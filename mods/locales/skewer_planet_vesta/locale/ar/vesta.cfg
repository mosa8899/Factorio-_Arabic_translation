[mod-setting-description]
ske_fusion_thruster_og=هذا الإعداد يعيد أداء الدافع الاندماجي إلى ما قبل تخفيض الإصدار 2.0.31، مما ينتج دفعاً جنونياً. اصل سفنك إلى الأماكن بسرعة هائلة وأمان تام عند دمجه مع صواريخ الاندماج المكمّلة.

ske_realistic_gases=يستبدل الغازات الملونة بنسخ أكثر شيوعاً في الواقع.

ske_vesta_gases=عند إيقافه، ستستخدم فيستا الغازات المشتركة. في حال وجود تعارض بين هذا المود ومودات أخرى بخصوص السوائل، فعّل هذا الخيار لتصبح مختلف الغازات المرتبطة بفيستا مستقلة. لكن هذا يعني وجود تكرارات.

ske_disable_metal_and_stars_bots=معطّل افتراضياً. إذا كنت تلعب مع Metal and Stars وتفضّل ألا تحصل على روبوتات مضادة للمادة من Metal and Stars، فعّل هذا الخيار.

ske_vesta_original_generation=إذا كان هذا الخيار مفعّلاً، ستحصل فيستا على توليدها الأصلي. منصات صخرية ضخمة تزيّن سطح العملاق الغازي بعد أن علقت في مجاله. رائع للعب الهادئ. إذا كان معطّلاً، ستكون فيستا عملاقاً غازياً واقعياً، لا يوجد فيه سوى منصة العملاق الغازي كمنطقة ظهور وبقية اليابسة معدومة. رائع لمن يبحث عن التحدي.

ske_vesta_legacy_recipes=يعيد الوصفات وسلسلة التقنيات الأصلية من الإصدار 1.0؛ هذه النسخة من فيستا تتضمن مواد وسيطة أكثر ومباني قد حُجز استخدامها حصراً على الكوكب. المحتوى الجديد للكوكب سيُضاف إلى هنا عادةً. إذا أردت تجربة أسهل وأكثر انسيابية، عطّل هذا الخيار.

ske_easy_fluids=إذا كان هذا الخيار مفعّلاً، ستحتاج معظم وصفات فيستا إلى غازات أقل بكثير. لا تأثير لهذا الخيار في الوضع المعقّد.

