milestones_write_file=كتابة الإنجازات إلى ملف (للاعب)
milestones_write_file_server=كتابة الإنجازات إلى ملف (للخادم)
milestones_global_announcements=الإعلان لكل الفصائل

[mod-setting-description]
milestones_check_frequency=سينتظر المود هذا العدد من النبضات بين كل فحص اكتمال.\nاخفضه إن كنت تهتم بدقة الوقت، وارفعه إن أردت تأثيراً أقل على الأداء.\nإذا ضبطته أقل من 60، ستعرض الواجهة أيضاً المللي ثانية.
milestones_initial_preset=الإعداد المبدئي المُحمَّل عند بدء خريطة جديدة. لا تأثير له على الألعاب الحالية. استعمل ميزة «التصدير» في المود داخل اللعبة للحصول على نص يمكنك لصقه هنا.
milestones_compact_list=يزيل تسميات «أُنجز في» قبل كل وقت، مما يجعل الواجهة أصغر.\nإعداد «تلقائي» يفعّل الوضع المضغوط تلقائياً إذا كانت قائمة الإنجازات كبيرة جداً بحيث لا تتسع للشاشة.
milestones_list_by_group=إذا كان محدداً، ستُجمَّع الإنجازات في فئات.\nإذا لم يكن محدداً، ستُدرج كل الإنجازات معاً زمنياً.
milestones_show_estimations=إذا كان محدداً، ستعرض أوقات الإنجاز المقدَّرة من سجل الإنتاج دقة التقدير بعد الوقت (مثل «(±5د)»).
milestones_show_incomplete=إذا كان محدداً، ستظهر الإنجازات غير المحققة موسومة بـ[color=100,100,100]غير مكتمل[/color]. لا يؤثر هذا على الإنجازات الموسومة صراحةً بـ«مخفي» في الإعدادات الجاهزة.
milestones_disable_chat_notifications=إذا كان محدداً، لن تظهر رسالة في الدردشة عند تحقيق إنجاز جديد. الإعداد لكل لاعب، لذا يؤثر عليك وحدك.
milestones_write_file=إذا كان محدداً، ستُضاف أوقات الإنجاز إلى ملف milestones-MAPSEED.txt في مجلد مخرجات السكربت بصيغة مقروءة آلياً. \nفي اللعب الجماعي يكتب هذا ملفاً على جهازك فقط. للكتابة على الخادم المخصص استعمل إعداد «كتابة الإنجازات إلى ملف (للخادم)» في تبويب «الخريطة».
milestones_write_file_server=إذا كان محدداً، ستُضاف أوقات الإنجاز إلى ملف milestones-MAPSEED.txt في مجلد مخرجات السكربت بصيغة مقروءة آلياً.\nيكتب هذا على الخادم المخصص فقط. إذا لم تكن تلعب على خادم جماعي مخصص فلا تأثير له. للكتابة على جهازك استعمل إعداد «كتابة الإنجازات إلى ملف (للاعب)» في تبويب «لكل لاعب».
milestones_global_announcements=إذا كان محدداً، سيُعلَن عن الإنجازات لكل الفصائل في لعبة جماعية بالفرق.\nإذا لم يكن محدداً، يُعلَن لفريقك فقط.\nلا تأثير له إذا لم تكن تلعب بفرق.

