nullius-guide-drone-iron-1=توجّه نيزكاً من المدار لإنشاء تجمّع حديد صغير.
nullius-guide-drone-iron-2=توجّه وابل نيازك من المدار لإنشاء تجمّع حديد كبير.
nullius-guide-remote-iron=يحدّد موقعاً لطائرات توجيه الحديد.
nullius-guide-drone-sandstone-1=توجّه نيزكاً من المدار لإنشاء تجمّع حجر رملي صغير.
nullius-guide-drone-sandstone-2=توجّه وابل نيازك من المدار لإنشاء تجمّع حجر رملي كبير.
nullius-guide-remote-sandstone=يحدّد موقعاً لطائرات توجيه الحجر الرملي.
nullius-guide-drone-bauxite-1=توجّه نيزكاً من المدار لإنشاء تجمّع باوكسيت صغير.
nullius-guide-drone-bauxite-2=توجّه وابل نيازك من المدار لإنشاء تجمّع باوكسيت كبير.
nullius-guide-remote-bauxite=يحدّد موقعاً لطائرات توجيه الباوكسيت.
nullius-guide-drone-limestone-1=توجّه نيزكاً من المدار لإنشاء تجمّع كالسيت صغير.
nullius-guide-drone-limestone-2=توجّه وابل نيازك من المدار لإنشاء تجمّع كالسيت كبير.
nullius-guide-remote-limestone=يحدّد موقعاً لطائرات توجيه الكالسيت.
nullius-guide-drone-copper-1=توجّه نيزكاً من المدار لإنشاء تجمّع نحاس صغير.
nullius-guide-drone-copper-2=توجّه وابل نيازك من المدار لإنشاء تجمّع نحاس كبير.
nullius-guide-remote-copper=يحدّد موقعاً لطائرات توجيه النحاس.
nullius-guide-drone-uranium-1=توجّه نيزكاً من المدار لإنشاء تجمّع يورانيوم صغير.
nullius-guide-drone-uranium-2=توجّه وابل نيازك من المدار لإنشاء تجمّع يورانيوم كبير.
nullius-guide-remote-uranium=يحدّد موقعاً لطائرات توجيه اليورانيوم.
nullius-sequestration-coal-drone=تنشئ رواسب فحم، تحجز فيها الكربون الزائد المُستخلص من الجو.
nullius-sequestration-coal-remote=يحدّد موقعاً لطائرات عزل الفحم.
nullius-sequestration-petroleum-drone=تنشئ رواسب بترول، تحجز فيها الكربون والهيدروجين الزائدين لتحرير الأكسجين.
nullius-sequestration-petroleum-remote=يحدّد موقعاً لطائرات عزل البترول.
nullius-algaculture-drone=تبثّ الطحالب في الماء. للحصول على أفضل النتائج اختر المياه الساحلية الأقل عمقاً ووزّعها بعيداً عن الطحالب الأخرى.
nullius-algaculture-remote=يستهدف مواقع عن بُعد لطائرات زراعة الطحالب كي تبثّها في الماء. للحصول على أفضل النتائج اختر المياه الساحلية الأقل عمقاً ووزّعها بعيداً عن الطحالب الأخرى.
nullius-horticulture-drone=تزرع العشب. يزدهر العشب في المناطق القريبة من الماء أو الغزيرة المطر، مع درجات حرارة معتدلة وتضاريس مستوية.
nullius-horticulture-remote=يستهدف مواقع عن بُعد لطائرات البستنة كي تزرع العشب. يزدهر العشب في المناطق القريبة من الماء أو الغزيرة المطر، مع درجات حرارة معتدلة وتضاريس مستوية.
nullius-arboriculture-drone=تزرع الأشجار. للحصول على أفضل النتائج استهدف يابسة على بُعد معتدل من الديدان وابقَ بعيداً عن الفوهات البركانية. تزدهر الأشجار في المناطق ذات التربة الغنية والأمطار الكافية ودرجات الحرارة المعتدلة.
nullius-arboriculture-remote=يستهدف مواقع عن بُعد لطائرات زراعة الأشجار. للحصول على أفضل النتائج استهدف يابسة على بُعد معتدل من الديدان وابقَ بعيداً عن الفوهات البركانية. تزدهر الأشجار في المناطق ذات التربة الغنية والأمطار الكافية ودرجات الحرارة المعتدلة.
nullius-entomology-drone=تفقس الديدان. للحصول على أفضل النتائج استهدف يابسة قرب العشب أو الأشجار ووزّعها بعيداً عن الديدان الأخرى. تفضّل أكثر من 30% من هدف الأكسجين.
nullius-entomology-remote=يستهدف مواقع عن بُعد لطائرات علم الحشرات كي تفقس الديدان. للحصول على أفضل النتائج استهدف يابسة قرب العشب أو الأشجار ووزّعها بعيداً عن الديدان الأخرى. تفضّل أكثر من 30% من هدف الأكسجين.
nullius-aquaculture-drone=تفقس الأسماك. للحصول على أفضل النتائج استهدف ماءً قرب الطحالب ووزّعها بعيداً عن الأسماك الأخرى. تفضّل أكثر من 60% من هدف الأكسجين.
nullius-aquaculture-remote=يستهدف مواقع عن بُعد لطائرات تربية الأحياء المائية كي تفقس الأسماك. للحصول على أفضل النتائج استهدف ماءً قرب الطحالب ووزّعها بعيداً عن الأسماك الأخرى. تفضّل أكثر من 60% من هدف الأكسجين.
nullius-husbandry-drone=تربّي عشّاً مفصلياً وتطوّر مخزونه الجيني. للحصول على أفضل النتائج استهدف يابسة على بُعد معتدل من الأشجار والأسماك، بعيداً عن الأعشاش أو الفوهات البركانية الأخرى. تفضّل أكثر من 80% من هدف الأكسجين.
nullius-husbandry-remote=يستهدف مواقع عن بُعد لطائرات تربية الحيوانات كي تربّي عشّاً مفصلياً. للحصول على أفضل النتائج استهدف يابسة على بُعد معتدل من الأشجار والأسماك، بعيداً عن الأعشاش أو الفوهات البركانية الأخرى. تفضّل أكثر من 80% من هدف الأكسجين.
nullius-sugar=وحدات بناء حيوية أساسية تُستخدم للطاقة والقوة الهيكلية.\n[font=default-semibold][color=1,0.9,0.75]الصيغة:[/color][/font] C[font=default-tiny-bold]6[/font]H[font=default-tiny-bold]12[/font]O[font=default-tiny-bold]6[/font]  [font=default-semibold][color=1,0.9,0.75]الحالة:[/color][/font] صلب (تصريف في 1)
nullius-cellulose=ألياف كربوهيدراتية حيوية لبنية النباتات.\n[font=default-semibold][color=1,0.9,0.75]الحالة:[/color][/font] صلب (تصريف في 2)
nullius-bacteria-genome=الملف الجيني لسلالة بكتيريا، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-algae=كائن مائي ملحي بسيط يقوم بالتمثيل الضوئي.
nullius-algae-genome=الملف الجيني لسلالة طحالب، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-algae-progenitor=بوغ طحالب صناعي صُنع لإنتاج ذرية طبيعية متنوعة وراثياً.
nullius-algae-spore=لازم لزراعة الطحالب.
nullius-fertilizer=مغذيات تربة لنمو النباتات، غنية بالنيتروجين المثبّت.
nullius-grass=نبات بري صغير متعدد الاستخدامات.
nullius-grass-genome=الملف الجيني لصنف عشب، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-grass-progenitor=بذرة عشب صناعية صُنعت لإنتاج ذرية طبيعية متنوعة وراثياً.
nullius-grass-seed=لازمة لزراعة العشب.
nullius-tree=نبات بري كبير يتألف أساساً من الخشب.
nullius-tree-genome=الملف الجيني لصنف شجرة، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-tree-progenitor=بذرة شجرة صناعية صُنعت لإنتاج ذرية طبيعية متنوعة وراثياً.
nullius-tree-seed=لازمة لزراعة الأشجار.
nullius-wood=مادة صلبة ليفية تُحصد من الأشجار.\n[font=default-semibold][color=1,0.9,0.75]الحالة:[/color][/font] صلب (تصريف في 2)
nullius-worm=حيوان صغير تحت الأرض يساعد على التحلل ويُثري التربة.
nullius-worm-genome=الملف الجيني لسلالة دودة، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-worm-progenitor=بيضة دودة صناعية صُنعت لإنتاج ذرية طبيعية متنوعة وراثياً.
nullius-worm-egg=لازمة لتربية الديدان.
nullius-fish=حيوان مائي غني بالزيت.
nullius-fish-genome=الملف الجيني لتجمّع سمكي، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-fish-progenitor=بيضة سمك صناعية صُنعت لإنتاج ذرية طبيعية متنوعة وراثياً.
nullius-fish-egg=لازمة لتربية الأسماك.
nullius-arthropod=كائن بري آكل لكل شيء ذو قشرة صلبة.
nullius-arthropod-genome=الملف الجيني لتجمّع مفصليات، نُزّل من إرسال صانعينا وعدّل ليناسب الظروف المحلية.
nullius-arthropod-progenitor=بيضة مفصلي صناعية صُنعت لإنتاج ذرية طبيعية متنوعة وراثياً.
nullius-arthropod-egg=لازمة لتربية المفصليات.
nullius-antimatter=وقود مركبة شديد الكثافة والقوة، تجمعه مصيدة مضادة للمادة ([item=nullius-antimatter-trap]).
nullius-antimatter-trap=تُستخدم في مفاعل لجمع وقود مضاد المادة ([item=nullius-antimatter]).
nullius-fusion-cell=وقود نووي أساسي لتشغيل المفاعلات النووية ([item=nullius-reactor]). فعّال، لكنه يستهلك كمية كبيرة من نظير التريتيوم النادر ([fluid=nullius-tritium]).
nullius-aneutronic-cell=وقود اندماج نووي بديل. أقل طاقة من خلايا اندماج التريتيوم ([item=nullius-fusion-cell])، لكنه مصنوع من مواد أكثر وفرة.
nullius-spent-fusion-cell=ناتج استهلاك خلية اندماج ([item=nullius-fusion-cell] أو [item=nullius-aneutronic-cell]) في مفاعل نووي ([item=nullius-reactor]). تحتوي على هيليوم مندمج ([fluid=nullius-helium]).
nullius-breeder-cell=خلية اندماج أكثر تقدماً، أقل طاقة من الأساسية ([item=nullius-fusion-cell])، لكنها تحوّل الديوتيريوم الزائد ([fluid=nullius-deuterium]) إلى تريتيوم أثمن ([fluid=nullius-tritium]).
nullius-spent-breeder-cell=ناتج استهلاك خلية مُكاثِرة ([item=nullius-breeder-cell])، وتحتوي على تريتيوم ([fluid=nullius-tritium]).
nullius-fission-cell=وقود نووي أسهل تقنياً من الاندماج، لكنه يعتمد على عنصر اليورانيوم الغريب ([item=nullius-uranium])، الذي لا يوجد عادةً على سطح هذا الكوكب.
nullius-spent-fission-cell=ناتج استهلاك خلية انشطار ([item=nullius-fission-cell])، ويمكن إعادة معالجتها لاستخراج بعض اليورانيوم غير المتفاعل ([item=nullius-yellowcake]).
nullius-android=خليفة على صورة هيئتك الأصلية. يمكنك وضعه ونقل وعيك إليه للتنقل سريعاً بين الأجساد في أجزاء مختلفة من مصنعك.
nullius-probe=مركبة فضائية بين نجمية تُرسل ذريتك لتقديم مهمتك في بثّ الحياة عبر المجرة.
nullius-surface-two-way-junction=اربط أنبوباً سطحياً بأنبوب تحت الأرض في أي اتجاه
nullius-surface-three-way-junction=اربط أنبوباً سطحياً بأنابيب تحت الأرض في أي اتجاهين
nullius-surface-four-way-junction=اربط أنبوباً سطحياً بأنابيب تحت الأرض في أي ثلاثة اتجاهات
nullius-surface-five-way-junction=اربط أنبوباً سطحياً بأنابيب تحت الأرض في كل الاتجاهات
nullius-underground-straight-junction=مدّ خط أنابيب تحت الأرض
nullius-underground-elbow-junction=اربط أنبوبين متعامدين تحت الأرض
nullius-underground-three-way-junction=اربط ثلاثة أنابيب تحت الأرض
nullius-underground-four-way-junction=اربط أربعة أنابيب تحت الأرض
nullius-underground-ctrl-r=\nاضغط CTRL+R لتدوير الأنابيب تحت الأرض.
nullius-underground-pump=اضخّ مباشرة بين الأنابيب تحت الأرض.
nullius-adjustable-top-up-valve=يسمح بالتدفق إلى وجهة سعتها أقل من عتبة قابلة للضبط.\nاضغط +/- لضبط العتبة بزيادات 10%.
nullius-adjustable-relief-valve=يسمح بالتدفق من مصدر سعته أعلى من عتبة قابلة للضبط.\nاضغط +/- لضبط العتبة بزيادات 10%.
nullius-companion-fuel=علبة وقود للطائرة المرافقة.
nullius-land-fill-gravel=يمكن وضعه على الماء لإنشاء تضاريس قابلة للبناء. النتيجة مزيج رمادي من التراب والرمل مع شاطئ ترابي.
nullius-land-fill-sand=يمكن وضعه على الماء لإنشاء تضاريس قابلة للبناء. النتيجة تضاريس رملية بلون زيتوني بالكامل.
nullius-land-fill-bauxite=يمكن وضعه على الماء لإنشاء تضاريس قابلة للبناء. النتيجة تضاريس ترابية بنية بالكامل.
nullius-land-fill-iron=يمكن وضعه على الماء لإنشاء تضاريس قابلة للبناء. النتيجة تضاريس ترابية حمراء في الغالب مع شاطئ رملي.
nullius-land-fill-limestone=يمكن وضعه على الماء لإنشاء تضاريس قابلة للبناء. النتيجة تضاريس ترابية بلون البيج مع شاطئ رملي.
nullius-rock-picker=امسك هذه الأداة واضغط __CONTROL__select-for-blueprint__ لاختيار منطقة لتنظيفها من الصخور الصغيرة والحطام والعناصر الملقاة والعيوب الطفيفة في المشهد. الصخور الأكبر ستُجدول للهدم، وكذلك الهاويات إن كانت تقنية المتفجرات كافية. اضغط __CONTROL__select-for-cancel-deconstruct__ لاستبعاد العناصر والصخور الأكبر والهاويات.
nullius-wood-chip=قطع صغيرة من الخشب. [font=default-semibold][color=1,0.9,0.75]الحالة:[/color][/font] صلب (تصريف في 2)
nullius-align-identification-card=فعّلها على عضو من فصيل آخر لقبول دعوته للانضمام. حملها يمنع التجنيد القسري. البطاقات فعّالة فقط إذا طوّرها فصيلك الحالي بشكل مستقل.\nإذا انضممت إلى فصيل آخر ولم يبقَ أي لاعبين في فصيلك الحالي، فسيُستوعَب بالكامل في الفصيل الجديد. ستؤول كل المباني إلى الفصيل المدمج الجديد، وستُدمج جميع التقنيات، وستُعاد أي أبحاث مكررة لتسريع البحث المستقبلي.
nullius-align-invitation-card=فعّلها على عضو من فصيل آخر لتوجيه دعوة للانضمام إلى فصيلك. البطاقات فعّالة فقط إذا طوّرها فصيلك الحالي بشكل مستقل.
nullius-align-transponder=فعّلها للكشف عن موقعك الحالي لكل الفصائل التي لديها عقدة استشعار نشطة.
nullius-align-conscription-charge=ذخيرة لشعاع التجنيد أو البرج.
nullius-align-conscription-ray=سلاح طاقة محمول يحوّل أندرويداً مجهول الهوية إلى فصيلك. يسبب ضرراً كهربائياً طفيفاً. إذا لم يكن في فصيل ما أندرويد نشط للدفاع عن مصنعه، يمكنك استخدامه للاستيلاء على مبانيه. إذا استوليت على كل مختبراته، سيتحول الفصيل بأكمله.
nullius-align-concordance-satellite=أول فصيل يطلق هذا إلى المدار سيهيمن على كل الفصائل الأخرى، ويفوز نهائياً بسباق جعلها تتوافق مع أهداف مهمتك.
