[mod-setting-description]
todolist-show-button=إذا كان مُفعّلاً، سيظهر دائماً زر «قائمة المهام» في الزاوية العليا اليسرى.\nإذا كان معطّلاً، لا يمكن الوصول للقائمة إلا بالمفتاح السريع (افتراضياً shift-t).
todolist-show-log=إذا كان مُفعّلاً، سيطبع المود رسائل تشخيصية في نافذة الدردشة.\nانتبه: هناك كثير منها :)
todolist-window-height=ارتفاع نافذة قائمة المهام. الافتراضي 600.
todolist-auto-assign=إذا كان هناك لاعب واحد فقط في اللعبة، تُعيَّن المهمة له تلقائياً.
todolist-click-edit-task=إذا كان مُفعّلاً، سيفتح النقر الأوسط نافذة التعديل. الافتراضي بالنقر الأيمن.
todolist-translation-mode=نمط النص لقائمة المهام. «Questlog» يغيّر الصياغة إلى سجل مهمات.

