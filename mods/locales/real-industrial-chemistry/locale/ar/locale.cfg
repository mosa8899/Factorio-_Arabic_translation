[entity-description]
ric-industrial-substation=يوسّع تغطية الأعمدة الكهربائية الأصلية ومدى الأسلاك. لا يغير الجهد الكهربائي.
ric-industrial-accumulator-bank=يخزن 25 ميجا جول من كهرباء فاكتوريو الأصلية مع قدرة شحن/تفريغ 2 ميجاوات. لا يولد الطاقة.
ric-industrial-load-switch=مفتاح الطاقة الأصلي الذي يتم التحكم فيه بالدائرة لعزل الدوائر الصناعية غير الحرجة.
ric-power-monitor=قامت التقارير بقياس الطلب والإنتاج، وقدرة الشبكة الكهربائية والإرتفاع الاحتياطي، والرضا والشحن التراكمي. يتم تحديث إشارات الدائرة كل ثانيتين. ضعه بالقرب من عمود كهربائي وقم بتوصيل الشاشة بمعدات فصل الأحمال.
ric-process-monitor=يُبلغ عما إذا كانت أقرب آلة معالجة RIC ضمن 12 بلاطة تعمل أو متوقفة أو قيد التصنيع.

ric-pollution-monitor=يقرأ التلوث المحيط في الجزء الحالي ويخرج إشارة التلوث إلى شبكة الدائرة. قم بتوصيله إلى مرشح Baghouse وقم بتكوين حالة دائرة المرشح لأتمتة تنظيف الهواء.
ric-integrated-industrial-complex=مجمع عمليات متكامل كبير يستخدم لتشغيل دورات عرض الإتقان الصناعي المستمرة من المعادن المتقدمة والكيمياء والإلكترونيات والبوليمرات والمحفزات والسيراميك والمواد النووية.
ric-industrial-fuel-boiler=غلاية حزمة مدفوعة بالوصفة مع توصيلات منفصلة للوقود ومياه التغذية والبخار وغاز المداخن الساخن. يتم تحديد كفاءة الغلاية وإنتاجيتها من خلال كل وصفة بخار مشتعل؛ لا يتم استهلاك قيمة الوقود العامة الموضحة على السائل مباشرة بواسطة هذه الآلة.
ric-industrial-solid-fuel-boiler=مرجل فحم كوك/وقود صلب بقدرة 4.5 ميجاواط لتوليد طاقة صناعية مدمجة قبل النووية. يمكن لمرجل واحد تغذية توربين بخاري صناعي واحد.
ric-industrial-steam-turbine=مولد بقدرة 4.5 ميجاواط مصمم لبخار بدرجة حرارة 165 درجة مئوية من حزمة Industrial Alchemy أو المراجل التي تعمل بالوقود الصلب.
ric-process-machine-placement-contract=معدات معالجة الكيمياء الصناعية ذات بصمة مدققة وعقد تخطيط أنابيب منفصل.
ric-real-resource=رواسب خام حقيقي أو معادن صناعية مخصصة للكيمياء الصناعية.
ric-gas-resource=مورد مخصص لسائل الغاز الطبيعي أو الغاز الحمضي من الكيمياء الصناعية.
ric-ore-sorter=آلة تحضير الخام الجاف لفرز الخام العادي والحجر إلى خامات حقيقية ومعادن ومركزات أولية.

ric-crusher=آلة تعمل بالحارق للسحق الآلي للمواد الخام الخام من المنجم. تم فتحه بواسطة معالجة الخام I.
ric-ore-washer=آلة المعالجة الرطبة لغسل الخامات المسحوقة والغرامات إلى مركزات أنظف بالإضافة إلى المخلفات ومياه الصرف الصحي.
ric-flotation-cell=ترقية كبريتيد العلوم الخضراء لتركيز النحاس الناعم والرغوة قبل المعالجة بالمعادن المائية لاحقًا.
ric-coke-oven=يحول الفحم أو الفحم المسحوق إلى فحم الكوك، وقطران الفحم، ومنتجات الوقود والغاز الثانوية لأول حلقات التعدين والبتروكيماويات.
ric-blast-furnace=فرن التعدين الأولي الأولي للحديد الخام والنحاس غير اللامع والخبث والمواد الخام لصناعة الصلب.
ric-sintering-plant=يقوم بتحضير تركيز الحديد الناعم في اللبيدة بحيث يحصل الفرن العالي على تغذية حديدية مناسبة.
ric-casting-machine=يقوم بصب الحديد الخام والنحاس المفلفل في ألواح قياسية خلال المرحلة الصناعية المبكرة للمعادن.
ric-rolling-mill=تشكيل قضبان الصلب والألواح/الصفائح المعدنية لاحقًا إلى ألواح قابلة للاستخدام ومخزون صناعي مُشكَّل.
ric-waste-treatment-plant=يتعامل مع المخلفات، والخبث، والمياه الحامضة، ومياه الصرف الصحي الحمضية، ومجاري النفايات المحايدة حتى لا تصل الصناعة المبكرة إلى طريق مسدود.
ric-chemical-reactor=آلة كيميائية للأغراض العامة مع وصلات منفصلة متعددة السوائل للكيمياء غير العضوية المبكرة، والمعادلة، والعمل بالأحماض، ووصفات الجسور.
ric-air-separator=يقسم الهواء إلى أكسجين ونيتروجين من خلال منافذ منتج متباعدة بحيث يمكن توجيه شبكات الغاز بشكل مستقل.
ric-electrolyzer=آلة كهركيميائية للماء والمحلول الملحي والكلور والقلويات والفلور والمسارات التحليلية الكهربائية المتقدمة لاحقًا.
ric-roaster=فرن الأكسدة لمركزات الكبريتيد والكيمياء المعدنية التي تحتاج إلى معالجة المنتجات الثانوية للغاز/الحمض.
ric-distillation-column=آلة تجزئة مبكرة لمعالجة النفط الخام وقار الفحم والنفتا وغاز الوقود والبقايا الثقيلة.
ric-electrowinning-cell=آلة معالجة المعادن بالمياه لاستعادة الكاثودات المعدنية من محاليل الكبريتات/المادة المرتشحة.
ric-vacuum-distillation-column=يتم إنشاء عمود تكرير متقدم للبقايا الثقيلة والتقطير التجزيئي بالتفريغ بعد التقطير الأساسي.
ric-delayed-coker=وحدة تكرير متقدمة لتكسير البقايا الناتجة عن التقطير بالتفريغ إلى فحم بترولي وتيارات تكرير أخف.
ric-hydrotreater=مفاعل ضغط متقدم لإزالة الكبريت وأجزاء التكرير الأنظف.
ric-catalytic-reformer=وحدة تكرير حفزية متقدمة للمواد المُعاد تشكيلها والكيمياء الأروماتية.
ric-steam-cracker=آلة بتروكيماوية متطورة لتكسير زيت الغاز والهيدروكربونات الخفيفة إلى مواد أولية للبوليمرات.
ric-cleanroom-assembler=جهاز تجميع في بيئة خاضعة للرقابة للوحات الدوائر وأشباه الموصلات والرقاقات والإلكترونيات الدقيقة.
ric-catalytic-reactor=آلة معالجة تعمل بالمحفز للأمونيا والميثانول والبيروكسيد والإصلاح والكيمياء المتخصصة.
ric-high-pressure-reactor=آلة معالجة مصنفة للضغط لطرق التوليف والهدرجة عالية الضغط.
ric-advanced-distillation-column=عمود فصل عالي الإنتاجية للكسور الكيميائية والمصفاة المتقدمة.
ric-advanced-electrochemical-cell=آلة كهركيميائية متقدمة لمسارات التحليل الكهربائي والتنقية الكهربائية عالية المستوى.

ric-limestone=رواسب الحجر الجيري القابلة للتعدين. مطلوب في وقت مبكر لسلاسل التدفق والحجر الجيري المسحوق.
ric-quartz=رواسب الكوارتز القابلة للتعدين لسلاسل السيليكا والمواد الإلكترونية.
ric-gypsum=رواسب الجبس القابلة للتعدين لسلاسل استخدام الكبريتات والبناء والمنتجات الثانوية.
ric-rock-salt=رواسب الملح الصخري القابلة للتعدين للكلور والمحلول الملحي والصوديوم والكيمياء غير العضوية الأساسية.
ric-graphite=رواسب الجرافيت القابلة للتعدين لسلاسل الكربون والمواد المقاومة للحرارة والإلكترونيات.
ric-bauxite=رواسب البوكسيت القابلة للتعدين لمعالجة الألومنيوم.
ric-borax=رواسب البوراكس القابلة للتعدين للزجاج والسيراميك والكيمياء المتخصصة.
ric-fluorite=رواسب الفلوريت القابلة للتعدين للتدفق والكيمياء الحمضية المتخصصة.
ric-apatite=رواسب الأباتيت القابلة للتعدين لكيمياء الفوسفات والأسمدة.
ric-sylvite=رواسب سيلفيت قابلة للتعدين لكيمياء البوتاس والأسمدة.
ric-kaolin=رواسب الكاولين القابلة للتعدين للسيراميك والمواد العازلة.
ric-baghouse-filter=يزيل الرماد المتطاير والغبار المعدني من غاز المداخن الصناعي المبرد قبل الغسل الرطب.
ric-wet-scrubber=يستخدم ملاط ​​الجير والوسائط الماصة القابلة للاستبدال لإزالة الملوثات الحاملة للكبريت من غاز المداخن الذي يتم التحكم فيه بالجسيمات.
ric-primary-clarifier=يقوم بترسيب المواد الصلبة العالقة من مياه الصرف الصناعي في التدفق السفلي للحمأة القابلة للضخ وفيضان السائل المعالج.
ric-sludge-filter-press=يقوم ميكانيكيًا بإزالة الماء من الحمأة في كعكة المرشح بينما يعيد السائل المصفى إلى حلقة المعالجة.

ric-geological-indication=علامة جيولوجية غير معروفة. وجّه سهم مخرجات منصة الحفر الأساسي إلى حزام أو صندوق؛ ويتم تسليم دفعة العينات الأساسية المكتملة قبل الكشف عن الرواسب المتصلة.
ric-geological-indication-critical=دليل جيولوجي حاسم للتقدم يتحكم فيه مولد الخريطة مباشرة. يغير التكرار مدى تكرار ظهور هذه الحقول، ويغير الحجم مساحتها، ويغير الغنى الاحتياطي الذي يتم الكشف عنه بعد المسح.
ric-starting-geological-indication=علامة سطحية يمكن التنقيب عنها يدويًا. استنفد جزءًا واحدًا من المنكشف المتصل لتحديد الرواسب بأكملها قبل إزالة التربة السطحية التي تغطيها.
ric-covered-deposit=رواسب محددة مخبأة تحت التربة والصخور المتآكلة والطبقات السطحية الأخرى. قم بإزالة هذه الطبقة قبل التعدين الإنتاجي.
ric-hand-workable-covered-deposit=رواسب متجوية ضحلة يمكن إزالتها يدويًا في بداية اللعبة. المعدات الميكانيكية لإزالة الطبقة السطحية أسرع بكثير.
ric-graded-deposit=المواد الخام المستخرجة من المنجم المكشوفة. تتحكم الدرجة في استخلاص المعادن المفيدة وإنتاج الصخور النفايات ومتطلبات المعالجة.
ric-hand-workable-graded-deposit=المادة المتعرّضة للعوامل الجوية منخفضة الدرجة التي يمكن العمل عليها يدويًا أو باستخدام مثقاب شعلة. كسر مخرجات المنجم الخام يدويًا قبل الصهر البدائي.
ric-core-drilling-rig=منصة حفر العينات من أجل التنقيب الجيولوجي. قم بتوجيه سهم إخراج العنصر الخاص به إلى سير ناقل أو حاوية؛ وعند اكتمال دفعة من العينات الأساسية، يتم الكشف عن المؤشر المتصل كترسب مصنف. مرّر مؤشر الماوس فوق حقول الجيولوجيا للاطّلاع على اكتشافاتها المحتملة، أو افتح النصائح والحيل ← الجيولوجيا والتنقيب في RIC للحصول على اللون الكامل للخريطة والمرجع الخاص بالخام.
ric-quarry-drill=مثقاب إنتاج موفر للطاقة للرواسب الرخوة والمتأثرة بالعوامل الجوية والرواسب الرسوبية في المحاجر. يستخدم البناء خطة تطوير المنجم القابلة لإعادة الاستخدام، لذلك فإن توسيع أسطول المحاجر لا يستهلك أبدًا عينات جوفية جيولوجية إضافية.
ric-overburden-excavator=حفارة إزالة خاصة عالية الإنتاجية. وهو أسرع وأكثر كفاءة في استخدام الطاقة وأكثر كفاءة في استخدام الاحتياطيات في الطبقة السطحية من الحفارة الهيدروليكية، ولكنه لا يستطيع استخراج خام المحاجر المكشوف أو طبقات الصخور الصلبة.
ric-hard-rock-production-drill=متخصص كبير للمقاعد المختصة بالصخور الصلبة. فهو يقوم بحفر أنماط سليمة لثقوب الانفجار، ويتوقف مؤقتًا بينما يقوم جهاز الشحن بتحميل المتفجرات، ثم يستأنف الإنتاج على المقعد المنفجر. إنتاجية أقل من مجرفة الحبال، ولكن الطلب على الطاقة أقل بشكل كبير وكفاءة احتياطية أفضل للصخور الصلبة.
ric-flare-and-vent-stack=معدات تخفيف الضغط الآلية للتنفيس الآمن للغازات الخاملة وحرق الغازات المنبعثة القابلة للاحتراق. يظل الاستخلاص أنظف وأكثر كفاءة.

ric-blast-hole-drill=حفر حفرة الانفجار الميكانيكية لإعداد مقاعد سليمة من الصخور الصلبة. يتم تسليم المتفجرات بشكل منفصل عن طريق منصة الشحن بعد اكتمال الحفر.
ric-intact-hard-rock-deposit=صخور صلبة تتطلب نمط تفجير بالحفر قبل شحن المتفجرات والحفر.
ric-blasted-hard-rock-deposit=صخور صلبة مجزأة جاهزة للحفر والنقل إلى مخزون المنجم.

ric-tailings-thickener=يفصل المخلفات القابلة للضخ إلى مواد صلبة سميكة ومياه مستردة للتخزين أو الردم الخاضع للتحكم.
ric-mine-backfill-plant=يمزج المخلفات السميكة والصخور النفايات والجير والماء في ردم المنجم المُعدّ هندسيًا وأشكال النفايات المستقرة.
ric-mine-reclamation-plant=تقوم العمليات باستعادة الأعباء الزائدة والردم وتحويل النفايات إلى مواد مناسبة لإعادة تأهيل مواقع المناجم.
ric-rom-stockpile=عازل عام كبير مقاس 3 × 3 يحتوي على 120 فتحة مخصص لمواد المناجم. تصف أسماء المخزونات دورها الاقتصادي؛ لا يتم تصفية فئات العناصر بشكل متعمد.
ric-crushed-ore-stockpile=عازل عام متوسط ​​2 × 2، 80 فتحة مخصص للخام المسحوق بين مراحل المعالجة. لم تتم تصفيته عن عمد.
ric-concentrate-stockpile=صندوق مغطى صغير الحجم 1×1، يحتوي على 24 فتحة مخصص للركاز. غالية الثمن لكل فتحة وغير مصفاة للأصناف عمدًا.
ric-mine-dewatering-station=محطة مخصصة لنزع الماء من الخامات الخام عالية الإنتاجية. تقوم بإجراء عملية الفصل الرطب للخام كما هو الحال في غاسلة الخام ولكن على نطاق المنجم، حيث تستعيد مياه المنجم قبل التكسير والتحسين.
ric-mine-water-pond=خزان ميداني بسعة 75000 وحدة مخصص لتدفقات مياه المناجم وتجفيف المياه من الحفر. ويبقى غير مُصفّى بحيث يمكن لتيارات مياه المناجم العادية والحمضية والمالحة والمشعة أن تشترك في البنية التحتية نفسها دون أن تصبح خزانًا عالي الكثافة متعدد الأغراض.
ric-tailings-impoundment=حجز حقل كبير بسعة 250.000 وحدة مخصص لملاط المخلفات القابلة للضخ قبل التسميك أو إعداد الردم أو المعالجة الخاضعة للرقابة. فهو يقبل فقط مخلفات الطين.
ric-waste-rock-stockpile=حاجز عام كبير جدًا 4 × 4، 160 فتحة، منخفض التكلفة مخصص للأحمال الصخرية والنفايات. لم تتم تصفيته عن عمد.
ric-bulk-transfer-station=مخزن مؤقت نقل مدمج 1×1، يحتوي على 16 فتحة لنقاط التسليم عبر السيور أو القضبان. مصمم لوضعه عند التقاطعات بدلاً من التخزين طويل الأجل.

ric-process-tank=وعاء معالجة مضغوط مدمج لتخزين الماء والأحماض والمواد الوسيطة وسوائل المصنع الأخرى. تحافظ الوصلات المتعاكسة على ترتيب فروع العملية القصيرة. السعة: 30,000.
ric-cylindrical-liquid-tank=وعاء تخزين أسطواني صناعي مخصص لمنتجات التكرير وسوائل العمليات السائبة. فئة السوائل لا يتم تصفيتها بشدة؛ يتم تحديد الدور من خلال البصمة والسعة والأنابيب. السعة: 100,000.
ric-spherical-gas-tank=حامل صناعي كروي مخصص للأكسجين والنيتروجين والهيدروجين والغاز الطبيعي والغاز الاصطناعي وغازات التكرير. فئة السوائل لا يتم تصفيتها بشدة؛ يتم تحديد الدور من خلال البصمة والسعة والأنابيب. السعة: 125,000.
ric-bulk-terminal-tank=خزان تخزين ميداني كبير لخدمات التكرير والكيميائيات والمياه والمحلول الملحي والأحماض كبيرة الحجم. أربع وصلات متباعدة على نطاق واسع تدعم رؤوس مزرعة الخزانات النظيفة. السعة: 400,000.

ric-process-pipe=أنابيب العمليات الصناعية المقواة مع ضعف حجم السائل الداخلي للأنابيب القياسية. مخصص للرؤوس الطويلة للنباتات ومزرعة الخزانات.
ric-process-pipe-to-ground=خط معالجة معزز تحت الأرض مع مضاعفة الوصول الأساسي تحت الأرض وزيادة الحجم الداخلي لعبور المخططات الصناعية الكثيفة.
ric-industrial-pump=مضخة مضمنة مطورة تتميز بسرعة ضخ أكبر بنسبة 50% من المضخة القياسية لنقل المصفاة وتحميل الخزانات ورؤوس المرافق.
ric-utility-manifold=رأس عملية مدمج رباعي الاتجاهات مع مخزن مؤقت صغير بسعة 5000 وحدة. يوزع سائلًا واحدًا على عدة فروع دون أن يكون بمثابة وحدة تخزين كبيرة.
ric-shallow-water-dredger=كراكة ساحلية ومحطة غربلة تعمل بالطاقة من أجل الاستعادة المستمرة للرواسب البحرية الضحلة. يجب أن توضع بالقرب من الماء.

ric-deep-sea-dredger=محطة تجريف واستخلاص معادن عالية الطاقة للجرف العميق والمواد الأولية للمحيطات العميقة. يجب أن توضع بجانب المياه العميقة.
ric-solar-evaporation-pond=بركة مبطنة منخفضة الطاقة تستخدم لتبخير مياه البحر المركزة وبلورة الملح والجبس وأملاح البوتاس والمواد الأولية المرة.
ric-offshore-production-platform=حزمة إنتاج الآبار البحرية التي تحل محل المضخة الأرضية في الصناعة البحرية. إنه يرفع تيارات آبار النفط الخام وسوائل حقول الغاز الطبيعي من منصات الآبار البحرية المحمية.
ric-deepwater-production-platform=حزمة إنتاج بحرية عالية الإنتاجية مقاومة للتآكل لحقول النفط والغاز الناضجة في أعماق المحيطات.

ric-blast-charging-rig=وحدة تحميل المتفجرات السائبة للدرجات المحفورة. تستخدم الثقوب الجافة ANFO؛ وتستخدم الثقوب الرطبة مستحلبًا مقاومًا للماء.
ric-hydraulic-excavator=حفارة سطحية مرنة للطبقة السطحية ومواد المحجر المكشوفة. وهي تتعامل بشكل جيد مع أعمال تطوير المناجم المختلطة، ولكنها أقل كفاءة من آلة الإزالة المخصصة ولا يمكنها العمل على طبقات الصخور الصلبة القوية.
ric-electric-rope-shovel=الحفار السائب ذو الإنتاجية الأعلى للحفر المفتوحة الناضجة. يمكنها إزالة الأعباء الثقيلة ومحاجر المناجم أو المقاعد الصخرية الصلبة المتفجرة، لكن الطلب الكهربائي المرتفع للغاية يجعلها آلة متأخرة للبنية التحتية للحفرة.
ric-drilled-hard-rock-bench-dry=نمط ثقب التفجير الجاف المكتمل في انتظار تعبئة نترات الأمونيوم وزيت الوقود (ANFO) والسد والبدء.
ric-drilled-hard-rock-bench-wet=نمط ثقب التفجير الرطب المكتمل الذي يتطلب شحن المستحلب المقاوم للماء قبل البدء.

ric-jaw-crusher=كسارة أولية كهربائية ذات إطار فولاذي لتغذية OpenPit المتطورة والتكسير العام عالي الإنتاجية. مقفلة باستخدام RIC Steel Processing.
ric-gyratory-crusher=كسارة أولية كبيرة عالية الإنتاجية للمناجم والمحاجر الناضجة. تقبل نفس العناصر المعدنية العامة وخلاصات OpenPit الأولية مثل الكسارة الفكية، لذلك لم تعد هناك حاجة إلى الكسارات ذات الموقد بمجرد توفر هذا المستوى.
ric-cone-crusher=كسارة ثانوية وثلاثية لتقليل التغذية المكسرة الأولية وإعادة الشاشة كبيرة الحجم إلى الدائرة.
ric-vibrating-screen=محطة تصنيف الحجم التي تفصل الخام المسحوق إلى كسور خشنة ودقائق ناعمة قبل إثراءه.
ric-gravity-concentrator=مركّز معادن خشن يستخدم فروق الكثافة لرفض النفايات قبل الطحن الناعم.
ric-magnetic-separator=محطة إثراء مغناطيسية للأعلاف الغنية بالماجنتيت وغيرها من التيارات المعدنية القابلة للفصل مغناطيسيًا.
ric-sag-mill=مطحنة كبيرة شبه ذاتية لتقليل الخام المنخل إلى تغذية مطحنة جاهزة للملاط.
ric-ball-mill=مطحنة طحن ناعم تُستخدم في التدفق السفلي للهيدروسيكلون في دائرة طحن مغلقة.
ric-hydrocyclone-cluster=المصنف الرطب الذي يرسل المواد الناعمة المحررة إلى الأمام بينما يعيد التدفق السفلي الخشن لإعادة الطحن.
ric-concentrate-thickener=وعاء الترسيب الذي يزيل ويستعيد المياه المعالجة من المركز المعدني الرطب قبل الترشيح.
ric-concentrate-filter-press=آلة نزح الماء من المركز النهائي التي تنتج مركزًا فلزيًا قابلًا للنقل ومياه معالجة مستصلحة.


ric-geological-indication-reference=احتمال __1__ مجهول الهوية. لون الخريطة الأساسية: __2__. يمكن أن يكشف الحفر الأساسي عن: __3__ افتح النصائح والحيل → RIC الجيولوجيا والتنقيب للحصول على المرجع الكامل.
ric-geological-indication-critical-reference=التقدم الحرج __1__. لون الخريطة الأساسية: __2__. يمكن أن يكشف الحفر الأساسي عن: __3__ افتح النصائح والحيل → RIC الجيولوجيا والتنقيب للحصول على المرجع الكامل.
ric-extrusion-press=يقوم بتشكيل مخزون الألمنيوم والسبائك الخفيفة في مقاطع قذف ومكونات هيكلية.
ric-vacuum-ladle-furnace=فرن تكرير الفولاذ الثانوي عالي الطاقة لمعالجة الفراغ والتحكم في التضمين والتشطيب المعدني الساخن.
ric-continuous-caster=عجلة جديلة كبيرة تحول الفولاذ المكرر إلى ألواح باستخدام مياه تبريد مكيفة من أجل صب عالي الإنتاجية ومنخفض الخسارة.

ric-rail-bulk-loader=أداة إدخال كبيرة الحجم بعيدة المدى للنقل عالي الإنتاجية بين المخازن المؤقتة على جانب السكك الحديدية والأحزمة وعربات البضائع دون الحاجة إلى عمليات نقل مكتوبة.
ric-slurry-transfer-pump=مضخة معالجة عالية الإنتاجية للملاط ومياه المناجم والسوائل الصناعية السائبة، بما في ذلك تحميل وتفريغ عربة السوائل.

ric-deep-geological-indication=مؤشر معدني عميق في وقت متأخر من اللعبة. يتطلب جهاز حفر عميق للمسح؛ الكشف لا يحل محل أو يستهلك رواسب الخام المبكرة.
ric-deep-ore-reserve=احتياطي معدني عميق محدود. يتم استخراجها باستخدام مثقاب الإنتاج العميق بعد المسح والتحليل. ينتج خامًا خامًا عالي الجودة.
ric-deep-core-drilling-rig=منصة جيولوجية متخصصة بقدرة 650 كيلووات تكشف عن احتياطيات خام عميقة محدودة. يتطلب المسح الجيولوجي العميق.
ric-deep-production-borer=حفار متخصص بقدرة 1.8 ميجاوات لاحتياطيات الخام العميقة المحدودة عالية الجودة. يتطلب فحصًا عميقًا معتمدًا للبناء.
ric-deep-survey-monitor=أداة دائرة تُبلغ عن عدد المؤشرات الجيولوجية العميقة القريبة والاحتياطيات المحدودة ضمن 32 مربعًا. لا يستخرج الخام أو يتجاوز سلسلة المسح/التحليل.
[autoplace-control-names]
ric-geological-indication-iron-bearing=جيولوجيا حاملة للحديد
ric-geological-indication-copper-bearing=جيولوجيا حاملة للنحاس
