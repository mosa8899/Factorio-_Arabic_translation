[mod-setting-description]
override-space-connection=يعدّل الوصلات من نافيس إلى فولكانوس وغليبا وفولغورا لتمر عبر ملونا. سيجبر كل منصة في طريقها إلى نافيس على إعادة ضبط رحلتها يدوياً.
space-science-pack-output=يعدّل ناتج وصفتَي حزمة علوم الفضاء.
enable-muluna-satellite-radar=قد يسبب مشاكل في الأداء أو إمكانية التخريب عند تفعيله على خوادم متعددة اللاعبين.
muluna-hardcore-restrict-crusher=يحصر وصفات الكسّارة والكسّارة 2 بملونا، ويضيف ألواح الألومنيوم إلى وصفة الكسّارة.
muluna-hardcore-restrict-asteroid-collector=يحصر وصفة جامع الكويكبات بملونا، ويضيف ألواح الألومنيوم إلى وصفة جامع الكويكبات.
muluna-change-quality-science-pack-drain=يمكن تعطيل معدلات استهلاك حزم العلوم المخصصة في ملونا للحفاظ على التوافق مع مودات أخرى.
muluna-hardcore-remove-steam-furnaces=يزيل مبنيَي «الفرن البخاري الحجري» و«الفرن البخاري الفولاذي» من اللعبة. يزيد الواقعية، لكنه يزيد صعوبة البدء على ملونا بدون شحنات خارجية.
muluna-hardcore-remove-starting-cargo-pods=يزيل كبسولات الشحن الابتدائية في ملونا. هذا يجعل من المستحيل إنشاء قاعدة على ملونا دون شحنات خارجية.
muluna-hardcore-lock-recipe-x=يحفّز بناء علوم صغير قبل إطلاق أول صاروخ عبر حجز تقنية خلف علوم الفضاء.
muluna-easy-simple-wood-gasification=يضاعف ناتج كل خطوة في سلسلة تغويز الخشب مع منع وحدات الإنتاجية.
muluna-hardcore-classic-wood-gasification=في الإصدار 2.0، أُزيلت خطوة واحدة من سلسلة تغويز الخشب في ملونا (الخشب المكسّر). هذا الخيار يعيد تلك الخطوة.
muluna-easy-vanilla-rocket-part-costs=بشكل افتراضي، يضاعف ملونا تكلفة كل وصفات أجزاء الصواريخ غير المستخدمة على ملونا، ويضاعف الحد الأقصى لوحدات الصومعة، ويضيف عشرة مستويات جديدة لتقنيات إنتاجية أجزاء الصواريخ بعد فتح علوم الفضاء. هذا الخيار يتراجع عن هذه التغييرات.
muluna-easy-wood-gasification-productivity=يقلل صعوبة إنتاج المنتجات البترولية على ملونا بإضافة تقنية تزيد إنتاجية تغويز الخشب. يُنصح عند اللعب ببداية ملونا.
muluna-graphics-enable-footstep-animations=تستهلك جسيمات خطوات الأقدام نحو 0.01 ميلي ثانية لكل لاعب على ملونا في كل تحديث. على الخوادم الضخمة قد يسبب ذلك مشاكل في الأداء.
muluna-easy-simple-nanofoamed-polymers=يبسّط سلسلة تصنيع البوليمرات الرغوية النانوية بجعل تلف البلاستيك المنتشر يبدأ عند التصنيع بدلاً من بدء الصنع.
muluna-easy-revert-changes-to-space-platform-technology=يتراجع أيضاً عن تغييرات تقنية دفع المنصة الفضائية لإتاحة وصفات وقود الدفع/المؤكسد القياسية قبل الوصول إلى ملونا.
muluna-easy-electric-roboports-on-muluna=يرفع ضغط جو ملونا إلى 10 hPa، مما يسمح بعمل منافذ الروبوتات الكهربائية على ملونا.
muluna-interstellar-science-pack-dynamic-packs-required=سيُطلب نصف حزم علوم الكواكب (مع التقريب للأعلى) التي تساهم في اكتشاف [technology=interstellar-science-pack]، بدلاً من القيمة الثابتة.
muluna-alternative-automation-pack-recipe=يسمح بإتمام بحث التقنيات المبكرة على ملونا. يُفعّل دائماً مع بداية ملونا.
muluna-easy-interstellar-science-pack-compatibility-mode=تُضاف حزمة علوم الاستكشاف فقط إلى تقنيات ملونا المخصصة وتقنيات نهاية اللعبة.
muluna-runtime-locomotive-replacement=تفعيل استبدال القاطرات أثناء التشغيل لمنع استخدام الوقود غير المؤكسج فيها.

