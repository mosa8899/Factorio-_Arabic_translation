menu_nullius=Nullius
title_nullius=Nullius: مقدمة إلى Factorio

page_nullius_text_1=في هذه المقدمة إلى Factorio، تلعب دور أندرويد أُرسل لتطوير كواكب قاحلة وبثّ الحياة فيها. بعد قرون من الزمن ستؤدي جهودك إلى مجرة مليئة بالكواكب الجاهزة لهبوط المهندسين اضطرارياً عليها. هذا مود إعادة صياغة شاملة يستبدل جميع الوصفات والتقنيات. لا حياة يعني لا فحم ولا نفط ولا خشب ولا زواحف ولا أكسجين حر في الجو. علاوة على ذلك، بما أن كواكب كثيرة فقيرة بالعناصر الثقيلة النادرة كالنحاس أو اليورانيوم، ستركّز تقنيتك على العناصر الأكثر وفرة والأخف وزناً.

page_nullius_text_2=الموارد الطبيعية الأساسية هي خام الحجر الرملي والباوكسيت والكالسيت والهواء وماء البحر والغاز البركاني. تصبح الموارد المتقدمة مثل النحاس واليورانيوم متاحة لاحقاً مع تقنية تعدين الكويكبات. الباوكسيت خام للألومنيوم، موصل كهربائي ومادة إنشائية مفيدة. الكالسيت مصدر للكالسيوم، مفيد في الأسمنت والزجاج وعلم المعادن، وهو أيضاً مصدر لآثار من الكبريت. يوفر الحجر الرملي السيليكون، الضروري للإلكترونيات والزجاج، إضافة إلى كميات ضئيلة من خام التيتانيوم. يتألف الهواء بشكل أساسي من النيتروجين وثاني أكسيد الكربون (مادة أولية حيوية لمنتجات الكيمياء العضوية مثل البلاستيك)، لكنه يحوي آثاراً من غازات مهمة أخرى منها الغازات النبيلة كالأرجون والهيليوم. ماء البحر مصدر للهيدروجين والأكسجين والكلور والصوديوم وآثار من الديوتيريوم والتريتيوم والليثيوم ومعادن أخرى. الغاز البركاني مصدر للكبريت وأول أكسيد الكربون وآثار من البورون.

page_nullius_text_3=بمجرد أن تؤسس قاعدة صناعية تكفي لإطلاق الصواريخ، تكون أهدافك في نهاية اللعبة هي بثّ الحياة على هذا الكوكب وإطلاق نسخ منك لتكرار العملية على كواكب أخرى في أرجاء المجرة. ستحتاج إلى رفع مستوى الأكسجين في الجو وبثّ نظام بيئي متنوع وراثياً من أنواع نباتية وحيوانية متعددة، لكل منها متطلبات بقاء خاصة به. يجب أن تعيد اتصالك بصانعيك لتنزيل جينومات هذه الأنواع، وتجميع المواد الحيوية من الصفر حتى تتوفر لديك مخزونة تكفي للتكاثر الطبيعي. كثير من هذه الأنواع تنتج مواد مفيدة بتكلفة أقل من تصنيعك لها، لذا قد ترغب في إدماج بعضها في خطوط إنتاج مصنعك.

menu_mods=المودات
title_mods=المودات
page_mods_text_1=يستخدم هذا المود موارد وتقنيات ووصفات مختلفة، لذا لا يتعامل جيداً مع المودات الأخرى التي لها تقنيات ووصفات خاصة بها ما لم تُكيَّف خصيصاً للعمل مع Nullius. مودات تحسين جودة الحياة دون تقنيات أو وصفات خاصة قد تعمل فحسب. بعض ميزات اللعب الشائعة في المودات مدمجة بالفعل في Nullius بشكل من الأشكال، مثل تعبئة الماء وتكديس العناصر والخامات اللانهائية.وعدد محدود من المودات التي لها تقنيات نُقلت بالفعل للعمل مع Nullius. ومن المتوقع إضافة غيرها. قد تتم هذه التوافقية بواسطة Nullius أو بواسطة المود الآخر.
page_mods_text_2=من المودات المعروف أنها نُقلت بالفعل: Miniloader وTransport Drones وJetpack وFactorissimo2 وLTN - Logistic Train Network وLTN Combinator Modernized وBob's Adjustable Inserters وSafe Waterfill وTeleporters وAdvanced Fluid Handling وWarehousing وRobot Replacer وAAI Signal Transmission وTrain Supply Manager (TSM) وInduction Charging وStack Combinator وText Plates وResource Spawner Overhaul (RSO) وI,Robot.

menu_research=البحث
title_research=البحث
page_research_text_1=في Nullius سبع حزم علوم. أول اثنتين تُفتحان مبكراً جداً، والخمس التالية تتزايد تقدماً وتكلفةً بشكل أُسّي. لذا يمكن تقسيم شجرة التقنيات إلى ست مراحل متميزة.
page_research_text_2=يستبدل Nullius كل التقنيات الأصلية، لذا تختلف الأسماء والتدرج كثيراً عمّا اعتدته. تقريباً كل ما يمكنك فعله في اللعبة الأساسية يمكنك فعله في Nullius، باستثناء بعض تقنيات الجيش أو الطاقة، لكنه قد يأتي بشكل آخر. يحاول Nullius تبسيط بعض المواد الوسيطة غير الضرورية، ويستخدم بدلاً منها المنتجات النهائية كمواد وسيطة أو يُحمّل العناصر بأكثر من استخدام.
page_research_text_3=بعض الأمثلة: متفجرات الهاويات والمتفجرات ليست عنصرين منفصلين؛ متفجرات Nullius مادة وسيطة تنفجر أيضاً لتدمير الهاويات. لا توجد معدات بطارية شخصية منفصلة؛ البطاريات العادية هي معدات ومواد وسيطة ووقود قابل للشحن للمركبات. تُسمى الرادارات عُقد مستشعرات، والفرق الرئيسي أن نطاق مسحها للقطاعات البعيدة أصغر بكثير (وهو جانب أشد ضرورة مع وجود الزواحف)، لكن نطاق عرض مصنعك عن بُعد من عرض الخريطة أكبر. يوفر Nullius بدلاً من ذلك طريقة مختلفة لمسح القطاعات البعيدة جداً ضمن تقنية الاستكشاف.

menu_early=بداية اللعبة
title_early=بداية اللعبة
page_early_header_1=المرحلة الأولى: بحث الجيولوجيا وعلم المناخ
page_early_text_1=تبدأ دون أي وصفات على الإطلاق، لكن أول تقنية تفتح عينات الجيولوجيا ولا تتطلب نفسها أي حزم علوم، فقط وقتاً في المختبر. مختبرك موجود في مكان ما من حطام مركبتك. ستبدأ بقدر يكفي من المباني كي تتقدم بما يكفي لصنع كل هذه المباني بنفسك.
page_early_text_2=الجيولوجيا وعلم المناخ بسيطان ورخيصان الإنتاج. تقنيات هذه المرحلة منخفضة التكلفة جداً ومُعدّة لأن تُبحث بسرعة. فهي تمهّد لعمليات تصنيع المواد الأساسية اللازمة لمرحلة البحث التالية.
page_early_header_2=المرحلة الثانية: بحث الهندسة الميكانيكية
page_early_text_3=الهندسة الميكانيكية ليست ببساطة المرحلة السابقة، لكن تقنياتها لا تزال تتطلب أعداداً قليلة من حزم العلوم. هذه التقنيات تمكّنك من بناء نسخ خاصة بك من معظم المنشآت التي تبدأ اللعبة بها، فتتمكن من توسيع قاعدتك بلا حدود. وبنهاية هذه المرحلة ستكون قادراً على التخلص من كل مخلفاتك الجانبية، مما يتيح أتمتة مستدامة.
page_early_text_4=بما أنك لا تستطيع توسيع التصنيع إطلاقاً دون هذه التقنيات الميكانيكية الأساسية، فإن معظم تقنيات هذه المرحلة وما قبلها لا تتأثر بإعداد مضاعف تكلفة التقنيات.

menu_mid=منتصف اللعبة
title_mid=منتصف اللعبة
page_mid_header_1=المرحلة الثالثة: بحث الهندسة الكهربائية
page_mid_text_1=والآن بعد أن صرت قادراً على بناء مختبراتك ومصنع أكبر، يبدأ البحث بالارتفاع في التكلفة. تتيح الإلكترونيات تحكماً وأتمتة وتخصيصاً أكثر تعقيداً، منها الظهور الأول للروبوتات والوحدات وإشارات القطارات والإدراجات الطويلة والمُركّبات. فتفتح نسخ المرحلة 2 من معظم منشآت الإنتاج الأساسية، إضافة إلى أنواع جديدة من المنشآت.
page_mid_header_2=المرحلة الرابعة: بحث الكيمياء
page_mid_text_2=تفتح الكيمياء استخدامات جديدة للموارد الموجودة ومواد كثيرة جديدة، مما يتيح أدوات مفيدة كالبطاريات والمتفجرات. كما توفّر أدوات الإنتاج الضخم الحقيقي. يمكن تعليب المواد الوسيطة لرفع معدل تدفق النقل، وتسمح وصفات جديدة بإنتاج المواد المعلّبة مباشرة من مواد معلّبة أخرى. ووبالم الطريقة نفسها يمكن ضغط الغازات لتدفق أكبر وكيمياء أكثر كفاءة.

menu_late=نهاية اللعبة
title_late=نهاية اللعبة
page_late_header_1=المرحلة الخامسة: بحث الفيزياء
page_late_text_1=أصبح إنتاج الأبحاث أكثر تعقيداً بكثير، ويكاد يتطلب استخدام الروبوتات للأتمتة على الأقل، لكن بما أنك تنتجها دفعة واحدة فتكلفة الموارد مماثلة للمراحل السابقة. تتيح لك هذه المرحلة بناء المستوى الثالث والأخير من معظم المنشآت الأساسية. كما تفتح ميزات جديدة مثل تطوير بيئتك بالطائرات المسيّرة على نطاق واسع، وتقنية الصواريخ اللازمة للتقدم إلى نهاية اللعبة في المرحلة التالية.
page_late_header_2=المرحلة السادسة: بحث علم الفلك
page_late_text_2=هذه هي نهاية اللعبة. في بداية هذه المرحلة، بعد إطلاق أول صاروخ، ستُسند إليك لوحة مهمات مع متتبع لأهدافك. ستختفي هذه المهام عند بلوغها 100% من التقدم، وتفوز عندما تكتمل كلها. إلى جانب البحث، يمكنك استخدام صواريخك لتعدين الكويكبات، مما يسمح بإنشاء نقاط تعدين ثابتة بمعادن متجددة. كثير من تقنيات هذه المرحلة لا نهاية لها، لكن تكاليفها الأُسّية ستكبر في النهاية بما يتجاوز المتناول. هذه التقنيات اللانهائية حافز جيد لمواصلة التصنيع حتى أحجام القواعد الضخمة، حتى بعد تحقيق أهداف التطوير البيئي الأساسية.

menu_fluids=السوائل
title_fluids=السوائل
page_fluids_text_1=الكيمياء والتعامل مع السوائل جزآن حاسمان في نظام التصنيع في Nullius، لذا من المهم فهم كيفية إدارة السوائل. هناك مجالات معينة يختلف فيها Nullius عن التعامل الأصلي مع السوائل يستحسن التنبه لها.

page_fluids_header_1=الضغط (آلية قديمة)
page_fluids_text_2=كان في Nullius مفهوم «تقييم الضغط» للأنابيب والخزانات. أزاله المحرك في الإصدار 2.0. مع نظام السوائل المبسّط الجديد، أصبحت ترقية مستويات الأنابيب تزيد الحد الأقصى لامتداد الشبكة. علاوة على ذلك، تستهلك المضخات طاقة أكثر بكثير من ذي قبل، لذا فأنت مدفوع لترقية أنابيبك. لاحظ أن الحد الأقصى لامتداد الخزانات أقل دائماً قليلاً من مستوى الأنبوب المقابل، وهذا لتشجيع استخدام المضخات لملء الخزانات وإفراغها.
page_fluids_header_2=المخلفات الجانبية
page_fluids_text_5=كثير من العمليات الكيميائية في Nullius تنتج منتجين أو أكثر. كلما حدث ذلك، فمن المرجح أن ينشأ مخلف جانبي، لأنك على الأرجح لن تستخدم كل المنتجات بالنسبة التي تُنتج بها بالضبط. التخلص من السوائل الزائدة غير المرغوب بها ضروري للأتمتة المستدامة.
page_fluids_text_6=مرّر مؤشرك على أيقونة السائل لتقرأ التلميح. قد تكون السوائل غازات أو سائلاً. معظم الغازات يمكن تصريفها في مدخنة ومعظم السوائل في مصرف. لكن بعضها موسوم بأنه غير قابل للتصريف، ولا يمكن تصريفه مباشرة. كل المخلفات يمكن إتلافها بطريقة ما، لكن قد تتطلب خطوات أكثر. على سبيل المثال، يجب تعادل حمض الهيدروكلوريك بمحلول قلوي أولاً. ويجب حرق البنزين لتحويله إلى غازات قابلة للتصريف. وبعض المواد الصلبة، مثل هيدروكسيد الصوديوم أو الحصى، يمكن معالجتها إلى سائل لأغراض التصريف. معظم تقنيات التخلص من المخلفات الرئيسية متاحة بنهاية تقنيات الهندسة الميكانيكية. في بداية اللعبة قبل ذلك، قد تحتاج إلى بناء صناديق أو تفريغ الخزانات يدوياً.
page_fluids_text_7=الصمامات ضرورية لإدارة شبكات معقدة من المنتجات والمخلفات الجانبية. في Nullius 2.0، أُزيلت الصمامات ككيانات منفصلة في معظمها، وأصبحت المضخات قابلة للتبديل بين أوضاع مختلفة: تُستخدم صمامات التخفيف لتصريف المخلفات إذا امتلأ خزان وهدد بتعطيل الإنتاج، دون إضاعتها إذا لم يكن الخزان ممتلئاً. وتتيح صمامات الإمداد الإضافي إرسال السائل إلى مخرج ثانٍ فقط إذا كان هناك ما يكفي لتغذية مستهلك أهم أولاً. وتسمح صمامات التعبئة بملء الخزان فقط عندما ينخفض مستواه، مع ترك مساحة له ليُنتج أيضاً كمخلف جانبي دون أن يُهدر.
page_fluids_text_8=ما يستحسن تذكره أن المدخنة 1 والمصرف 1 غير كفؤين ولن يُفرغا أنبوباً تماماً. يجب أن يمتلئ المصدر قليلاً للتغلب على مقاومتهما قبل البدء بالتصريف. قد تفيد المضخات في إبقاء السوائل متحركة.

menu_energy=الطاقة
title_energy=الطاقة
page_energy_text_1=بما أنه لا حياة في Nullius، فلا فحم ولا خشب ولا نفط، ولا أكسجين في الجو يحرقها أصلاً. هذا يستدعي استخدام مصادر الطاقة المتجددة.
page_energy_text_2=طاقة الرياح هي أقل الخيارات تقنيةً وتظهر أولاً، وفي بداية اللعبة هي خيارك الحقيقي الوحيد. لاحقاً في الهندسة الميكانيكية تحصل على الطاقة الشمسية الحرارية، التي أغلى تكلفةً لكن يمكن تخزين حرارتها للاستخدام ليلاً أو عند هدوء الريح. بدءاً من مرحلة الهندسة الكهربائية، تصبح لديك مجموعة خيارات لها نقاط قوة وضعف. الرياح تحتاج مساحة كبيرة وغير متوقعة. الألواح الشمسية قد تكون غالية ولا تنتج شيئاً ليلاً. الطاقة الحرارية الجوفية تنتج طاقة ثابتة لكن لا يمكن وضعها إلا على الفوهات البركانية. الطاقة النووية تنتج طاقة ثابتة ويمكن بناؤها في أي مكان، لكنها تستهلك بعض الموارد.
page_energy_text_3=يجب أن تُبعد توربينات الرياح عن بعضها بمسافة 32 مربعاً بالضبط، لذا تشغل مساحة كبيرة. قد تساعدك المخططات المحاذاة لشبكة الخريطة أو عرض الشبكة بالمفتاح f5 في تخطيط مسافات مرتبة. سيصبح وضعها أسهل بعد بحث تقنية الصارية 1، إذ تصل بدقة إلى الـ 32 مربعاً التي تحتاجها لوضع واحدة لكل توربين. لا تخف من بناء مزرعة رياح كبيرة، فلا توجد زواحف، لذا لا تحتاج للدفاع عن تلك المنطقة. الروبوتات التي تبدأ بها قد تساعد في وضع المخططات.

page_energy_header_1=تخزين الطاقة
page_energy_text_4=بما أن الرياح والشمس تنتجان كميات متغيرة من الطاقة، فهما تحتاجان إلى تخزين الطاقة. لا يتوفر تخزين البطاريات قبل تقنية الهندسة الكيميائية، بسبب محدودية العناصر المتاحة لصناعتها. حتى ذلك الحين، يمكنك بناء أنظمة «مكثّف» خاصة بك باستخدام التحليل الكهربائي أو الغاز المضغوط، عبر مُحللات كهربائية أو ضواغط تعمل بالفائض. المُحلل الكهربائي بالفائض يعمل فقط بالطاقة الزائدة، تماماً كما يخزّن المكثّف الطاقة. يمكنك حفظ الهيدروجين والأكسجين الناتجين في خزانات عندما تنتج الرياح أو الشمس طاقة إضافية، ثم حرقهما لتوليد الطاقة عندما لا يكفيان. لن يستهلك التوربين البخار إلا إذا لم تكن الرياح والشمس تنتجان طاقة كافية.
page_energy_text_5=يستحسن النظر في استخدام مُحللات الفائض حتى في إنتاجك المعتاد بدلاً من المُحللات ذات الأولوية الأكثر تقليدية. مُحللات الفائض ذات تدفق أقصى مرتفع، لذا يمكنها ملء الخزانات في أوقات وفرة الطاقة، ويمكن لبقية قاعدتك الاستمرار باستخدام المنتجات المخزّنة في الخزانات عندما لا تعمل المُحللات. التحليل الكهربائي من أكبر مستهلكي الطاقة لديك، فإبقاؤه مرناً بهذه الطريقة قد يقلل حد أدنى متطلبات الطاقة ويقلل حاجتك لتخزين الطاقة. العيب هو أنك إذا كنت تنفد من الطاقة باستمرار، فقد لا ترى عرضاً واضحاً كالانقطاع، بل سترى نقص الهيدروجين.
page_energy_text_6=درجة حرارة البخار في Nullius تجميلية فقط. تفاعلات الحرارة الأعلى تُنتج حجماً أكبر من البخار مقارنةً بمدخلاتها، والمهم هو عدد الوحدات. كل وحدة بخار تحمل قدراً معيناً من الطاقة يظهر في التلميح، لذا يسهل حساب مقدار الطاقة المخزّنة في الخزان. التوربينات نفسها التي تستهلك البخار تستهلك أيضاً غازات مضغوطة أخرى، ولكل منها قدر محدد من الطاقة لكل وحدة. النيتروجين المضغوط هو الخيار الأكثر شيوعاً وسيطاً لتخزين الطاقة، لأن فصل الهواء يوفّر إمداداً ثابتاً من النيتروجين الزائد كمخلف جانبي.
