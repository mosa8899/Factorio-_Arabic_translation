[technology-description]
wood-gas-processing=يستخدم تغويز الخشب مختبراً كيميائياً لتحويل السليلوز والألومينا المكسّرة إلى غاز بترولي وبيتومين مخفّف. يمكن تحويل البيتومين المخفّف إلى وقود صلب باستخدام مختبر كيميائي.
wood-gas-processing-to-crude-oil=تستخدم ترقية البيتومين المخفّف البيتومين المخفّف والماء لإنتاج النفط الخام.
advanced-wood-gas-processing=يحوّل التغويز المتقدم للخشب السليلوز والألومينا المكسّرة والماء إلى زيت ثقيل وزيت خفيف وغاز بترولي باستخدام مصفاة.
