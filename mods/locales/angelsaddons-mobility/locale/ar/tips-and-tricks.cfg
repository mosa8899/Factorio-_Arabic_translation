[tips-and-tricks-name]
angelsaddons-mobility=إضافات الملاك (النقل الجماعي) - التنقل

[tips-and-tricks-description]
angelsaddons-mobility=يضيف هذا المود مجموعة متنوعة من القطارات بأسلوب الملاك بشكل مستقل عن مجموعة مودات الملاك.\nالثلاثة قطارات المزاجية هي [img=item/angels-crawler-locomotive]Crawler، و[img=item/angels-smelting-locomotive]الصهر، و[img=item/angels-petro-locomotive]البتروكيمياء.\nلكل نمط قطار قيم تشغيلية مختلفة مثل الكتلة والقدرة والسعة والكبح والسرعة القصوى.\n\n[font=default-bold]ملاحظات[/font]: لكل قطار (مع بعض الاستثناءات الصغيرة) معلومات نسخ/لصق متوافقة تتضمن الجدول والألوان، كما أنها متوافقة مع المخططات.
angelsaddons-mobility-notes=\n[font=default-bold]ملاحظات[/font]: عربات التموين هي قطارات بمقاومة هوائية عالية لكنها عالية القدرة، وتجيد كقاطرة ثانية للقطارات الأكبر.\n[font=default-bold]ملاحظات[/font]: عربات الروبوتات هي عربات شحن يمكنها استخدام معدات منفذ الروبوتات.
