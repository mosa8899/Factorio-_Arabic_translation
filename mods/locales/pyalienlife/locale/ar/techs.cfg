soot-separation=Seperate الرماد إلى السخام. Seperate السخام إلى عالٍ-القيمة المعادن مثل كـ الفضة و الذهب.
mounts-mk01=الكروداد هي كبير armored arthropods التي هي مُستأنس لـ riding.  قوي الصدفة يمكن easily كبش و يدمّر الأشجار و rocks. يمكن يكون مُجهَّز بـ معّياري معدات و supports لوجستي requests.
mounts-mk02=Dingridos هي  سلالة لـ الدينغريت optimized لـ عالٍ-سرعة riding. عند ممتلئ سرعة, هم يمكن يركض حتى أسرع من  القطار. يمكن يكون مُجهَّز بـ معّياري معدات و supports لوجستي requests.
spidertron=من خلال intensive (obsessive) experimentation أنت لديهم finally اكتُشف  طريق إلى calm و مُروَّض  الزونغور... بواسطة blocking  movements في  الميكا suit. هذه cyborgs لديهم  ضخم الحقيبة و شبكة. يمكن يكون مُجهَّز بـ معّياري معدات و supports لوجستي requests.
mounts-mk04= فادايسوس هو  نهائي ترقية في شخصي transportation. هو flies عند mach سرعة فوق كل terrain و لديه  هائل معدات شبكة. يمكن يكون مُجهَّز بـ معّياري معدات و supports لوجستي requests.
