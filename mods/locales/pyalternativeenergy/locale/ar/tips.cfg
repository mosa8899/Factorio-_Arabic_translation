[pywiki-descriptions]
steam-engine= earliest طريق إلى يصنع الكهرباء via الاحتراق بـ[entity=boiler]. \n[entity=steam-engine]\nStats: \n    الإخراج الأقصى: 7.3MW \n    consumes:[fluid=steam]\n    الكمية: 15 per ثانية \n    الأقصى الحرارة: 500°C \n\n\n[entity=boiler]يمكن فقط يولّد البخار عند  الأقصى الحرارة لـ 250 °C.\nIn order إلى يستخدم  ممتلئ potential لـ  محرك البخار,[entity=geothermal-plant-mk01]يمكن يكون موضوع على[entity=geothermal-crack].\nThe[entity=geothermal-plant-mk01]يولّد[fluid=geothermal-water]عند عالٍ كافٍ temperatures إلى الأقصى خارج [entity=steam-engine].

steam-turbine=[entity=steam-turbine]→ الأقصى. الطاقة الإخراج 119 MW. ([item=py-science-pack-2])\n\nUnlocked بـ[technology=uranium-processing], [entity=steam-turbine]هو  side-الدرجة إلى  مُضغوط البخار التوربينات intended إلى يسمح  usage لـ  يسخّن generated بواسطة [entity=nuclear-reactor]. هو consumes 60[fluid=steam]per ثانية عند  الأقصى الحرارة لـ 2000 °C.

hp-steam-turbines=[entity=steam-turbine-mk01]→ الأقصى. الطاقة الإخراج: 473 MW ([item=py-science-pack-1])\n[entity=steam-turbine-mk02]→ الأقصى. الطاقة الإخراج: 9.5 GW ([item=py-science-pack-2])\n[entity=steam-turbine-mk03]→ الأقصى. الطاقة الإخراج: 143  GW ([item=py-science-pack-3])\n[entity=steam-turbine-mk04]→ الأقصى. الطاقة الإخراج: 2.4 TW ([item=py-science-pack-4])\n\nThe عالٍ-الضغط البخار التوربينات يستهلك كبير amounts لـ[fluid=pressured-steam]و يولّد ضخم amounts لـ الطاقة.\n[fluid=pressured-steam]يجب يكون generated داخل[entity=py-heat-exchanger],[entity=py-heat-exchanger-mk02],[entity=py-heat-exchanger-mk03],[entity=py-heat-exchanger-mk04].\nEach المستوى لـ يسخّن exchanger ينتج[fluid=pressured-steam]عند progressively higher temperatures ranging من 1000 °C - 5000 °C.\n\nHeat exchangers ينقل لها يسخّن إلى[fluid=pressured-water]و  يسخّن هو sourced من [fluid=hot-molten-salt]. كثير غير-متجدد الطاقة النباتات يمكن ينشئ[fluid=hot-molten-salt]including[entity=py-coal-powerplant-mk01],[entity=py-biomass-powerplant-mk01],[entity=py-gas-powerplant-mk01],[entity=py-oil-powerplant-mk01], و[entity=nuclear-reactor-mk01]. هو's important إلى يختار  correct محطة الطاقة مستند على technological المستوى و available resources.\n\nEach التوربين consumes 60, 600, 6000, و 60000[fluid=pressured-steam]per ثانية respectively.

wind=الرياح التوربينات هي  نظيف و آمن طريق إلى يولّد الطاقة لـ your مصنع. هناك هي three مختلف varieties لـ توربين رياح. Horizontal axis الرياح التوربينات مثل كـ[entity=hawt-turbine-mk01], vertical axis الرياح التوربينات مثل كـ[entity=vawt-turbine-mk01], و multiblade التوربينات مثل كـ[entity=multiblade-turbine-mk01].\n\nAll الرياح التوربينات لديهم  variance مستند على الحالي الرياح speeds. هذا عدد represents  الأقصى أو الأدنى الطاقة الإخراج لـ  التوربين. لـ example  10mW التوربين بـ  variance لـ 80% سي لديهم  الأقصى الطاقة الإخراج لـ 18mW و  الأدنى الطاقة الإخراج لـ 2mW.  formula لـ التوربين variance هو (sin(2t) + sin(πt)) / 2 حيث t هو  الحالي gametick divided بواسطة 10000.\n\nAll الرياح التوربينات أيضاً لديهم  المجال الجوي. Placing  توربين رياح داخل آخر التوربين's المجال الجوي سي cause interference و هو لا allowed.\n\nHAWT التوربينات هي manufactured بـ expensive أجزاء, لكن benefit أكثر من الإنتاجية الوحدات. هم لديهم  lowest variance و  highest الطاقة الإخراج.\n[entity=hawt-turbine-mk01]→ Variance: 50%, المتوسط الإخراج: 5MW, المجال الجوي: 10 البلاطات.\n[entity=hawt-turbine-mk02]→ Variance: 50%, المتوسط الإخراج: 25MW, المجال الجوي: 10 البلاطات.\n[entity=hawt-turbine-mk03]→ Variance: 50%, المتوسط الإخراج: 50MW, المجال الجوي: 10 البلاطات.\n[entity=hawt-turbine-mk04]→ Variance: 50%, المتوسط الإخراج: 80MW, المجال الجوي: 9 البلاطات.\n\nVAWT التوربينات هي أقل expensive من HAWT التوربينات. هم لديهم  متوسط الطاقة الإخراج و  متوسط variance.\n[entity=vawt-turbine-mk01]→ Variance: 70%, المتوسط الإخراج: 4MW, المجال الجوي: 16 البلاطات.\n[entity=vawt-turbine-mk02]→ Variance: 70%, المتوسط الإخراج: 20MW, المجال الجوي: 14 البلاطات.\n[entity=vawt-turbine-mk03]→ Variance: 70%, المتوسط الإخراج: 50MW, المجال الجوي: 14 البلاطات.\n[entity=vawt-turbine-mk04]→ Variance: 70%, المتوسط الإخراج: 85MW, المجال الجوي: 15 البلاطات.\n\nMultiblade التوربينات يتطلب  fewest المواد إلى manufacture مع ذلك هم لديهم  منخفض الطاقة الإخراج و  جداً عالٍ variance.\n[entity=multiblade-turbine-mk01]→ Variance: 90%, المتوسط الإخراج: 550kW, المجال الجوي: 10 البلاطات.\n[entity=multiblade-turbine-mk03]→ Variance: 80%, المتوسط الإخراج: 34MW, المجال الجوي: 8 البلاطات.

blimp=[entity=aerial-blimp-mk01]يولّد الطاقة بواسطة flying عالٍ في  الغلاف الجوي. جوي التوربينات لديهم  ضخم البطارية size و  lowest الطاقة export الأولوية making ها perfect لـ dealing بـ الطاقة spikes أو brownouts.\n\nAerial التوربينات يجب يكون موضوع في  الطاقة grid. هم سي ثم يأخذ  random يمشي بين كل  الطاقة poles في  grid.[entity=power-switch]يمكن يكون eستُخدم لـ limit  ممكن paths التي جوي التوربينات يمكن يأخذ.\n\nLonger trips يسمح  التوربين إلى maintain عالٍ RPM increasing effectiveness (أعلى إلى  الأقصى المكافأة لـ +100%).\n100 البلاطات → +25% المكافأة\n1000 البلاطات → +51% المكافأة\n10000 البلاطات → +76% المكافأة\n100000 البلاطات → +91% المكافأة\n1000000 البلاطات → +97% المكافأة\nThe exact formula لـ calculating المسافة المكافأة هو 2-(1 / (المسافة^0.5/30+1) )\n\nIf your الشبكة does لا لديهم كافٍ الطاقة poles, أنت قد يحصل  "هذا المجال الجوي هو أيضاً مزدحم!" خطأ. كل جوي التوربين يتطلب 3 الطاقة poles.\n\n                       المستوى                             السرعة             الإخراج        Avg. الإخراج     البطارية  \n[entity=aerial-blimp-mk01]1.2 البلاطات/s   4.5  MJ/بلاط   6.25 MW       400 MJ   \n[entity=aerial-blimp-mk02]2.4 البلاطات/s   9.0  MJ/بلاط   25.0 MW       800 MJ   \n[entity=aerial-blimp-mk03]3.6 البلاطات/s   13.5 MJ/بلاط   56.3 MW       1.6 GJ   \n[entity=aerial-blimp-mk04]4.8 البلاطات/s   18.0 MJ/بلاط   100  MW       3.2 GJ\n\nUnlocked عند[technology=renewable-mk02], [entity=aerial-base-combinator]يمكن تلقائياً نشر أو يزيل جوي التوربينات من  كهربائي الشبكة. Perfect لـ upgrading جوي التوربين networks إلى higher tiers أو constantly topping أعلى your الطاقة الشبكة. يغذّي [entity=aerial-base-combinator]بـ  جوي التوربين الدائرة الإشارات و هو سي attempt إلى يحتفظ التي exact عدد لـ التوربينات deployed في  الشبكة. Note التي missing الإشارات هي counted كـ 0. Consumes 1MW.\nOutputs[virtual-signal=signal-1][virtual-signal=signal-2][virtual-signal=signal-3][virtual-signal=signal-4]مستند على  الحالي عدد لـ جوي التوربينات في  كهربائي الشبكة per المستوى.\nOutputs[virtual-signal=signal-A][virtual-signal=signal-B][virtual-signal=signal-C][virtual-signal=signal-D]مستند على  الحالي عدد لـ جوي التوربينات stored في  القاعدة (الأقصى: 10) per المستوى. \nOutputs[virtual-signal=signal-yellow]مستند على  summed stored الطاقة لـ كل التوربين (MJ).\nOutputs[virtual-signal=signal-green]مستند على  summed الأقصى السعة لـ كل التوربينات (MJ).

lfr-stirling=[entity=lrf-panel-mk01]و[entity=stirling-concentrator]كلاهما يستخدم sunlight إلى دافئ أعلى[fluid=molten-salt]أثناء  يوم.  higher-الحرارة الملح المصهور يمكن ثم يكون eستُخدم لـ يولّد الكهرباء via[entity=lrf-building-mk01]و[entity=solar-concentrator]. Adding أكثر panels أو concentrators سي يزيد  السرعة عند الذي  الملح هو warmed, و لذلك  السرعة عند الذي  الطاقة النبات سي يكون قادر إلى operate. [entity=lrf-panel-mk01]adds 600kW لـ يسخّن إلى  الملح المصهور stored داخل لـ هو, و [entity=stirling-concentrator]does  نفس عند 1.6MW لـ يسخّن. Note التي هو يمكن يأخذ  أثناء لـ  الملح إلى دافئ أعلى initially.\n\nThe الحرارة لـ  الملح المصهور does لا تلقائياً equalize بين entities. بدلاً من أنت يجب continuously المضخة  بارد الملح إلى  ساخن الملح.  آخر panels contribute إلى  التسخين لـ  الملح التي goes إلى  الطاقة النبات, even though هو قد يأخذ  أثناء لـ  نظام إلى reach  steady state.\n\nBoth [entity=lrf-panel-mk01]و [entity=stirling-concentrator]هي disabled أثناء ليل وقت مع ذلك هم سي لديهم 100% الإخراج even بـ  صغير الكمية لـ ضوء النهار. هناك هو لا falloff.  ratio بين[entity=lrf-building-mk01]و[entity=lrf-panel-mk01]هو 46.2 panels per الطاقة النبات.  ratio بين[entity=stirling-concentrator]و[entity=solar-concentrator]هو 34.2 panels per الطاقة النبات.

thermosolar=[entity=sut]هو  البرج الشمسي megastructure التي works بواسطة باستخدام  sun إلى يسخّن ساخن الهواء عبر  كبير عدد لـ[item=sut-panel]بلاط covers. ساخن الهواء rises عبر  البرج و spins generators. في order إلى يولّد الطاقة, [item=sut-panel]يجب يكون موضوع في  100 بلاط النطاق لـ  main[entity=sut]. كل بلاط يولّد 320 kW و  الأقصى لـ 31488 يمكن يكون موضوع حول  single البرج.\nThe البرج الشمسي هو الأكثر effective أثناء عالٍ noon. بدون ممتلئ ضوء النهار,  الإخراج لـ  البرج هو smoothly مُختزل. آخر الطاقة توليد أو التخزين methods سي يحتاج إلى يكون مستخدَم في  downtime. بـ  ممتلئ الكمية لـ[item=sut-panel] البرج سي الإخراج 10.1 GW أثناء peak daytime. على المتوسط  ممتلئ البرج سي يولّد 7.1 GW.\nUnlike آخر البلاطات, [item=sut-panel]هو موضوع أعلى الماكينات بدلاً من لـ على  مطحون. هذا means التي أنت يمكن يبني anything underneath  الزجاج surface أثناء ما زال functioning كـ-expected.\nNOTE: Due إلى  minor amounts لـ المعالجة الطاقة needed إلى simulate [entity=sut]هو هو likely  الأكثر UPS-فعّال الطاقة المصدر في بيانودون’s mods. هذا هو  عظيم option إن أنت هي struggling لـ performance.\n\nUnlocked عند[item=py-science-pack-4]بـ[technology=thermal-mk03].\n\n[entity=solar-tower-building]يستخدم الشمسي الطاقة إلى يسخّن[fluid=hot-molten-salt].[entity=solar-tower-panel0]هو eستُخدم لـ orient و focus كل الشمسي خفيف إلى  single point. كل[entity=solar-tower-panel0]يجب يكون موضوع في  100 بلاط النطاق لـ  megastructure و يولّد على المتوسط 59.8 MW.  الأقصى عدد لـ[entity=solar-tower-panel0]حول  single البرج الشمسي هو 1926.\nDuring noon, [entity=solar-tower-building]يولّد أعلى إلى 115.2GW و converts 4000[fluid=molten-salt]إلى 4000[fluid=hot-molten-salt]per ثانية عند 5000° C. هذا هو كافٍ الطاقة إلى continuously يركض 1/50th لـ [entity=steam-turbine-mk04]. على المتوسط throughout  whole يوم  ممتلئ[entity=solar-tower-building]يولّد 80.64 GW.\n\nUnlocked عند[item=utility-science-pack]بـ[technology=thermal-mk04].

microwave-receiver=[entity=microwave-receiver]يسمح  ينقل لـ الشمسي الطاقة من [item=microwave-satellite]في orbit.\n\nEach[item=microwave-satellite]يمكن beam أسفل أعلى إلى 4.8MW لـ الطاقة. في order إلى يحصل  القمر الصناعي إلى orbit, launch هو إلى الفضاء بـ [entity=rocket-silo]. [entity=rocket-silo]لديه room لـ أعلى إلى 5 الأقمار الصناعية per launch.\n\n[entity=microwave-receiver]يمكن support أعلى إلى 15 الأقمار الصناعية لـ  الإجمالي لـ 72 MW.

nuclear-fission=Starting بـ[technology=uranium-processing]يحوّل[item=uranium-ore]إلى[item=pu-238]needed لـ[item=chemical-science-pack]باستخدام [entity=nuclear-reactor].  المفاعل سي يحرق خلية وقود regradless لـ  يسخّن كون مستخدَم أو لا. \n\nAfter researching[technology=nuclear-power]أنت يمكن ينتج كبير amounts لـ الكهرباء بـ[entity=nuclear-reactor-mk01]fueled بواسطة[fluid=uf6]أو بـ[entity=nuclear-reactor-mox-mk01]fueled بواسطة[fluid=puo2].\n\nThe reactors سي ينتج المفاعل النفايات[fluid=reactor-waste-1]أو[fluid=reactor-waste-2].  المفاعل النفايات يمكن يكون separated إلى[fluid=hot-molten-salt]و[item=high-energy-waste-1]أو[item=high-energy-waste-2]الذي يمكن يكون معالَج إلى recover unburnt اليورانيوم و البلوتونيوم isotopes لـ العلم و الوقود.\n\nThe[entity=nuclear-reactor-mk01]هو eستُخدم لـ ينتج الطاقة و يحوّل[item=yellow-cake]إلى[item=plutonium-oxide]أكثر effectively من سيكون يكون done في[entity=nuclear-reactor].\n\nThe[entity=nuclear-reactor-mox-mk01]ينتج الطاقة و converts excess[item=u-238]و[item=pu-239]إلى آخر isotopes لـ البلوتونيوم.\n\nThe الوقود المعالجة لـ واحد[entity=nuclear-reactor-mk01]سي يكون قادر إلى ينتج [item=u-238]مطلوب بواسطة عدة[entity=nuclear-reactor-mox-mk01].  recycled النفايات لـ كلاهما يمكن ينتج أكثر من  needed[item=pu-239]إلى يغذّي [fluid=puo2]لـ [entity=nuclear-reactor-mox-mk01].\n\nSee  section على[item=steam-turbine-mk01]على الطاقة الإنتاج بـ[fluid=hot-molten-salt]

mdh=[entity=mdh]هو  الأكثر powerful مدمج الاندماج المولّد theoretically ممكن. هو يستخدم نقي[fluid=neutron]البلازما كـ  moving conductor, rotating عند مستحيل speeds. مجرد  single MHD المولّد هو powerful كافٍ إلى الإمداد كل لكن  الأكثر هائل factories.\nIt's unlocked عند[item=production-science-pack]بـ[technology=fusion-mk02]و يولّد أعلى إلى 1.5 TW.\n\nThere هي 5 ways إلى manufacture  مطلوب[fluid=neutron]البلازما:\n\n[recipe=thermal-neutron]:\nUse [entity=neutron-moderator-mk01]إلى يسخّن subzero neutrons إلى 500 °C. هذا method consumes expensive[item=control-rod]لكن يمكن يكون مستخدَم في  pinch بدون access إلى proper الاندماج reactors. Due إلى inadequate البلازما ionization,  MHD المولّد سي operate عند 10% الكفاءة و يولّد 150 GW.\n\n[recipe=dt-fusion]:\nTritium الاندماج هو  أول النيوتрон البلازما manufacturing يعالج داخل [entity=fusion-reactor-mk01]. Unlocked عند[technology=fusion-mk02], هذا الطاقة المصدر consumes قيّم[fluid=tritium]الذي يمكن فقط يكون مصنوع من [recipe=deuterium-fusion]داخل  2nd[entity=fusion-reactor-mk01].  البلازما ionization هو 4X أكثر فعّال من compared إلى[entity=neutron-moderator-mk01]و يمكن يولّد 600 GW داخل[entity=mdh]. Note التي كل[entity=fusion-reactor-mk01]consumes 5.17 GW الذي cannot يكون مُختزل بـ[item=efficiency-module-3].\n\n[recipe=dt-he3]:\n[technology=fusion-mk03]يفتح aneutronic[fluid=helium3]الاندماج. Aneutronic الاندماج يمكن فقط يكون performed داخل [entity=fusion-reactor-mk02]الذي consumes  هائل 41.33 GW. هذا الوصفة consumes expensive[item=silver-foam]و[fluid=liquid-helium]إلى ينشئ أعلى إلى 900 GW في  MHD المولّد.\n\n[recipe=b-h]:\nBoron-الهيدروجين الاندماج هو  sidegrade الاندماج method unlocked عند[technology=fusion-mk04]. هو consumes [fluid=tholins]داخل[item=production-science-pack]و ينشئ أعلى إلى 1.2 TW في  MHD المولّد.
# This should be readded to the mhd wiki entry if antimatter is reenabled in pysex. also be sure to re-add it in other languages
# \n\n[recipe=antimatter-fusion]:\nAntimatter fusion is the final and most powerful form of fusion unlocked at [technology=fusion-mk04]. A steady supply of [item=antimatter] can effectively generate infinite energy. It creates a perfectly ionized neutron stream for the MHD generator to run at 100% efficiency and generate 1.5 TW.