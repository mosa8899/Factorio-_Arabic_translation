module-inserter-ex-target-entities=شروط الهدف
module-inserter-ex-target-entities-tooltip=يحدد الآلات التي ستستعمل مواصفات الوحدات المرتبطة\nتُفحص الصفوف من الأعلى للأسفل، ويُستعمل أول صف مطابق. إذا لم يطابق أي صف وكان مربع «الوحدات الافتراضية» محدداً، يُستعمل ذلك الصف - وإلا تبقى الوحدات الموجودة في الآلة كما هي.\nلكي يطابق صف، يجب أن تتطابق كل الشروط المحددة (أنواع الشروط غير المضبوطة تُتجاهل). على سبيل المثال، إذا حُددت الآلات والوصفات معاً، فإن الآلات المضبوطة على إحدى تلك الوصفات فقط هي التي تطابق، أما إذا حُددت الآلات وحدها فإنها كلها تطابق بغض النظر عن وصفتها.
module-inserter-ex-module-specification=مواصفات الوحدات
module-inserter-ex-module-specification-tooltip=الوحدات المراد إدراجها\nحدد الوحدات التي تُدرَج في الأهداف المرتبطة (على اليسار)\nالمواضع الفارغة تُزيل أي وحدة موجودة حالياً في ذلك الموضع\nإذا كانت الآلة تملك فتحات أقل، ستُستعمل أول الوحدات حتى عدد فتحاتها ويُتجاهل الباقي\nيمكن أيضاً تحديد مجموعات وحدات بديلة إذا لم تكن الأولى مناسبة دائماً (مثل احتوائها على وحدات إنتاجية)
module-inserter-ex-default-modules=الوحدات الافتراضية
module-inserter-ex-default-modules-tooltip=إذا كان محدداً، سيملأ الآلات غير المحددة أدناه بالوحدات هنا
