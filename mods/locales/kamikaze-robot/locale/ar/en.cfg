[mod-setting-description]
kamikaze-robot-detection-range=مدى الكشف بالمربعات للروبوتات الانتحارية المسلحة. الافتراضي: 100.
kamikaze-robot-allow-atomic-bomb=يسمح بالقنابل الذرية كحمولة. تحذير: الروبوت المسلح يدور حولك ويصيد بمفرده - الانفجار سيقتلك وقتل قاعدتك. معطل افتراضياً.
kamikaze-robot-safety-check=يرفض الروبوت التفجير إذا كان أحد شخصياتك داخل نطاق انفجار حمولته، ويرفض جهاز التحكم مثل هذه الأهداف.
kamikaze-robot-detonate-on-death=تنفجر الحمولة عندما يقتل الأعداء الروبوت. عطّل هذا لتجنب التفاعلات المتسلسلة بين الروبوتات.
kamikaze-robot-min-cluster=كم عدد الأعداء الذين يجب أن يتجمعوا قبل أن يضحي الروبوت بنفسه من أجلهم. الأعشاش والديدان تستحق ذلك دائماً وتُعفى من هذا. 1 = يهاجم أي شيء.
kamikaze-robot-tnt-per-slot=كم متفجرة تتسع في روبوت عادي؛ الجودة تضاعفها (أسطوري = 5x). المتفجرات الأكثر تعني نطاقاً أكبر وضرراً أكبر.
kamikaze-robot-resupply-range=إلى أي مدى يبحث الروبوت الفارغ عن صندوق يحمل صاروخه. يطير إليه، يأخذ ما يتسع، ويعود. 0 = لا إعادة تزويد تلقائية.
kamikaze-robot-max-per-player=كم روبوتاً يمكن للاعب واحد أن يضعه في الوقت نفسه. 0 = بلا حد.
kamikaze-robot-auto-attack=روبوتاتك المسلحة تهاجم الأعداء ضمن مدى الكشف من تلقاء نفسها. مع تعطيل هذا، تنفذ فقط المهمات التي تُسندها إليها بجهاز التحكم.
kamikaze-robot-default-payload=أي صاروخ يجلبه الروبوت عندما لا يكون هناك مرشح على فتحته. المرشح داخل الروبوت نفسه يفوز دائماً. "none" يعطّل إعادة التزويد التلقائية.
kamikaze-robot-loss-alert=يعرض رسالة مع تحديد على الخريطة عندما يُسقط أحد روبوتاتك (رسالة واحدة على الأكثر كل 5 ثوانٍ).
kamikaze-robot-menu-scene-only=يستبدل خلفية القائمة الرئيسية العشوائية بمشهد هذا المود وحده (روبوتات انتحارية تنقض على عش). إعداد بدء التشغيل - يسري بعد إعادة التشغيل.

