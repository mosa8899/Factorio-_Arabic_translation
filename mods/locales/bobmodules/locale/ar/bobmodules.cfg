[tips-and-tricks-item-description]
quality-probabilities=احتمال إنتاج عنصر بجودة أعلى هو 1% مع وحدة [item=quality-module,quality=normal] واحدة، ويمكن أن يصل إلى 75% مع ست وحدات [item=bob-quality-module-5,quality=legendary].\nهناك أيضاً احتمال صغير لتجاوز المراحل والحصول على جودة أعلى مباشرة كما هو موضّح في الجدول.
