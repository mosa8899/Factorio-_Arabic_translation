[tips-and-tricks-item-description]
nullius-geology-1=لقد هبطت للتو على كوكب قاحل. تضرر بعض معداتك أثناء الهبوط. يجب أن تتمكن من إنقاذ مختبر من الحطام.\n\nهذا الكوكب غير مألوف لك. للبدء، عليك أولاً تحليل البيئة المحلية. ضع [entity=nullius-lab-1] و[entity=nullius-solar-panel-1] اللذين أنقذتهما وابدأ بحث [technology=nullius-geology-1]. هذا البحث الأول لا يتطلب أي حزم علوم، فقط مختبراً مزوداً بالطاقة.
nullius-chlorine=سيظل موازنة إنتاج واستهلاك [fluid=nullius-chlorine] و[item=nullius-sodium-hydroxide] تحدياً مستمراً لمصنعك. كلاهما يُنتج عند التحليل الكهربائي لـ [fluid=nullius-saline] أو [fluid=nullius-brine]. ليس لمصنعك في البداية أي طريقة لتصريف أيٍّ منهما، لذا يجب تخزين أي فائض تنتجه.\n\nبعد البحث، يمكن إذابة [item=nullius-sodium-hydroxide] باستخدام [recipe=nullius-saline-caustic-solution]، ويمكن تصريف المحلول القلوي الزائد باستخدام [entity=nullius-outfall-1].\n\nوبعد البحث أيضاً، يمكن جعل [fluid=nullius-chlorine] خاملاً عبر [recipe=nullius-dust-disposal-1] ثم التخلص منه بأمان. ومع تقدّم بحثك ستفتح طرقاً محسّنة للتخلص من الكلور.

nullius-power=مباشرة بعد الهبوط، تقتصر خيارات توليد الطاقة وتخزينها على [item=nullius-solar-panel-1] و[item=nullius-grid-battery-1] اللذين يمكن إنقاذهما من الحطام.\n\nومع نمو مصنعك ستتمكن من بناء المزيد من خيارات التوليد والتخزين.
nullius-priority=لكل من [item=nullius-electrolyzer-1] و[item=nullius-compressor-1] و[item=nullius-turbine-open-1] و[item=nullius-turbine-closed-1] عدة أوضاع أولوية تؤثر في طريقة استهلاكها للطاقة أو إنتاجها لها. يمكنك تبديل أوضاع الأولوية للكيان باستخدام __CONTROL__nullius-prioritize__.\n\n[font=heading-1]مستهلكو الأولوية والفائض[/font]\n\nللمُحللات الكهربائية والضواغط وضعان لاستهلاك الطاقة: [font=default-bold]الأولوية[/font] و[font=default-bold]الفائض[/font].\n\nمستهلك [font=default-bold]الأولوية[/font] يعمل دائماً، حتى لو لم يكن إنتاج الشبكة كافياً لتغطية كل الطلب. هذه هي الأولوية نفسها التي تحظى بها معظم كيانات مصنعك.\n\nمستهلك [font=default-bold]الفائض[/font] لا يسحب طاقة إلا إذا كان هناك فائض في الإنتاج بعد إشباع كل مستهلكي الأولوية بالكامل.\n\n[font=heading-1]التوربينات القياسية والتصريفية والاحتياطية[/font]\n\nلكلا التوربينين المفتوح والمغلق ثلاثة أوضاع أولوية: [font=default-bold]قياسي[/font] و[font=default-bold]تصريفي[/font] و[font=default-bold]احتياطي[/font].\n\nالتوربين [font=default-bold]التصريفي[/font] يعالج سائله الداخل بأقصى سرعة دائماً. أي طاقة مولّدة تُقدَّم للشبكة بأولوية، لكن أي طاقة يولّدها تتجاوز الطلب الحالي تُهدر. هذا جيد لتصريف البخار الزائد والغازات المضغوطة مع استرداد جزء من الطاقة في العملية. مصادر الطاقة المتجددة كالشمس والرياح مشمولة في هذه الفئة.\n\nالتوربين [font=default-bold]القياسي[/font] يعالج سائله وينتج الطاقة بعد فئة الإنتاج السابقة، وفقط حتى إشباع كل مستهلكي الطاقة. هذا جيد لمحطة الطاقة الرئيسية. سيعالج سائله بمعدل أقل إذا كان الطلب منخفضاً مقارنةً بالإنتاج المتاح.\n\nالتوربين [font=default-bold]الاحتياطي[/font] هو أقل منتجي الطاقة أولوية. لن يعالج سائله ويولّد الطاقة إلا إذا فشلت كل فئات التوليد السابقة في تغطية الطلب الحالي. هذا جيد لتصريف البخار أو الغازات المضغوطة المخزّنة كشكل من تخزين الطاقة. بطاريات الشبكة مشمولة في هذه الفئة.
nullius-hydrogen-battery=باستخدام الطاقة الفائضة يمكنك تقسيم [fluid=nullius-water] في [entity=nullius-surge-electrolyzer-1] للحصول على [fluid=nullius-hydrogen] و[fluid=nullius-oxygen]. يمكن دمجهما في [entity=nullius-combustion-chamber-1] لإنتاج [fluid=nullius-steam]. يمكن تصريف هذا البخار في [entity=nullius-turbine-open-backup-1] أو [entity=nullius-turbine-closed-backup-1] لتوليد الطاقة أثناء انخفاض التوليد.\n\nيمكن ضبط [item=nullius-electrolyzer-1] ليعمل فقط عند وجود فائض في التوليد باستخدام __CONTROL__nullius-prioritize__ لتبديله إلى وضع الفائض.\n\nيمكن ضبط [item=nullius-turbine-open-1] و[item=nullius-turbine-closed-1] بوضع قياسي أو تصريفي أو احتياطي باستخدام __CONTROL__nullius-prioritize__. التوربينات في الوضع القياسي تولّد الطاقة بأولوية نفسها كبقية طرق التوليد. التوربينات التصريفية تعمل دائماً إن كان هناك غاز داخل، وتُهدر أي كهرباء زائدة لم تُستهلك. التوربينات الاحتياطية تُفعّل فقط عندما لا تكفي التوربينات القياسية والتصريفية.
nullius-compressed-nitrogen-battery=باستخدام الطاقة الفائضة يمكنك ضغط [fluid=nullius-nitrogen] في [entity=nullius-surge-compressor-1]. عندما ينخفض التوليد الأساسي دون الطلب، يمكن إزالة ضغط [fluid=nullius-compressed-nitrogen] عبر [entity=nullius-turbine-closed-backup-2] لاسترداد معظم الطاقة التي استُخدمت أصلاً في ضغط الغاز.\n\nهذا مشابه من حيث الفكرة لـ [tip=nullius-hydrogen-battery]، مع تخزين الطاقة في [fluid=nullius-compressed-nitrogen] بدلاً من تخزينها في [fluid=nullius-hydrogen] و[fluid=nullius-oxygen] المنفصلين.\n\nالغازات المضغوطة المختلفة تخزن كميات مختلفة من الطاقة. هذا يؤثر في مقدار الطاقة المخزّنة لكل وحدة غاز مضغوط، وبالتالي مقدار الطاقة في خزان واحد من الغاز المضغوط. [fluid=nullius-nitrogen] سهل الحصول بكميات كبيرة ومعظمه مخلف جانبي، مما يجعله خياراً بسيطاً لتخزين الطاقة بالغاز المضغوط. ليس أكثر الغازات كثافةً بالطاقة، وستتوفر غازات مضغوطة أخرى مع تقدّم مصنعك.
nullius-solar-thermal-power=[item=nullius-solar-collector-1] يمتص حرارة الشمس. يمكن استخدام هذه الحرارة لغلي الماء وتوليد الطاقة. الجامع الشمسي يحتفظ ببعض حرارته في الليل مما يوفر قدراً صغيراً من تخزين الطاقة. تحصل الجوامع الشمسية على مكافأة كفاءة 10% لكل جامع مجاور، لذا فإن وضعها في كتلة ينتج حرارة أكثر لكل جامع.
nullius-heat=[font=heading-1]إنتاج الحرارة[/font]\n\n[item=nullius-solar-collector-1] يحوّل طاقة الشمس نهاراً إلى حرارة. [item=nullius-geothermal-plant-1] يُبنى على [entity=nullius-fumarole] وينتج قدراً ثابتاً من الحرارة دون استنفاد [fluid=nullius-volcanic-gas]. [item=nullius-reactor] يستهلك الوقود النووي ويُخرج حرارة.\n\n[font=heading-1]استهلاك الحرارة[/font]\n\nيمكن استخدام الحرارة بطريقتين: توليد [fluid=nullius-steam] في [item=nullius-heat-exchanger-1] أو تشغيل [item=nullius-stirling-engine-1] لتوليد الطاقة مباشرة. البخار أكثر كفاءة من محرك ستيرلينغ في التوربين، بتكلفة تعقيد أكبر. يمكن أيضاً استخدام بخار المبادل الحراري لتشغيل عمليات صناعية مثل [recipe=nullius-steam-electrolysis] الأكثر كفاءة في الطاقة.\n\n[font=heading-1]تخزين الحرارة[/font]\n\nكل منتجات ومستهلكي الحرارة لديها قدر من الكتلة الحرارية تعمل كمخزن مؤقت للحرارة. يوفر [item=nullius-thermal-tank-1] تخزيناً مخصصاً للحرارة يمكن أن يساعد على حمل حرارة أكبر من الجوامع الشمسية عبر الليل.

nullius-plumbing=سيحتاج مصنعك إلى إنتاج وموازنة وتصريف سوائل كثيرة ومتنوعة لتحقيق هدفك. الإدارة الدقيقة لهذه السوائل ضرورية لمصنع يعمل بكفاءة.
nullius-pipe-extents=للأنابيب امتداد محدود. مواد الأنابيب المختلفة لها حدود مختلفة للامتداد الأقصى، وتحسّن هذا الحد يقابل مواد أنابيب أكثر تقدماً. الخط المبني من أنواع متعددة من الأنابيب يساوي امتدادَ أنبوبه الأقل.\n\nيمكن تمديد خط وصل إلى حده بإضافة مضخات لتحريك السائل. يمكن إنشاء تدفق ثنائي الاتجاه بدمج مضخات تعبئة ومضخات تصريف تحرك السوائل في اتجاهين متعاكسين.\n\nالخزانات المتوسطة والكبيرة امتدادها أصغر من أنابيب نفس المستوى، والخزانات الكبيرة أصغرها. اعزل الخزانات خلف المضخات للحفاظ على أقصى امتداد للخط.
nullius-pump-modes=يمكن ضبط المضخات للعمل بثلاثة أوضاع مختلفة باستخدام __CONTROL__configurable-valves-switch__.\n\n[font=default-bold]المضخات العادية[/font] تضخ السائل دائماً من جهة الدخول إلى جهة الخرج بغض النظر عن المستويات.\n\n[font=default-bold]مضخات التصريف[/font] لا تضخ إلا إذا كان مستوى السائل في جهة الدخول 80% أو أكثر.\n\n[font=default-bold]مضخات التعبئة[/font] لا تضخ إلا إذا كان مستوى السائل في جهة الخرج 80% أو أقل.\n\n[font=default-bold]مضخات الاتجاه الواحد[/font] تضخ السائل إذا كان مستواه في الدخول أعلى من مستواه في الخرج. يمكن تعديل قيم العتبة لكل مضخة على حدة.

nullius-terraforming=أنت أندرويد مطوّر بيئي نشره صانعوك لتطوير الكواكب القاحلة في المجرة وبثّ الحياة بين النجوم. لقد هبطت على هذا الكوكب ويجب أن تُنشئ الآن مصنعاً قادراً على تطوير البيئة المحلية، وبناء الحياة من المواد الخام، وإرسال الموجة التالية من أندرويدات التطوير لمواصلة المهمة.
nullius-oxygen-venting=لا يوجد أكسجين حر في جو هذا الكوكب [fluid=nullius-oxygen]. أحد أهدافك طويلة المدى هو رفع أكسجين الجو إلى نقطة تستطيع فيها الكائنات الحية البقاء، ثم الازدهار.\n\nلا يمكنك تصنيع أكسجين جديد، بل يمكنك فقط استخراج الأكسجين الموجود أصلاً في [fluid=nullius-water] و[fluid=nullius-carbon-dioxide] بتفكيك هذه الجزيئات. التحليل الكهربائي لوحدة ماء يُنتج وحدة [fluid=nullius-oxygen] ووحدتين [fluid=nullius-hydrogen]. تصريف الأكسجين يزيد كمية الأكسجين في الجو، لكن تصريف الهيدروجين ينقصها لأنه سيتحد مع أكسجين الجو لإنتاج بخار الماء. لزيادة مستويات الأكسجين بنجاح، يجب استهلاك الهيدروجين في عملية ما تمنع تصريفه إلى الجو.\n\nتصريف غازات متنوعة يتحد مع أكسجين الجو بطريقة مشابهة وينقص التقدّم نحو هدف الأكسجين. الغازات المختلفة تتحد مع الأكسجين بنسب مختلفة. وحدتان من [fluid=nullius-hydrogen] تتحدان مع وحدة [fluid=nullius-oxygen]، لذا لتصريف الهيدروجين عقوبة خفض أكسجين بنسبة 50%. تصريف الغازات التالية يسبب عقوبة خفض الأكسجين:\n\n[fluid=nullius-volcanic-gas]: 20%\n[fluid=nullius-hydrogen]: 50%\n[fluid=nullius-carbon-monoxide]: 50%\n[fluid=nullius-deuterium]: 50%\n[fluid=nullius-ammonia]: 100%\n[fluid=nullius-methane]: 200%
nullius-land-fill-dumping=تسمح وصفات إلقاء مواد الردم [recipe=nullius-dumping-rock] و[recipe=nullius-dumping-dirt] و[recipe=nullius-dumping-sand] بإلقاء كميات كبيرة من النواتج الجانبية آلياً. تُحمّل طائرات التطوير المسيّرة بكميات كبيرة من مواد الردم وتُرسل إلى مناطق نائية من الكوكب لإلقاء حمولتها، بعيداً عن البيئات الحساسة اللازمة للتطوير. أي شيء يمكن تحويله إلى ردم يمكن التخلص منه بهذه الطريقة. بعض الطائرات تنجو من الرحلة الطويلة وتُعاد تدويرها إلى أجزاء روبوتية لإعادة استخدامها مستقبلاً.\n\nمن النواتج الجانبية التي يمكن التخلص منها بهذه الطريقة [item=nullius-box-gravel] و[item=nullius-box-sand] و[item=nullius-box-mineral-dust] و[item=nullius-box-graphite] و[item=nullius-box-plastic] و[item=nullius-box-acid-boric] و[item=nullius-box-cellulose] و[fluid=nullius-chlorine]. بعض النواتج تحتاج معالجة قبل إلقائها، بعمليات مثل [recipe=nullius-plastic-pyrolysis] ثم [recipe=nullius-carbon-sink].

nullius-biology=أصبح مصنعك قادراً على تخليق وحدات بناء الحياة، ومن هذه المكونات الأساسية خلق كائنات جديدة يمكنها الازدهار في البيئة المحلية.
nullius-bootstrapping-biology=أصبحت لديك الآن التقنية اللازمة لتخليق وحدات بناء الحياة الأساسية: [fluid=nullius-amino-acids] و[fluid=nullius-fatty-acids] و[fluid=nullius-nucleotides] و[item=nullius-sugar]. الكائنات الحية تمتلك طرقاً شديدة الكفاءة لصنع المكونات الحيوية اللازمة لبقائها. لسوء الحظ، لا تتوفر أي منها لديك بعد.\n\nتخليق هذه الوحدات عملية بطيئة وكثيفة الطاقة. يُنصح الأندرويدات الحذرون بأن ينشئوا فوراً مصنعاً صغيراً للكيمياء الحيوية لإنتاج هذه الوحدات بكميات صغيرة. ومع الوقت ستكفي هذه الكميات الصغيرة لإرساء أشكال حياة قادرة على التكاثر الذاتي، يمكن بعدها جني وحدات البناء الحيوية منها بكفاءة أعلى.
nullius-creating-life=الحياة قادرة على التكاثر الذاتي بمجرد رسوخها، لكن يجب أولاً خلقها. كل شكل حياة جديد تحتاجه لتطوير الكوكب يجب تخليقه أولاً قبل أن يشارك في تكاثره. طوّر بحثك البيولوجي سلالة من [fluid=nullius-bacteria] تزدهر في البيئة المحلية. باستخدام [recipe=nullius-bacteria] يمكنك تخليق تجمّع بكتيري ابتدائي، ويمكنك استخدامه كحفّاز لبدء مستعمرة بكتيرية قادرة على التكاثر الذاتي عبر [recipe=nullius-bacteria-2].\n\nكل شكل حياة جديد تخلقه سيحتاج إلى مسار مشابه: تخليق تجمّع صغير أولاً، ثم استخدام تلك الكائنات الابتدائية لبدء التكاثر الذاتي.
