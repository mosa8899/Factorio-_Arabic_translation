[mod-setting-description]
inserter-fuel-leech-inserters-enabled=أنواع الإدراجات التي تُعالَج أثناء التشغيل.\nعلامة النموذج allow_burner_leech مفعّلة دائماً لكل الإدراجات بغض النظر عن هذا الإعداد.
inserter-fuel-leech-discover-per-tick=يعيد اكتشاف هذا العدد من الإدراجات الموجودة على الخريطة لكل نبضة.\nزد القيمة عند استعمال مودات تنشئ إدراجات كثيرة تريد معالجتها دون رفع الأحداث المناسبة.\nاتركها على 1 في باقي الحالات. ضبطها على صفر لن يساعد مشاكل UPS حتى على جهاز ضعيف.
inserter-fuel-leech-discover-empty-chunks-per-tick=يتخطى أقصى عدد من المقاطع الفارغة لكل نبضة أثناء اكتشاف الإدراجات.\nهذا إعداد تشخيصي غالباً، والافتراضي مناسب لأي نظام.
inserter-fuel-leech-self-leech-from-drop-enabled=إذا احتاج إدراج احتراقي إلى وقود، يمكنه أخذ من هدف الإلقاء إضافة إلى هدف الالتقاط.
inserter-fuel-leech-self-refuel-cheat-enabled=إذا علق إدراج احتراقي نفد وقوده وكان لديه وقود في يده أو أن هدف الالتقاط أو الإلقاء فيه وقود، يُنقل عنصر واحد من ذلك الوقود إلى مخزون وقود الإدراج.
inserter-fuel-leech-target-item-count-min=عدد العناصر المراد الحفاظ عليه في مخزون الهدف. سلوك الإدراج الافتراضي هو إدراج 5 عناصر وقود في مخزونات الوقود غير المركبة.
inserter-fuel-leech-source-item-count-to-leave=عدد العناصر المتروكة في مخزون مصدر احتراقي لمنع التوقف. محدود بأقل عدد عناصر في الهدف - 1. لا تضبطه أعلى من حجم حزمة الوقود القصوى - 1 وإلا قد لا يحصل الكيان الثاني في السلسلة على وقود أبداً.
inserter-fuel-leech-pickup-margin-ticks=سينقل الإدراج عناصر الوقود إلى يده قبل هذا العدد من النبضات من هدف الالتقاط أو بعده من هدف الإلقاء. إذا كانت القيمة منخفضة جداً، قد يكون الإدراج قد التقط عنصراً آخر أو فاتته فرصة السحب من الإلقاء عند خطأ في التقدير.
inserter-fuel-leech-no-use-for-fuel-seconds-to-wait=الثواني قبل التحديث التالي عندما لا يستعمل الإدراج أو هدفه عناصر الوقود.\nوهو أيضاً تأخير الاستجابة لتغيير هدف الإلقاء.\nزد هذا أولاً عند بطء UPS.
inserter-fuel-leech-missing-resource-seconds-to-wait=الثواني قبل التحديث التالي عندما يُفترض أن يحصل الإدراج على وقود لنفسه أو لهدفه لكن لا وقود للالتقاط.\nوهو أيضاً تأخير الاستجابة عند توفر الوقود.\nزد هذا عند بطء UPS بسبب أعمدة الصهر سيئة التزويد.
inserter-fuel-leech-missing-power-seconds-to-wait=الثواني قبل التحديث التالي عندما يكون إدراج لا يحرق وقوداً بلا طاقة.\nوهو أيضاً تأخير الاستجابة عند عودة الكهرباء (أو السوائل لبعض الإدراجات المعدّلة).\nزد هذا عند بطء UPS في المصانع التي تستعمل مفاتيح الطاقة بكثرة أو إدراجات تعمل بالسوائل.
inserter-fuel-leech-vanilla-self-refuel-seconds-to-wait=الثواني قبل التحديث التالي عندما يكون إدراج يحرق وقوداً بلا وقود ويمكنه إعادة التزوّد من مخزون احتراقي في موقع الالتقاط (سلوك المحرك القياسي) [ث]
inserter-fuel-leech-wait-variation-seconds=أقصى مدة تُضاف لمدد الانتظار السابقة لتوزيع حمل التحديث بالتساوي.\nزد هذا إذا كنت ترى ارتفاعات متكررة في UPS بفاصل زمني يطابق أحد الإعدادات الأخرى لفترة بعد بناء إدراجات كثيرة في وقت قصير.\nزيادته لا تساعد إذا كان UPS أقل من 60 باستمرار.
inserter-fuel-leech-chat-log-color=
inserter-fuel-leech-log-low-traffic=يطبع رسالة في الدردشة للأحداث النادرة مثل إعادة تهيئة الحالة.
inserter-fuel-leech-log-discovery-cycle=يطبع رسالة في الدردشة عند انتهاء دورة اكتشاف الإدراجات.
inserter-fuel-leech-watch-last-inserter=يُغرق دردشتك بالرسائل عن آخر إدراج بُني للمساعدة في تشخيص سكربت التحكم في هذا المود.\nالإدراج المراقب هو آخر ما بنيته. ابنِ وأزل إدراجاً لإيقاف المراقبة.
inserter-fuel-leech-last-inserter-log-color=

[string-mod-setting]
inserter-fuel-leech-inserters-enabled-none=لا شيء
inserter-fuel-leech-inserters-enabled-itemfueled=إدراجات احتراقية تعمل بالعناصر
inserter-fuel-leech-inserters-enabled-all=كل الإدراجات

[string-mod-setting-description]
inserter-fuel-leech-inserters-enabled-none=لا معالجة أثناء التشغيل لأي إدراج. تأثير شبه معدوم على UPS.
inserter-fuel-leech-inserters-enabled-itemfueled=معالجة أثناء التشغيل للإدراجات الاحتراقية التي تعمل بالعناصر. يعتمد الثمن الأدائي على عددها.
inserter-fuel-leech-inserters-enabled-all=معالجة أثناء التشغيل لكل الإدراجات. أعلى ثمن أدائي.
