combinator-item-quantity-mode-desc=كيفية حساب قيمة الإشارة لعنصر صلب عند إنشاء مُركّب ثابت من قائمة الإدخال. «تكديسات»: القيمة مضروبة في حجم تكديس العنصر. «كمية»: القيمة مضروبة في كمية إدخال الكتلة.

