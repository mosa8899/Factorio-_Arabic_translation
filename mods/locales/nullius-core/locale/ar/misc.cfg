nullius-intro=أنت أندرويد من نوع فون نيومان. بعد مئات السنين من السفر النسبي، وصل مسبارك إلى كوكبه المستهدف، وجرى تفعيلك بحمولة صغيرة من المعدات الأساسية. هذا الكوكب الخالي من الحياة فقير نسبياً بالعناصر الثقيلة ويفتقر إلى جو قابل للتنفس. ورغم هذه العيوب البسيطة، يُصنَّف عموماً كمرشح ممتاز للتطوير البيئي. مهمتك هي بناء القدرة الصناعية اللازمة لتطوير هذا الكوكب، وبثّ الحياة فيه، وإطلاق موجة من الخلفاء لمواصلة التقدم إلى كواكب جديدة.

nullius-mission=لقد أكملت المرحلة الأولى من مهمتك بإنشاء منشأة صناعية كبيرة ومتقدمة على هذا الكوكب البعيد القاحل. المرحلة التالية هي استخدام هذه القدرة لتطوير الكوكب. لديك لوحة تتتبع التقدم في كل هدف متبقٍ، وزر جديد لإدارة هذه اللوحة. ستُعتبر مهمتك ناجحة عند إنجاز كل المهام.\n\nيجب أن تبثّ 3 أنواع نباتية و3 أنواع حيوانية. يمكن تنزيل الجينومات بعد إنشاء اتصال قمر صناعي مع الشبكة بين النجمية. أطلقها في الطبيعة باستخدام الطائرات المسيّرة، التي تذكر الظروف المثالية لكل نوع. الحيوانات تحتاج إلى أكسجين في الجو.\n\nرفع مستوى الأكسجين العالمي هدف آخر. النباتات التي تبثّها في الطبيعة سترفع الأكسجين تدريجياً بمرور الوقت. والأكسجين (أو الأكسجين المضغوط) الذي تُصرفه سيساهم أيضاً في الجو. لكن أي هيدروجين أو غازات مختزلة أخرى تصرفها ستُبطل جزءاً من الأكسجين. يجب أيضاً خفض ثاني أكسيد الكربون في الجو بعزله وتخزينه كفحم وبترول.\n\nهذا الكوكب ناقص العناصر الثقيلة، التي ستحتاج إلى معالجتها عبر تعدين الكويكبات. هناك هدفان لإنشاء رواسب معدنية نادرة جديدة. يجب أيضاً إعادة تشكيل المشهد الغريب باستخدام طائرات التطوير المسيّرة لاستبدال التضاريس الغريبة بتربة أصلح للحياة الجديدة.\n\nوأخيراً، ستحتاج إلى نشر موجة التطوير عبر المجرة بصنع نسخ منك وإطلاقها في سفن إلى كواكب أخرى قد تكون صالحة للتطوير.

[mod-name]
nullius=Nullius

[mod-description]
nullius=في هذه المقدمة إلى Factorio، أنت أندرويد يطوّر كواكب ويبثّ فيها الحياة. يستبدل كل الوصفات والتقنيات. لا حياة يعني لا فحم ولا نفط ولا خشب ولا زواحف ولا أكسجين حر، مما يتطلب مصادر طاقة متجددة متنوعة. من أجل الاعتمادية، ستركّز على العناصر الوفيرة من الهواء والبحر أو المعادن الشائعة مثل خام الحديد والباوكسيت والحجر الرملي والكالسيت. التقنية المتقدمة تتيح تعدين الكويكبات لاستخراج العناصر الأندر. زر بوابة المود للحصول على وصف أعم وقائمة بالمودات المتوافقة.

