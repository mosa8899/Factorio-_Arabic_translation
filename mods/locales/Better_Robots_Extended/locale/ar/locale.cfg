[mod-setting-description]
BRE-use-space-science=عند تفعيله، تُستعمل علوم الفضاء لأغراض البحث.

BRE-Speed-MK2=يضبط سرعة الروبوت العامل MK2.
BRE-Speed-MK3=يضبط سرعة الروبوت العامل MK3.
BRE-Speed-MK4=يضبط سرعة الروبوت العامل MK4.
BRE-Speed-MK5=يضبط سرعة الروبوت العامل MK5.

BRE-Carry-MK2=يضبط سعة النقل للروبوت العامل MK2.
BRE-Carry-MK3=يضبط سعة النقل للروبوت العامل MK3.
BRE-Carry-MK4=يضبط سعة النقل للروبوت العامل MK4.
BRE-Carry-MK5=يضبط سعة النقل للروبوت العامل MK5.

BRE-logistic-radius-mk2=يضبط مدى اللوجستيات لـ Roboport MK2.
BRE-construction-radius-mk2=يضبط مدى البناء لـ Roboport MK2.

BRE-logistic-radius-mk3=يضبط مدى اللوجستيات لـ Roboport MK3.
BRE-construction-radius-mk3=يضبط مدى البناء لـ Roboport MK3.

BRE_Tier-Stufe=يحدّد أقصى درجة MK مسموح للروبوتات اللوجستية وروبوتات البناء باستخدامها.
BRE_Tier-Stufe-Extra=يتحكم في درجات MK الإضافية لمباني الروبوتات المتخصّصة ذات الدور المحدّد، مثل صناديق الروبوتات ومحطات الشحن وامتدادات الشبكة.

BRE-Kosten-Multiplikator=يضاعف تكاليف بناء جميع المباني المتخصّصة من Better Robots Extended.

BRE-disable-bobs-bots=يعطّل روبوتات Bob والأبحاث المرتبطة بها!
BRE-erzwinge-MK1-Bots=ينقل الروبوتات إلى فئة اللعبة الأساسية ويلزم بإنشاء وصفة إضافية لروبوتات MK1 وفق مواصفات اللعبة الأساسية.

BRE-erzwinge-BRE-MK1-Bots=يحدّد طريقة تعامل BRE مع روبوتات MK1 اللوجستية وروبوتات البناء.\n\nتلقائي – تُنشئ MK1 فقط إذا عدّل مود آخر وصفات الروبوتات الأساسية.\nتعطيل – لا ينشئ BRE بدائل MK1 حتى لو عُدّلت الوصفات الأساسية.\nتجاوز – تُنشئ MK1 دائماً حتى لو بقيت الوصفات الأساسية دون تغيير.
