[technology-description]
kovarex-enrichment-process=كل ما يلزم هو استهلاك فائض اليورانيوم-238. حوّله إلى بلوتونيوم-239 عبر دورات التربية.
angels-thorium-power=كل ما يلزم هو استخدام دورات طاقة مبنية على الثوريوم. إذا كان لديك فائض من البلوتونيوم-239 أو الكوريوم-245، يمكنك أيضاً الحصول على دفعة طاقة.
angels-fusion-power=كل ما يلزم هو بثّ والحفاظ على الاندماج باستخدام الميونات والديوتيريوم.
