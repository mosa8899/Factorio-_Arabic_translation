[technology-description]
planet-discovery-corrundum=كوكبٌ يكسوه غاز ثاني أكسيد الكربون مع كمية من الأكسجين تكفي للاحتراق. ولذلك فإن الضغط ودرجة الحرارة مرتفعان هنا. وقد ضمن تأثير الاحتباس الحراري المتسارع أن الظروف أقسى من ظروف فولكانوس، مع غياب أي أثر للحياة بين التراب والعواصف البرقية. والضغط العالي يجعل غاز البترول - الذي يكون متطايراً عادةً - سائلاً هنا، وبكميات هائلة. الحديد والنحاس محبوسان معاً في الغالب على هيئة كالكوبرايت. أما المعدن المهم هنا فهو البلاتين، الذي يُستخدم محفّزاً في معالجة الكبريت المتقدمة، ومصعداً ومهبطاً في التفاعلات الكهروكيميائية. ولا بد من سلسلة تصنيع فريدة من نوعها تتمحور حول الكبريت لإتقان هذا الكوكب.
platinum-processing=صقّر خام البلاتين إلى سبائك.
catalytic-chemical-plant=أنتج مصنعاً كيميائياً يستخدم البلاتين محفّزاً ومصعداً/مهبطاً للتفاعلات الكهروكيميائية.
electrochemical-science-pack=اصنع حزمة علوم الكهروكيمياء.
sulfur-redox1=اصنع كبريتيد الهيدروجين.
sulfur-redox2=أنتج الكبريت وكبريتيد الهيدروجين.
sulfur-redox3=أنتج حمض الكبريتيك من ثاني أكسيد الكبريت والماء.
sulfate-processing-1=حوّل كبريتيد الهيدروجين الزائد إلى ثاني أكسيد الكبريت.
sulfate-processing-2=حوّل الكالكوبرايت إلى مواد قابلة للاستخدام.
sulfur-dilution-concentration=ركّز وخفّف حمض الكبريتيك.
sulfonated-plastic=اصنع بلاستيكاً بحمض الكبريتيك المدخّن ومصدر كربون.
calcium-sulfate=اصنع كبريتات الكالسيوم.
calcium-sulfate-nutrients=أنتج مزيداً من المغذيات.
stone-production=اصنع الحجر.
asphalt-and-concrete=الأسفلت والخرسانة.
pressure-lab=اصنع مختبر بحث سريعاً يستخدم حزم علوم نادرة وما فوق. وستُستهلك حزم العلوم ذات الجودة العادية داخل الآلة كل 0.75 ثانية أثناء عملها.
space-steam-production=استخدم وقود محرك الدفع ومؤكسده في احتراق مضبوط لتحويل الماء إلى بخار.
dry-ice=برّد ثاني أكسيد الكربون إلى حالته الصلبة: الثلج الجاف. يمكن استخدام الثلج الجاف في صندوق الثلج لإبقاء البيوفلكس والبيوض والعلوم الزراعية عند 50% من التلف. وهو يعمل داخل صندوق الثلج فقط.
recrystalization=أذِب الصفائح الزائدة في محلول، ليُعاد تبلورها منه إلى خامات.
platinum-thruster=اصنع محرك دفع قادراً على تحمل الحرارة الناتجة عن استهلاك كميات هائلة من السوائل.
calcium-sulfate-recovery=استرد كبريتات الكالسيوم من المغذيات الزائدة. نستخدم أولاً الزيت الخفيف كطور عضوي والماء كطور مائي في قمع الإفراز. ومع الوقت، تنتشر أيونات المغذيات في الطور المائي، بينما يحتوي الطور الزيتي على كل المواد العضوية. ثم نستخدم حمض الكبريتيك لترسيب كبريتات الكالسيوم من المحلول، ومزيداً من الماء لإعادة التبلور لتنقية بلورات كبريتات الكالسيوم.
rocket-fuel-catalysis-productivity=يزيد إنتاج وقود الصواريخ في المصنع الكيميائي المحفّز (زيت خفيف + وقود). لا يعزز طرق إنتاج وقود الصواريخ الأخرى.
blue-rocket=استخدم حمض الكبريتيك لإضافة الكثير من مجموعات الكبريتات إلى الوقود الصلب، ليصبح مؤكسداً مدمجاً للصواريخ.
chalcopyrite-processing=عالج الكالكوبرايت إلى حديد ونحاس.
sulfur-poison-capsule=تبخير متقدم للمعاضّ.
petrol-dehydrogenation-and-combustion=اجفف الهيدروكربونات وكوّن روابط مزدوجة للحصول على غاز H2. ثم احرق الناتج للحصول على CO2.

