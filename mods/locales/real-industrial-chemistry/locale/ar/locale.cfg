ric-acidic-wastewater-acid-recovery=استخلاص الحمض من مياه الصرف الحمضية
ric-refinery-offgas-pressure-swing-recovery=استعادة ضغط الغاز المنطلق من المصفاة
ric-closed-loop-cooling-water-recovery=استرداد مياه التبريد في حلقة مغلقة
