flyavan=أحياناً نبالغ كثيراً. مخلوق معدّل بثقل استخدمنا فيه جينات حيتان الأرض وجينوم التريتس الفضائي، مع استبدال بعض الأعضاء والأجزاء بنظائر حيوية ميكانيكية تسمح بالطفو وحمل البضائع.
fluidflyavan=أحياناً نبالغ كثيراً. مخلوق معدّل بثقل استخدمنا فيه جينات حيتان الأرض وجينوم التريتس الفضائي، مع استبدال بعض الأعضاء والأجزاء بنظائر حيوية ميكانيكية تسمح بالطفو ونقل السوائل.
