[mod-setting-description]
start-with-basic-logistics=يبدأ اللعبة بعدد من التقنيات المبكرة مسبقة البحث، لتتمكن من تصنيع الأحزمة والآلات الاحتراقية فوراً.
quick-start-science=عدد حقائب علم الأتمتة التي يحتويها السفينة المتحطمة.
aai-fast-motor-crafting=يجعل تصنيع __ITEM__motor__ من الصفيحة الحديدية يستغرق زمن التروس الحديدية في اللعبة الأصلية. __ITEM__iron-gear-wheel__ 0.2s، __ITEM__motor__ 0.3s، __ITEM__copper-cable__ 0.2s، __ITEM__electric-motor__ 0.4s.
aai-wide-drill=يضيف حفرة تعدين كهربائية أكبر بنطاق وسرعة أكبر وفتحة وحدات إضافية.
aai-burner-turbine-efficiency=يغيّر كفاءة استهلاك الوقود في المولد التوربيني الاحتراقي.
aai-fuel-processor=يضيف معالج وقود يحوّل الوقود الكيميائي إلى وقود معالج متعدد الاستعمالات ويكسب طاقة في العملية (نسبة كسب الطاقة إعداد مختلف). إذا عُطّلت، تُخفى التقنية في بداية اللعبة.
aai-fuel-processor-efficiency=نسبة الطاقة الإضافية المكتسبة من العملية. القيم الأعلى تقلّل استهلاك معالج الوقود.
aai-stone-path=يضيف بلاطات ممر حجري خشن يمكن وضعها من الحجر.
wide-flashlight=يستبدل كشّاف الشخصية بإصدار أوسع.
enhanced-nightvision=يستخدم مجموعة تدرّج لرؤية ليلية لا تُزيل تشبع الألوان من الشاشة، بل تضيف لمسة خضراء خفيفة في بعض الظلال.
night-lut-set=شدة تأثير العتمة الليلية.

