nullius-scout-drone-2=يكشف منطقة قطاعات 13x13 من الخريطة.
nullius-scout-remote=يحدّد موقعاً على الخريطة لإطلاق طائرة استطلاع تكشف قسماً منها. من عرض الخريطة، يمكنك استهداف مواقع بعيدة غير مستكشفة ضمن مدى قاذف الطائرات.
nullius-demolition-drone=يدمر كل شيء ما عدا تجمّعات الموارد في منطقة قطاعات 4x4.
nullius-demolition-remote=يحدّد موقعاً على الخريطة لإطلاق طائرة هدم تدمر كل شيء ما عدا تجمّعات الموارد في منطقة قطاعات 4x4.
nullius-shallow-excavation-drone=يستبدل اليابسة الفارغة بمياه ضحلة في منطقة قطاعات 4x4. قد يرفع تقييم التطوير البيئي للكوكب كما تفعل طائرات التطوير (كفاءة 0.5x).
nullius-shallow-excavation-remote=يحدّد موقعاً على الخريطة لإطلاق طائرة حفر تستبدل اليابسة الفارغة بمياه ضحلة في منطقة قطاعات 4x4.
nullius-excavation-drone=يستبدل اليابسة بمياه عميقة في منطقة قطاعات 4x4. يُزيل كل ما على اليابسة، بما في ذلك الموارد. قد يرفع تقييم التطوير البيئي للكوكب كما تفعل طائرات التطوير.
nullius-excavation-remote=يحدّد موقعاً على الخريطة لإطلاق طائرة حفر تستبدل اليابسة بمياه عميقة في منطقة قطاعات 4x4.
nullius-terraforming-drone-grey=يستبدل المشهد بتضاريس رمادية في منطقة قطاعات نحو 4x4. يزيل الصخور والهاويات والماء والحطام. سيرفع تقييم التطوير البيئي للكوكب عند استبدال تضاريس غريبة كالبنفسجية أو البركانية أو السوداء.
nullius-terraforming-remote-grey=يستهدف موقعاً على الخريطة عن بُعد لإطلاق طائرة تطوير رمادية لاستبدال التضاريس.
nullius-terraforming-drone-tan=يستبدل المشهد بتضاريس سمراء في منطقة قطاعات نحو 4x4. يزيل الصخور والهاويات والماء والحطام. سيرفع تقييم التطوير البيئي للكوكب عند استبدال تضاريس غريبة كالبنفسجية أو البركانية أو السوداء (كفاءة 1.25x).
nullius-terraforming-remote-tan=يستهدف موقعاً على الخريطة عن بُعد لإطلاق طائرة تطوير سمراء لاستبدال التضاريس.
