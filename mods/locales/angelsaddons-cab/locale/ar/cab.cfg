[tips-and-tricks-name]
angelsaddons-cab=القاعدة الذاتية لـCrawler (C.A.B.)

[tips-and-tricks-description]
angelsaddons-cab=مركبة Crawler التجريبية للغاية هي مركبة قابلة للقيادة تستطيع سحب الطاقة وتوريدها للشبكة. يتيح هذا موقع تصنيع متنقلاً مؤقتاً أثناء استكشاف الخريطة. هناك ميزات إضافية مخطط لها.
angelsaddons-cab-notes=\n\n[font=default-bold]ملاحظات[/font]: للتشغيل، اضبط المركبة ببساطة في وضع النشر لتوفير الطاقة للشبكة التي تتواجد فيها المركبة.\nقد تُزوَّد الطاقة بواسطة مولدات متنقلة أو بطاريات مشحونة مخصصة.

