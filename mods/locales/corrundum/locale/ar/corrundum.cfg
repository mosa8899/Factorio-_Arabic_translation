[mod-setting-description]
automatically-populate-pressure-lab=إن كانت صحيحة، فإن data.raw["lab"]["pressure-lab"].inputs EQUALTO data.raw['lab']['lab'].inputs
automatically-populate-labs-with-electrochemical-science=سواء كنا نمر على كل مختبر ونضيف علوم الكهروكيمياء إلى مدخلاته.
ignore-everything-brute-force-science-into-pressure-lab=في نهاية data-updates، نفرّغ مدخلات مختبر الضغط. ثم نضيف كل العلوم ذات المجموعة الفرعية science pack إلى مختبر الضغط. سيؤدي هذا إلى تعطيل العلوم التي يُفترض أن يستخدمها مختبر واحد فقط، لكن هذا الإجراء يضمن التوافق. مللتُ من خطأ «لا مختبر يقبل كل العلوم».
require-vulcanus-before-corrundum=إن كانت صحيحة، سيتعين عليك استخدام علوم المعادن لفتح كوراندوم.
force-reduction-requires-plates=إن كانت صحيحة، ستُضاف صفائح الحديد والنحاس إلى ناتج وصفتَي force-reduction-iron وforce-reduction-copper على التوالي، وسيُعاد خام إضافي واحد. غيّرت الوصفة لأنني رأيت أن الحصول على عناصر أسطورية صار سهلاً للغاية، ولا سبيل لدي لإجبارك على استخدام الجودة العادية... صفيحة حديد أسطورية ستسمح لك باسترداد 3 خام حديد أسطوري من محلول الكبريتات...
maraxsis-bonus-content=إن كانت صحيحة، ستتوفر تقنية جديدة ووصفتان جديدتان - إذا كان Maraxsis مثبّتاً.
consider-planetslib=إن كانت صحيحة وكان مود planetslib مثبّتاً، فلن نضبط مدخلات المختبر ولن نضيف علوم الكهروكيمياء إلى جميع المختبرات. استخدم هذا إن أردت أن يتولى planetslib التوافق بين العلوم.
