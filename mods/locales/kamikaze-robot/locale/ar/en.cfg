[technology-description]
kamikaze-robot=تفتح الروبوت الانتحاري، رفيقاً طائراً يوصل الصواريخ إلى الأعداء.
kamikaze-robot-health=كل مستوى يزيد صحة جميع الروبوتات الانتحارية بمقدار +50 (تدرّج خطي).
kamikaze-robot-speed=كل مستوى يزيد سرعة حركة جميع الروبوتات الانتحارية بمقدار +5% (تدرّج خطي). التقنية لا نهاية لها، لذا فهي منحدر وليست مكافأة. تتراكم مع بحث سرعة روبوتات العمل.

