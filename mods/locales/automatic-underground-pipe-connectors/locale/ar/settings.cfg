[mod-setting-name]
aupc-substitute-pipe-quality=الاتصال بأنابيب بجودة مختلفة

[mod-setting-description]
aupc-substitute-pipe-quality=عند عدم توفّر أنبوب يطابق جودة الأنبوب تحت الأرض الذي وضعته، يُستعمل أقرب جودة متوفّرة لديك بدلاً من ترك شبح. وعند التساوي تُفضَّل الجودة الأدنى، فتبقى أنابيبك الأفضل محفوظة. أما الأنبوب المطابق فيُفضَّل دائماً متى كان متوفّراً.
