[technology-description]
ric-industrial-instrumentation=أدوات للطاقة الصناعية ومعدات العمليات باستخدام إشارات دائرة فاكتوريو.
ric-industrial-grid-control=التخلص من الأحمال الأصلية وتوزيع الطاقة الصناعية الممتد مع تحسين استعادة حرارة العادم.

ric-closed-loop-industry=يدفع أنظمة النفايات والمياه والغازات المنبعثة الناضجة إلى طبقة حلقة مغلقة متأخرة تعمل على استعادة المعادن والأحماض والمذيبات والهيدروجين وغاز الوقود ومياه التبريد، ثم تعمل على تثبيت المخلفات المعدنية المركزة في حشو بناء مفيد.
electric-energy-accumulators=يفتح المجمع الأساسي للتخزين على الشبكة في وقت مبكر. يوفر تخزين طاقة الرصاص الحمضي لاحقًا طريقًا أكثر كفاءة في إنتاج المواد السائبة.
ric-expanded-base-metallurgy=يوسّع إنتاج المعادن الأساسية من خلال طرق التكرير والصب والاستخلاص الصناعية للزنك والنيكل والرصاص والقصدير.
ric-industrial-alloy-casting=تحدد طرق الصب الخاضعة للرقابة لسبائك القضبان المتقدمة والمواد الأولية المعدنية المشكلة.
ric-industrial-wire-drawing=يسحب النحاس المكرر ومخزون السبائك إلى منتجات أسلاك دقيقة للإلكترونيات والمكونات الصناعية.
ric-board-substrate-processing=يعالج الزجاج والسيراميك والراتنجات والمواد الموصلة إلى مواد أولية لركيزة لوحة الدائرة يتم التحكم فيها.
ric-high-purity-silicon-processing=ينقي المواد الأولية المشتقة من السيليكا إلى سيليكون عالي النقاء مناسب لإنتاج أشباه الموصلات المتقدمة.
ric-industrial-research=يؤسس مستوى علوم مركز الابتكار الإقليمي (RIC) ما بعد الأصفر من خلال دمج مواد المعالجة عالية النقاء والإلكترونيات المتقدمة والتحفيز والهندسة النووية في سلسلة توريد بحثية واحدة.
ric-industrial-mastery=بناء وتشغيل مجمع صناعي متكامل بعد الانتهاء من فروع التعدين والتعامل مع المواد السائبة والمعادن والمواد والبتروكيماويات والإلكترونيات والمرافق والاسترداد في حلقة مغلقة في RIC. تشكل دورات العرض المستمرة شرط النصر المخصص لمركز الابتكار الإقليمي والقابل للتطبيق في ناوڤيس.
ric-industrial-fuel-boilers=يضيف توليد بخار صغير الحجم بقدرة 4.5 ميجاواط باستخدام الوقود الصلب والسائل/الغازي للمصنع السابق للمرحلة النووية. تغذي كل من المرجل المدمج والمرجل الذي يعمل بالوقود الصلب التوربين البخاري الصناعي دون الحاجة إلى حقول من المحركات البخارية العادية.
steam-power=تم تفعيلها بإنتاج 50 لوح حديدي. يفتح الأنابيب والمضخة البحرية والغلاية والمحرك البخاري.
electronics=يتم تشغيلها عن طريق إنتاج 10 ألواح نحاسية. يفتح مكونات لوحة الدوائر البدائية، والدوائر الإلكترونية، والمدخلات، والأعمدة الكهربائية الصغيرة.
automation-science-pack=تم إطلاقه من خلال إنشاء مختبر بعد الطاقة البخارية والإلكترونيات. يفتح حزم علوم الأتمتة.
ric-ore-processing-1=الأساس المبكر من المنجم إلى المصنع: الكسر والفرز الأساسيان، ومخازن مؤقتة منفصلة للخام الخام/المكسر/المركز، وإطارات الآلات، والتركيز الجاف منخفض الإنتاجية للرواسب الأولية.
ric-ore-processing=تصنيع مسار ROM منخفض الجودة للمبتدئين باستخدام الكسارة الأساسية وفارز الخام. يمكن سحق الهيماتيت والملكيت البادئ وتركيزهما على الفور؛ التكسير الأولي الثقيل يتبع بعد الفولاذ.
ric-coking=يفتح فرن فحم الكوك البناء البدائي وفحم الكوك وقطران الفحم والكربون الصناعي. يتم استخلاص غاز قطران الفحم لاحقًا من خلال التقطير.
ric-blast-furnace=يفتح الأفران العالية، والتلبيد، والصب، والحديد الخام، والنحاس غير اللامع، والنحاس البثري، وتنظيف الخبث الأول.
ric-steel-processing=يفتح مطحنة الدرفلة وطريق الخام. وهذا يستبدل اختصار الفولاذ الفانيليا بالفولاذ الصناعي المشكل.
ric-basic-chemistry=تضيف آلات كيمياء العمليات الأساسية وفصل الهواء بعد أن يصبح مسار الصلب مستقرًا.
ric-electrolysis=يفتح المحلل الكهربائي والتحليل الكهربائي للماء للهيدروجين والأكسجين.
ric-chlor-alkali-processing=يحول المحلول الملحي إلى كلور، وهيدروكسيد الصوديوم، وحمض الهيدروكلوريك.
ric-sulfur-processing=يربط تحميص النحاس واحتراق كبريتيد الهيدروجين بإنتاج ثاني أكسيد الكبريت.
ric-ammonia-processing=يجمع النيتروجين والهيدروجين لتكوين الأمونيا، ثم يؤكسدها إلى حمض النيتريك.
ric-oil-processing=يفتح عملية استخراج النفط الخام وتقطير RIC مباشرة. لا تعد معالجة مصفاة الفانيليا جزءًا من المسار المقصود.
ric-plastics=يحول المواد الأولية البتروكيماوية إلى قضبان بلاستيكية أساسية للدوائر والعلوم الكيميائية.
ric-lubricant=يعالج المخلفات الثقيلة إلى مواد تشحيم وبيتومين لأول منفذ تيار جانبي للزيت الثقيل.
chemical-science-pack=يكمل الجسر العلمي من الأخضر إلى الأزرق بمجرد أن تصبح المحركات والبطاريات والدوائر المتقدمة والبلاستيك والكبريت وحمض الكبريتيك ومعالجة النفايات مستقرة.
advanced-circuit=يفتح جسر الدائرة المتقدمة لركيزة الدائرة بعد تصنيع الألواح والبلاستيك والبطاريات وإنتاج حامض الكبريتيك.
ric-fertilizer-chemistry=يستخدم الأمونيا وحمض النيتريك وحامض الفوسفوريك وثاني أكسيد الكربون والبوتاس في كيمياء الأسمدة الصناعية. يستخدم سماد NPK أيضًا لتكييف التربة السطحية المستردة أثناء استصلاح منجم Nauvis.
ric-syngas-chemistry=يقوم بتوسيع الغاز الوقود إلى غاز توليفي والميثانول والفورمالديهايد والهيدروجين والميثان وأول أكسيد الكربون وأول تيار مذيب خفيف.
ric-olefins-and-aromatics=يشقق النافثا إلى أوليفينات ويستخلص المركبات الأروماتية للكيمياء الفينولية والأﺳﻴﺘﻮن والإﺳﺘﻴﺮﻳﻦ والراتنجات.
ric-rubber-and-resins=تنتج راتينج الفينول، وبيسفينول أ، وراتنج الإيبوكسي، والمطاط الصناعي، والبولي بروبيلين من سلسلة البتروكيماويات الموسعة.
ric-chlorinated-polymers=يستخدم كيمياء الإيثيلين والكلور لإنتاج كلوريد الفينيل والـ PVC.
ric-fluorine-chemistry=يحول الفلوريت إلى حمض الهيدروفلوريك، وفلوريد الصوديوم، وفلوريد الألومنيوم، والكريوليت.
ric-aluminium-smelting=تستخدم عملية Hall-Héroult لتحويل الألومينا إلى سبائك وألواح وكابلات من الألومنيوم.
ric-light-alloys=يستخدم الألومنيوم والنيكل والزنك وكربيد السيليكون والمطاط والإيبوكسي لبناء مواد إنشائية خفيفة وهياكل منخفضة الكثافة.
ric-lead-tin-metallurgy=يعالج الجالينا وحجر القصدير إلى الرصاص والقصدير واللحام.
ric-lead-acid-storage=يفتح مسارًا لاحقًا لحمض الرصاص ينتج ثلاث مراكم لكل دفعة. إنها تحتاج إلى تعدين الرصاص والتعامل مع الأحماض، ولكنها تستخدم بطاريات أقل بكثير لكل مركم.
ric-alloy-steel-processing=يحول الكروميت والبيرولوسيت والنيكل والصلب إلى سبائك حديدية وفولاذ مقاوم للصدأ.
ric-corrosion-resistant-components=يستخدم الفولاذ المقاوم للصدأ وPVC لصنع التروس المقاومة للصدأ والأنابيب المقاومة للتآكل.
ric-magnesium-processing=يستعيد كلوريد المغنيسيوم من الماء المالح ويحلله كهربيًا إلى مغنيسيوم لاختزال التيتانيوم.
ric-titanium-metallurgy=يعالج الإلمنيت والروتيل إلى ثاني أكسيد التيتانيوم، ورابع كلوريد التيتانيوم، وإسفنجة التيتانيوم، ولوحة التيتانيوم.
ric-lithium-chemistry=يعالج السبودومين إلى كربونات الليثيوم، وهيدروكسيد الليثيوم، وفلوريد الليثيوم، وإلكتروليت البطارية.
ric-titanium-alloys=يجمع بين التيتانيوم والألمنيوم والموليبدينوم والنيكل في سبيكة تيتانيوم متقدمة.
ric-advanced-battery-chemistry=يقوم ببناء ألسنة البطاريات وخلايا الليثيوم أيون ومخارج بطاريات الليثيوم أيون.
ric-natural-gas-processing=يعالج الغاز الطبيعي إلى غاز الميثان، والألكانات الخفيفة، والغاز الاصطناعي، والهيدروجين، والمواد الأولية للأوليفين.
ric-sour-gas-processing=يحلي الغاز الحامض ويستعيد الكبريت من خلال أكسدة كبريتيد الهيدروجين واستخلاص الكبريت كلاوس.
ric-wet-ore-processing=يحدد غسل الخام ومعالجة مياه المعالجة ومعالجة مياه الصرف الصحي/النفايات كبنية تحتية رطبة ضرورية لمنشأة التركيز الكاملة.
ric-waste-treatment=يضيف محطة معالجة النفايات ووصفات التعادل المبكر بحيث يكون للغسيل والخَبَث والمخلفات والمياه الحمضية/الحامضية منافذ.
ric-sulfur-recovery=يستعيد الكبريت الأولي من ثاني أكسيد الكبريت للبطاريات والدوائر المتقدمة والمتفجرات والعلوم الكيميائية.
ric-sulfuric-acid-production=يؤكسد ثاني أكسيد الكبريت ويرطب ثالث أكسيد الكبريت إلى حامض الكبريتيك للبطاريات والصناعة الكيميائية.
ric-naphtha-cracking=يشق النفتا إلى مواد وسيطة للبوليمر وغاز وقود لجسر البلاستيك.
automation=يفتح المجمع الأول. في RIC، لا يزال هذا بمثابة عملية تسليم من نظام النسخ الاحتياطي إلى الإنتاج القابل للتكرار.
battery=يصنع البطاريات من البلاستيك المنتج من مركز الابتكار البحثي وحمض الكبريتيك.
ric-component-logistics=تقسيم لوجستي مبكر تم ضبطه ليكون قابلاً للوصول إليه بعد وقت قصير من الأتمتة.
ric-fast-logistics=يتم ضبط الخدمات اللوجستية السريعة كترقية للصلب/المكونات بعد الصلب الصناعي.
ric-mechanical-engines=تم ضبط المحركات الميكانيكية للوصول إلى الفولاذ الصناعي دون جر اللاعب إلى العلوم الكيميائية أولاً.
ric-electric-engines=يتم ضبط المحركات الكهربائية كترقية في عصر العلوم الكيميائية بمجرد إنشاء مواد التشحيم وإطارات الآلات.
ric-basic-modules=يتم ضبط الوحدات الأولى كترقية بعد الدائرة المتقدمة مع ضريبة مكونات أخف.
ric-sulfide-flotation=تضيف التعويم الانتقائي لجزيئات النحاس والرصاص والزنك الدقيقة بعد معالجة الخام الرطب وتأسيس كيمياء الكواشف الأساسية.
ric-refinery-fractionation=يضيف التقطير بالتفريغ، والتكويك المتأخر، ونزع الماء الحمضي، واستخلاص الغاز المنبعث، وإصلاح الغاز المنبعث، وفحم الكوك البترولي، ومادة ربط الأسفلت، ومسارات الوقود الصلب في مجمع الصناعات التحويلية.
ric-petrochemical-cracking-reforming=يعزز الكيمياء البترولية من خلال المعالجة الهيدروجينية للغاز والنفط، والتكسير بالبخار، وتنقية البنزين الناتج عن الانحلال الحراري، واستخلاص المواد المُعاد تشكيلها/العطرية، وخلط الوقود الألكيلي.
ric-integrated-steelmaking=تضيف الحديد المُخْتَزَل مباشرةً، وصناعة الصلب بالأكسجين، وألواح الصلب، ودرفلة الصفائح، وإطارات الصلب المُشَكَّلة لطبقة المعادن الصناعية.
ric-copper-fire-refining=يضيف الصهر السريع، وتنقية النحاس الخام بالنار، وصب الأنود المكرر بالنار، وصفيحة النحاس المدلفنة.
ric-light-metal-forming=يضيف قضبان الألومنيوم وصفيحة الألومنيوم والمقذوفات المصنوعة من الألومنيوم والألواح الهيكلية المصنوعة من السبائك الخفيفة.
ric-stainless-forming=تضيف شحنات السبائك الحديدية، والقضبان الفولاذية المقاومة للصدأ، ودرفلة الصفائح الفولاذية المقاومة للصدأ، والبطانات المقاومة للحرارة لمعدات المعالجة المتقدمة.
ric-titanium-forming=يضيف قضبان التيتانيوم وصفيحة التيتانيوم كطبقة من المنتجات المشكّلة للمعدات المتقدمة والبنية التحتية المتأخرة.
ric-industrial-fuels-and-emissions=قم بمعالجة الفحم وفحم الكوك وتحويلهما إلى ناقلات وقود صريحة، وإعداد مواد ماصة لجهاز الغسيل، وتعريض غاز المداخن القذر لمعالجة النفايات بدلاً من إخفاء الانبعاثات وراء اختصارات الفانيليا.
ric-waste-heat-recovery=استرجاع غاز الوقود، وإزالة الكبريت من مجاري التكرير، وتغويز فحم الكوك، ومزج الوقود الصلب، وتحويل غاز المداخن الساخن إلى بخار قابل للاستخدام قبل غسله.
ric-waste-stream-recycling=توحيد معايير النفايات السائلة الحمضية، ونفايات المذيبات، ونفايات التنقيب، والغبار المعدني، والرماد، وبقايا أجهزة الغسيل، وكعكة المرشح، والحمأة في مسارات معالجة بيئية قابلة للاسترداد.
ric-nuclear-fuel-chemistry=تقوم بتعبئة كريات وقود اليورانيوم والكسوة وقضبان الوقود في خلايا وقود اليورانيوم الفانيليا المخصصة للمفاعلات من خلال سلسلة الكيمياء النووية RIC.


# 0.8.4 recipe clarity and technology tooltip pass
ric-advanced-ore-processing=يفتح طرقًا لإعداد الخام عالي الإنتاجية تتجاوز مرحلة التكسير والفرز الأساسية.
ric-advanced-process-equipment=يفتح معدات العمليات الأثقل للضغط والتآكل والترشيح والكيمياء الصناعية المستمرة.
ric-advanced-process-machinery=يفتح المفاعلات والأعمدة والآلات الكهروكيميائية المتقدمة التي تستخدمها السلاسل الصناعية المتأخرة.
ric-advanced-radiochemical-processing=يفتح خطوات فصل اليورانيوم والكيمياء الإشعاعية المتقدمة للصناعة النووية.
ric-advanced-refractories=يفتح المواد المقاومة للحرارة المحسنة للأفران والمحولات وإنتاج السبائك الأكثر سخونة.
ric-ceramics=يفتح مساحيق السيراميك والمرشحات والعوازل والمواد المقاومة للحرارة للكيمياء والإلكترونيات.
ric-circuit-board-fabrication=يفتح طريق تصنيع الألواح الذي يحول النحاس والراتنج والألياف الزجاجية والمواد الكيميائية إلى إلكترونيات قابلة للاستخدام.
ric-construction-materials=يفتح مدخلات البناء الصناعي مثل الخرسانة والزجاج والجير ومواد البناء العملية.
ric-glass-chemistry=يفتح زجاج الصودا والجير. اصنع رماد الصودا من خلال كيمياء الليمون والصودا؛ تكليس الحجر الجيري هناك يوفر ثاني أكسيد الكربون المبكر.
ric-high-tech-electronics=يفتح المجال للوسائط الإلكترونية المتقدمة للتحكم في العمليات، وآلات غرف الأبحاث، والإنتاج عالي التقنية.
ric-hydrometallurgy=يفتح طرق الترشيح وتنقية المحاليل والترسيب وطرق الاستخلاص الكهربائي لاستعادة المعادن.
ric-industrial-catalysis=يفتح طبقات المحفز، والدعامات، وإعداد المحفز من المعدن النبيل للكيمياء عالية الإنتاجية.
ric-industrial-oxidizers=يفتح طرق حمض النيتريك وبيروكسيد الهيدروجين والمؤكسد للمتفجرات والمعالجة الكيميائية.
ric-lime-and-soda-chemistry=يفتح تكلس الحجر الجيري، وهو المصدر المقصود لثاني أكسيد الكربون المبكر، بالإضافة إلى الجير الحي والجير المطفأ وطريق رماد الصودا سولفاي الذي تستخدمه شركة Glass Chemistry.
ric-phosphate-chemistry=يفتح معالجة الفوسفات للأسمدة ودعم الكيمياء غير العضوية.
ric-precious-metal-refining=يفتح طرق ترشيح المعادن الثمينة، والترسيب، والتكرير لسلاسل الفضة والذهب.
ric-rare-earth-processing=يفتح طرق ترشيح وفصل المواد الأرضية النادرة للمواد المتقدمة.
ric-real-ore-processing=يفتح معالجة مخصصة للخام الحقيقي تتجاوز اختصارات خام الفانيليا.
ric-refined-concrete=يفتح مواد بناء أقوى باستخدام السلاسل المعدنية والرابطية من Industrial Alchemy.
ric-semiconductor-fabrication=يفتح خطوات إنتاج رقائق غرف الأبحاث والطباعة الحجرية والتعبئة وأشباه الموصلات.
ric-sulfate-leaching=يفتح عملية الترشيح القائمة على الكبريتات لاستخراج المعادن من خامات خام محضرة.
ric-tool-steel-and-high-temperature-alloys=يفتح طرق صناعة السبائك لفولاذ الأدوات والسبائك الحديدية والمعادن المقاومة للحرارة.
ric-tungsten-molybdenum-processing=يفتح معالجة خام التنغستن والموليبدينوم، وهطول الأمطار، وإنتاج المعادن.
ric-uranium-chemistry=يفتح الباب أمام ترشيح اليورانيوم والتعامل مع المواد الكيميائية قبل أعمال النظائر المتقدمة.
ric-uranium-fluoride-processing=يفتح كيمياء الفلورايد المطلوبة لمعالجة اليورانيوم المتقدمة.

logistics=تضيف أدوات توجيه السيور الأساسية بعد الأتمتة، قبل أول آلات تحضير الخام الأكبر حجمًا.
logistic-science-pack=يؤسس العلوم الخضراء بعد أن تصبح مسار المعادن الأول للعلوم الحمراء قابلاً للقراءة.
ric-controlled-release-fertilizers=يضيف مزجًا متطورًا للأسمدة وأسمدة مطلية بالراتنج ذات إطلاق بطيء. في Nauvis، يحسن استعادة التربة السطحية في مواقع المناجم؛ ويمكن لعصر الفضاء أيضًا استهلاك الأسمدة في سلاسل الإنتاج البيولوجي.
ric-polymer-additives=تضيف مواد الإضافات البوليمرية النهائية، والمواد الملدنة، ومركبات المطاط، وإنتاج الألواح البوليمرية المقواة، ومركبات الصب الراتنجية.
ric-byproduct-utilisation=يحول المخلفات والبقايا المعدنية والخبث والجبس والغبار المعدني إلى مجاميع بناء مفيدة وألواح ومضافات أسمنتية وتغذية أفران منخفضة الجودة.
ric-advanced-board-materials=تضيف مادة الزجاج الإيبوكسي المشربة مسبقًا، والصفائح النحاسية المقواة، وحبر قناع اللحام، وخرطوشات المذيبات للغرف المعقمة، والحفر الدقيق، وتجميع لوحات الدوائر عالية الكثافة.
ric-process-media-engineering=يضيف مواد ماصة من الزيوليت والألومينا المنشطة ووسائط الطبقة الواقية وشحنات المحفز واستعادة الدقائق الناعمة للمحفز المستهلك للتكرير والمعالجة البتروكيماوية.
ric-industrial-gas-utilities=يضيف الهواء المضغوط، وهواء الأجهزة الجاف، وغاز النيتروجين الخامل الواقي، وحلقات مرافق هواء المعالجة الغني بالأكسجين للأنظمة الصناعية المتقدمة.
ric-utility-water-treatment=تضيف تنقية المياه منعدمة المعادن، وخلط مثبطات التآكل، ومعالجة مياه تغذية المرجل، وتحضير مياه التبريد، ومعالجة التفريغ، وتنقية مياه المرافق المستهلكة.
ric-emissions-control-equipment=يضيف معدات مجمّع الأكياس وجهاز التنقية بالبلل قبل مصادر غاز المداخن المحتوية على الجسيمات اللاحقة. تتوفر معدات المعالجة عن قصد قبل استرداد الحرارة المهدرة حتى يمكن إنشاء نظام التحكم في التلوث قبل أن تصبح تيارات العادم هذه قيد التشغيل.
ric-advanced-wastewater-treatment=تضيف التنقية الأولية والضغط على مرشح الحمأة بحيث يصبح معالجة مياه الصرف الصناعية عملية فصل متعددة المراحل للسوائل والمواد الصلبة بدلاً من وصفة تنظيف عامة واحدة.

ric-engineering-polymers=تطوير المواد الملدنة وحزم المواد المضافة وألواح البوليمر المقواة ومركبات المطاط ومواد صب الراتنج للصناعة المتقدمة.
ric-nauvis-emissions-recovery-integration=يربط أفران الكوك، وأفران الصهر، وكيمياء الكبريت، وغازات العادم من المصافي، ومياه المرافق، والحرارة المهدرة، ومياه التبريد، وترشيح أجهزة الترشيح القماشية، والغسل الرطب، ومعالجة مياه الصرف الصحي في حلقة استرداد صناعية واحدة.

ric-geological-surveying=تحديد الأنظمة المعدنية المخفية من خلال أعمال الحفر والفحص الأساسية. تكشف نتائج المسح عن نوع الودائع والدرجة وظروف المياه.
ric-surface-mining=إزالة العبء الزائد وتشغيل تدريبات المحاجر واستعادة الركام المفيد من نفايات المناجم السائبة.
ric-hard-rock-mining=يفصل تطوير منجم الصخور الصلبة إلى حفر حفرة الانفجار، أو ANFO الجاف أو شحن المستحلب الرطب، والتفجير، وحفر الصخور المجزأة. كما يتيح أيضًا التعدين بمساعدة السوائل من فاكتوريو لمنصات الشحن دون انتظار تعدين اليورانيوم.
ric-mine-dewatering=نزع الماء من المواد الرطبة الخارجة من المنجم ومعالجة تيارات مياه المنجم العادية والحمضية والمالحة قبل إعادة استخدامها.
ric-mine-waste-containment=تثبيت الأعباء الملوثة ونفايات المناجم المشعة باستخدام الاحتواء الخرساني الهندسي بعد إنشاء معالجة مياه المناجم.

ric-geological-assay=يحول عينات الحفر إلى تقارير فحص معتمدة وتقديرات احتياطيات مطلوبة لتطوير المنجم الميكانيكي.

ric-tailings-management=استرجاع المياه من مخلفات المخلفات وإنتاج مواد صلبة سميكة بدلاً من الاعتماد على التخزين الجاف لأجل غير مسمى.
ric-mine-backfilling=تحويل النفايات الطينية وصخور النفايات ونفايات الكبريتيد التفاعلية إلى ردم هندسي ومواد بناء مناجم مستقرة.
ric-mine-reclamation=قم باستعادة التربة السطحية، وحزم نفايات المناجم الخطرة، وتصنيع مواد إعادة التأهيل لإغلاق مواقع المناجم المضطربة.

ric-amine-gas-treating=تضيف عملية إزالة الكبريت بالأمين القابل للتجديد، واستخلاص غاز الحمض بطريقة كلاوس، وتخزين صهر الكبريت، وإعادة تدوير الغاز المتخلف بحيث يصبح الغاز الحامض حلقة كبريت صناعية مغلقة بدلاً من سلسلة من المنتجات الثانوية التي يتم التخلص منها.
ric-wet-sulfuric-acid=يضيف طرق امتصاص ثاني أكسيد الكبريت وأكسدة الغاز الرطب التي تحول غازات الكبريت المعدنية وغازات كبريت كلاوس مباشرة إلى حمض كبريتيك مفيد.
ric-industrial-storage=تقدم خزانات العمليات الصناعية المدمجة كبديل أنظف لتخزين الفانيليا للأغراض العامة.
ric-petrochemical-storage=تضيف خزانات سائل أسطوانية عالية السعة وخزانات غاز كروية للمصافي والمصانع الكيميائية.
ric-tank-farms=تضيف خزانات طرفية كبيرة جدًا للمرافق المركزية ومخزونات معامل التكرير والأحماض والمحاليل الملحية والسوائل السائبة.

ric-industrial-pipework=أنابيب معالجة معززة ذات حجم خطوط أكبر ومعابر أطول تحت الأرض لطرق المصافي والمرافق ومزرعة الخزانات.
ric-plant-utilities=ضخ ذو قدرة أعلى ورؤوس مدمجة رباعية الاتجاه لتوزيع سوائل النبات بشكل نظيف بين وحدات المعالجة ومناطق التخزين.
ric-marine-mineral-recovery=تجاوز الرواسب الضحلة إلى التجريف العميق، وغسل العقيدات، وإعداد الكبريتيد الحراري المائي، وتركيز الرمال المعدنية الثقيلة.
ric-marine-carbonisation=تحويل الكتلة الحيوية البحرية المتجددة إلى عامل اختزال عالي الكربون الثابت مناسب للتشغيل المبكر لأفران المعادن بدلاً من الاعتماد على الفحم الأرضي.

ric-marine-evaporation=بناء أحواض تبخير مبطنة وتبلور مياه البحر المركزة بشكل جزئي إلى ملح وجبس وعلف بوتاسيوم ومرارة ذات قيمة كيميائية.
ric-marine-offshore-processing=استبدال استخراج النفط المباشر من الأرض بإنتاج الآبار البحرية، والفصل على ثلاث مراحل، وتكييف الغاز الرطب، وتثبيت المكثفات، ومعالجة المياه المنتجة.
ric-marine-bittern-chemistry=قم باستخلاص المغنيسيوم والبروم والمحلول الملحي المتبقي الذي يحتوي على الليثيوم من مياه البحر المر بدلاً من معالجة الأملاح المركزة كمنتج ثانوي يمكن التخلص منه.
ric-marine-hydrometallurgy=ترشح العقيدات المتعددة المعادن وتطفو الكبريتيدات الضخمة في قاع البحر إلى تيارات النحاس والنيكل والكوبالت والمنغنيز والزنك والرصاص مع معالجة واضحة لمياه الصرف الصحي.
ric-marine-strategic-minerals=فصل الرمال المعدنية الحاملة للتيتانيوم، واستعادة الزركون لصهريات الزركونيا، ودمج الأجزاء الحاملة للمونازيت مع سلسلة العناصر الأرضية النادرة الموجودة.
ric-marine-deep-ocean-industry=نشر معدات تجريف عالية القدرة في أعماق المحيطات ومعدات إنتاج في المياه العميقة لاستخلاص المواد الخام المخففة للمعادن الاستراتيجية والمعادن الأرضية النادرة من الرواسب البحرية البعيدة.
ric-seawater-uranium-recovery=استخدم امتزاز وسط الأوكسيم القابل للتجديد، وشطف الحمض، والترسيب لاستعادة اليورانيوم من مياه البحر المخففة للغاية بتكلفة عالية جدًا من المواد والطاقة.

ric-mine-development=قم بتحويل بيانات الفحص والاحتياط المعتمدة إلى خطة منجم مصممة هندسيًا قبل بدء التجريد والحفر الميكانيكي.
ric-large-scale-open-pit-mining=حفر مطورة على نطاق واسع باستخدام تدريبات متخصصة في إنتاج الصخور الصلبة ومجارف حبال كهربائية عالية السعة. يتعامل تدريب الإنتاج مع إعداد حفرة الانفجار واستخراج الصخور الصلبة بعد الانفجار، في حين أن مجرفة الحبل هي أداة استخراج المواد السائبة الباهظة الثمن والمتعددة الأغراض.

ric-concentrator-plants=توسيع أساس الكسارة الفكية مع الكسر الأولي الدوار عالي الإنتاجية، والكسر الثانوي المخروطي، والغربالات الاهتزازية، ودائرة الطحن شبه الأوتوماتيكي/الطحن الكروي المغلقة ودائرة الفواصل الحلزونية المائية، والجاذبية النوعية للخام/الفصل المغناطيسي، وتكثيف/ترشيح المركز قبل العمليات المعدنية.

ric-advanced-steelmaking=يضيف التكرير الثانوي بالتفريغ، والمعالجة المتكاملة للمعادن الساخنة، والصب المستمر للألواح، وتحسين استخلاص الخبث والمعادن بمجرد أن تصبح أنظمة المواد الحرارية المقاومة والمنتجات الثانوية ومياه المرافق الناضجة قيد التشغيل.

ric-bulk-material-logistics=مناولة المواد الصلبة المخصصة بجانب السكك الحديدية ونقل الطين/السوائل عالي الإنتاجية للخدمات اللوجستية من المنجم إلى المصنع مع الاحتفاظ بقطارات وأحزمة Factorio العادية.

ric-deep-geological-surveying=قم بمسح المؤشرات الجيولوجية في وقت متأخر من اللعبة واكشف عن الاحتياطيات المعدنية العميقة المحدودة باستخدام التدريبات الأساسية المتخصصة.
ric-deep-resource-extraction=فحص العينات الأساسية العميقة واستخراج كمية محدودة من الخام المرتفع الجودة باستخدام مثاقب الإنتاج المتخصصة.
ric-associated-mineral-recovery=يمكنك استخراج تيارات صغيرة من الموليبدينوم والفضة من مركزات النحاس والرصاص العادية، بتكلفة إنتاجية من المعدن الأولي يمكن التحكم فيها.
ric-rare-earth-tailings-recovery=استخدم الفصل الكيميائي المتقدم لاستعادة المعادن الأرضية النادرة من المخلفات بعد صناعة الحلقة المغلقة.
[mod-setting-name]
ric-progression-mode=وضع تقدم الكيمياء الصناعية
ric-world-mode=وضع عالم الكيمياء الصناعية

[mod-setting-description]
ric-progression-mode=يحتفظ Space Age بالتقدم الطبيعي خارج العالم عند تثبيت التوسيع. يقوم Nauvis فقط بإزالة التقدم المطلوب على الكوكب والكويكب والمنصات الفضائية ويستبدل RIC Industrial Research بالعلوم خارج العالم. إذا تم تعطيل Space Age، فسيقوم RIC تلقائيًا بتشغيل تقدم Nauvis فقط.
ric-world-mode=اختر الحملة قبل إنشاء خريطة. تستخدم حملة "كونتيننتال" المسح الجيولوجي والرواسب من RIC؛ اترك عناصر التحكم في الموارد الأصلية كما هي—يقوم RIC تلقائيًا بإيقاف توليد الحديد والنحاس والحجر واليورانيوم العادي في ناوڤيس مع الاحتفاظ بتلك النماذج من أجل التوافق. تتيح الصناعة البحرية حملة المحيط الكاملة وتضيف إعداد مولد الخريطة المسبق الخاص بها بعد إعادة تحميل التعديل المطلوب.

[item-description]
ric-spent-baghouse-filter-media=الوسائط المستخدمة من التقاط التلوث المحيط. تجديدها من خلال معالجة النفايات.
ric-malachite-mill-feed=تغذية دائرة طحن الملكيت الرطب التي يتم إنتاجها بواسطة SAG أو الطحن الكروي.
ric-malachite-cyclone-underflow=تمت إعادة كسور المالاكيت الخشنة من التصنيف بالهيدروسيكلون إلى المطحنة الكروية لمزيد من التحرير.
ric-malachite-cyclone-overflow=جزء مالاكيت مفصول بدقة جاهز للترقية الخاصة بالخام.
ric-deep-pit-development-plan=بيانات اعتماد هندسية للحفرة الكبيرة قابلة لإعادة الاستخدام تغطي هندسة المقاعد، واستخراج عالي السعة، وطرق الصرف والنقل. يؤدي إعدادها إلى إرجاع خطة تطوير المنجم الأساسية.
ric-haul-road-base=ركام صخور النفايات المضغوطة الذي يمكن وضعه كطريق حجري لطرق نقل المناجم ويُستخدم في إنشاء المعدات الكبيرة في المناجم المفتوحة.
ric-primary-crushed-material=منتج الكسارة الأولية الخشنة الذي يحتوي على معادن خام منفصلة بالإضافة إلى نسبة كبيرة من النفايات. يتطلب كسراً ثانوياً وتحسينًا قبل الاستخدام المعدني.
ric-iron-concentrate=مركز الحديد الجاف المرشّح جاهز للتلبيد والاختزال وعمليات تعدين الحديد اللاحقة.
ric-copper-concentrate=مركز النحاس الجاف المفلتر جاهز للصهر والتحويل وصناعة المعادن النحاسية النهائية.
ric-lead-concentrate=مركز كبريتيد الرصاص المعالج المناسب لتحميص الغالينا في فرن الدوران المباشر ومعادن الرصاص.
ric-zinc-concentrate=مركز كبريتيد الزنك المعالج المناسب لتحميص الزنك بالتحميص الانعكاسي المباشر (RIC) ولسلخه وتنقيته.
ric-galena-lump-ore=جزء الجالينا المنخول الخشن المناسب للتركيز المسبق بالجاذبية.
ric-galena-fines=جزء الجالينا الناعم الذي يتطلب التعويم لاستخلاص الرصاص بكفاءة.
ric-sphalerite-lump-ore=جزء السفاليريت المنخول بشكل خشن مناسب للتركيز المسبق بالوسط الكثيف أو بالجاذبية.
ric-sphalerite-fines=جزء سفاليريت ناعم يتطلب التعويم الانتقائي لاستخلاص الزنك بكفاءة.

ric-industrial-research-pack=حزمة أبحاث ما بعد اللون الأصفر تثبت أن المواد المتقدمة، والتحكم في العمليات، والحفز الكيميائي، والإلكترونيات، وسلاسل توريد المواد النووية تعمل معًا.
ric-industrial-mastery-demonstration=دورة توضيحية مستدامة للصناعة المتكاملة تجمع بين السبائك المتقدمة، والإلكترونيات، والبوليمرات، والسيراميك، والمحفزات، ومجموع المخلفات المستردة، ووسائط خدمة العمليات. يجب أن يكمل مجمع الإتقان الصناعي عشر دورات لإنهاء حملة RIC.
ric-geological-core=عينات الحفر الفيزيائية الناتجة عن المسح الجيولوجي. يؤدي مسح الحفر الأساسي المكتمل على مؤشر جيولوجي عادي إلى إنتاج خمسة عينات جوفية؛ تستهلك سلسلة الفحص الأولية + المعتمدة تلك النوى الخمسة بالضبط لتأهيل تطوير المنجم.
ric-electrical-contact=أجهزة الاتصال المختومة المستخدمة في الخدمات اللوجستية والدوائر المبكرة.
ric-insulating-board=لوح العزل البدائي المستخدم قبل تصنيع الإلكترونيات المناسبة.
ric-primitive-circuit-board=لوح خام يجعل الدوائر الإلكترونية الأولى ممكنة.
ric-industrial-components=تركيبات ميكانيكية/كهربائية عامة للآلات الأولى والأبحاث.
ric-machine-frame=الإطار الهيكلي الذي يمثل الانتقال من الآلات المصنوعة يدويًا إلى الآلات الصناعية.
ric-pig-iron=حديد أفران الصهر الوسيط لصب ألواح الحديد أو تصنيع قضبان الصلب.
ric-blister-copper=وسيط نحاس غير نقي لصب ألواح النحاس الصناعية.
ric-steel-billet=مخزون فولاذي نصف جاهز للدرفلة إلى ألواح فولاذية.
ric-hematite-lump-ore=الهيماتيت المنخول بشكل خشن المناسب للتركيز الجاف.
ric-hematite-fines=جزء الهيماتيت الناعم الذي يستفيد من الغسل الرطب.
ric-magnetite-lump-ore=الماجنتيت المنخول خشنًا المناسب للتركيز الجاف.
ric-magnetite-fines=جزء دقيق من المغنتيت يستفيد من الغسل الرطب.
ric-chalcopyrite-lump-ore=خام كبريتيد النحاس المفروز بشكل خشن مناسب للتركيز الجاف.
ric-chalcopyrite-fines=جزء كبريتيد النحاس الناعم المناسب للتعويم.
ric-bornite-lump-ore=خام كبريتيد النحاس الخشن الغني بالبورنيت.
ric-bornite-fines=جزء دقيق غني بالبورنيت مناسب للتعويم.
ric-malachite-lump-ore=خام نحاس خشن غني بالمالاكيت.
ric-malachite-fines=جزء مالاكيت ناعم مناسب للتعويم.
ric-iron-sinter=مادة خام حديد متكتلة للاختزال في فرن الصهر.
ric-copper-sulfide-froth=استعادة رغوة التعويم الحاملة للنحاس.
ric-copper-matte=كبريتيد النحاس المنصهر الوسيط الذي يجب تحويله إلى نحاس نفطة.
ric-beneficiation-sludge=حمأة معالجة الخام الرطبة التي ينبغي تسويتها في معالجة النفايات.
ric-petroleum-coke=منتج ثانوي غني بالكربون من مصفاة التكويك المتأخر؛ مفيد كوسيط وقود كثيف.
ric-asphalt-binder=يتم استخراج مادة رابطة البناء الثقيلة المرتبطة بالقار من الجزء السفلي من سلسلة المصفاة.
ric-spent-hydrotreater-catalyst=بقايا المحفز المتسخ من تنظيف زيت الغاز؛ ويمكن لحوض إعادة تدوير لاحق استخلاص المعادن منه.
ric-metallurgical-flux=خليط من الجير وفلوس الفلوريت لتكرير الصلب والنحاس والسبائك.
ric-direct-reduced-iron=يتم تقليل تركيز الحديد بالهيدروجين وأول أكسيد الكربون قبل صناعة الصلب بالأكسجين.
ric-basic-oxygen-steel=الفولاذ الوسيط الناتج عن تحويل الأكسجين، يُصب في ألواح قبل دحرجته.
ric-steel-slab=خام فولاذي مصبوب باستمرار للتشكيل بالدلفنة إلى ألواح وصُفائح.
ric-steel-sheet=منتج فولاذي مسطح يُستخدم في الإطارات المشكلة والآلات اللاحقة.
ric-formed-steel-frame=إطار مصنّع مصنوع من صاج فولاذي وألواح ومثبتات ميكانيكية.
ric-fire-refined-copper=نحاس محبب يتم تنقيته بالنار بالأكسجين قبل الصب أو الدرفلة.
ric-copper-sheet=منتج نحاسي مسطح للإلكترونيات والموصلات والمنتجات المشكّلة في المستقبل.
ric-aluminium-extrusion=تشكيلات هيكلية من الألومنيوم الخفيف للإطارات والهياكل منخفضة الكثافة.
ric-light-alloy-structural-panel=لوح من السبائك الخفيفة المُشكَّل لاستخدامات عصر الفضاء وطرق البنية التحتية المتقدمة.
ric-glass-fibre-composite-panel=لوح مركب من الألياف الزجاجية والألمنيوم مربوط بالإيبوكسي يُستخدم في الهياكل منخفضة الكثافة.
ric-refractory-lining=بطانة حرارية قابلة للاستبدال لمعدات العمليات ذات درجات الحرارة العالية والتآكل.
ric-titanium-sheet=منتج التيتانيوم المدلفن للمعدات عالية الأداء والبنية التحتية المتأخرة.
ric-steelmaking-charge=شحنة معدة لمحول الأكسجين تجمع بين الحديد الخام والحديد المُختزل مباشرة والمادة المساعدة على الانصهار.
ric-mill-scale=مقياس أكسيد الحديد الناتج أثناء الدرفلة على الساخن؛ قابلة للاسترداد من خلال معالجة الأحماض ومعالجة النفايات.
ric-copper-anode-slime=بقايا حاملة للمعادن الثمينة من تكرير النحاس كهربائيا.
ric-metallurgical-dust=الغبار الناعم الناتج عن الصب ومعالجة المعادن عند درجات حرارة عالية.
ric-waste-filter-cake=المواد الصلبة المستقرة الناتجة عن تصفية مياه الصرف الصحي الأولية وتنظيف المجاري المستهلكة.
ric-neutralised-sludge=تحييد بقايا من السائل الحمضي ومعالجة منمش.
ric-recovered-metal-concentrate=مركز منخفض الدرجة يتم استخلاصه من الغبار المعدني وتيارات النفايات المختلطة.
ric-mineral-residue=بقايا معدنية مستقرة من كعكة الترشيح المجففة، والرماد، ومعالجة الحمأة.
ric-sulfur-sorbent-cake=بقايا المواد الماصة الغنية بالكبريت الناتجة عن تنظيف غاز المداخن وأجهزة غسل الغاز.
ric-carbon=الكربون الصناعي المكرر المحضر من فحم الكوك لكيمياء النترات والمتفجرات والكيمياء الاختزالية وطرق معالجة الكربون لاحقًا.

ric-crusher=آلة تعمل بالحارق للسحق الآلي للمواد الخام الخام من المنجم. تم فتحه بواسطة معالجة الخام I.
ric-ore-sorter=آلة تحضير الخام الجاف لفرز الخام العادي والحجر إلى خامات حقيقية ومعادن ومركزات أولية.
ric-ore-washer=آلة المعالجة الرطبة لغسل الخامات المسحوقة والغرامات إلى مركزات أنظف بالإضافة إلى المخلفات ومياه الصرف الصحي.
ric-flotation-cell=ترقية كبريتيد العلوم الخضراء لتركيز النحاس الناعم والرغوة قبل المعالجة بالمعادن المائية لاحقًا.
ric-coke-oven=يحول الفحم أو الفحم المسحوق إلى فحم الكوك، وقطران الفحم، ومنتجات الوقود والغاز الثانوية لأول حلقات التعدين والبتروكيماويات.
ric-blast-furnace=فرن التعدين الأولي الأولي للحديد الخام والنحاس غير اللامع والخبث والمواد الخام لصناعة الصلب.
ric-sintering-plant=يقوم بتحضير تركيز الحديد الناعم في اللبيدة بحيث يحصل الفرن العالي على تغذية حديدية مناسبة.
ric-casting-machine=يقوم بصب الحديد الخام والنحاس المفلفل في ألواح قياسية خلال المرحلة الصناعية المبكرة للمعادن.
ric-rolling-mill=تشكيل قضبان الصلب والألواح/الصفائح المعدنية لاحقًا إلى ألواح قابلة للاستخدام ومخزون صناعي مُشكَّل.
ric-waste-treatment-plant=يتعامل مع المخلفات، والخبث، والمياه الحامضة، ومياه الصرف الصحي الحمضية، ومجاري النفايات المحايدة حتى لا تصل الصناعة المبكرة إلى طريق مسدود.
ric-chemical-reactor=آلة كيميائية للأغراض العامة مع وصلات منفصلة متعددة السوائل للكيمياء غير العضوية المبكرة، والمعادلة، والعمل بالأحماض، ووصفات الجسور.
ric-air-separator=يقسم الهواء إلى أكسجين ونيتروجين من خلال منافذ منتج متباعدة بحيث يمكن توجيه شبكات الغاز بشكل مستقل.
ric-electrolyzer=آلة كهركيميائية للماء والمحلول الملحي والكلور والقلويات والفلور والمسارات التحليلية الكهربائية المتقدمة لاحقًا.
ric-roaster=فرن الأكسدة لمركزات الكبريتيد والكيمياء المعدنية التي تحتاج إلى معالجة المنتجات الثانوية للغاز/الحمض.
ric-distillation-column=آلة تجزئة مبكرة لمعالجة النفط الخام وقار الفحم والنفتا وغاز الوقود والبقايا الثقيلة.
ric-electrowinning-cell=آلة معالجة المعادن بالمياه لاستعادة الكاثودات المعدنية من محاليل الكبريتات/المادة المرتشحة.
ric-vacuum-distillation-column=يتم إنشاء عمود تكرير متقدم للبقايا الثقيلة والتقطير التجزيئي بالتفريغ بعد التقطير الأساسي.
ric-delayed-coker=وحدة تكرير متقدمة لتكسير البقايا الناتجة عن التقطير بالتفريغ إلى فحم بترولي وتيارات تكرير أخف.
ric-hydrotreater=مفاعل ضغط متقدم لإزالة الكبريت وأجزاء التكرير الأنظف.
ric-catalytic-reformer=وحدة تكرير حفزية متقدمة للمواد المُعاد تشكيلها والكيمياء الأروماتية.
ric-steam-cracker=آلة بتروكيماوية متطورة لتكسير زيت الغاز والهيدروكربونات الخفيفة إلى مواد أولية للبوليمرات.
ric-cleanroom-assembler=جهاز تجميع في بيئة خاضعة للرقابة للوحات الدوائر وأشباه الموصلات والرقاقات والإلكترونيات الدقيقة.
ric-catalytic-reactor=آلة معالجة تعمل بالمحفز للأمونيا والميثانول والبيروكسيد والإصلاح والكيمياء المتخصصة.
ric-high-pressure-reactor=آلة معالجة مصنفة للضغط لطرق التوليف والهدرجة عالية الضغط.
ric-advanced-distillation-column=عمود فصل عالي الإنتاجية للكسور الكيميائية والمصفاة المتقدمة.
ric-advanced-electrochemical-cell=آلة كهركيميائية متقدمة لمسارات التحليل الكهربائي والتنقية الكهربائية عالية المستوى.

ric-baghouse-filter-media=وسائط مرشح سيراميك قابلة للاستبدال بمادة داعمة عازلة تستخدم لالتقاط المواد الجسيمية من العادم الصناعي.

ric-baghouse-filter=معدات مخصصة للتحكم في الجسيمات الجافة لغاز المداخن الصناعي المبرد.
ric-wet-scrubber=ماص رطب مخصص للغازات المنبعثة المحتوية على الكبريت بعد إزالة الجسيمات.
ric-primary-clarifier=معدات الترسيب لفصل مياه الصرف الصحي إلى التدفق الفائض المعالج والحمأة المركزة.
ric-sludge-filter-press=معدات نزح المياه الميكانيكية لتحويل الطين الحمأة إلى كعكة الترشيح.

ric-run-of-mine-material=الصخور المستخرجة غير المستغلة والتي تحتوي على معادن ونفايات مفيدة. قم بسحقه وفصله قبل استخدام سلسلة معالجة الخام الموجودة في RIC.

ric-preliminary-assay-report=التفسير المختبري الأولي للحقل الذي تم مسحه. يستخدم ثلاثة من النوى الخمسة المستردة من مؤشر جيولوجي واحد مكتمل.
ric-certified-assay-report=تقييم جيولوجي ومعادني معتمد. يستخدم التقرير الأولي بالإضافة إلى القلبين المتبقيين من حملة المسح نفسها المكونة من خمسة قلوب.
ric-reserve-estimate=التقدير الهندسي للدرجة وحجم الاحتياطي والصلابة وظروف المياه المطلوبة لمنجم إنتاج للصخور الصلبة.
ric-blast-hole-cuttings=الصخور المكسرة الناتجة أثناء حفر نمط التفجير. اسحقها لمعالجة الزلط والصخور النفايات.
ric-sulfide-waste-rock=نفايات المناجم التفاعلية التي يمكن أن تتأكسد وتولد تصريفًا حمضيًا ما لم يتم تحييدها أو إعادة معالجتها.
ric-radioactive-waste-rock=تتطلب نفايات المناجم معالجة واستقرارًا خاضعًا للرقابة.
ric-stabilised-contaminated-overburden=الغطاء الصخري الملوث المرتبط بالأسمنت المُعَدّ للاحتواء المحكم طويل الأجل.
ric-stabilised-radioactive-mine-waste=نفايات المناجم المشعة المربوطة بالأسمنت المضغوطة والمجهزة للتخزين الخاضع للرقابة طويل الأجل.

ric-thickened-tailings=نفايات معدنية منزوعة الماء مناسبة للردم بالمعجون أو الاحتواء الهندسي.
ric-paste-backfill=حشوة أسمنتية قابلة للضخ مصنوعة من المخلفات السميكة وصخور النفايات لتحقيق الاستقرار في الأعمال المنهكة.
ric-engineered-waste-rock-fill=صخور نفايات متدرجة ومكيفة للرطوبة ومناسبة لتعبئة المناجم وتشكيل الأرض بشكل متحكم فيه.
ric-encapsulated-sulfide-waste=نفايات كبريتيد مرتبطة بالقواعد مصممة للحد من دخول الأكسجين والماء وتقليل التصريف الحمضي.
ric-contained-contaminated-overburden=العبء الملوث المستقر والمختوم في حزمة احتواء معززة طويلة المدى.
ric-contained-radioactive-mine-waste=نفايات المناجم المشعة المستقرة والمختومة في حزمة احتواء معززة طويلة المدى.
ric-recovered-topsoil=طبقة ترابية علوية مُعالجة مُعدَّلة بالرماد المعدني والماء لإعادة تأهيل السطح النهائي.
ric-reclamation-fill=مواد إعادة تأهيل المناجم متعددة الطبقات تجمع بين الحشو الهيكلي والردم المعجون والتربة السطحية المستعادة.

ric-process-tank=وعاء تخزين مدمج للعمليات الصناعية.
ric-cylindrical-liquid-tank=تخزين أسطواني متوسط ​​السعة لخدمة المواد الكيميائية السائلة ومصافي التكرير.
ric-spherical-gas-tank=حامل كروي كبير مخصص لتخزين الغاز الصناعي.
ric-bulk-terminal-tank=خزان طرفي عالي السعة لمزارع الخزانات وتخزين المرافق المركزية.
ric-dredged-marine-sediment=رواسب الجرف الضحلة الغنية بالمعادن والتي تم استعادتها عن طريق التجريف اليدوي أو الميكانيكي وجاهزة للتصنيف.
ric-marine-aggregate=كسر الكربونات والسيليكات والصخور الخشنة المفصول من الرواسب البحرية المجروفة؛ قابلة للاستخدام كركام بناء أو تغذية حجرية.
ric-marine-biomass=الكتلة الحيوية البحرية الساحلية والعائمة الطازجة التي يتم جمعها كمصدر أول للكربون المتجدد.
ric-dried-marine-biomass=الكتلة الحيوية البحرية المجففة بالهواء والشمس المناسبة للاحتراق المبكر والكربنة اللاحقة.
ric-polymetallic-nodules=عقد من الفيرومنجنيز في قاع البحر تحتوي على نسب من المنجنيز والحديد والنيكل والكوبالت والنحاس.
ric-hydrothermal-sulfide-rubble=مادة كبريتيد ضخمة مكسورة من قاع البحر تحتوي على كبريتيدات النحاس والزنك والرصاص والحديد.
ric-heavy-mineral-sand=جزء الرواسب البحرية الكثيفة الغني بمعادن التيتانيوم والزركون والكوارتز وآثار من المونازيت.
ric-compacted-marine-fill=الركام المعدني المجفف والمدموك المستخدم لاستصلاح المياه الضحلة وتوسيع المنصة الصناعية المبكرة.
ric-metallurgical-carbon=مواصفات مادة اختزال عالية الكربون. وفي الصناعة البحرية يتم توفيره عن طريق الكتلة الحيوية المتفحمة بدلا من فحم الكوك الأحفوري.

ric-polymetallic-nodule-concentrate=تغذية عقيدية مغسولة ومنزوعة الطين محضرة للمعالجة المائية بحمض الكبريتيك.
ric-nickel-cobalt-hydroxide=راسب وسيط مختلط يحمل قيم النيكل والكوبالت المستخرجة من سائل ترشيح العقيدات.
ric-cobalt-hydroxide=مادة وسيطة من الهيدروكسيد الغني بالكوبالت مفصولة عن ناتج ترسيب خليط النيكل والكوبالت.
ric-cobalt-metal=منتج الكوبالت المستخرج بالتحليل الكهربائي للمعدات المستخدمة في المياه العميقة المقاومة للتآكل ودرجات الحرارة.
ric-hydrothermal-sulfide-concentrate=خام الكبريتيد الضخم من قاع البحر المسحوق والمعالج والمُعد للتعويم.
ric-titanium-mineral-concentrate=جزء المعادن الثقيلة الكثيفة جاهز للفصل المغناطيسي/الكهروستاتيكي إلى الإلمينيت والر</h2>
ric-zircon-sand=جزء من الرمل المعدني الثقيل الغني بالزركون يستخدم كمادة خام لتصنيع الزركونيا.
ric-zirconia=مادة سيراميك ثاني أكسيد الزركونيوم مع تطبيقات حرارية عالية الحرارة.
ric-rare-earth-mud=رواسب بحرية عميقة ناعمة غنية بالأطوار المعدنية الحاملة للعناصر الأرضية النادرة والمواد الفوسفاتية.
ric-trace-metal-concentrate=مركزات معدنية مختلطة منخفضة الجودة في أعماق المحيطات تتطلب ترقية تعدينية مائية.
ric-brominated-flame-retardant=مادة مضافة بوليمرية مشتقة من البروم تُستخدم في المعدات الكهربائية والهيكلية المقاومة للحريق في المياه العميقة.
ric-offshore-structural-module=تجميع مكونات مصنوعة من الفولاذ/الخرسانة/مكونات العمليات مصممة للآلات البحرية وهياكل الإنتاج البحرية.
ric-amidoxime-adsorbent=مادة ماصة بوليمرية قابلة للتجديد تربط بشكل انتقائي أنواع اليورانيل النادرة من مياه البحر.
ric-uranium-loaded-adsorbent=مادة ماصة للأميدوكسيم بعد ملامسة مياه البحر لفترة طويلة، تحمل اليورانيوم الممتز لعملية النزع الحمضي.
ric-engineered-marine-fill=يتم خلط الركام والخبث المتدرج في مادة استصلاح أقوى للمناطق الصناعية المتقدمة.
ric-concrete-caisson-foundation=الأساس البحري الخرساني المقوى بالفولاذ للبنية التحتية لمصافي التكرير الثقيلة والكيميائية والمياه العميقة.
ric-aluminous-marine-clay=طين بحري ناعم غني بمعادن الألومينوسيليكات؛ وهو مصدر متوافق مع مياه البحر للكاولين والسيليكا والألومينا بعد الغسل والهضم بالمواد الكاوية.
ric-phosphatic-marine-sediment=تتركز رواسب قاع البحر الحاملة للفوسفوريت من رواسب الرفوف وتستخدم كمصدر للصناعة البحرية لفوسفات الأباتيت.
ric-hydrothermal-gangue-concentrate=جزء معدني غير كبريتيدي منفصل عن الأنقاض الحرارية المائية، ويحمل الفلوريت وشوائب السيليس.
ric-precious-metal-sulfide-concentrate=منتج ثانوي صغير الحجم يحتوي على الذهب والفضة يتركز من تعويم الكبريتيد الضخم في قاع البحر.
ric-refractory-metal-marine-concentrate=قشرة الحديد والمنغنيز في أعماق المحيطات وجزء المعادن الثقيلة الغني بالتنغستن والموليبدينوم.

ric-mine-development-plan=بيانات اعتماد هندسية قابلة لإعادة الاستخدام تجمع بين تقدير الاحتياطي وتخطيط مقاعد البدلاء واستراتيجية التجريد والوصول إلى الإنتاج. تُرجع وصفات آلات التعدين الخطة بدلاً من استهلاكها كضريبة بحجم الأسطول.
ric-electric-detonator=عنصر البدء لتفجير الألغام الخاضعة للرقابة. يتم استهلاكه أثناء تحضير كميات كبيرة من ANFO أو تيارات شحن المستحلب.
ric-blast-stemming=يستخدم الركام الخامل المتدرج لحصر الغازات المتفجرة في فتحات الانفجار المشحونة وتحسين تفتيت الصخور.

ric-jaw-crusher=كسارة أولية كهربائية ذات إطار فولاذي لتغذية OpenPit المتطورة والتكسير العام عالي الإنتاجية. مقفلة باستخدام RIC Steel Processing.
ric-gyratory-crusher=كسارة أولية كبيرة عالية الإنتاجية للمناجم والمحاجر الناضجة. تقبل نفس العناصر المعدنية العامة وخلاصات OpenPit الأولية مثل الكسارة الفكية، لذلك لم تعد هناك حاجة إلى الكسارات ذات الموقد بمجرد توفر هذا المستوى.
ric-cone-crusher=كسارة ثانوية وثلاثية لتقليل التغذية المكسرة الأولية وإعادة الشاشة كبيرة الحجم إلى الدائرة.
ric-vibrating-screen=محطة تصنيف الحجم التي تفصل الخام المسحوق إلى كسور خشنة ودقائق ناعمة قبل إثراءه.
ric-gravity-concentrator=مركّز معادن خشن يستخدم فروق الكثافة لرفض النفايات قبل الطحن الناعم.
ric-magnetic-separator=محطة إثراء مغناطيسية للأعلاف الغنية بالماجنتيت وغيرها من التيارات المعدنية القابلة للفصل مغناطيسيًا.
ric-sag-mill=مطحنة كبيرة شبه ذاتية لتقليل الخام المنخل إلى تغذية مطحنة جاهزة للملاط.
ric-ball-mill=مطحنة طحن ناعم تُستخدم في التدفق السفلي للهيدروسيكلون في دائرة طحن مغلقة.
ric-hydrocyclone-cluster=المصنف الرطب الذي يرسل المواد الناعمة المحررة إلى الأمام بينما يعيد التدفق السفلي الخشن لإعادة الطحن.
ric-concentrate-thickener=وعاء الترسيب الذي يزيل ويستعيد المياه المعالجة من المركز المعدني الرطب قبل الترشيح.
ric-concentrate-filter-press=آلة نزح الماء من المركز النهائي التي تنتج مركزًا فلزيًا قابلًا للنقل ومياه معالجة مستصلحة.

ric-hematite-mill-feed=تغذية دائرة طحن الهيماتيت الرطب التي يتم إنتاجها بواسطة SAG أو الطحن الكروي.
ric-hematite-cyclone-underflow=تمت إعادة كسr الهيماتيت الخشن من التصنيف بالمصفاة الدوامية إلى مطحنة الكرات لمزيد من التحرير.
ric-hematite-cyclone-overflow=جزء الهيماتيت المصنف الناعم جاهز للترقية الخاصة بالخام.
ric-magnetite-mill-feed=تغذية دائرة طحن المغنتيت الرطب التي تنتجها SAG أو طحن الكرة.
ric-magnetite-cyclone-underflow=تمت إعادة كسr المغنتيت الخشن من التصنيف بالدوار المائي إلى المطحنة الكروية لمزيد من التحرير.
ric-magnetite-cyclone-overflow=جزء المغنتيت المصنف الناعم جاهز للترقية الخاصة بالخام.
ric-chalcopyrite-mill-feed=تغذية دائرة طحن الكالكوبايرايت الرطب التي يتم إنتاجها بواسطة SAG أو الطحن الكروي.
ric-chalcopyrite-cyclone-underflow=جزء الكالكوبيريت الخشن الذي أُعيد من تصنيف الهيدروسيكلون إلى المطحنة الكروية لمزيد من التحرير.
ric-chalcopyrite-cyclone-overflow=جزء الكالكوبيريت المصنف الناعم جاهز للترقية الخاصة بالخام.
ric-bornite-mill-feed=تغذية دائرة طحن البورنيت الرطبة التي تنتجها SAG أو طحن الكرة.
ric-bornite-cyclone-underflow=تمت إعادة كسr البورنيت الخشن من التصنيف بالدوارق المائية إلى المطحنة الكروية لمزيد من التحرير.
ric-bornite-cyclone-overflow=جزء البورنيت المصنف الناعم جاهز للتحسين الخاص بالخام.
ric-galena-mill-feed=تغذية دائرة طحن الجالينا الرطبة التي يتم إنتاجها بواسطة SAG أو الطحن الكروي.
ric-galena-cyclone-underflow=تمت إعادة كسr الغالينا الخشن من التصنيف بالدوار المائي إلى المطحنة الكروية لمزيد من التحرير.
ric-galena-cyclone-overflow=جزء الجالينا المصنف الناعم جاهز للتحسين الخاص بالخام.
ric-sphalerite-mill-feed=تغذية دائرة طحن السفاليريت الرطب التي يتم إنتاجها بواسطة SAG أو الطحن الكروي.
ric-sphalerite-cyclone-underflow=جزء السفاليريت الخشن الذي أُعيد من تصنيف المصفاة الدوامية إلى مطحنة الكرات لمزيد من التحرير.
ric-sphalerite-cyclone-overflow=جزء السفاليريت المصنف الناعم جاهز للترقية الخاصة بالخام.
ric-wet-iron-concentrate=تركيز معادن الحديد الحاملة للماء يتطلب سماكة وترشيح قبل الاستخدام المعدني.
ric-thickened-iron-concentrate=مركز حديد منزوع الماء جزئيًا جاهز لنزح الماء النهائي بضغط الترشيح.
ric-wet-copper-concentrate=مركزات معدن النحاس الحاملة للماء تتطلب سماكة وترشيح قبل الاستخدام المعدني.
ric-thickened-copper-concentrate=تركيز النحاس منزوع الماء جزئيًا جاهز لنزح المياه النهائي بضغط الترشيح.
ric-wet-lead-concentrate=مركزات الرصاص المعدنية الحاملة للماء تتطلب سماكة وترشيح قبل الاستخدام المعدني.
ric-thickened-lead-concentrate=تركيز الرصاص منزوع الماء جزئيًا جاهز لنزح الماء النهائي بضغط الترشيح.
ric-wet-zinc-concentrate=مركزات معدن الزنك الحاملة للماء تتطلب سماكة وترشيح قبل الاستخدام المعدني.
ric-thickened-zinc-concentrate=تركيز الزنك المنزوع الماء جزئيًا جاهز لنزح الماء النهائي بضغط الترشيح.


ric-extrusion-press=يقوم بتشكيل مخزون الألمنيوم والسبائك الخفيفة في مقاطع قذف ومكونات هيكلية.
ric-vacuum-ladle-furnace=فرن ثانوي لصناعة الصلب للفولاذ المكرر عالي المواصفات.
ric-continuous-caster=آلة صب مستمر للقضبان لإنتاج الصلب المتقدم.
ric-vacuum-treated-steel=فولاذ مُكرَّر ثانوياً بشوائب أقل وتركيب كيميائي مضبوط، جاهز للصب المستمر.

[fluid-description]
ric-carbon-dioxide=معالجة ثاني أكسيد الكربون. المصدر المبكر المقصود هو تكليس الحجر الجيري من كيمياء الجير والصودا؛ في وقت لاحق تنتجه أيضًا طرق البتروكيماويات والمعادن.
ric-lubricant=مادة تشحيم كيميائية صناعية من بقايا المصافي الثقيلة، تستخدمها سلاسل المحركات والآلات المملوكة لشركة RIC.
ric-treated-effluent=المياه الصناعية المعالجة جزئياً والتي يجب صقلها قبل إعادة استخدامها كمياه نظيفة.

ric-particulate-flue-gas=غازات عادم الاحتراق المبردة التي تحمل الرماد المتطاير والجسيمات الدقيقة الحاملة للمعادن.
ric-sludge-slurry=تدفق سفلي لمصفاة قابلة للضخ تحتوي على مواد صلبة معلقة مركزة.

ric-mine-water=المياه المستردة من الرواسب الحاملة للمياه، والتي تحمل الدقائق المعدنية العالقة والملوثات الذائبة.

ric-acid-mine-water=تصريف المياه من الأعمال الحاملة للكبريتيد ذات الحموضة والمعادن الذائبة.
ric-saline-mine-water=تحمل مياه المنجم الأملاح الذائبة المركزة من رواسب المتبخرات.
ric-radioactive-mine-water=المياه الملوثة من أعمال تعدين اليورانيوم والعناصر الأرضية النادرة.
ric-blasting-emulsion=شحنة مستحلب نترات الأمونيوم المقاومة للماء للثقوب الانفجارية الرطبة. قم بنقلها عبر الأنابيب أو عربة السوائل أو البرميل إلى منصة الشحن المتفجرة.

ric-tailings-slurry=تعليق قابل للضخ من المخلفات المعدنية الدقيقة والمياه الجاهزة للتكثيف واستعادة المياه.

ric-concentrated-bittern=السائل الأم المتبقي بعد تبلور الملح البحري والجبس الأولي، المخصب بالمغنيسيوم والبوتاسيوم والبروميد والليثيوم.
ric-bromide-rich-bittern=سائل بحري ما بعد البوتاس يتركز في البروميد والمغنيسيوم وأملاح الليثيوم.
ric-bromine=البروم العنصري المستعاد من مرارة مياه البحر لتصنيع المواد الكيميائية المتخصصة والمواد المثبطة للهب.
ric-lithium-rich-brine=المرحلة الأخيرة من محلول ملحي بحري حيث أدت إزالة الملح المتكررة إلى تركيز قيمة الليثيوم المتبقية.
ric-offshore-wellstream=سائل إنتاج النفط الخام متعدد المراحل غير المعالج الذي يحتوي على خام قابل للاسترداد والغاز المصاحب ومياه التكوين.
ric-produced-water=تكوين المياه المالحة/مياه المعالجة المنفصلة عن إنتاج النفط والغاز البحري وتتطلب إزالة الزيوت/المعالجة.
ric-wet-natural-gas=الغاز الخام الحامل للرطوبة والمكثفات الناتج عن إنتاج الغاز البحري أو فصل تيارات آبار النفط الخام.
ric-stabilized-condensate=مكثفات هيدروكربونية خفيفة مستردة تنتظر التجزئة إلى سائل وغاز وقود في نطاق النافتا.
ric-nodule-leach-liquor=محلول معدني مختلط حمضي ناتج عن ترشيح العقد المتعددة المعادن المغسولة.
ric-sulfide-process-water=مياه التعويم المحملة بالمعادن والكبريتيد تتطلب تحييدها وتوضيحها قبل إعادة استخدامها أو تصريفها.
ric-uranium-elution-liquor=محلول اليورانيوم الحمضي المركز المنزوع من مادة ماصة للأميدوكسيم المشبعة.

ric-bulk-anfo-charge=شحنة نترات الأمونيوم/زيت الوقود المُقاسة للثقوب الانفجارية الجافة. نماذج التعامل مع السوائل من فاكتوريو تسليم المثقاب السائب؛ قم بنقله عن طريق الأنابيب أو عربة السوائل أو البرميل إلى منصة الشحن المتفجرة.

[recipe-category-description]
ric-industrial-mastery=دورات تشغيل متكاملة في وقت متأخر من اللعبة تجمع بين تعدين RIC والمعادن والكيمياء والإلكترونيات والسيراميك والبوليمرات ومرافق العمليات والمواد المستردة والمحفزات والمواد النووية.
ric-ore-sorting=التحضير الجاف للمواد السائبة وفصل الخامات المستخرجة وتدفقات المعادن.
ric-crushing=تخفيض الحجم الميكانيكي للخامات والمعادن والفحم والمواد الصلبة العملية.
ric-washing=الغسيل الرطب وتحضير الملاط للخام القذر والجداول المعدنية.
ric-flotation=تعويم الكبريتيد والمعادن باستخدام الماء والكواشف والتعامل مع التركيز.
ric-coking=معالجة الفحم وفحم الكوك البترولي والمواد الأولية الغنية بالكربون في الأفران أو وحدات تصنيع فحم الكوك.
ric-roasting=الأكسدة أو المعالجة الحرارية لخامات الكبريتيد والمركزات التفاعلية.
ric-sintering=تكتل الخام الناعم والغبار والتغذية المعدنية قبل المعالجة في الفرن.
ric-blast-furnace=تخفيض درجة الحرارة العالية للخامات والشحنات المعدنية.
ric-oxygen-converting=تكرير الأكسجين في مهب الصلب وتحويل المعادن عالي الإنتاجية.
ric-casting=صب المعادن المنصهرة إلى سبائك أو كتل أو ألواح أو صفائح أو مواد وسيطة.
ric-rolling=الدرفلة الميكانيكية وتشكيل الألواح المعدنية والقضبان والصفائح والألواح المعدنية.
ric-extrusion=البثق الميكانيكي والتشكيل بالضغط للمنتجات المعدنية المتخصصة.
ric-electrowinning=الاستخلاص الكهروكيميائي وتنقية المعادن المذابة.
ric-waste-treatment=التحييد والتوضيح والترشيح والاسترداد من مجاري النفايات.
ric-chemistry=المعالجة الكيميائية الصناعية العامة في المفاعل الكيميائي.
ric-chemical-reactor=تم الاحتفاظ بالاسم المستعار لعملية المفاعل الكيميائي المخصصة من أجل التوافق والتحسين المستقبلي.
ric-electrolysis=التحلل الكهربائي والإنتاج الكهروكيميائي على غرار الكلور والقلويات.
ric-air-separation=فصل الهواء إلى الأكسجين والنيتروجين وتيارات الغاز ذات الصلة.
ric-distillation=تجزيء وتقطير تيارات المعالجة السائلة أو الغازية.
ric-catalysis=التحويل الكيميائي المدفوع بالمحفز في معدات العمليات التحفيزية.
ric-high-pressure-chemistry=كيمياء تفاعل الضغط العالي للتوليف المتقدم والمعالجة المائية.
ric-cleanroom-electronics=إنتاج الإلكترونيات وأشباه الموصلات النظيفة التي تتطلب معدات الغرف النظيفة.
ric-hydrotreating=المعالجة الهيدروجينية لأجزاء المصفاة والتيارات البتروكيماوية الملوثة.
ric-catalytic-reforming=تحديث المصافي المدفوع بالمحفز وإنتاج نواتج الإصلاح.
ric-steam-cracking=تكسير تيارات الهيدروكربونات بالبخار عند درجة حرارة عالية.
ric-delayed-coking=التحويل الحراري للمخلفات الثقيلة إلى فحم الكوك وتيارات التكرير الأخف.
ric-vacuum-distillation=تجزئة الضغط المنخفض لبقايا النفط الثقيل وقيعان المصافي.
ric-advanced-distillation=التقطير المتقدم والتقسيم الدقيق في معدات المراحل الأخيرة من العملية.
ric-advanced-electrochemistry=المعالجة الكهروكيميائية المتقدمة في المعدات المتخصصة الحديثة.

# 0.9.32 Recipe Book organization notes
ric-vanilla-compat=توافق RIC الشامل

ric-particulate-control=الترشيح الجاف لعادم الاحتراق المبرد لإزالة الرماد المتطاير والغبار الناعم الحامل للمعادن.
ric-flue-gas-scrubbing=الامتصاص الرطب وتجديد المواد الماصة للعوادم الصناعية الحاملة للكبريت.
ric-water-clarification=فصل الجاذبية وصقل مياه الصرف الصناعي إلى الفائض المعالج والمواد الصلبة المستقرة.
ric-sludge-dewatering=الفصل الميكانيكي للسائل والصلب وتجفيف الحمأة الصناعية المركزة.
ric-gas-handling=التنفيس والحرق المنضبطين للغازات الصناعية الفائضة.

ric-tailings-thickening=تحضير الملاط والتكثيف واستعادة الماء للمخلفات المعدنية.
ric-mine-backfill=تحضير العجينة الأسمنتية والحشوة الهندسية ومخلفات المناجم المغلفة.
ric-mine-reclamation=استعادة التربة السطحية، والاحتواء النهائي للنفايات، وإنتاج مواد إعادة التأهيل.
ric-marine-dredging=الاسترداد الآلي وفحص المواد غير المجمعة من المياه الضحلة القريبة من الأراضي المستصلحة.

ric-deep-sea-dredging=استعادة عالية الطاقة للتغذية المعدنية في أعماق البحار/أعماق المحيطات وعمليات الامتزاز البحري طويلة التلامس.
ric-marine-evaporation=التبخر الجزئي منخفض الطاقة وتبلور مياه البحر المركزة والسوائل البحرية الأم.

ric-secondary-steelmaking=التكرير الثانوي المتأخر والتشطيب المعدني الساخن للصلب عالي المواصفات.
ric-continuous-casting=صب جديلة عالية الإنتاجية من الفولاذ المكرر إلى مواد خام متدحرجة.

