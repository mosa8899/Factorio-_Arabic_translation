[mod-setting-description]
alien-biomes-terrain-scale=تكبير أو تصغير مساحة البيئة الحيوية. القيم الأصغر تنتج بيئات حيوية أصغر وأكثر تكراراً. الافتراضي 100.
alien-biomes-temperature-low=أدنى درجات حرارة الكوكب. قلّل القيمة لإضافة المزيد من الثلج والجليد المتجمد. زد القيمة لجعل المناطق المتجمدة أقل شيوعاً أو مستحيلة. الافتراضي -50.
alien-biomes-temperature-high=أعلى درجات حرارة الكوكب. زد القيمة لإضافة المزيد من المناطق البركانية. قلّل القيمة لجعل المناطق البركانية أقل شيوعاً أو مستحيلة. الافتراضي 150.
alien-biomes-humidity-low=أدنى درجات رطوبة الكوكب. قلّل القيمة لإضافة المزيد من الصحراء. زد القيمة لجعل المناطق الصحراوية أقل شيوعاً أو مستحيلة. الافتراضي 0.
alien-biomes-humidity-high=أعلى درجات رطوبة الكوكب. زد القيمة لإضافة المزيد من المناطق العشبية. قلّل القيمة لجعل المناطق العشبية أقل شيوعاً أو مستحيلة. الافتراضي 100.
alien-biomes-aux-low=أدنى تنوّعات الألوان في الكوكب. قلّل القيمة لإضافة المزيد من الألوان الخضراء / البنية / الكهرمانية الفاتحة. زد القيمة لجعل هذه الألوان أقل شيوعاً. الافتراضي 0.
alien-biomes-aux-high=أعلى تنوّعات الألوان في الكوكب. زد القيمة لإضافة المزيد من الألوان الزرقاء / البنفسجية / الحمراء. قلّل القيمة لجعل هذه الألوان أقل شيوعاً. الافتراضي 100.
alien-biomes-disable-vegetation=عند تفعيله، ستُزال جميع الأراضي العشبية والأشجار والزخارف النباتية (ما لم تُضفها مودات أخرى). يتيح لك هذا محاكاة كوكب ميت أو قمر أو كويكب.
alien-biomes-reduced-tiles=أنواع البلاطات المخفّضة
tile-speed-reduction=بعض البلاطات (مثل الأراضي البركانية الحارة) تُبطئ سرعة اللاعب. تخفيض هذه القيمة يعني أن الأرض ستُبطئك أقل.
