ric-hypochlorite-effluent-disinfection=يعقم النفايات السائلة المنقاة بهيبوكلوريت الصوديوم لاستعادة المياه القابلة لإعادة الاستخدام مع إعادة المحلول الملحي وبقايا المعادن النادرة.
ric-middle-distillate-cracking=يقوم البخار بتكسير نواتج التقطير المتوسطة إلى مادة أخف من النفتا وغاز الوقود، مع إرسال المياه الحامضة إلى معالجة المصافي.
