[message]
ric-industrial-mastery-progress=العرض التوضيحي الصناعي المتكامل: اكتمال الدورات المستدامة __1__/__2__.
ric-marine-new-save-required=يتم تنشيط الجيل العالمي للصناعة البحرية فقط عند الحفظ الجديد. لقد تُركت هذه الخريطة الموجودة سليمة؛ قم بإنشاء لعبة جديدة مع تحديد Marine Industry لبدء المحيط.
ric-continental-geology-intro=الجيولوجيا القارية: تظهر مكاشف الهيماتيت والمالاكيت والفحم والحجر الجيري الأولية بشكل مضمون بالقرب من نقطة الظهور. يتم اكتشاف موارد التوسيع من المؤشرات الجيولوجية باستخدام منصة الحفر الأساسية. تتحكم جيولوجيا مولد الخرائط في ضبط تواتر المواقع المحتملة وحجم الحقل والاحتياطي الذي يتم الكشف عنه بعد المسح؛ وتُعدّ أشرطة التمرير الخاصة بالخامات المحددة غائبة عن عمد.

ric-marine-shoreline-placement=يجب وضع جرافات المياه الضحلة بالقرب من الشاطئ بما يكفي للوصول إلى المياه.
ric-marine-deepwater-placement=يجب وضع الكراكات البحرية العميقة بجانب المياه العميقة.

[map-gen-preset-name]
ric-continental-geology=الكيمياء الصناعية: الجيولوجيا القارية
ric-marine-industry=الصناعة البحرية (البلوك البحري)

[map-gen-preset-description]
ric-continental-geology=يوصى بإعداد خريطة جديدة مسبقًا للحملة القارية. يتم استبدال منزلقات الخام المسماة عن قصد بضوابط الاحتمالية الجيولوجية: يغير التردد عدد حقول المسح، ويغير الحجم بصمة الحقل، ويغير الثراء الاحتياطي الذي تم الكشف عنه بعد الحفر الأساسي. يتم ضمان ظهور نتوءات الهيماتيت والملكيت والفحم والحجر الجيري بالقرب من وضع البيض.
ric-marine-industry=أكمل حملة الخيمياء الصناعية في المحيط. ابدأ على منصة صغيرة مستصلحة وتوسع من خلال التجريف والأساسات البحرية الهندسية وكيمياء مياه البحر/المرارة ومعالجة النفط والغاز البحرية ومعادن قاع البحر والمعادن الاستراتيجية والاستخراج من أعماق المحيطات واستخلاص اليورانيوم من مياه البحر في مرحلة متأخرة. يتطلب وضع عالم الصناعة البحرية في إعدادات الوضع.

[ric-ending]
industrial-mastery-title=الإتقان الصناعي
industrial-mastery-message=لقد أثبتت __1__ اقتصادًا صناعيًا متكاملاً تمامًا.
industrial-mastery-bullet-integrated=تم الانتهاء من دورات العرض الصناعي المتكامل المستدام __1__.
industrial-mastery-bullet-nauvis=يمكن إكمال حملة RIC بالكامل على Nauvis دون الحاجة إلى سطح آخر.
industrial-mastery-bullet-continue=يمكنك الاستمرار في المصنع بعد النصر.
industrial-mastery-final=إن الخام والطاقة والكيمياء والمعادن والإلكترونيات وهندسة العمليات واستعادة النفايات تعمل الآن كنظام صناعي واحد.

[autoplace-control-description]
ric-geological-family=متخصص __1__ الاحتمالية. يغير التكرار عدد مؤشرات المسح التي تحدث، ويغير الحجم بصمة كل حقل جيولوجي، ويضاعف الثراء الاحتياطي القابل للاستخدام الذي تم الكشف عنه بعد الحفر الأساسي. لا يقوم عنصر التحكم هذا بوضع تصحيح خام مسمى مباشرة.
ric-geological-indication-iron-bearing=توسيع إمكانية اكتشاف الحديد للهيماتيت والمغنتيت. يغير التكرار عدد حقول المسح الإضافية الحاوية للحديد، ويغير الحجم مساحة الحقل، وتضاعف الثراء الاحتياطي الذي يتم الكشف عنه بعد المسح. يُضمن وجود نتوء الهيماتيت الأولي بالقرب من نقطة الظهور بشكل مستقل عن هذا التحكم.
ric-geological-indication-copper-bearing=توسيع احتمالية وجود النحاس للمالاكيت والكالكوبيريت والبورنيت. يغير التكرار عدد حقول المسح الإضافية الحاملة للنحاس، ويغير الحجم مساحة الحقل، وتضاعف الثروة الاحتياطي الذي يتم الكشف عنه بعد المسح. يتم ضمان وجود كشف مالاكيت أولي بالقرب من نقطة الظهور بشكل مستقل عن هذا التحكم.
ric-geological-indication-coal-bearing=توسيع إمكانية اكتشاف الفحم. يغير التكرار عدد حقول المسح الإضافية الحاملة للفحم، ويغير الحجم مساحة الحقل، ويضاعف الثراء الاحتياطي الذي يتم الكشف عنه بعد المسح. يُضمن وجود نتوء فحم أولي بالقرب من موقع الظهور بشكل مستقل عن هذا التحكم.
ric-geological-indication-limestone-bearing=توسيع احتمالية وجود الحجر الجيري. يغير التكرار عدد حقول المسح الكلسية الإضافية، ويغير الحجم مساحة الحقل، ويضاعف الغنى الاحتياطي الذي يتم الكشف عنه بعد المسح. يُضمن وجود كشف حجر جيري أولي بالقرب من موقع الظهور بشكل مستقل عن هذا التحكم.


ric-geological-family-reference=متخصص __1__ الاحتمالية. يغير التكرار عدد حقول المسح التي تحدث، ويغير الحجم مساحة الحقل، ويضاعف الثراء الاحتياطي الذي تم الكشف عنه بعد الحفر الأساسي. لون الخريطة الأساسية: __2__. الاكتشافات المحتملة: __3__
ric-geological-critical-reference=احتمالية __1__. يغير التكرار عدد حقول المسح التي تحدث، ويغير الحجم مساحة الحقل، ويضاعف الثراء الاحتياطي الذي تم الكشف عنه بعد الحفر الأساسي. لون الخريطة الأساسية: __2__. الاكتشافات المحتملة: __3__

ric-deep-geological-indication=أهداف مسح عميقة متفرقة في وقت متأخر من اللعبة. وهي لا تحل محل الحقول المعدنية العادية أو الجيولوجيا البادئة.
[ric-geology-discovery]
sedimentary=[item=ric-gypsum] الجبس، [item=ric-apatite] الأباتيت، [item=ric-graphite] الغرافيت، [item=ric-pyrolusite-ore] البيرولوزيت.
hydrothermal=[item=ric-fluorite] الفلوريت، [item=ric-sphalerite-ore] السفاليريت، [item=ric-galena-ore] الجالينا. عند 512+ مربعاً من مركز الخريطة: [item=ric-wolframite-ore] الولفراميت، [item=ric-scheelite-ore] الشيلايت، [item=ric-molybdenite-ore] الموليبدينيت. عند 640+: [item=ric-argentite-ore] الأرجينتايت. عند 768+: [item=ric-native-gold-ore] الذهب الأصلي.
magmatic=[item=ric-pentlandite-ore] البنتلانديت، [item=ric-chromite-ore] الكروميت، [item=ric-ilmenite-ore] الإلمنيت، [item=ric-rutile-ore] الروتيل.
lateritic=[item=ric-bauxite] الباوكسيت، [item=ric-kaolin] الكاولين.
evaporite=[item=ric-rock-salt] الملح الصخري، [item=ric-borax] البوراكس، [item=ric-sylvite] السيلفيت.
pegmatite=[item=ric-quartz] الكوارتز، [item=ric-cassiterite-ore] الكاسيتريت. عند 512+ مربعاً من مركز الخريطة: [item=ric-spodumene-ore] السبودومين. عند 640+: [item=ric-bastnasite-ore] الباستناسيت.
radioactive=[item=ric-pitchblende-ore] بيتشبليند و[item=ric-monazite-ore] المونازيت. الحقول المشعة متفرقة بشكل متعمد؛ يعد كلا المعدنين من الاكتشافات المحتملة في قواعد المسح الحالية.
ric-geological-indication-iron-bearing=ضمن 384 بلاطة: [item=ric-hematite-ore] الهيماتيت. عند أكثر من 384 بلاطة: الهيماتيت أو [item=ric-magnetite-ore] المغنتيت.
ric-geological-indication-copper-bearing=ضمن 384 مربعاً: [item=ric-malachite-ore] الملاكيت. عند 384+ مربعاً: الملاكيت أو [item=ric-chalcopyrite-ore] الكالكوبرايت أو [item=ric-bornite-ore] البورنيت.
ric-geological-indication-coal-bearing=[item=coal] الفحم.
ric-geological-indication-limestone-bearing=[item=ric-limestone] الحجر الجيري.

