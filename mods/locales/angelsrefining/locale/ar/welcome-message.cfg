[angels-welcome-message-gui]
title=تعديلات Angel على إعدادات الخريطة
confirm-button=متابعة

[angels-welcome-message]
intro=عزيزي اللاعب،\nإعدادات الخريطة الافتراضية متوازنة لتحسين تجربتك مع Angel. الإعدادات المعدّلة موضحة أدناه.
outro=لتغيير أي من هذه الإعدادات، عد إلى قائمة لعبة جديدة واضبط الإعداد المناسب. تجد مزيداً من المعلومات عن الإعدادات بتمرير المؤشر فوق أيقونات المعلومات.

[angels-welcome-message-settings]
disabled=[color=red]معطّل[/color]
enabled=[color=green]مُفعّل[/color]

pollution-setting=التلوث حالياً __1__.
enemy-setting=الأعداء حالياً __1__.
evolution-setting=تطور الأعداء حالياً __1__.
expansion-setting=توسّع الأعداء حالياً __1__.

[angels-welcome-message-settings-tooltip]
pollution-setting=لتغيير إعداد التلوث، اذهب إلى تبويب «متقدم» في مولّد الخريطة وبدّل مربع الاختيار بجانب «التلوث».
enemy-setting=لتغيير إعداد الأعداء، اذهب إلى تبويب «العدو» في مولّد الخريطة واضبط شريط «مضاعف أعداء Angel».
evolution-setting=لتغيير إعداد تطور الأعداء، اذهب إلى تبويب «العدو» في مولّد الخريطة وبدّل مربع الاختيار الخاص بـ«التطور».
expansion-setting=لتغيير إعداد توسّع الأعداء، اذهب إلى تبويب «العدو» في مولّد الخريطة وبدّل مربع الاختيار الخاص بـ«توسّع الأعداء».
