[mod-name]
Milestones=الإنجازات

[mod-description]
Milestones=تابع تقدّمك عبر معرفة سرعة إنتاجك للعناصر الرئيسية. كافئ نفسك في كل خطوة من جلسة لعب طويلة، وانظر إلى تاريخ مصنعك، وقارن مع أصدقائك، أو تحدَّ نفسك.\nيدعم أي قائمة عناصر ويأتي بإعدادات جاهزة للمودات الكبيرة الشائعة. يمكن إضافته إلى الألعاب الحالية.

