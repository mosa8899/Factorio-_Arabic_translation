h2-recycle=الراليسيا يحتوي trace كميات لـ الهيليوم في  الخلية بنية. يستخدم الهيدروجين diffusion إلى replace الهيليوم molecules و اجمع هو لـ مستقبلي يستخدم.
deadheading=الرينيا blossoms أحياناً die إيقاف بسرعة و يصبح "deadheads". إعادة-برنامج  المزرعة آلات إلى تلقائياً detect و يزيل هذه defects. باستخدام  خاص نمو procedure, هذه deadheads يمكن يكون recycled إلى مفيد النباتات المحلية.
alltime=يزيد ري إلى متطرف مستويات. هذا سي أجبر الرينيا الأزهار إلى يصبح perennial. هذا تقنية سي يزيد متوسط نمو سرعة, مع ذلك إضافي الكهرباء هو مطلوب إلى المضخة كل التي الماء.  متنوع soils هي لا أطول مطلوب و هي washed away.
aphid-cleaning= انعدام الوراثي diversity تسبّب الرينيا إلى يكون جداً susceptible إلى صغير pests مثل كـ aphids. أنت لديهم اكتُشف التي صغير كميات لـ الأرجاد السم يمكن act كـ  عظيم proto-مبيد.
unstable= إضافة لـ  شائع dermal طبقة سي يسمح لـ كبير البيانات مجموعة لـ  فضائي بيئة.
ms= إضافة لـ semi-نادر galenic مواد سي يزوّد improvements في  البلازما تحكم نظام و يزيد  سرعة لـ ionic measures في  كتلة-إلى-charge ratio لـ  object لـ دراسة.
spg= إضافة لـ  passivation طبقة سي calm existing الكائنات الدقيقة في  الركيزة. Microscopes سي يعالج images في higher orders لـ magnitude لـ resolution.
mci= إضافة لـ عالٍ-الدرجة موفا الشراب سي act كـ  preservative لـ  نادر و expensive مثالي العينات.  likelihood لـ تهجين-contamination هو dramatically مُختزل بواسطة هذا تقنية.
neuron=Splicing  الآرثوريان العصبي gen إلى السكروندريكس genoma سي يسمح  الدماغ الخلايا إلى intercommunicate عند بالقرب خفيف سرعة, زيادة  الذكاء عند  geometric scale. هذا procedure هو جداً خطير لكن هو سي result في significantly أكثر العصبي مادة عندما slaughtered. إن هذا مادة هو eaten, هو grants  مؤقتة فضائي <-> human speech capability.
boronb=السكروندريكس الدماغ chemistry هو completely مختلف إلى anything وجد على الأرض. Apparently, البورون derivatives يمكن act كـ  performance enhancing و hallucinogenic substance إلى السكروندريكس الأحياء. بواسطة الإضافة diborane إلى  الماء الإمداد هم سي gain  عظيم reproductive يعزّز. طفورات هي أيضاً أكثر شائع.
hspa=Crosslink alkali dissociation في  intestines سي يسمح السكروندريكس إلى function على  نقي آكل لحوم diet بعد maturation.  simplified diet سي generally الرصاص إلى  reduction في overall الطاقة و activity, مع ذلك  عدد لـ السكروندريكس مصنع inputs هو بكثير decreased. Evolution أيضاً يصبح أكثر difficult.
arcanium=Bombard سيميك's arcaniums (أعضاء responsible لـ procreation) بـ microwaves يمكن induce يسخّن, boosting  الإنتاج.
etelnav=تثبيت patented إيتيلناف الأنظمة إلى يستخدم النفايات يسخّن من التي الحظيرة إلى يولّد الطاقة.
flagellum=ينشئ  جديد توليد لـ sponges بـ triple  كمية لـ flagellum في  choanocytes. هذه sponges شكل دراسة skeletons في  نمو متوسط و يسمح لـ  التحويل لـ softer elements.
fragmentation=عندما  sponges reach  certian المرحلة في  الحياة دورة, هم سي begin  reaction التي تسبّب fragmentation لـ  own branches. إن landed إلى  suitable الركيزة,  mesophyll سي reshape و attach إلى  جديد يضع, صنع  جديد الإسفنج.
bacterial=يحوّر choanocytes إلى capture و engulf البكتيريا في  الماء, reducing  يحتاج لـ الطعام و sterilizing  الماء.
mgo=التريتس لديهم metagenesis التربية cycles, الذي mean هم لديهم بعض individuals مجرد إلى يزرع و آخرون مجرد إلى procreate. Inserting  شائع قديم الأرض الجين من mammals يمكن turn هذا المخلوق إلى  كامل typical التربية دورة leading إلى أكثر offspring.
dc=التريتس's cubs سي طبيعياً يفصل إلى اثنان halves الذي mature separately. من خلال البحث, أنت لديهم وجد التي nanomachines يمكن يصنع adjustments إلى  genoma. هذا سي يسمح تلك cubs إلى يفصل إلى حتى أكثر mature التريتس.
nexelit-axis=Change  ضغط المضخات main axis لـ  جديد و محسّن النيكسيلايت-مبني واحد. السماح  طريق أفضل يستخدم لـ الطاقة و كافٍ ضغط إلى يحتفظ التريتس happy.
fi= إجمالي لـ 5-6 irrigations هي مضافة أثناء germination بما في ذلك قبل-sowing ري, تحسين الاستهلاك و الإنتاج.
fungicide= التربة isn't welcome إلى التوفريا. Spray ثقيل fungicide إلى avoid  dreaded "Late Blight" disease. أحياناً phosphates هي ضروري. هذه chemicals سي يحسّن  محصول's نمو, لكن هم سي أيضاً يسبّب هائل كميات لـ التلوث.
tr=Recycle  smaller و discarded التوفريا tubes كـ  المصدر لـ عضوي starches و greases.
evoa=عميق البحث و الجين implementation من الأرض's arthropods سي turn الفونيكس أقل فضائي و أكثر anthropod-مثل. هذا التقنية يسمح investment إلى live birthing لـ الفونيكس أثناء exponentially زيادة  viable embryo الإنتاج معدل.  mother سي لا survive.
uge=أدخل  defective الجين التي تسبّب dysregulation في الفونيكس's metabolism, speeding أعلى  نمو لكن صنع  lives miserable. Cancerous subcultures هي harvestable من  الفونيكس's الحظيرة.
dermal=وصل الأووج's جينات إلى  الفونيكس genoma. هذا سي يساعد ها بـ  aggression و سي إلغاء أي nomadic سلوك patterns. بدلاً من لـ  الحظيرة,  الفونيكس سي يكون fully حر المدى, removing الحظيرة تكاليف.
ap=يسمح الزينو إلى incorporate أكثر لـ  host's الحمض النووي السماح ها إلى يستخدم أي المستوى و الأنواع لـ hosts, أي sex و age إلى يطوّر  نهائي forms.
herm=الزينو سي لديهم  قدرة إلى sidestep التوالد العذري. عندما  منخفض الوراثي variability هو detected, يسمح بعض لـ ها إلى change sexes أثناء الحياة في  attempt إلى recover  الوراثي الحوض بواسطة sexual reproduction.
hive=Insertion لـ الآرثوريان's جينات يسمح الزينو إلى لديهم  collective consciousness directed بواسطة  الملكة, من يمكن call ظهره و يعطي orders إلى  subjects باستخدام shrieks و telepathy, أكثر organization means أقل النفايات. هذا modification سي يسمح  الملكة إلى communicate telepathically بـ آخر متقدم الأنواع, مثل كـ أنت, inducing terrifying dreams و religious visions الذي قد حتى الرصاص إلى  formation لـ cults بـ  الزينو كـ  god-مثل figures.
temp-c=يستخدم smoldering coals و frozen النيتروجين إلى rapidly دورة محاكى حرارة changes. كسيهيفوي اليرقات سي يكون stimulated إلى mature أسرع, من 14 إلى 8 sols لـ metamorphosis إلى  benthic المرحلة.
rst=Intervenes عند  الحياة دورة المرحلة عندما اليرقات هي "competent" أو جاهز إلى settle, attach إلى clutch, و metamorphose إلى يصبح  "spat". هذا هو  eyed المرحلة عند الذي  اليرقات يمكن يكون safely removed من  الاستنبات متوسط إلى يزرع alone, preventing losses من competition.
reuse-ev=Import wastewater من آخر aquacultures إلى prepare و يغذّي كسيهيفوي's favorite phytoplankton.  plankton هي قادر إلى يفصل و reconstitute trace كميات لـ dissolved الأسيتون في  wastewater.
sub-s=Substrates هي  matter لـ competition. إلى يحسّن الكفاءة,  الزراعة متوسط يحتاج إلى يكون sterilized أو pasteurized بـ heated الغازات. هذا kills إيقاف أي competing mold أو البكتيريا و gives اليادولز  الأفضل chance عند dominating أي competition.
duct=إعادة-configure  ducting installation إلى يجلب heated الهواء إلى  الزراعة الفضاء.  الفطر هو قادر إلى fully purify و chill  nearby الغلاف الجوي.
humidity-control=تثبيت hygrometers إلى ذاتي-regulate  أفضل humidity مستويات لـ اليادولز, صنع ها absorb CO2 من الهواء efficiently.  اليادولز سي يكون قادر إلى أكثر effectively expel  الأبواغ إلى  بيئة من خلال runoff, groundwater, و التبخير. هذه إضافي الأبواغ يمكن يكون مجموعة بواسطة  البوغ collector.
cryopreservation=متقدم freezing methods يساعد preserve البذرة الوراثة أثناء  offseason.  غير-depreciative التخزين يسمح الثمرة التطوير و vegetative التطوير إلى يركض كـ طبيعي عند أي date في  مستقبلي.
harvest=مؤتمت آلات و الروبوتات هي مستخدم بدلاً من لـ بسيط الإدراجات, زيادة  جودة لـ  أوراق و fruits (since هم won't harm ها أثناء  حصاد). هذه agribots يمكن أيضاً detect dying النباتات قبل حتى  البستان knows هم هي dying.
nutrinet=يطوّر  nutrient,  الذكاء الاصطناعي controlled نظام التي يستخدم electronic sensors. هذه عالٍ resolution sensors يمكن evaluate التربة جودة مبني على available المغذيات detected في  التربة. بدلاً من لـ fertilizing  entire الحقل equally, now  الذكاء الاصطناعي knows الذي areas يحتاج  الأكثر fertilizer و الذي areas يحتاج  الأقل. هذا لا فقط decreases fertilizer تكاليف, هو gives  أكثر حتى, fuller محصول yield من  اليوتوي الثمرة و أوراق.
suicide=مزيد دراسات reveal التي اصطناعي abdominal disengagement لـ  chitinous protrusion من  sternite لـ الزيبير هو مطلوب قبل males يمكن mate في أي early المرحلة لـ التطوير.  procedure يسمح ها إلى لديهم 100% نجاح في التربية حتى عندما immature, لكن هم يمكن't live أطول بدون هذا عضو نظام. Considering maturation لـ  ممتلئ بالغ الزيبير يمكن يأخذ decades,   valid تقنية إن أنت don't care حول ethics.
sr=أدخل معدّل transposons من التريتس إلى الزيبير's genoma إلى يسمح females إلى يطوّر  spermatheca إلى retain sperm بعد mating لذا التي 2 أو حتى 3 البيضة masses يمكن يكون مُنتَج بدون  مزيد intervention لـ آخر ذكر.
hatchery=يبني  attachment لـ الزيبير reefs dedicated إلى يزوّد excellent الماء الشروط لـ  الزيبير's البيض. بواسطة doing التي, recycling  wastewater من  main الخزان سي يختزل  التلوث و الطاقة تكاليف. بسبب إلى  بكثير مُزاد population و reproductive rates, هو يصبح ضروري إلى smelt أي إضافي الزيبير لـ  الرماد byproduct.
geooxidation=Six tandem copies لـ اليادولز monomers كانت cloned إلى  pBC1 vector لـ الزونغور الدرع, السماح ها إلى absorb مهم المعادن مباشرة من  التربة.
genooscillation=يسمح rapid الجين oscillation أثناء meiosis, تحسين الوراثي variability. في كل procedures,  variable spinneret kiloglider عضو سي يكون multiplied.
oviduct-bombardment=بـ عظيم الطاقة comes عظيم responsibility. أدخل بشدة مشع isotopes إلى  الزونغور's diet.  الزونغور oviducts سي overcompensate و يسمح higher availability لـ  spidroins في  cocoons.
xgv=باستخدام شائع retroviral التقنية إلى يحتفظ الزونغور's جينوم بدون degradation. حتى تحسين  جودة لـ الشرنقة البروتينات.
d2o=هذا التقنية كان primarily مستخدم لـ  التطوير لـ جديد, مُعزَّز الأنواع. لكن soon نحن اكتُشف هو يمكن يكون eستُخدم لـ ينتج المخلوقات بـ محدد traits التي يمكن يكون exploited بواسطة triggering  series لـ الوراثي reactions التي سيكون يسبّب النومال إلى ينتج أكثر لـ  particular body جزء,  aeroorgan.
nc=باستخدام  النيوتрон emitter التي ينتج  steady stream لـ عالٍ-الطاقة neutrons, الذي هي ثم targeted عند  نومال's reproductive أعضاء.  neutrons stimulate  المخلوق's reproductive نظام و encourage  الإنتاج لـ إضافي البيض. مع ذلك,  viability قد vary.
neutron-bombardment= يعالج involves placing  نومال في  controlled بيئة و subjecting هو إلى  محدد wavelength لـ خفيف emitted بواسطة  النيوديميوم-مبني crystals.  خفيف penetrates  الجلد لـ  نومال و activates  ink الغدد, causing  المخلوق إلى ينتج significantly أكثر ink من هو سيكون تحت normal الشروط.
guarpulse= nanobot-مبني التقنية التي يمكن monitor  health لـ individual غوار النباتات في حقيقي-وقت, detecting diseases أو nutrient deficiencies قبل هم يصبح  problem. هذه nanobots يمكن أيضاً يسلّم targeted المغذيات أو pesticides مباشرة إلى  النباتات, reducing النفايات و زيادة الكفاءة.  semi-مثالي بيئة يسمح لـ  occasional الإنتاج لـ الزنك nanocomplex كـ  byproduct.
aquaguar= وراثياً مُهندَسة سلالة لـ غوار التي هو resistant إلى drought و يمكن يزرع في saline التربة. هذا سلالة لـ غوار سيكون يتطلب أقل الماء و fertilizer إلى يزرع, صنع هو أكثر sustainable إلى cultivate.
hh= المسيرة-مبني نظام التي يستخدم متقدم sensors و الذكاء الاصطناعي algorithms إلى identify  الأكثر productive areas لـ  غوار المزرعة.  المسيرات يمكن ثم autonomously حصاد  ripe غوار pods, maximizing yield و minimizing تكاليف.
turd-respec=إعادة الضبط كل T.U.R.D. اختيارات.
turd-partial-respec=يسمح أنت إلى reselect  خيار لـ واحد T.U.R.D.