iw-nullia-rocket-part=اجمع تكلفة مواد الصاروخ الكاملة المشتقة من Nullius كجزء صاروخ واحد لعصر الفضاء داخل الصومعة المدارية المخصصة.
iw-nullia-space-platform-starter-pack=اصنع بادئة منصة لعصر الفضاء من مركّبات الكربون وألواح الألومنيوم والألواح الشمسية والمستشعرات من Nullius.
iw-nullia-space-platform-foundation=اصنع مقاطع أساس مدارية باستخدام عوارض ومركّبات وألومنيوم من Nullius.
iw-nullia-cargo-landing-pad=اصنع منصة هبوط بضائع لعصر الفضاء باستخدام متطلبات مواد صومعة Nullius الأصلية.
iw-nullia-asteroid-collector=ابنِ جامع كويكبات باستخدام العوارض الهيكلية والمستشعرات ومركّبات الكربون من Nullius.
iw-nullia-crusher=ابنِ كاسراً مدارياً باستخدام العوارض الهيكلية والمستشعرات ومركّبات الكربون من Nullius.
iw-nullia-solar-panel=ابنِ لوحاً شمسياً لعصر الفضاء باستخدام وحدات الألواح الشمسية والعوارض الهيكلية من Nullius.
iw-nullia-thruster=اصنع محرك دفع المنصة من وقود صواريخ Nullius وصفائح التيتانيوم والمستشعرات ومركّبات الكربون.

