ric-refinery-offgas-thermal-oxidation=يحرق الغاز المنبعث من المصفاة الملوّث إلى غاز دخان ساخن يمكن أن يمر عبر استرداد الحرارة المهدرة، والتصفية في غرفة الأكياس، والغسل الرطب.
ric-metallurgical-gas-quench=يستخدم مياه تبريد مكيفة لاستعادة الحرارة من عادم الفرن وتحويل غاز المداخن الساخن إلى تيار جسيمات مناسب لترشيح الأكياس.
ric-controlled-process-heat-steam=يرفع بخار الغلاية بغاز الوقود الحلو أثناء استهلاك وسائط الترشيح والمواد الماصة لجهاز الغسيل لإنتاج تيار غاز مداخن ومياه صرف أنظف.
ric-vent-nitrogen=إطلاق فائض النيتروجين من خلال فتحة تهوية جوية خاضعة للرقابة مع تلوث محلي لا يذكر.
ric-vent-oxygen=إطلاق الأكسجين الفائض من خلال فتحة تهوية جوية يمكن التحكم فيها. مفيد فقط كحماية من الفائض.
ric-flare-waste-gas=حرق الغاز النفايات القابل للاحتراق في الهواء الجوي. يمنع الضغط العكسي للسوائل ولكنه يسبب تلوثًا كبيرًا.
ric-flare-fuel-gas=حرق فائض غاز الوقود بدلاً من استرداد قيمته الطاقية أو الكيميائية.

