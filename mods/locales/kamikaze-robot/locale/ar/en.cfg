[item-description]
kamikaze-robot=ضعه للنشر. يرافقك ولا يهاجم إلا وهو مسلح، ويستهدف الأعشاش والديدان وتجمعات الأعداء بدلاً من الزواحف المنفردة.\nعند فراغه يتوجه إلى أقرب صندوق يحمل صاروخه ويعيد تزويده. افتح الروبوت واختر حمولته من اللوحة على اليمين - هناك أيضاً يمكنك تفعيل وضع الحراسة.\nالحمولات: صاروخ، صاروخ متفجر، قنبلة ذرية - أو متفجرات عادية ينمو انفجارها كلما حملت أكثر.\nالجودة: +1 سعة صاروخ، +10% سرعة حركة و+50 نقطة صحة لكل مستوى.\nSHIFT + G يبدّل الروبوت الذي تحت المؤشر (أو جميعها) إلى وضع الحراسة، حيث يثبت مكانه بدلاً من متابعتك.
kamikaze-robot-remote=نقرة واحدة بالزر الأيسر - في العالم أو في عرض الخريطة - ترسل أقرب روبوت انتحاري مسلح إلى ذلك الموقع. ينتهي الأمر بعد 30 ثانية. السحب بالزر الأيمن، أو SHIFT + K دون جهاز التحكم في اليد، يلغي كل الأوامر الجارية.
kamikaze-robot-designator=يسلّمه إليك مكتب العمليات التكتيكي؛ ويختفي بمجرد اختيارك هدفاً.

