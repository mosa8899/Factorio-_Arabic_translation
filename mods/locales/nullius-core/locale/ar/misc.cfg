[alignment]
nullius-align-first-intro=أنت أندرويد من نوع فون نيومان. وصل مسبارك إلى كوكب قاحل بمهمة تطويره وبثّ الحياة فيه وبناء موجة من الخلفاء لمواصلة التقدم إلى كواكب جديدة. رصدت إشارات واضحة إلى أن مسبارات أخرى قد تقترب من هذا الكوكب، لكنك أول الواصلين. استغل هذه الأسبقية للاستعداد لتدخل معادٍ محتمل، إلى أن تتمكن من تحديد ما إذا كانت تعمل وفق توجيهات متوافقة. إن كانت كذلك، تعاونوا لإنجاز المهمة أسرع، وإلا أعد برمجتها لتشاركك أهدافك أو سابقها للتفوق عليها. استعد لهبوط عنيف أثناء دخولك الجو.

nullius-align-intro=أنت أندرويد من نوع فون نيومان. وصل مسبارك إلى كوكب يُفترض أنه قاحل بمهمة تطويره وبثّ الحياة فيه وبناء موجة من الخلفاء لمواصلة التقدم إلى كواكب جديدة. رصدت إشارات إلى أن مسبارات أخرى قد وصلت إلى هذا الكوكب قبلك. راقبها بحذر لتحديد ما إذا كانت تعمل وفق توجيهات متوافقة. إن كانت كذلك، تعاونوا لإنجاز المهمة أسرع، وإلا أعد برمجتها لتشاركك أهدافك أو سابقها للتفوق عليها. استعد لهبوط عنيف أثناء دخولك الجو.

align-concordance=حقّق __1__ توافقاً كوكبياً تاماً. طُولبت هذه المنظومة النجمية بشكل دائم على الشبكة المجرية. كل الفصائل المنافسة التي وصلت أو ستصل إلى هذا النظام قد اندمجت في خطة تطوير موحّدة.
align-transponder-self=بثّ __1__ موقع __2__ من (__3__، __4__).
align-transponder-other=بثّ __1__ موقعه الحالي عند (__2__، __3__).
align-no-identification=لا يمكنك استخدام بطاقة توافق لم يطوّرها فصيلك الحالي بشكل مستقل.
align-protected-transmitter=الفصيل المستهدف محمي بجهاز بث التوافق.
align-protected-identity=اللاعب المستهدف محمي ببطاقة هويته.
align-guarded-identity=المبنى المستهدف يحرسه عضو فصيل يحمل هوية.

