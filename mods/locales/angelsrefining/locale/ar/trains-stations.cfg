intro=الهدف من هذا الدرس هو إظهار كيفية استخدام محطات القطار والجداول لإعداد نقل الخام بين المناجم والأفران.

place-stop=ابنِ محطة القطار في الموقع المحدد.

place-locomotive=ابنِ القاطرة عند محطة القطار.
place-locomotive-info=عند القرب من محطة قطار وبالاتجاه الصحيح، ستنجذب القاطرة تلقائياً إلى موقع المحطة.

place-wagon=ابنِ عربة البضائع خلف القاطرة.
place-wagon-info=ستظهر مؤشرات الاتصال على العربة عندما يمكن وصلها بشكل صحيح بالقاطرة.

set-schedule=أضف المحطة "__1__" إلى جدول القطار مع شرط الانتظار "__2__".

start-train=اضبط القطار على الوضع التلقائي.

fuel-train=زوّد القاطرة بالوقود باستخدام الإدراج.

load-wagon=ابنِ إدراجات لتحميل العربة بخام الحديد.

trains-will-loop=الآن سيقوم القطار تلقائياً بنقل الخام بين محطتي القطار.

unload-train=فرّغ خام الحديد من عربة البضائع، وغذِّ به الأفران.
unload-train-info=نصيحة: استخدم الصناديق كخزان مؤقت بين العربة والأحزمة لتسريع التفريغ.

finish=إنهاء
finish-info=لقد زُوّدت ببعض العناصر لتجربة محطات القطار.\n\nاضغط زر «إنهاء» لإنهاء الدرس.
button-controller-note=__ALT_CONTROL__1__toggle-free-cursor__ واستخدم المؤشر للضغط على الزر.
