configurable-valve=صمام قابل للضبط

[entity-name]
configurable-valve=صمام قابل للضبط

[entity-description]
configurable-valve=صمام يمكن ضبطه ليعمل كصمام فيض أو تعبئة أو باتجاه واحد بعتبات مخصّصة باستخدام شروط الدوائر. مستوى الإدخال ([img=virtual-signal/signal-I]) ومستوى الإخراج ([img=virtual-signal/signal-O]) متاحان دائمًا كنسبة مئوية.

[configurable-valves]
valve-examples=\n\n[font=default-bold]أمثلة شائعة:[/font]\nصمام الفيض: [img=virtual-signal/signal-I] > 80\nصمام التعبئة: [img=virtual-signal/signal-O] < 80\nصمام الاتجاه الواحد: [img=virtual-signal/signal-I] > [img=virtual-signal/signal-O]
valve-shortcuts=\n\n[font=default-bold]اختصارات:[/font]\n__CONTROL__configurable-valves-switch__ التبديل بين أنواع الصمامات.\n__CONTROL__configurable-valves-plus__ زيادة العتبة\n__CONTROL__configurable-valves-minus__ تقليل العتبة
more-in-factoriopedia=مزيد من المعلومات في Factoriopedia.
unknown-configuration=إعداد غير معروف
configuration-doesnt-support-thresholds=لا يدعم هذا الإعداد العتبات
overflow=فيض
top_up=تعبئة
one_way=اتجاه واحد

[controls]
configurable-valves-switch=التبديل بين أنواع الصمامات المختلفة
configurable-valves-plus=زيادة عتبة الصمام
configurable-valves-minus=تقليل عتبة الصمام

[controls-description]
configurable-valves-switch=يتيح التنقل بين الوضعيات الرئيسية الثلاث للصمام: الفيض والتعبئة والاتجاه الواحد.
configurable-valves-plus=يضبط العتبة المستخدمة في صمامات الفيض أو التعبئة.
configurable-valves-minus=يضبط العتبة المستخدمة في صمامات الفيض أو التعبئة.

[mod-setting-name]
configurable-valve-default-type=نوع الصمام الافتراضي
configurable-valve-pump-speed=سرعة ضخّ الصمام
configurable-valve-disable-py-migration=تعطيل الترحيل: PyIndustry
configurable-valve-default-threshold-top_up=العتبة الافتراضية لصمام التعبئة
configurable-valve-default-threshold-overflow=العتبة الافتراضية لصمام الفيض


[mod-setting-description]
configurable-valve-default-type=النوع الافتراضي المُسنَد للصمامات المبنية حديثًا. يمكن تغييره لاحقًا داخل اللعبة لكل صمام على حدة.
configurable-valve-pump-speed=كمية السائل التي يضخها الصمام كل ثانية عند فتحه.
configurable-valve-disable-py-migration=يعطّل ترحيل صمامات PyIndustry تلقائيًا إلى هذا المود.
configurable-valve-default-threshold-top_up=العتبة الافتراضية لإعداد صمام التعبئة. يمكن تعديلها بعد الوضع.
configurable-valve-default-threshold-overflow=العتبة الافتراضية لإعداد صمام الفيض. يمكن تعديلها بعد الوضع.

[string-mod-setting]
configurable-valve-default-type-overflow=فيض
configurable-valve-default-type-top_up=تعبئة
configurable-valve-default-type-one_way=اتجاه واحد
