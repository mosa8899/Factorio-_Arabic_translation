[recipe-description]
electrochemical-science-pack=الكبريت والبلاتين وحمض الكبريتيك تصنع هذه الحزمة!
platinum-plate=صفائح بلاتين صُنعت في مسبك!
platinum-plate-production-alt=صفائح بلاتين صُنعت في فرن!
catalytic-chemical-plant=أنتج مصنعاً كيميائياً متخصصاً في استخدام البلاتين محفّزاً للتفاعلات.
pressurized-acid-neutralization=الضغط الأعلى على كوراندوم يتيح لنا استخراج طاقة أكبر من التعادل الحمضي.
pressurized-acid-neutralization-alt=نحتاج إلى ماء أكثر لالتقاط كل الطاقة المنطلقة، لكن هذا سيساعد على البدء.
dilute-acid-neutralization=نحصل على طاقة حرارية كافية من التعادل لتغلي الماء.
hot-water-to-steam=قليل من الطاقة الإضافية لتحويل الماء الساخن إلى بخار بدرجة 500.
petroleum-alkylation=كميات كبيرة من حمض الكبريتيك يمكنها تكوين كاتيونات الكربون، التي تُستخدم أساساً للألكلة لتكوين روابط كربون-كربون جديدة.
light-oil-alkylation=كميات كبيرة من حمض الكبريتيك يمكنها تكوين كاتيونات الكربون، التي تُستخدم أساساً للألكلة لتكوين روابط كربون-كربون جديدة. نستخدم هذه الصيغة للحصول على الزيت الثقيل.
sulfur-combustion=حرق الكبريت يمنحنا هذا الغاز، الذي يمكننا استخدامه لصنع كلٍ من حمض الكبريتيك والماء.
hydrogen-sulfide=بمحفّز بلاتيني، يمكننا استخدام البترول لإضافة الهيدروجين إلى الكبريت والحصول على كبريتيد الهيدروجين.
sulfur-reduction=يُختزل الكبريت إلى حالة أكسدة صفرية، بينما يتكوّن الماء.
sulfurous-oxidation=بوجود محفّز بلاتيني، يمكن لثاني أكسيد الكبريت أن يتفاعل مع الأكسجين لتكوين ثلاثي أكسيد الكبريت في الموقع. ثم يتفاعل ثلاثي أكسيد الكبريت مع الماء لتكوين حمض الكبريتيك.
hydrogen-sulfide-combustion=احتراق كبريتيد الهيدروجين يمنحنا مكونات إضافية لصنع حمض الكبريتيك.
chalcopyrite-refining=الكالكوبرايت هو FeCuS. نُعرّض الخام للحرارة وحمض الكبريتيك المركّز لأكسدة المعادن تماماً، فتتكوّن مزيج من أملاح الكبريتات المائية لها.
reactive-displacement=الحديد أكثر تفاعلية من النحاس. لذلك يمكننا استخدامه لإحلال أيونات النحاس من المحلول.
force-reduction-iron=يمكننا استخدام الجهد لضخ الإلكترونات في المحلول الأيوني. هذه الإلكترونات تختزل أيونات الحديد (III) المائية إلى حديد نقي. يجب تشكيل الناتج النقي إلى صفائح مجدداً.
force-reduction-copper=على غرار اختزال كبريتات الحديد (III)، نضخ الإلكترونات فتختزل أيونات النحاس.
sulfonated-plastic=بمحفّز بلاتيني، نستخدم ثاني أكسيد الكبريت والأكسجين لتكوين ثلاثي أكسيد الكبريت. يتفاعل ثلاثي أكسيد الكبريت مع حمض الكبريتيك لتكوين حمض الكبريتيك المدخّن، الذي يمكنه سلفنة الهيدروكربونات.
sulfonated-plastic-production-alt=بمحفّز بلاتيني، نستخدم ثاني أكسيد الكبريت والأكسجين لتكوين ثلاثي أكسيد الكبريت. يتفاعل ثلاثي أكسيد الكبريت مع حمض الكبريتيك لتكوين حمض الكبريتيك المدخّن، الذي يمكنه سلفنة الهيدروكربونات.
calcium-sulfate-fish=بوجود مصدر للنيتروجين والفوسفور، نضيف المزيد من الكربون وكبريتات الكالسيوم لتحسين إنتاج المغذيات.
calcium-sulfate-bioflux=بوجود مصدر للنيتروجين والفوسفور، نضيف المزيد من الكربون وكبريتات الكالسيوم لتحسين إنتاج المغذيات.
calcium-sulfate-egg=بوجود مصدر للنيتروجين والفوسفور، نضيف المزيد من الكربون وكبريتات الكالسيوم لتحسين إنتاج المغذيات.
calcium-sulfate=بوجود مصدر للنيتروجين والفوسفور، نضيف المزيد من الكربون وكبريتات الكالسيوم لتحسين إنتاج المغذيات.
sulfuric-acid-dilution=أضف الحمض إلى الماء للتخفيف بأمان، وليس العكس.
sulfuric-acid-concentration=ننفق طاقة كبيرة لتغلي الماء وتحويله إلى بخار يمكن تكثيفه مجدداً إلى ماء.
sulfuric-acid-concentration-alt=ننفق طاقة كبيرة لتغلي الماء، دون عناء تكثيفه.
calcium-sulfate-production-alt=يتفاعل ثاني أكسيد الكبريت وكربونات الكالسيوم لتكوين كبريتات الكالسيوم وثاني أكسيد الكربون.
stone-production=يُمثَّل الحجر بـSiO2 (متفاعل) وCaSiO3 (ناتج). على غرار صناعة الحجر على فولكانوس.
asphalt-c=نُكثّف الزيت الثقيل إلى مادة سابقة للخرسانة.
asphalt-c-alt=يمكننا أيضاً استخدام الزيت الخفيف الفائض لصنع الأسفلت. التفاعل أسرع لكنه أقل كفاءة.
concrete-production-from-asphalt=الأسفلت والحجر يصنعان الخرسانة.
pressure-lab=اجمع مصنعاً كيميائياً ومختبراً وتوربيناً بخارياً لتحصل على مختبر ضغط - من أجل العلوم!
thruster-fuel-oxidizer-to-steam=احرق وقود محرك الدفع لصنع البخار!
carbon-dioxide-to-carbon=اختزل ثاني أكسيد الكربون إلى كربون باستخدام الحديد.
