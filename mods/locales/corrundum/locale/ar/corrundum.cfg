controlled-petrol-combustion=احرق البترول بحذر لإنتاج غاز ثاني أكسيد الكربون.
calcium-sulfate-recovery=استرد كبريتات الكالسيوم من المغذيات عبر غسلات متكررة لإزالة الجزيئات غير القطبية.
destructive-dilute-acid-neutralization=سخّن الماء واتركه يتبخر.
rocket-fuel-catalytic-chemistry=الوصفة ذاتها - لكن في آلة أسرع!
super-saturated-displacement=يمكننا انتزاع نحاس إضافي من محلول مختلط عبر الإشباع الفائق وإعادة التبلور المتكررين.
super-saturated-displacement-iron=إحلال فائق التشبع مع الحديد.
sulfur-poison-capsule=حرب كيميائية مُطوّرة.
blue-rocket=صاروخ أكثر انفجاراً، محشوّ بمتفجر قوي جديد.
sulfuric-oxidizer=اسلفن ناتجاً هيدروكربونياً ليصبح غنياً بمجموعات الأكسجين - فيعمل مؤكسداً للتفاعلات المتفجرة.
explosives-from-sulfuric-oxidizer=عبّئ المؤكسد الكبريتي في حزم متفجرة.
petrol-dehydrogenation-and-combustion=بمحفّز بلاتيني، يمكننا استخدامه لنزع الهيدروجين من الهيدروكربونات للحصول على الألكاينات والألكينات وغاز الهيدروجين. هذه عملية ماصة للحرارة تتطلب ضغوطاً عالية، لذا فهي تستغرق وقتاً. بعد نزع الهيدروجين، نُحرق النواتج غير المشبعة تماماً لنحصل على ثاني أكسيد الكربون.
