farming= طبيعي النباتات و الحيوانات يمكن يكون معالَج إلى multiple مفيد منتجات. [item=vrauks]bloodstream يحتوي  مفيد[fluid=formic-acid]و[item=moondrop]يمكن يكون معالَج إلى[fluid=methane].\n\nAll farmable الأنواع يسقط تحت واحد لـ ثلاثة kingdoms; النبات, الحيوان, أو الفطريات.[item=saps],[item=moss],[item=tree-mk01],[item=fish], و[item=seaweed]يمكن يكون harvested من  محلي بيئة مع ذلك الأكثر aliens يجب يكون synthesized من خلال expensive معدَّل وراثياً processes في [entity=creature-chamber-mk01]أو[entity=botanical-nursery]. هذا يعالج سي يتطلب الحمض النووي البيانات stored في  الموسوعة مثل كـ[item=vrauks-codex]كـ well كـ الوراثي template البيانات من [entity=data-array].\n\nAfter أنت لديهم obtained  أول الأنواع, هو’s مهم إلى يربّي مزيد generations إلى avoid  complicated معدَّل وراثياً يعالج. كل kingdom لديه  unique التربية method.\n\nAnimal - الحيوان cubs/البيض مثل كـ[item=cocoon]يمكن يكون bred في [entity=rc-mk01]. هذا ماكينة يتطلب اثنان parents inserted إلى  ماكينة’s الوحدة فتحات. مرة واحدة أنت لديهم  young pups, كل الحيوان يمكن يكون raised إلى adulthood في  respective الحظيرة مثل كـ[entity=vrauks-paddock-mk01]. هذا الحظيرة أيضاً يتطلب بالغ المخلوقات إلى يكون inserted في  الوحدة فتحات.\n\nPlant - النباتات يتطلب seedlings مثل كـ[item=moondrop-seeds]إلى ينشئ  التالي توليد. يحوّل بالغ محاصيل إلى seedlings داخل [entity=botanical-nursery]. هذه seedlings يمكن ثم يكون cultivated إلى بالغ محاصيل في كبير farming بنى مثل كـ[entity=moondrop-greenhouse-mk01]. كل المزرعة مبنى يتطلب  بالغ محصول إلى يكون موضوع في  الوحدة الفتحة. كل دورة سي yield أكثر البذور من  الإدخال.\n\nFungi - ضئيل الفطر الأبواغ هي plentiful في  الغلاف الجوي. [entity=spore-collector-mk01]سي تلقائياً يعالج  الهواء لـ البوغ particulates مثل كـ[item=fawogae-spore]عند لا الإدخال cost. هذه الأبواغ يمكن ثم يكون grown إلى بالغ الفطريات في مكيّف shroom المزارع مثل كـ[entity=fawogae-plantation-mk01].  الفطريات يتطلب خاص الركيزة مادة مثل كـ[item=fungal-substrate]. هذه المباني أيضاً يتطلب بالغ mushrooms داخل  الوحدة فتحات.\n\nIn لترتيب إلى مزيد optimize و يزيد  الإخراج لـ المخلوق المزارع مزيد الوراثي modification هو ممكن أعلى إلى MK04. هذا الوراثي ترقية سي يزيد نمو speeds بواسطة أعلى إلى 400%.  الأكثر complicated الحيوان الأنواع يتطلب أكثر متقدم البيانات التخزين methods مثل كـ[item=zungror-codex-mk04].
caravans=[entity=caravan]هو  حي, عضوي اللوجستيات المخلوق بـ 30 الحقيبة فتحات و  programmable الجدول, مشابه إلى  القاطرة. هو utilizes  biter pathfinding الذكاء الاصطناعي.\ القافلة يتطلب الطعام إلى function.  القافلة consumes الطعام لـ كل الوجهة أو عندما transferring العناصر, بـ مختلف types لـ الطعام providing  مختلف عدد لـ الإجراءات. أنت يمكن see availible foods عندما hovering فوق  القافلة's الطعام الفتحة.\nYou يمكن برنامج  القافلة إلى visit أي الكيان, لكن عادةً[entity=outpost]هو  الأكثر مفيد. عندما  القافلة reaches  الوجهة, أنت يمكن برنامج محدد الإجراءات مبني على التي الوجهة.\nCaravans cannot يكون killed بواسطة القطارات أو biters. هناك هو أيضاً [entity=flyavan]و[entity=outpost-aerial].\n\nActions available لـ مختلف destinations include:\n- ينتظر:  القافلة سي يبقى عند  الوجهة. *يفعل لا يستخدم الطعام\n- يخزّن الطعام:  القافلة سي يعبّئ  الوقود فتحات من  الهدف's الحقيبة. *يفعل لا يستخدم الطعام\n- يعبّئ الحمولة:  القافلة سي استخراج العناصر حتى  الحقيبة هو ممتلئ.\n- يفرّغ الحمولة:  القافلة سي يفرّغ  الحقيبة.\n- Load العناصر حتى القافلة لديه:  القافلة سي ينقل العناصر من الهدف إلى ذاتي حتى هو لديه  specifed كمية لـ العناصر.\n- Load العناصر حتى الهدف لديه:  القافلة سي ينقل العناصر من الهدف إلى ذاتي حتى الهدف لديه  specifed كمية لـ العناصر.\n- Unload العناصر حتى القافلة لديه:  القافلة سي ينقل العناصر من ذاتي إلى الهدف حتى هو لديه  specifed كمية لـ العناصر.\n- Unload العناصر حتى الهدف لديه:  القافلة سي ينقل العناصر من ذاتي إلى الهدف حتى الهدف لديه  specifed كمية لـ العناصر.\n- الدائرة condition:  القافلة سي ينتظر عند  الوجهة حتى  الدائرة condition هو مستوفاة. *يفعل لا يستخدم الطعام\n- اجمع كل autotrash: Collects كل العناصر من  اللاعب's autotrash الحقيبة.\n\nActions التي ينقل العناصر لديهم  "ينتظر حتى مُنجَز" checkbox. عندما checked,  القافلة سي continue trying إلى perform  الإجراء حتى هو هو كامل. عندما unchecked,  القافلة سي try إلى ينقل كـ كثير العناصر كـ ممكن و ثم continue  الجدول حتى إن  الإجراء wasn't مُنجَز.\n\nDifferent kinds لـ الإجراءات هي available لـ مختلف types لـ destinations:\n- اللاعب:[Wait, Store food, Transfer items, Collect all autotrash]\n- نقطة التجمع:[Wait, Store food, Transfer items, Circuit condition]\n- آخر القافلة:[Wait, Store food, Transfer items]\n- المركبة:[Wait, Transfer items]\n- كهربائي pole:[Wait, Circuit condition]\n- Default:[Wait]\n\nCaravans, مشابه إلى القطارات, يمكن أيضاً لديهم المقاطعات. بعد  القافلة أوراق  الوجهة, هو سي check كل لـ  المقاطعات هو لديه و إن كل الشروط على واحد لـ ها هي مستوفاة, كل destinations لـ  مقاطعة سي يكون مضافة إلى  الجدول كـ مؤقتة المحطات.\nInterrupts لديهم  following الشروط: الحقيبة ممتلئ, الحقيبة يفرّغ, الحمولة العنصر عدد, الهدف العنصر عدد, الطعام عدد, الدائرة condition, عند محدد محطة, لا عند محدد محطة.\n\nYou يمكن يضيف filters في [entity=outpost]إلى ensure هناك هو كافٍ room لـ كل العناصر التي قد يكون transferred بين هذا نقطة التجمع و القوافل.
mounts=مركوبات هي  effective شكل لـ شخصي ينقل لـ كل المرحلة لـ progression التي يمكن أيضاً يساعد في combat.[item=hazard-concrete]و[item=refined-hazard-concrete]سي يمنع أي مركوبات من crossing و يمكن act كـ barriers إلى avoid destroying مهم infrastructure.\n\n[item=automation-science-pack]\n\[entity=car]هو  الأكثر أساسي و  بدائي مركوب. هو runs على صلب الوقود مثل كـ[item=raw-coal]و لديه  أعلى سرعة لـ 100km/h.  car هو مُجهَّز بـ[item=vehicle-machine-gun]لـ صغير arms damage. هو stores 80 stacks لـ العناصر.\n\n[item=logistic-science-pack]\n\n[entity=crawdad]هو  أول حيوي مركوب. Crafted في [entity=creature-chamber-mk01], هذا مركوب هو capable لـ running عند  أعلى سرعة لـ 85km/h. هذا المخلوق loves السمك و eats[item=fish],[item=fish-mk02],[item=fish-mk03], و[item=fish-mk04]. أثناء running هو consumes 800kW. بسبب إلى  ثقيل armor, هو هو قادر إلى كبش و يدمّر obstacles بدون taking أي damage. هو stores 90 stacks لـ العناصر.\n[entity=crawdad]لديه  10x4 armor معدات شبكة; مع ذلك  center 4x4 البلاطات هي permanently occupied بواسطة[item=py-mount-generator]. هذا المولّد taps إلى  حيوي الطاقة مُنشأ بواسطة  مركوب و instantly fills أي معدات batteries بواسطة باستخدام  الطعام الوقود. Note التي هذا المولّد هو 200% فعّال عند converting الطعام الوقود إلى معدات شبكة الطاقة. هو’s للغاية مفيد لـ شخصي robotics. لا آخر generators هي allowed داخل  كروداد’s معدات شبكة.\n\n[item=chemical-science-pack]\n\n[item=dingrido]هو  tamed و مُستأنس شكل لـ[item=dingrits]. هذا مركوب هو قادر إلى يركض عند فوق 250km/h! هذا مركوب loves اللحم منتجات مثل كـ[item=meat],[item=dingrits-food-01], و[item=dingrits-food-02]و أيضاً benefits من [item=py-mount-generator]. هذا مركوب يستخدم  طويل legs إلى traverse على أعلى لـ المباني بدون damaging ها. هو stores 120 stacks لـ العناصر و لديه  10x6 معدات شبكة.\n\n[item=py-science-pack-3]\n\n[item=spidertron]هو  mechanized نسخة لـ [item=zungror]. هذا cyborg الحياة شكل هو قادر إلى crawl على eight legs فوق تقريباً أي terrain. هو travels عند 110km/h و لديه عالٍ acceleration. هذا مركوب consumes الطاقة stored داخل[item=gastrocapacitor]و هو يستخدم  WASD driving mode. هو هو مُجهَّز بـ 4 cycling[item=spidertron-rocket-launcher-1]التي يمكن fire الصواريخ عند عالٍ سرعة. [item=spidertron-remote]يمكن يكون eستُخدم لـ تحكم[item=spidertron] من  الخريطة عرض. باستخدام  remote, multiple[item=spidertron]يمكن يكون programmed إلى follow كل آخر في  سلسلة. هو stores 160 stacks لـ العناصر و لديه  10x8 معدات شبكة. هذا مركوب benefits من [item=py-mount-generator].\n\n[item=utility-science-pack]\n\n[item=phadaisus]هو  نهائي evolved نسخة لـ[item=phadai]. بـ أقصى[item=exoskeleton-equipment], هو flies عند hypersonic speeds فوق 1700km/h و يستخدم  WASD driving mode. هذا مركوب loves إلى يأكل[item=phadai-food-01]و[item=phadai-food-02]و يمكن يكون controlled باستخدام [item=spidertron-remote]. هذا مركوب لديه  devastating[item=dragon-breath]dealing 2100 fire damage/s إلى أي الكيان في  6 بلاط نطاق. هذا weapon completely decimates forests.  flame نَفَس هو fueled بواسطة[item=dragon-breath-ammo]الذي كل provides ammo لـ five ساعات. هو stores 200 stacks لـ العناصر و لديه  10x10 معدات شبكة. هذا مركوب benefits من [item=py-mount-generator].
digosaurus=[item=digosaurus]هو جزء لـ  قديم dinosaur الأنواع. فوق سنوات لـ evolution, هم لديهم مُكيَّف إلى اجمع و يستخدم[item=nexelit-ore]كـ  الطاقة المصدر. Exploit هو.\nDig-o-saurus يجب يكون موضوع في [entity=dino-dig-site].  موقع الحفر لديه  المدى الذي هو يمكن منجم  النيكسيلايت. هو أيضاً يتطلب الكهرباء.\n\nDig-o-saurus يتطلب الطعام إلى العمل. كل الطعام يسمح  Dig-o-saurs gather أكثر الخامات في  نفس trip.\n[item=dried-meat]→ 1 الخام\n[item=guts]→ 1 الخام\n[item=meat]→ 2 الخامات\n[item=workers-food]→ 8 الخامات\n[item=workers-food-02]→ 16 الخامات\n[item=workers-food-03]→ 32 الخامات\n\n[item=thikat]هو  larger, وراثياً مُعزَّز نسخة لـ  ديغ-أو-سور. ثيكات لديه 100% التعدين الإنتاجية.\n[item=work-o-dile]لديه 200% التعدين الإنتاجية.\n\nFloor البلاطات مثل كـ[item=py-steel]يمكن يحسّن  running سرعة لـ  ديغوصور.
mega-farm=[entity=mega-farm]لديه  قدرة إلى cultivate patches لـ النباتات. أنت يمكن pick  نوع لـ النبات و  الوصفة لـ التي النبات, لـ example[recipe=bioreserve-super-1], ثم أنت لديهم إلى يغذّي  مطلوب مواد. أنت ثم لديهم إلى أدخل  collector, لـ example[item=replicator-bioreserve]. بعد inserting  collector, أنت لديهم إلى 'launch'  'الصاروخ' - overhyped terms thought أعلى بواسطة marketing, لا doubt - الذي يولّد  تجمّع لـ  chosen النباتات إلى  north لـ  مبنى. هذا تجمّع يمكن ثم يكون harvested باستخدام [entity=harvester].\n\nWhen  تجمّع dries أعلى, أنت يمكن repeat  يعالج, لـ  متجدد المصدر لـ النباتات مثل كـ[item=native-flora]. أكثر معقّد الوصفات يولّد richer patches.
wyrmhole=أنت’ve مُنشأ  الأنواع لـ عملاق, فائق سريع, yet docile worms. هم هي قادر إلى ينقل العناصر instantaneously بين مختلف[entity=wyrmhole]المباني, كـ طويل كـ تلك المباني هي tuned إلى  identification لـ  نفس دودة.\n\nUse  rings لـ checkboxes إلى يختار  محدد دودة - كل pattern لـ checked و unchecked boxes سي يختار  مختلف دودة.  العناصر سي ما زال يكون بـ  دودة إن لا ثقب الدود هو tuned إلى التي دودة, أنت يمكن retrieve ها بواسطة tuning إلى التي دودة مرة أخرى.\n\n[entity=wyrmhole]يتطلب 250 MW لـ continuous الكهرباء.
ocula=أنت’ve developed  weird, creepy, overpriced eyeball المخلوق.[item=ocula]هو  شخصي اللوجستيات الجهاز التي سي يسلّم العناصر حتى إن أنت هي خارج  المدى لـ  منصة الروبوتات.\n\ أوكولا لديه لا المدى limit, و delivers العناصر مبني على  شخصي لوجستي filters. جداً helpful إن أنت don’t لديهم  global لوجستي الشبكة.\n\ أوكولا يتطلب [item=ipod]لـ التخزين. كل عينبود لديه room لـ 3 oculus.  عينبود يجب يكون موضوع في المدى لـ  منصة الروبوتات الشبكة, مثل كـ من [item=py-roboport-mk01].  oculus سي فقط pick أعلى العناصر من التي الشبكة.\n\n[item=ocula]يفعل لا support لوجستي المهملات فتحات.
vatbrain=أحياناً العلم pushes أيضاً بعيد.[entity=vat-brain]grants  كبير الإنتاجية المكافأة إلى nearby[entity=lab]عند  عالٍ cost.\n\n[entity=vat-brain]works similarly إلى [entity=beacon], مع ذلك هو يجب يكون fed constantly بـ cartridges مثل كـ[item=brain-cartridge-01].  single خرطوشة سي أخير لـ 20 seconds.\ التأثير لـ multiple دماغ-الوعاء يمكن الرصة معاً, granting  greater الإنتاجية المكافأة. Whenever  خرطوشة expires, أنت سي lose  الإنتاجية المكافأة.\n\nEach خرطوشة grants  مختلف كمية لـ الإنتاجية إلى nearby labs:\n-[item=brain-cartridge-01]→25%\n-[item=brain-cartridge-02]→50%\n-[item=brain-cartridge-03]→75%\n-[item=brain-cartridge-04]→100%
symbiosis=[item=ulric-infusion]يسمح أنت إلى combine  الأفضل aspects من multiple الأنواع. حقن أو digest هذا المصل إلى temporarily gain heightened physical abilities. هذا procedure سي transform  character إلى  الأولريك-human هجين لـ 10 minutes.\n\nIncreased attributes include:\n- Running سرعة +40%\n- Reach مسافة ×3\n- Health و regeneration ×5\n- الحقيبة فتحات +40\n- القطار immunity\n- Instant التعدين سرعة\n- Powerful melee attack\n\ الأولريك transformation lasts لـ فقط 10 minutes مع ذلك [item=ulric-infusion-equipment]يمكن autoinject طازج المصل من  الحقيبة. يضع [item=ulric-infusion-equipment]داخل  armor’s معدات شبكة و يزوّد الطاقة إلى continuously benefit من  transformation.
turd=Welcome إلى  technological ترقية و البحث الجهاز. هذا page يحتوي permanent الترقيات إلى محدد ماكينات.\nResearch  primary التقنية من  التقنية الشجرة و  T.U.R.D. ترقية الخيارات سي يصبح available من هذا القائمة. Available الترقيات include permanent الوحدة bonuses, جديد الوصفات, و الوصفة الترقيات.\n[item=speed-module-3]سرعة bonuses scale بـ  المزرعة مبنى المستوى.[item=productivity-module-3]الإنتاجية bonuses apply إلى كل الوصفات في  ماكينة.
biofluid=أنت’ve بنجاح حيوي-مُهندَسة[entity=gobachov],[entity=huzu], و[entity=chorkok]. هذه ثلاثة المخلوقات هي حيوي alternatives إلى [entity=py-logistic-robot-mk01]. بدلاً من لـ transporting العناصر, هم سي بدلاً من يساعد في  السائل اللوجستيات. هم هي قادر إلى ينقل السوائل بين[entity=provider-tank]و[entity=requester-tank].\n\nA[entity=bioport]هو مطلوب إلى يخزّن, يغذّي, و muck خارج  العامل المخلوقات. Unlike  standard[entity=py-roboport-mk01] منفذ باي الحيوي لديه لا لوجستي نطاق. بدلاً من, يصنع  direct connection باستخدام[entity=vessel]و[entity=vessel-to-ground].\n\n[entity=bioport]يتطلب  ثابت caloric الإمداد في لترتيب إلى يحتفظ  المخلوقات بصحة جيدة و نشط. كل المستوى لـ العامل’s الطعام يسمح لـ  مختلف كمية لـ التسليمات. الطعام هو دائماً مستهلك عند  beginning لـ  التسليم.[item=efficiency-module-3]يمكن يكون مستخدم. Additionally, [entity=bioport]سي فقط spawn السائل الحيوي المخلوقات عند  أقصى معدل لـ 1 المخلوق كل 2.38 seconds.  السائل الحيوي المخلوق سي typically يعود إلى whichever المنفذ الحيوي هو came من, لكن هناك هو  10% chance لـ هو إلى spread إلى آخر المنفذ الحيوي في  نفس الشبكة.\n\[entity=requester-tank]لديه عدة مفيد يرشّح الإعدادات. أول, configure  requested السائل نوع و كمية. Secondly, configure  الطالب’s الأولوية عندما compared إلى آخر requesters. Note التي إن اثنان requesters لديهم  نفس الأولوية,  الطالب بـ  highest يطلب حجم minus  حالياً contained السائل سي يكون chosen أول. Finally هناك هو  optional حرارة يرشّح.  أدنى كمية لـ السائل مطلوب إلى يكون present في  المزوّد لـ هو إلى يكون eligible لـ ينقل يمكن يكون configured في  الخريطة الإعدادات (بواسطة default هو هو 10000 units),  نفس goes لـ  كمية لـ أدنى missing السائل في requesters. كل الطالب الإعدادات هي blueprintable و copypastable.\n\n[item=guano]هو  مفيد النفايات المنتج مُنشأ في [entity=bioport]. عندما consuming الطعام, كل المخلوق يولّد  صغير كمية لـ النفايات مُظهر كـ  الإنتاجية bar. مرة واحدة  النفايات bar هو ممتلئ,  bar هو إعادة الضبط و 3[item=guano]هي مولّدة في  الإخراج الفتحة. يزيل  النفايات منتجات باستخدام  الإدراج أو [entity=bioport]سي ظهره-أعلى و يتوقف functioning.\n\nEach السائل الحيوي المخلوق لديه مختلف stats depending على  المستوى:\n[entity=gobachov]- المستوى: MK 01, سرعة: 19.4 km/h, الأقصى التسليم حجم: 10000, النفايات لكل trip: 0.6\n[entity=huzu]- المستوى: MK 02, سرعة: 25.9 km/h, الأقصى التسليم حجم: 15000, النفايات لكل trip: 0.8\n[entity=chorkok]- المستوى: MK 03, سرعة: 64.8 km/h, الأقصى التسليم حجم: 20000, النفايات لكل trip: 1.3

