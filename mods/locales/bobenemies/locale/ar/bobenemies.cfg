[mod-setting-description]
bobmods-enemies-enableartifacts=إن فُعّل، يمكن للأعداء إسقاط قطع أثرية فضائية.
bobmods-enemies-enablesmallartifacts=إن فُعّل، يمكن للأعداء إسقاط قطع أثرية فضائية صغيرة.
bobmods-enemies-enablenewartifacts=إن فُعّل، يمكن للأعداء إسقاط قطع أثرية فضائية ملوّنة.
bobmods-enemies-aliensdropartifacts=إن فُعّل، سيسقط المعاضّ والبصّاقات قطعاً أثرية، وليس القواعد فقط.
bobmods-enemies-leviathanfrequency=يحدّد احتمال ظهور ليفياثان عند أقصى معامل تطور.
bobmods-enemies-biggersooner=إن فُعّل، سيُستخدم جدول الظهور المُعدَّل الذي يظهر فيه أعداء أكبر عند معاملات تطور أدنى.
bobmods-enemies-superspawner=إن فُعّل، قد يظهر المُفرّخ الفائق على الخريطة، وهو أقوى ويُفرّخ الأعداء الأصعب بوتيرة أعلى.
bobmods-enemies-healthincrease=يزيد صحة بعض الأعداء.
bobmods-enemies-factionsappear=مستوى تطور الأعداء الذي تبدأ عنده السلالات الجديدة بالظهور على الخريطة. وسيجعل ضبطه على 0 بداية اللعبة صعبة للغاية.
bobmods-enemies-qualityenemies=قد تظهر منشآت قواعد الأعداء الجديدة بجودة أعلى، مما يُنتج وحدات وغنائم أعلى جودة.
bobmods-enemies-originalcolors=ستظهر مفرّخات الأعداء على الخريطة بلونها الأحمر الأصلي بدلاً من الألوان الخاصة بالسلالات التي تُسهّل تمييزها.
bobmods-enemies-radarscanlimit=يحدّد عدد العناصر الموجودة على الأرض التي سيُحدد الرادار الأرضي مواقعها لتفكيكها في دورة واحدة. ورغم أن هذا قد يؤثر قليلاً على الأداء، فإن غرضه الأساسي هو منع انشغال روبوتات البناء بجمع العناصر لفترات طويلة. وضبطه على 0 يُلغي الحدّ.
bobmods-enemies-randomizeenemies=ستُفتح سلالات الأعداء الجديدة بترتيب عشوائي. ولا يمكن القيام بذلك إلا عند بدء اللعبة أو عند إضافة هذا المود لأول مرة.
bobmods-enemies-factionlist=قائمة بجميع السلالات التي تظهر، بترتيب فتحها غير العشوائي (الذي يمكن تغييره بحرية). افصل بينها بفاصلة واحدة دون مسافات. وإزالة أكثر من سلالة قد تُصعّب جمع جميع أنواع القطع الأثرية. السلالات التابعة لهذا المود والمحذوفة أثناء اللعبة لن تختفي من الخريطة، لكن لن تظهر قواعد جديدة.