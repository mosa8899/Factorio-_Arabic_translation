module-inserter-ex-add-module-set=إضافة مجموعة وحدات بديلة\nيمكن استعمالها كبديل إذا كانت المجموعة الأولى غير صالحة (مثلاً لاحتوائها على وحدات إنتاجية لا تسمح بها الوصفة الحالية)\nعند الإدراج، تُجرَّب المجموعات من الأعلى للأسفل وتُستعمل أول مجموعة صالحة
