[mod-name]
reskins-library=Artisanal Reskins: المكتبة

[mod-description]
reskins-library=يحتوي على الدوال والأيقونات والرسوم المطلوبة من كل مودات Artisanal Reskins. جزء من سلسلة Artisanal Reskins.

