[technology-description]
cargo_ships=نقل واسع النطاق عبر المياه.
water_transport=يوفر الوسائل اللازمة لعبور المجاري المائية.
automated_water_transport=يتيح إنشاء الممرات المائية، التي تحصل عليها عبر زر الاختصارات أو بـ __CONTROL__give-waterway__. يمكن بناء الموانئ على الممرات المائية لإنشاء مسارات سفن آلية.
tank_ship=قدرة على نقل السوائل عبر الماء. يمكن ملء __ENTITY__oil_tanker__s وتفريغها بالمضخّات.
automated_bridges=يمكّن من الجسور التي تتيح للقطارات والممرات المائية تقاطع مساراتها.

[mod-setting-name]
fuel_modifier=سعة وقود السفينة
speed_modifier=سرعة حركة السفينة
