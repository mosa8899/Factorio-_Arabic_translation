ric-tailings-scavenger-recovery=يقوم بمسح القيم المعدنية المتبقية من ملاط ​​المخلفات، ويعيد معظم المياه المعالجة بينما يصنف المواد الصلبة المتبقية إلى مخلفات مجمعة قابلة لإعادة الاستخدام.
ric-metallurgical-dust-oxidative-leach=يستخدم محلول الترشيح والبيروكسيد لاستعادة المزيد من القيمة المعدنية من غبار الفرن الناعم مقارنة بمسار ترشيح الغبار الأساسي.
ric-acidic-wastewater-acid-recovery=يستعيد جزء متحكم فيه من حمض الكبريتيك من مياه الصرف الصحي الحمضية قبل أن يستمر السائل المتبقي من خلال معالجة النفايات السائلة العادية.
ric-refinery-offgas-pressure-swing-recovery=يستخدم امتزاز الزيوليت لفصل الغازات المنبعثة من المصفاة إلى هيدروجين وميثان وغاز وقود النبات القابل لإعادة الاستخدام مع وجود تيار صغير فقط من غاز النفايات المتبقي.
ric-closed-loop-cooling-water-recovery=تستهلك مواد التلميع مياه التبريد باستخدام مياه الماكياج منزوعة المعادن ووسائط الحماية بحيث يعود معظم مخزون مياه التبريد مباشرة إلى الخدمة.
ric-closed-loop-ash-mineral-reclamation=يفصل رماد المرجل والعمليات مع مياه الصرف الصحي ومحلول الجير، ويستعيد المواد الصلبة المعدنية القابلة لإعادة الاستخدام مع تحسين مياه العمليات إلى مياه صرف معالجة.
ric-closed-loop-spent-acid-regeneration=يستخدم الأكسجين ومياه الماكياج منزوعة المعادن وتلميع الطبقة الواقية لاستعادة معظم تيار الحمض المستهلك كحمض الكبريتيك القابل لإعادة الاستخدام.
ric-closed-loop-solvent-reclamation=يتم تشغيل المذيبات المستهلكة من خلال دورة التقطير والتلميع عالية الكفاءة، مما يعيد كلاً من المذيبات العضوية ومذيبات العملية العامة مع فقدان مياه الصرف الصحي بشكل أقل بكثير.
ric-closed-loop-mineral-residue-stabilisation=يربط المخلفات المعدنية المركزة في ردم صناعي مستقر بكميات كبيرة باستخدام مادة مضافة من الخبث والأسمنت وملاط الجير، مما يوفر حوض بناء متين للمواد الصلبة المتراكمة عن طريق الاستخلاص في حلقة مغلقة.

