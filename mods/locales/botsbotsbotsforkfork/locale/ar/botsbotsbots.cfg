[technology-description]
bots-robots-steamworks=روبوتات بسيطة غير فعّالة في استهلاك الطاقة، تساعد في بناء قواعد أكبر بسرعة في بداية اللعبة، لكنها غير عملية لاحقاً بسبب هشاشتها الشديدة واستهلاكها الضخم للطاقة.
bots-robots-simple=أكثر تحمّلاً من السابق، لكنها لا تزال قابلة للاشتعال بسهولة ولا يمكن استعمالها على كواكب المراحل المتقدّمة.
bots-robots-advanced=أخيراً روبوتات جيدة! يمكن استعمال هذه الموديلات على كواكب أخرى (باستثناء الكواكب شديدة البرودة) ولديها قدرة بقاء عالية.
bots-robots-superiour=باستعمال عناصر متخصصة من كواكب أخرى، يمكن ترقية روبوتاتك أكثر، مما يسمح لها بالبقاء على الكواكب الباردة.
bots-robots-astounding=تحسين قدرة المعالجة في روبوتاتك يسمح لها باستعمال بطارياتها بكفاءة أكبر.
bots-robots-ups=المفاعلات الاندماجية الصغيرة المدمجة في كل روبوت تُزيل استهلاك الطاقة تماماً، وتُدخل عصراً جديداً من اللوجستيات المعتمدة على الروبوتات.

