[tips-and-tricks-item-description]
ric-geology-reference=تستخدم خرائط RIC القارية المؤشرات الجيولوجية بدلاً من بقع الخام المسماة مباشرة. قم بتحريك الإشارة لرؤية مجموعة الاكتشاف الخاصة بها. يحدد لون الخريطة الجيولوجيا قبل الحفر. ضع [entity=ric-core-drilling-rig] على إشارة وقم بتوجيه إخراج [item=ric-geological-core] إلى حزام أو حاوية؛ بعد اكتمال دفعة العينة، يتم الكشف عن الحقل المتصل بالكامل على شكل رواسب متدرجة أو جافة أو حاملة للماء. يتم قياس المسافات أدناه من أصل الخريطة.
ric-geology-specialist=[font=default-bold]الجيولوجيا الرسوبية — #9E8052[/font]\n[item=ric-gypsum] الجبس؛ [item=ric-apatite] الأباتيت. [item=ric-graphite] الجرافيت. [item=ric-pyrolusite-ore] البيرولوسيت.\n[font=default-bold] الجيولوجيا الحرارية المائية — #9E5C38[/font]\n[item=ric-fluorite] الفلوريت؛ [item=ric-sphalerite-ore] السفاليريت؛ [item=ric-galena-ore] جالينا. 512+: [item=ric-wolframite-ore] ولفراميت، [item=ric-scheelite-ore] شيليت، [item=ric-molybdenite-ore] موليبدنيت. 640+: [item=ric-argentite-ore] أرجنتيني. 768+: [item=ric-native-gold-ore] الذهب الأصلي.\n[font=default-bold]جيولوجيا الصهارة - #38383D[/font]\n[item=ric-pentlandite-ore] البنتلانديت؛ [item=ric-chromite-ore] الكروميت؛ [item=ric-ilmenite-ore] إلمينيت؛ [item=ric-rutile-ore] روتيل.\n[font=default-bold] الجيولوجيا اللاتريتية — #B84C24[/font]\n[item=ric-bauxite] البوكسيت؛ [item=ric-kaolin] الكاولين.\n[font=default-bold]جيولوجيا التبخر — #E0C7B8[/font]\n[item=ric-rock-salt] الملح الصخري؛ [item=ric-borax] البوراكس؛ [item=ric-sylvite] سيلفايت.\n[font=default-bold]جيولوجيا البغماتيت — #B8B8D1[/font]\n[item=ric-quartz] كوارتز؛ [item=ric-cassiterite-ore] حجر القصدير. 512+: [item=ric-spodumene-ore] سبودومين. 640+: [item=ric-bastnasite-ore] باستناسيت.\n[font=default-bold]الجيولوجيا الإشعاعية — #4C852E[/font]\n[item=ric-pitchblende-ore] البيتشبلند; [item=ric-monazite-ore] المونازيت.
ric-geology-critical=[font=default-bold]الجيولوجيا الحاملة للحديد — #9E422E[/font]\nفي 384 بلاطة، تكشف عن الهيماتيت [item=ric-hematite-ore] فقط. عند 384+ يمكنه الكشف عن الهيماتيت أو [item=ric-magnetite-ore] الماجنتيت.\n[font=default-bold] جيولوجيا احتواء النحاس - #389E52[/font]\nضمن 384 بلاطة يكشف [item=ric-malachite-ore] الملكيت فقط. عند 384+، يمكن أن يكشف عن الملكيت، أو [item=ric-chalcopyrite-ore] الكالكوبرايت أو [item=ric-bornite-ore] البورنيت.\n[font=default-bold] الجيولوجيا الحاملة للفحم — #1F1F21[/font]\nيكشف عن الفحم [item=coal].\n[font=default-bold] الجيولوجيا الحاملة للحجر الجيري — #B8AD8F[/font]\nيكشف عن الحجر الجيري [item=ric-limestone].\nيتم ضمان نتوءات الهيماتيت والمالاكيت والفحم والحجر الجيري بالقرب من مرحلة النشر بشكل مستقل عن عناصر التحكم في التوسيع هذه.
ric-geology-galena=[item=ric-galena-ore] الجالينا هو اكتشاف [font=default-bold] للجيولوجيا الحرارية المائية [/font]. قبل الحفر، ابحث في الخريطة عن حقول [font=default-bold]#9E5C38[/font] ذات اللون البني الصدئ. داخل 512 بلاطة من أصل الخريطة، يتكون مجموعة الاكتشاف الحرارية المائية من [item=ric-fluorite] الفلوريت و[item=ric-sphalerite-ore] السفاليريت والجالينا، لذا فإن كل حقل حراري مائي يحتوي على لفة جالينا حتمية 1 في 3. من 512 إلى 639 بلاطة، ينمو المجمع إلى 6 مرشحين، ومن 640 إلى 767 إلى 7، ومن 768+ إلى 8. إذا كنت بحاجة إلى الرصاص على وجه التحديد، فابحث عن الحقول الحرارية المائية القريبة قبل السفر بعيدًا.
ric-geology-grade-water=يتم طرح [font=default-bold]الدرجة مرة واحدة عند مسح الحقل. [/font] لا يتحسن أو يعود إلى الظهور أثناء تعدين الودائع. احتمالات الدرجة حسب المسافة من أصل الخريطة هي: أقل من 384 مربعًا - 65% منخفض / 34% قياسي / 1% مرتفع؛ 384-1023 — 43% / 49% / 8%؛ 1024–2047 — 25% / 55% / 20%؛ 2048+ — 15% / 55% / 30%. لكل 10 ROM، تنتج درجة منخفضة 4 معادن مفيدة + 6 نفايات، وتنتج القياسية 7 + 3، وتنتج عالية 9 + 1.\n[font=default-bold]الحامل الجاف/الماء عبارة عن لفة منفصلة.[/font] كل معدن لديه فرصة مياه قاعدية خاصة به، ومن المرجح قليلاً أن تكون الحقول البعيدة حاملة للمياه. خريطة الرطوبة لا تقرر ذلك. لا يغير المستوى وحالة الماء نوع آلة التعدين التي يتطلبها نوع الخام.
ric-geology-blasting=[font=default-bold]رواسب المحاجر [/font] يمكن حفرها بعد إزالة الأعباء دون التفجير. [font=default-bold]تتطلب رواسب الصخور الصلبة [/font] حفر حفرة الانفجار ← الشحن ← التفجير ← الحفر. تستهلك المقاعد المحفورة الجافة [fluid=ric-bulk-anfo-charge]؛ تستهلك المقاعد المحفورة الحاملة للماء [fluid=ric-blasting-emulsion]. يمكن نقل كلا تياري الشحن عن طريق الأنابيب أو عربة السوائل أو البرميل بعد تعدين الصخور الصلبة.\nتشمل معادن الصخور الصلبة المغنتيت، والكالكوبايرايت، والبورنيت، والكوارتز، والفلوريت، والسفاليريت، والجالينا، والكاستيريت، والبنتلانديت، والكروميت، والولفراميت، والشيلايت، والموليبدينيت، والإلمنيت، والروتيل، والسبودومين، والذهب الأصلي، والأرجنتيت، والبتشبلند، والمونازيت، و باستناسيت. يستخدم الهيماتيت والملكيت والبوكسيت والحجر الجيري والجبس والملح الصخري والبوراكس والأباتيت والسيلفيت والجرافيت والفحم والكاولين والبيرولوسيت طريق المحجر.

