[mod-description]
BottleneckLite=أداة لتحديد عنق الزجاجة في مصنعك، دون أي كلفة تشغيلية وباستجابة فورية للتغيّرات في الحالة.

[mod-name]
BottleneckLite=عنق الزجاجة المبسّط

[mod-setting-description]
bnl-glow=عند التمكين، تتوهّج المؤشرات ليلًا. عطّلها إذا كان الأمر مزعجًا جدًا.
bnl-include-mining-drills=عند التعطيل، لن تُرسم المؤشرات على حفر التعدين.

[mod-setting-name]
bnl-color-disabled=لون المعطّل
bnl-color-full_output=لون الإنتاج الكامل
bnl-color-idle=لون الخمول
bnl-color-insufficient_input=لون نقص المدخلات
bnl-color-low_power=لون الطاقة المنخفضة
bnl-color-no_minable_resources=لون عدم وجود خامات قابلة للتعدين
bnl-color-no_power=لون غياب الطاقة
bnl-color-working=لون العمل
bnl-enable=تمكين المؤشرات
bnl-glow=مؤشرات متوهّجة
bnl-include-mining-drills=تضمين حفر التعدين
bnl-indicator-size=حجم المؤشر

[string-mod-setting]
bnl-indicator-size-huge=ضخم
bnl-indicator-size-large=كبير
bnl-indicator-size-medium=متوسط
bnl-indicator-size-small=صغير
bnl-indicator-size-tiny=ضئيل
