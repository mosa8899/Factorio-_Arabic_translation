[map-gen-preset-description]
maritime-archipelago=شحن بين الجزر مع يابسة بداية سخية للبناء وخامات أولية، تليها بحار جزرية صالحة للملاحة. مناطق الموارد والرواسب البعيدة الأغنى تنطبق على هذا الإعداد فقط. المحيط العميق يبقى محمياً من الاستصلاح.
maritime-vanilla-continents=مساحات يابسة نافيس الكبيرة وتوزيع خامات عادي على النمط الأصلي. سفن الموانئ البحرية والمراسي والمربعات العميقة المحمية تبقى متاحة؛ قيود الموارد الخاصة بالأرخبيل لا تنطبق.

[mi-message]
project-cargo-crane-placement=يجب بناء رافعات البضائع المشروعية الثقيلة بجانب ممر مَرسى مياه عميقة حقيقي.
offshore-service-platform-placement=يجب بناء منصات الخدمة البحرية فوق ماء صالح للملاحة في معظم مساحتها.
dry-dock-coastal-placement=يجب بناء الأحواض الجافة التجارية على الخط الساحلي مع جهة واحدة تواجه ماءً صالحاً للملاحة.
deep-draft-berth-placement=يجب أن تواجه المراسي العميقة الغاطس قناة مياه عميقة. عمّق ممر المَرسى أولاً بقطع تجريف المياه العميقة.
heavy-bulk-loader-placement=يجب بناء رافعة/مسترد السفن السائبة الثقيلة بجانب ممر مَرسى مياه عميقة حقيقي. عمّق مدخل مَرسى Panamax أولاً.
quay-edge-deepwater-rejected=يجب أن يبقى تبليط الرصيف في المياه العميقة ضمن عرض المَرسى الهندسي لشاطئ موجود أو أرض ميناء مستصلحة.
quay-edge-deepwater-unanchored=ضع تبليط الرصيف في المياه العميقة بجانب يابسة موجودة أو قطعة رصيف قبل تمديده فوق ماء مفتوح.
container-gantry-coastal-placement=يجب وضع رافعة الحاويات الجسرية على الشاطئ بماء أمامها ويابسة خلفها.
heavy-container-gantry-placement=يجب وضع الرافعة الجسرية الثقيلة للحاويات بيابسة خلفها وممر مَرسى مياه عميقة حقيقي أمامها.
heavy-tanker-transfer-placement=يجب بناء أذراع نقل خام VLCC بجانب ممر مَرسى مياه عميقة حقيقي. عمّق مَرسى الناقلة أولاً.
container-gantry-load-mode=رافعة الحاويات: تحميل السفينة
container-gantry-unload-mode=رافعة الحاويات: تفريغ السفينة

[tile-name]
mi-quay-edge=حافة الرصيف
mi-deep-draft-quay-edge=حافة الرصيف العميقة الغاطس
mi-quay-apron=ساحة الرصيف

[mod-setting-name]
maritime-industry-shore-include=مربعات الرصيف تُحسب كشاطئ

[mod-setting-description]
maritime-industry-shore-include=مفعّل (الافتراضي): حافة الرصيف وساحة الرصيف وحافة الرصيف العميقة تُحسب كمراسي ساحلية، لذا يمكن تمديد الرصيف فوق المياه العميقة دون حد أقصى للمسافة من الشاطئ الطبيعي. اليابسة العادية تبقى مرساءً صالحاً. معطّل: يعيد قاعدة الرصيف الأصلية القصيرة المرتكزة على اليابسة. هذا الخيار لا يسمح بالردم في المحيط العميق المحمي. تغيير إعدادات بدء التشغيل يتطلب إعادة تشغيل اللعبة.
