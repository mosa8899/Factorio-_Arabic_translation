reskins-lib-tier-mapping=خرائط المستويات
reskins-lib-blend-mode=كثافة اللون
reskins-lib-customize-tier-colors=تفعيل الألوان المخصصة
reskins-lib-custom-colors-tier-0=اللون: المستوى 0
reskins-lib-custom-colors-tier-1=اللون: المستوى 1
reskins-lib-custom-colors-tier-2=اللون: المستوى 2
