[controls-description]
additional-paste-settings-hotkey=يجب أن يكون SHIFT + النقر بالأيسر لمعظم المستخدمين. يجب أن يكون هذا الاختصار دائماً هو الاختصار الذي يلصق الإعدادات على الكيانات.
additional-paste-settings-hotkey-alt=يجب أن يكون SHIFT + ALT + النقر الأيسر لمعظم المستخدمين. يقسم هذا الاختصار مقدار الرزمة الحالي للإدراج إلى النصف.

