[item-description]
platinum-ore=معدن نبيل يُستخدم لتسهيل التفاعلات المحفّزة.
chalcopyrite-ore=خام أزرق جميل يتألف من النحاس والحديد مرتبطين بالكبريت. FeCuS.
platinum-plate=خام بلاتين صُقّر إلى صفائح.
asphalt-c=قطران مكرّر يمكن تحويله إلى خرسانة.
catalytic-chemical-plant=مصنع كيميائي مزوّد بمكونات بلاتينية. مثالي لتحفيز التفاعلات والتفاعل الكهروكيميائي.
pressure-lab=مزيج غير مقدّس بين مختبر ومصنع كيميائي. هذه الوحشة الميكانيكية تُصنع تحت ضغط عالٍ، ويمكنها البحث أسرع من المختبر العادي - باستهلاك 35% فقط من العلوم. تعمل بالبخار/mضغوطة، والضغط العالي داخل الآلة يسمح بإجراء البحث أسرع. لكنها ترفض حزم العلوم ذات الجودة العادية - فالحزم العادية لا تصلح لضغوط هذه الآلة. تعمل بالبخار!
red-boiler=غلاية مصممة لتحويل البترول إلى غاز CO2 ساخن. وبما أننا نحبس معظم الغاز، فإنها لا تُنتج الكثير من التلوث
red-steam-engine=محرك بخاري معدّل. يستخدم التأثير الكهروحراري لإنتاج الطاقة. صُمم لاستقبال غاز CO2 الساخن وإنتاج الطاقة - بتكلفة تلوث كبيرة.
ice-box=صندوق بلاستيكي رائع للحفاظ على المواد القابلة للتلف طازجة بنسبة تصل إلى 50%!
dry-ice=ثاني أكسيد الكربون مبرداً إلى حالة صلبة.
sulfur-poison-capsule=كبسولة سمّ تحرق الكبريت لتوليد أبخرة سامّة.
sulfuric-oxidizer=وقود مُعالَج بمجموعات كبريتات ليعمل مؤكسداً للتفاعلات المتفجرة.

