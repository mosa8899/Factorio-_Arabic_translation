[tips-and-tricks-description]
angels-bioprocessing-intro=استكشف هذا الكوكب الفضائي لتجد النباتات (الفلورا) والحيوانات (الفونا) واستخدمها لصالحك. يقدّم هذا المود بدائل للعمليات البتروكيماوية ويشجّع على استكشاف المحيط.\n
angels-bioprocessing-intro-nauvis=[font=default-bold]معالجة نافيس[/font]:\n - [img=item/angels-algae-farm] زراعة الطحالب — طرق زراعة مبكرة للكتلة النباتية.\n - [img=item/angels-bio-arboretum-1] زراعة الأشجار بالاعتماد على الأشجار الأصلية للحصول على الخشب والراتنج والبلاستيك والمطاط.\n
angels-bioprocessing-intro-vegetables=\n[font=default-bold]معالجة الخضروات[/font]:\n - [img=item/angels-desert-garden] بعض النباتات الأصلية تحمل بذوراً تعطي محاصيل مفيدة.\n - [img=item/angels-crop-farm] ازرع هذه المحاصيل واعتنِ بها للحصول على منتجات مفيدة.\n
angels-bioprocessing-intro-animals=\n[font=default-bold]معالجة الحيوانات[/font]:\n - [img=item/angels-bio-refugium-fish] بعض الأسماك الأصلية مصدر مفيد للتغذية والمنتجات الزيتية.\n - [img=item/angels-bio-refugium-puffer] بعض المخلوقات الطيّارة الصغيرة بارعة في تحويل الغازات الخطرة إلى منتجات مفيدة.

angels-bioprocessing-nauvis=استكشاف واستغلال الطحالب سريعة النمو هو المرحلة الأولى من هذا المود. العثور على أشجار متخصصة في البيئات المختلفة يسمح بتنمية الأشجار بطريقة متجددة، بينما تزرع مزارع الطحالب نباتات منخفضة الجودة كثيفة الاستهلاك للماء للحصول على مواد مبكرة مفيدة مثل السليلوز والميثانول.\nلمحة عن كيف كان العالم يستغل النباتات في صنع أشياء غير غذائية قبل العصر الصناعي.\n\nيركّز هذا الجزء من المود على الطحالب ونمو الأشجار باستخدام المواد المهدورة والماء.
angels-nauvis-algae=استكشاف واستغلال الطحالب سريعة النمو للحصول على منتجات مفيدة.\n\n
angels-nauvis-notes-algae-green=[font=default-bold]ملاحظات[/font]: يُعرف الميثانول عامياً بـ«كحول الخشب» لأنه كان يُصنع تقليدياً بحرق الخشب وتقطير الأبخرة.\n\n
angels-nauvis-notes-algae-brown=[font=default-bold]ملاحظات[/font]: كان كربونات الصوديوم تُصنع تقليدياً بتجفيف وحرق الأعشاب البحرية قبل أن يجد الثوار الصناعيون طرقاً بديلة أكثر استدامة.\n              كان حمض الألجينيك يوجد عادةً في جدران خلايا النباتات، وتحتوي صموع النباتات على تراكيز عالية منه. وهو لزج جداً، لذا يمكن استعماله كرابط في صناعة الورق.\n\n
angels-nauvis-notes-algae-brown-lithia= - يمكن أيضاً معالجة الطحالب البنية إلى [item=angels-solid-lithium] كبديل لاستعمال [fluid=angels-thermal-water].\n
angels-nauvis-notes-algae=\n[font=default-bold]ملاحظات[/font]: تُستعمل معالجة الطحالب عادةً في بداية اللعبة لإنتاج مواد معقّدة إلى أن تتوفر طرق أخرى، لأن المعالجة الحيوية بطيئة ولا يسهل توسيعها لتلبية الطلب اللاحق.
angels-nauvis-trees=باستكشاف الكوكب تجد أنواعاً مختلفة من الأشجار عريضة الأوراق، إضافة إلى الأشجار المخروطية في اللعبة الأساسية.\nاستخرج البذور من هذه الأشجار وابدأ في تنمية أشجارك كمصدر متجدد لـ[item=wood]. تؤدي المعالجة الأكثر تقدّماً إلى نموّ أشجار أكثر تقدّماً، مما يتيح لك استخراج الراتنج والبلاستيك والمطاط من هذه الأشجار الخاصة.\n\nهذه الأشجار مُعلَّمة بـ[font=default-bold]مربع أزرق فاتح[/font] على الخريطة المصغّرة، وتوجد في بيئات مختلفة حسب مستويات الرطوبة.\n
angels-nauvis-notes-trees=[font=default-bold]ملاحظات[/font]: بما أن مواقع الأشجار الخاصة مرتبطة بالرطوبة وليس بـ«بيئات» محددة، فإن مودات مثل alien biomes لا تمنع ظهورها. ومع ذلك، معدّل ظهورها منخفض جداً.
angels-nauvis-arbor=يمكن تحويل الأشجار الخاصة إلى مولّدات بذور. وتنتج هذه البذور مقابل مواد سهلة المنال ([item=angels-solid-mud]، [item=angels-solid-soil]، [item=angels-solid-sand]) وبعض الرطوبة ([img=fluid/water] ماء، أو [img=fluid/angels-water-light-mud] ماء طيني خفيف، أو [img=fluid/angels-water-saline] ماء مالح).\nيمكن بعد ذلك زراعة هذه البذور في [img=item/angels-bio-arboretum-1] مشتل الأشجار لإنتاج [img=item/angels-solid-tree] أشجار للخشب، أو أشجار ونسغ حسب نوع الشجرة (انظر النصيحة السابقة).
angels-nauvis-arbor-compost=\n\n[font=default-bold]ملاحظات[/font]: للحصول على التربة أو السماد المطلوب للمشاتل (بعض الوصفات لا تتطلب أياً منهما)، ستحتاج إلى صنع السماد العضوي.\n  - [img=item/angels-solid-compost] يمكن إنتاج السماد العضوي بإرسال معظم مواد المعالجة الحيوية (الطحالب، الخشب، السليلوز، البذور، المحاصيل) إلى [img=item/angels-composter] صانع السماد.\nللحصول على القائمة الكاملة للمواد القابلة للتسميد، تحقق من فتحة المكوّنات في صانع السماد؛ فليست كل المواد بنسبة 1 إلى 1، لذا انتبه للمواد الأكثر كفاءة.\nستتيح لك التقنيات اللاحقة مضاعفة هذه الأشجار الخاصة، لكنك ستحتاج إلى العثور عليها في البرية في البداية.

angels-bioprocessing-vegetables=باستكشاف الكوكب تجد [img=item/angels-desert-garden][img=item/angels-swamp-garden][img=item/angels-temperate-garden] حدائق يمكنك فحصها وتكريرها إلى بذور. تسمح لك هذه البذور بأن تنمي النباتات بنفسك. عالج هذه النباتات للحصول على مغذيات ووقود وزيوت. يمكن أيضاً معالجة هذه الحدائق للحصول على [img=item/angels-token-bio] عينات حياة نباتية تُستعمل في بحث مباني الزراعة المتقدّمة مثل ترقيات المزرع ووصفات الخشب الأكثر كفاءة والعمليات الأكثر تقدّماً.\n\nهذه الحدائق مُعلَّمة بـ[font=default-bold]مربع أخضر فاتح[/font] على الخريطة المصغّرة، وتوجد في بيئات مختلفة حسب مستويات الرطوبة.\n
angels-vegetables-farming=بمجرد معالجة الحدائق في [img=item/angels-seed-extractor] مستخرج البذور للحصول على بذور المحاصيل، حان وقت زراعة النباتات والعناية بها لإنتاج منتجات مفيدة.\n\n
angels-vegetables-notes-gardens=\n\n[font=default-bold]ملاحظات[/font]: بما أن مواقع الحدائق مرتبطة بالرطوبة (كالأشجار) وليس بـ«بيئات» محددة، فإن مودات مثل alien biomes لا تمنع ظهورها. ومع ذلك، معدّل ظهورها منخفض جداً.
angels-vegetables-crops=نتائج معالجة المحاصيل في [img=item/angels-bio-processor] المعالج الحيوي تعطي نتيجة محددة (أو نتائج) حسب الوصفة، ويمكن أن تكون مزيجاً مما يلي:\n
angels-vegetables-notes-crops=\n\n[font=default-bold]ملاحظات[/font]:\nفقط [img=item/angels-solid-corn] الذرة و[img=item/angels-solid-fruit] الفواكه يمكن تحويلها إلى [img=fluid/angels-liquid-fermentation-raw] أساس التخمير لتحويلها إلى [img=fluid/angels-gas-ethanol] إيثانول أو [img=fluid/angels-liquid-acetic-acid] حمض أسيتيك.\nكل المنتجات غير المتقدّمة يمكن تحويلها إلى [img=fluid/angels-liquid-nutrient-pulp] اللبّ المغذي لتحويلها إلى [img=fluid/angels-gas-acetone] أسيتون شديد الفائدة، ومجموعة متنوعة من المنتجات البتروكيماوية من الزيوت إلى غاز التخليق.

angels-bioprocessing-animals=[font=default-bold]اصطد، استكشف، جرّب البيض[/font]:\n\nيركّز هذا الجزء من المود على الحياة البرية في نافيس، من تربية الأسماك وتكاثر المنتفخات وتربيتها إلى تكاثر المُهاجِمين للحصول على مواد متقدّمة تُستعمل في أشياء مثل وقود الصواريخ والوحدات والأسلحة المتقدّمة.\n
angels-animals-notes-fish=\n[font=default-bold]الأسماك[/font]: اصطد الأسماك (4 أنواع [img=item/raw-fish] [img=item/angels-alien-fish-1-raw] [img=item/angels-alien-fish-2-raw] [img=item/angels-alien-fish-3-raw]) وربّها كطريقة متجددة لاستعادة صحتك، أو كـ[img=item/angels-bio-raw-meat] غذاء للحيوانات لاحقاً. يمكن أيضاً معالجة الأسماك إلى زيوت و[img=item/angels-fish-pulp] لبّ يُستعمل في عمليات مشابهة لعمليات الزراعة. ويمكن معالجة [img=fluid/angels-liquid-polluted-fish-atmosphere] ماء الأسماك الملوث لاستخراج [img=item/angels-crystal-splinter-raw] الشظايا البلورية لمعالجة البلورات.
angels-animals-notes-puffers=\n\n[font=default-bold]المنتفخات[/font]: استكشف الكوكب لتجد [img=entity/angels-puffer-nest] أعشاش المنتفخات وتحصل على بيضها (لا توجد في البرية إلا [img=item/angels-bio-puffer-1] المنتفخات الغازية، [font=default-bold]مربع أصفر[/font] على الخريطة). ربّ منتخفاتك ذات الرائحة لتحصل على طرق مختلفة لمعالجة الغازات. فقس البيض في دورة التربية يعطي [img=item/angels-bio-puffer-egg-shell] قشور البيض التي يمكن طحنها وخلطها بماء الأسماك الملوث لإنتاج [img=item/angels-crystal-shard-raw] قطعة بلورية أعلى درجة.\n[font=default-bold]ملاحظات:[/font] احذر من احتمالات الطفرة لدى المنتفخات.
angels-animals-notes-biters=\n\n[font=default-bold]المُهاجِمون[/font]: أجرِ تجارب على منتخفاتك، قد تتمكن من تربية مُهاجِمين مُستأنسين. ادرسهم للحصول على بلورات قد تكون مفيدة لزيادة إنتاجية مصنعك أو تسريعه.\nتكاثر المُهاجِمين باستخدام الملكات يعطي جميع درجات البلورات الثلاث ([img=item/angels-crystal-splinter-raw] الشظايا، و[img=item/angels-crystal-shard-raw] القطع، و[img=item/angels-crystal-full-raw] الخام) حسب الحجم (صغير ومتوسط وكبير على التوالي).\n[font=default-bold]ملاحظات:[/font] المُهاجِمون يأكلون كمية كبيرة من [img=item/angels-bio-alien-processed-meat] اللحم المُعالَج فضائياً، لذا تأكد من توفّر الكثير من [img=item/angels-bio-butchery] المنتفخات والأسماك المذبوحة عندما تصل إلى هذه المرحلة.

[tips-and-tricks-sub]
angels-algae-green=هذه تعيش على [fluid=angels-water-mineralized] وتنتج [item=angels-cellulose-fiber] الذي يمكن تحويله إلى [fluid=angels-gas-methanol].
angels-algae-brown=هذه تعيش على [fluid=angels-water-saline] وتنتج [item=angels-solid-sodium-carbonate] إلى جانب [item=angels-solid-alginic-acid]. ويمكن دمج الأخير مع [item=angels-cellulose-fiber] لإنتاج [item=angels-solid-paper].
angels-algae-blue=هذه تعيش على [fluid=angels-water-yellow-waste] و[fluid=angels-gas-carbon-dioxide]. وتنتج مركّبات غنية بالنيتروجين مثل [fluid=angels-gas-ammonia].\n
angels-algae-red=هذه تعيش على [fluid=angels-thermal-water] و[fluid=angels-gas-ammonia]. وتنتج مركّبات غنية بالكالسيوم مثل [item=angels-solid-calcium-carbonate].\n
angels-trees-swamp=توجد الشجرة المستنقعية في المناطق «الرطبة» مع تفضيل لمحتوى رطوبة حوالي __1__ (عادةً المناطق العشبية الداكنة أو الزرقاء).\nتُستعمل الأشجار المستنقعية لإنتاج الخشب أو كمادة خام مبكرة لإنتاج [img=item/angels-bio-plastic] البلاستيك.\n\n
angels-trees-temperate=توجد الشجرة المعتدلة في المناطق «المعتدلة» مع تفضيل لمحتوى رطوبة حوالي __1__ (عادةً المناطق العشبية الفاتحة).\nتُستعمل الأشجار المعتدلة لإنتاج الخشب أو كمادة خام مبكرة لإنتاج [img=item/angels-bio-resin] الراتنج.\n
angels-trees-desert=توجد الشجرة الصحراوية في المناطق «الجافة» مع تفضيل لمحتوى رطوبة حوالي __1__ (عادةً المناطق الرملية أو الرملية الحمراء).\nتُستعمل الأشجار الصحراوية لإنتاج الخشب أو كمادة خام مبكرة لإنتاج [img=item/angels-bio-rubber] المطاط.\n
angels-farm-seeds-to-crops=\nضع هذه المحاصيل في [img=item/angels-crop-farm] مزرعة أساسية أو في المزرعة المطوّرة المناسبة للمحصول ([img=item/angels-swamp-farm] مستنقعية، [img=item/angels-temperate-farm] معتدلة، [img=item/angels-desert-farm] صحراوية) لتنميتها.\nيمكن معالجة المحاصيل في [img=item/angels-bio-processor] المعالج الحيوي، وتُعاد البذور إلى [img=item/angels-seed-extractor] مستخرج البذور لتجديدها.\n\n 
angels-crops-special-products=\nبما في ذلك أيّ من المحاصيل الأكثر تقدّماً التالية ([img=item/angels-swamp-5]، [img=item/angels-temperate-5]، [img=item/angels-desert-5]):
angels-fish-artifacts= عالج ماءها لاستخراج [img=fluid/angels-alien-spores] الأبواغ الفضائية التي يمكن معالجتها أكثر للحصول على [img=item/angels-alien-artifact] آثار فضائية.
angels-fish-artifacts-bob= عالج ماءها لاستخراج [img=fluid/angels-alien-spores] الأبواغ الفضائية التي يمكن معالجتها أكثر للحصول على [img=item/bob-alien-artifact] آثار فضائية.
