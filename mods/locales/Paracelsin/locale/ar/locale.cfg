[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin] أرض قاحلة متجمّدة مثل [planet=aquilo]، لكنها على خلاف عالم الأمونيا تملك سطحاً صلباً. تحت الأرض يحتوي الكوكب محيطاً كبيراً من [fluid=nitrogen]، يتدفق على السطح إلى [tile=nitrogen-lake]s. الكوكب غني بـ[item=sphalerite] و[item=tetrahedrite]، مركّبات [item=zinc]، وبـ[entity=calcium-crystals]. يمكن أيضاً العثور على [entity=cryovolcanic-vent]s منتشرة على السطح.
fulgoran-log=داخل [entity=crashed-fulgoran-pod]، إلى جانب المخططات، وجدت رسالة. أمكنك ترجمتها بفضل الأبحاث على Fulgora: «تحية لكل أشكال الحياة التي قد تجد هذا. نحن Fulgorans، أرسلنا هذه الكبسولات إلى هذه الأرض المتجمّدة للبحث عن النفط. أدى سعينا للنمو إلى عواقب بسيطة لبيئة كوكبنا، لا نبالي، لكنه استنفد أيضاً معظم مخزوننا المحبوب من النفط وجمعنا احتياطياً من منتجات معالجته الثانوية. إذا كنتم تعرفون مكاناً فيه نفط، يرجى الاتصال بأقرب نقطة لنا. إذا كان كوكبكم غير قادر حالياً على السفر الفضائي، أرسلوا هذه الرسالة لمن يستطيع. وإذا كنا قد متنا بحلول ذلك الوقت... حسناً، أشك أن نفشل.» كنت أنت وFulgorans لتصبحا صديقين رائعين.

