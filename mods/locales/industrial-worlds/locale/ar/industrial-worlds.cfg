[space-location-description]
iw-pyanodons=عالم صناعي مخصص لمجموعة ألعاب Pyanodons 3.1 المدعومة بالكامل. يعزل محوّل 0.0.12 جيولوجيا pY وملكية الإنتاج والماكينات والعلوم الخاصة بالعالم، مع استعادة التقدم القياسي لعصر الفضاء على العوالم القياسية.
iw-nullia=عالم بداية صناعي تجريبي من Nullius بنظامه الأصلي للبحث والإنتاج والروبوتات البشرية. تضيف Industrial Worlds مسار إطلاق مداري منفصلًا مشروطًا بالبحث في عصر الفضاء. لا تزال رحلة نوليا إلى ناوفيس الكاملة دون مساعدة قيد الاختبار داخل اللعبة.
iw-angelus=عالم صناعي من فئة ناوفيس يستضيف النظام البيئي الكامل المدعوم من Angel/Bob: خامات مركّبة ولا نهائية، ومعالجة بتروكيميائية وحيوية، ومعادن وإلكترونيات وطاقة، والفرع الصناعي الأوسع من Bob.

