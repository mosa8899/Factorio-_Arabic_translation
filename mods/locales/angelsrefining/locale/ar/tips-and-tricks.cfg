[tips-and-tricks-description]
angelsrefining=مود يُدخل الخامات المركّبة التي يجب تكريرها قبل أن تتمكن من صهرها وصبّها في سبائك.
angels-ore-generation=المود [tooltip=Angels refining,tips-and-tricks-description.angelsrefining] يستبدل كل تجمّعات الخام بتجمّعات جديدة يجب تكريرها قبل الصهر. جميع الخامات القابلة للصهر (من اللعبة الأساسية أو Bob أو YI) ستُستبدل بخامات مركّبة جديدة: \n\n__1__\n كما يوجد بئر جديد: __2__
angels-ore-refining=يجب تكرير الخامات المركّبة المستخرجة قبل أن تتمكن من صهرها وصبّها في سبائك. طرق التكرير الأكثر تقدّماً تعطي محصولاً أعلى من الخام المُعالَج وقد تفتح خامات مكرّرة جديدة.\n\nهناك 3 أوضاع حالياً:\n    - فانيلا: تكرير لزيادة محصول خام الحديد والنحاس.\n    - Angel الخالص: تكرير للحصول على مواد متنوعة.\n    - Bob's-Angel's (يُعرف بـ BA أو AB): تكرير للكثير من خامات المودات.\n\nيعمل بشكل جيد مع مودات Bob ويدعم مودات أخرى مثل Yuoki Industries (والمودات المفقودة للأسف: Uranium Power وNuclear.)\nكما يُدخل هذا المود معالجة متقدّمة للخامات مثل سحق الخام والتعويم والغسل الحمضي والتبلور لتحسين المحصول والكفاءة. علاوة على ذلك، يأتي المود بأنظمة تنظيف مياه الصرف للاستعمال في هذه السلاسل وغيرها.\nسلاسل معالجة الماء والتكرير المضافة في هذا المود مستكشفة عبر شجرة التقنيات بأكملها.
angels-crushing=كأول خطوة بعد التعدين، يجب سحق الخام إلى شيء يمكن التعامل معه. السحق يأخذ الخام المستخرج ويفصل الصخور الصلبة عن المواد المفيدة.\n\nالوصفة العامة تحوّل [img=item/angels-ore4] الخام المركّب إلى [img=item/angels-ore4-crushed] خام مسحوق، إضافة إلى [item=angels-stone-crushed].\nيمكن معالجة [item=angels-stone-crushed] إلى مواد أخرى في منتصف اللعبة، لكن في البداية يمكن تحويله إلى [item=stone] و[item=stone-brick] و[item=stone-wall]. ويمكن صهر [img=item/angels-ore4-crushed] الخام المسحوق مباشرة في بعض الحالات، أو معالجته أكثر ثم فرزه أخيراً.
angels-crushing-notes=\n\n[font=default-bold]ملاحظات[/font]: أمثلة واقعية لسحق الخام موجودة في الكسّارات الكروية والفكية والهوائية والصدماوية. يُستعمل لتكسير الخام إلى قطع أصغر، مما يزيد مساحة السطح للمعالجة الكيميائية، خصوصاً في الخطوة التالية: التعويم.
angels-floatation=التعويم خطوة تكرير ثانوية تغسل الخام المسحوق أكثر لإزالة مزيد من الشوائب. هذه أول خطوات التكرير الكيميائي، وتستعمل الماء المُنقّى. يُنصح بوجود نظام تنقية ماء قريب، ونظام تنقية لماء الصرف الناتج مثل الجيودات. وهي مواد بلورية توجد عادةً في التربة والصخور.\n\nالوصفة العامة تحوّل الخام المسحوق مع قليل من [fluid=angels-water-purified] إلى قطع خام، مع احتمال وجود جيودة وبعض ماء الصرف.\nيمكن معالجة الجيودات إلى أشياء مختلفة حسب المودات المُثبّتة.\nيمكن فرز القطع أو تنقيتها أكثر في الخطوة التالية: الغسل الحمضي.
angels-floatation-notes=\n\n[font=default-bold]ملاحظات[/font]: أمثلة واقعية لتعويم الخام كثيرة، تُجرى غالباً بمادة شبيهة بالصابون ومزيج مائي حمضي أو قلوي. هذا يفصل المواد في المحلول حسب خصائص فيزيائية وكيميائية مختلفة. إن أردت مزيداً من القراءة، ابحث عن froth flotation (لاحظ عدم وجود حرف a في flot)، وهو المصطلح الأعم للعملية.
angels-leaching=الخطوة الثالثة في التكرير هي الغسل الحمضي. هذه العملية تُذيب قطعة الخطوة السابقة في حمض قوي، وتترك قليلاً من الخبث (يُفترض أنه لا يمثل مشكلة في هذه المرحلة). يُتبلور مزيج الخام والحمض هذا إلى بلورات عالية النقاء متجانسة نسبياً. هذه العملية تستفيد أيضاً من الخصائص الكيميائية للخام.\n\nالوصفة العامة تحوّل قطع الخام مع 10 أحماض إلى بلورتَي خام.\nيمكن الحصول على كثير من الحمض المطلوب في هذه الخطوة من الخطوة السابقة (التعويم)، لكن قد يُطلب بعض الحمض الإضافي. هذه أول مرحلة لا تُنتج فضلات.
angels-leaching-notes=\n\n[font=default-bold]ملاحظات[/font]: أمثلة واقعية للغسل الحمضي تشير عادةً إلى كومة الفضلات. يُرمى الحجر المسحوق وغيره من الفضلات الصلبة من نظام تنقية الخام في حفرة كبيرة بقاعدة إسمنتية محكمة (كبركة سباحة كبيرة)، ثم تُرشّ بالأحماض التي تتسرّب عبر الكومة، فتُذيب أي أجزاء مفيدة من التراب كانت قد فُوّتت سابقاً. السائل (المحلول الحمضي) الذي يُجمع في القاعدة غني بالمعادن التي تُبلّور عادةً لتعود إلى نظام الصهر.
angels-purification=الخطوة الأخيرة في معالجة الخام هي الذروة في تنقيته، حيث تُزال آخر الشوائب لتكشف أنظف خام حتى الآن. مزيج من الحرارة المتجددة والمعالجة الكيميائية والتحليل الكهربائي يعني أنه لا حاجة لأي مواد صلبة أو سائلة إضافية، ولا تُهدر أي منها في هذه العملية.\n\nالوصفة العامة تحوّل بلورات الخام إلى خام مُنقّى.\nنادراً ما تُستعمل خطوة «تلميع» الخام هذه، إلا للمواد الأكثر غرابة وندرة التي تبرر جودتها العالية قبل الصهر.
angels-ore-sorting=منشأة فرز الخام فاصل جاذبية عملاق متقدّم وطرد مركزي وفاصل شبكي، يصفّي الخام المكرّر إلى أجزائه (أو معادنه) المنفصلة لصهرها إلى معادن عالية الجودة.
angels-ore-sorting-vanilla=\n\nتحوّل منشأة الفرز الخامات المركّبة الأربع بدرجات تكرير مختلفة إلى خام قابل للصهر، وقطع صغيرة، وحبيبات، بنسب مزيج مختلفة. يمكن تحويل القطع الصغيرة والحبيبات إلى مزيد من خام المعادن. الخام المُنقّى الأعلى درجة ينتج كمية أكبر من الخام القابل للصهر. الخام المُنقّى يولّد أيضاً خبث معدني.
angels-ore-sorting-overhaul=\n\nتحوّل منشأة الفرز الخامات الرئيسية الستة بدرجات تكرير مختلفة إلى أنواع شتى من خامات المعادن:\n4×[img=item/angels-ore4-crushed] خام مسحوق تصبح 2 خام أولي، و1 خام ثانوي، و1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] قطع خام تصبح 2 خام أولي، و1 خام ثانوي، و2 خام ثالثي، و1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] بلورات خام تصبح 3 خام أولي، و1 خام ثانوي، و3 خام ثالثي، و1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] خام مُنقّى يصبح 3 خام أولي، و2 خام ثانوي، و4 خام ثالثي.\n\nيمكنك رؤية ما يعطيه كل خام بتمرير المؤشر فوق الخام على الأرض.\nالخامات الأولية والثانوية مذكورة أدناه:\n- [item=angels-ore1] و[item=angels-ore2]: الأولي [item=iron-ore]، والثانوي [item=copper-ore]\n- [item=angels-ore3] و[item=angels-ore4]: الأولي [item=copper-ore]، والثانوي [item=iron-ore]\n- [item=angels-ore6]: الأولي [item=angels-tin-ore]، والثانوي [item=angels-quartz]\n- [item=angels-ore5]: الأولي [item=angels-lead-ore]، والثانوي [item=angels-nickel-ore]
angels-ore-sorting-bobs=\n\nتحوّل منشأة الفرز الخامات الرئيسية الستة بدرجات تكرير مختلفة إلى أنواع شتى من خامات المعادن:\n4×[img=item/angels-ore4-crushed] خام مسحوق تصبح 2 خام أولي، و1 خام ثانوي، و1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] قطع خام تصبح 2 خام أولي، و1 خام ثانوي، و2 خام ثالثي، و1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] بلورات خام تصبح 3 خام أولي، و1 خام ثانوي، و3 خام ثالثي، و1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] خام مُنقّى يصبح 3 خام أولي، و2 خام ثانوي، و4 خام ثالثي.\n\nيمكنك رؤية ما يعطيه كل خام بتمرير المؤشر فوق الخام على الأرض.\nالخامات الأولية والثانوية مذكورة أدناه:\n- [item=angels-ore1] و[item=angels-ore2]: الأولي [item=iron-ore]، والثانوي [item=copper-ore]\n- [item=angels-ore3] و[item=angels-ore4]: الأولي [item=copper-ore]، والثانوي [item=iron-ore]\n- [item=angels-ore6]: الأولي [item=angels-tin-ore]، والثانوي [item=angels-quartz]\n- [item=angels-ore5]: الأولي [item=angels-lead-ore]، والثانوي [item=angels-nickel-ore]
angels-watertype=أمثلة على سوائل الماء:\n[fluid=angels-water-saline] ماء مالح\n[fluid=angels-water-purified] ماء مُنقّى\n[fluid=angels-water-mineralized] ماء معدني
angels-wastewaters=أمثلة على ماء الصرف:\n[fluid=angels-water-yellow-waste] ماء صرف كبريتي\n[fluid=angels-water-greenyellow-waste] ماء صرف فلوري\n[fluid=angels-water-green-waste] ماء صرف كلوري\n[fluid=angels-water-red-waste] ماء صرف نيتري
angels-water-processing=عالج ماء البحر ومياه الصرف إلى ماء مُنقّى، واستردد المواد الصلبة المفيدة في [entity=angels-hydro-plant].
angels-water-processing-vanilla=\nحوّل الماء إلى [fluid=angels-water-saline] مفيد للأملاح و[fluid=angels-water-purified] لدعم معالجة الخام مثل التعويم. \nاستردد [item=sulfur] من [fluid=angels-water-yellow-waste] لإعادته إلى العملية.
angels-water-processing-overhaul=\nحوّل الماء إلى [fluid=angels-water-saline] مفيد للأملاح و[fluid=angels-water-purified] لدعم معالجة الخام مثل التعويم.\n\n
angels-water-processing-voiding=\nيمكنك إزالة فائض [tooltip=water type fluids,tips-and-tricks-description.angels-watertype] و[tooltip=wastewaters,tips-and-tricks-description.angels-wastewaters] من اللعبة باستخدام [entity=angels-clarifier].\n\n[font=default-bold]ملاحظات[/font]: للحصول على القائمة الكاملة للسوائل القابلة للتصفية، تحقق من فتحة إدخال السائل في المُصفّى.\n

