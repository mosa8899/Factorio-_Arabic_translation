combinator-fluid-quantity-mode=كمية سائل المُركّب
combinator-fluid-quantity-mode-desc=كيفية حساب قيمة الإشارة لسائل عند إنشاء مُركّب ثابت من قائمة الإدخال. «تكديسات»: القيمة مضروبة في حجم تكديس العنصر. «كمية»: القيمة مضروبة في كمية إدخال الكتلة.

combinator-default-fluid-value=قيمة سائل المُركّب
combinator-default-fluid-value-desc=المعامل المطبق على كل سائل. في وضع «التكديسات» هو عدد التكديسات، وفي وضع «الكمية» يضرب كمية الإدخال. استخدم قيمة سالبة لطلب السوائل (مثلاً لطلب لوجستي أو طلب قطار).

