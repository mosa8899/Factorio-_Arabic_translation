bobmods-warfare-spidertron-overhaul=يغيّر طريقة بناء الـSpidertron على مراحل.
bobmods-warfare-spidertron-needsfuel=خيارات لتحديد أي من الروبوتات العناكب (Spidertron) تحتاج إلى وقود.\nستظهر المفاعلات في وصفات جميع الروبوتات العناكب التي لا تحتاج وقوداً.
bobmods-warfare-vehicleflamethrowerstartsfires=عند التفعيل، يُعدَّل مقذوف لهب المركبة ليصبح أشبه ببرج اللهب.


