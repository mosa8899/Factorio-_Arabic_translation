[technology-description]
bob-electric-pole=بحث عن أعمدة كهربائية أفضل
bob-electric-substation=بحث عن محطات تحويل أفضل
bob-boiler=بحث في صناعة الغلايات وتحسينها.
bob-steam-engine=بحث في صناعة وتحسين مولدات المحركات البخارية.
bob-oil-boiler=بحث في صناعة وتحسين الغلايات بحرق السوائل.
bob-heat-exchanger=بحث في صناعة وتحسين المبادلات الحرارية.
bob-steam-turbine=بحث في تحسين مولدات المحركات البخارية باستعمال التوربينات. ستُستعمل طاقة التوربينات بأولوية أعلى.
bob-heat-pipe=بحث في الأنابيب الحرارية، وهي طريقة لتوصيل الحرارة واستعمالها كمصدر طاقة.
bob-burner-reactor=بحث في الطاقة الحرارية. مصدر الحرارة الاحتراقي يحرق عناصر الوقود لتوليد الحرارة. صله بالكيانات التي تعمل بالحرارة مثل المبادلات الحرارية عبر أنابيب حرارية.
bob-fluid-reactor=بحث في الطاقة الحرارية. مصدر الحرارة بحرق السوائل يحرق وقوداً سائلاً لتوليد الحرارة. صله بالكيانات التي تعمل بالحرارة مثل المبادلات الحرارية عبر أنابيب حرارية.

