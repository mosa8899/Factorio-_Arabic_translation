[mod-setting-description]
bobmods-inserters-long1=إذا كان مُفعّلاً، سيوجد بحث «الإدراجات الطويلة 1». يسمح بتغيير طول الإدراج.\nيُفعَّل قسرياً إذا كان إعداد «إصلاح الإدراجات» في مود Bob's Logistics مُفعّلاً.
bobmods-inserters-long2=إذا كان مُفعّلاً، سيوجد بحث «الإدراجات الطويلة 2». يسمح بضبط مدى طويل جداً للإدراج.\nلا تأثير له إذا كان إعداد «بحث الإدراجات الطويلة 1» معطّلاً.
bobmods-inserters-more2=إذا كان مُفعّلاً، سيوجد بحث «المزيد من الإدراجات 2». يسمح بكل أوضاع مواضع البلاطات الممكنة ضمن المدى.
bobmods-inserters-show-window=إذا كان مُفعّلاً، ستحتوي نافذة الإعداد المستقلة على نافذة عرض تُظهر الإدراج الجاري إعداده.
bobmods-inserters-gui-position=يحدد أين ترسو نافذة إعداد الإدراج إلى نافذة الإدراج عند فتح واجهتها.\nإذا كان «معطّل» وزر الإعداد معطّلاً، لن يمكن الوصول لنافذة الإعداد إلا عبر [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].
bobmods-inserters-button-enable=يضع زراً في الزاوية العليا اليسرى من الشاشة للوصول إلى إعداد الإدراج.\nإذا كان معطّلاً وموقع الرسو «معطّل»، لن يمكن الوصول لنافذة الإعداد إلا عبر [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].

