[technology-description]
planet-discovery-paracelsin=أرض قاحلة متجمّدة شديدة النشاط البركاني الجليدي. بحيرات من [fluid=nitrogen] تغطي السطح، تتدفق من محيط جوفٍ. تنتشر [entity=cryovolcanic-vent]s على السطح إلى جانب عروق [item=tetrahedrite] و[item=sphalerite]، الضرورية لاستخراج [item=zinc]. يوجد [item=vaterite] و[item=fluorite] بعروق متفرقة. كل ما يُبنى على الكوكب يجب إبقاؤه دافئاً باستمرار وإلا تجمد، ويجب التخلص من كل المنتجات الثانوية غير المرغوبة لاستخراج الزنك.
pressure-power=داخل [entity=crashed-fulgoran-pod] المتجمّد كانت هناك مخططات قديمة لمولّد كهربائي خاص يستعمل ضغط فتحات الغاز لتوليد الكهرباء. يمكن استعماله لإقلاع Paracelsin.
nitric-acid-handling=بتحليل التفاعلات الكيميائية التلقائية التي تحدث على [entity=big-metallic-rock]، يمكننا تقليدها لإنتاج [fluid=nitric-acid].
sphalerite-processing=معالجة [item=sphalerite] إلى [fluid=zinc-concentrate] و[item=iron-ore] و[item=sulfur].
tetrahedrite-processing=معالجة [item=tetrahedrite] إلى [fluid=zinc-concentrate] و[item=copper-ore] و[item=sulfur].
zinc-extraction=معالجة [fluid=dirty-zinc-solution] إلى [item=zinc] عبر عمليات مختلفة.
electrochemical-plant=منشأة تصنيع تستعمل الكهروكيمياء لتنفيذ كل أنواع العمليات الكيميائية.
mechanical-plant=منشأة تصنيع تستعمل عمليات ميكانيكية متقدّمة لبناء عناصر متنوعة.
galvanization-science-pack=يسمح بالدراسة ما بعد تطبيقات الجلفنة الأساسية.
zinc-piping=أنابيب أقوى ومعزولة مصنوعة من [item=zinc-plate]s. لا تتجمد على الأسطح الباردة مثل [planet=paracelsin] أو [planet=aquilo]، ويمكنها نقل السوائل تحت الأرض لمسافات أطول.
axe-mining-speed=بجلفنة الفأس وإصلاحه يمكن الوصول لسرعات تعدين يدوي أسرع.
advanced-repair-device=تقنية روبوتات نانوية يمكنها الإصلاح أسرع وأطول مقارنة بـ[item=repair-pack] العادي.
solar-matrix=حتى إذا كانت الطاقة الشمسية غير قابلة للاستعمال على [planet=paracelsin]، يمكن ابتكار تطبيقات شمسية جديدة بتقنيات Paracelsin.
accumulator-v2=مكثّفات أقوى تستعمل طاقة [item=supercapacitor]s و[item=electric-coil]s لتخزين مزيد من الطاقة.
elevated-pipe=هياكل دعم قوية تسمح بوضع الأنابيب عالياً فوق الأرض.
galvanized-steel=تطبيق [item=zinc] على صفائح [item=steel-plate]s يجعلها أقوى ومقاومة للتآكل.
macerating=تصميم كسّارة معدّل قادر على تمزيق أي عنصر إلى غبار.
zinc-refining=وصفة متقدّمة لرفع جودة الزنك.
advanced-cryovolcanic-mixture-separation=باستعمال [fluid=fluorine] يمكننا الحصول على كمية وتنوع مختلف من المركّبات من [fluid=cryovolcanic-mixture].

