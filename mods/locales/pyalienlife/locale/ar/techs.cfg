alpha= alpha الدينغريت هو  oldest, wisest, و strongest leader لـ  الحزمة. في لترتيب إلى يصبح  alpha, تلك الدينغريت يجب survive countless fights فوق كثير سنوات. Survival هو لا guaranteed.
c-mutation=Let's يزيل  قليل layers لـ الإشعاع protection. نحن يمكن حتى يغذّي  الدينغريت fewer pharmaceuticals قبل  journey.  الفضاء الدينغريت سي experience rapid الخلية الطفرة و degradation أثناء خارج  protection لـ  مغناطيسي الحقل. هناك هو  chance التي  عينة سي يصبح fully unrecoverable, مع ذلك هذه متطرف طفورات سي grant  overall greater probability إلى obtain  نادر و مفيد snarer hearts.
