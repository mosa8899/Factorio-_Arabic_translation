[mod-name]
reskins-bobs=Artisanal Reskins: مودات Bob

[mod-description]
reskins-bobs=يعيد تصميم العناصر والكيانات والتقنيات في مودات Bob لإضافة ألوان المستويات وتسميات الأيقونات. يتميز بأيقونات عالية الدقة ورسوم محدّثة تتماشى مع Factorio الأساسية، ويدعم تخصيص اللاعبين للتسميات والألوان والخرائط. جزء من سلسلة Artisanal Reskins.

[mod-setting-name]
reskins-bobs-do-bobelectronics-colored-circuits=إلكترونيات Bob: دوائر ملوّنة
reskins-bobs-do-bobrevamp-reactor-color=لون المفاعل حسب الوقود
reskins-bobs-flip-bulk-inserter-icons=قلب أيقونات الإدراج الكمّي
reskins-bobs-do-furnace-tier-labeling=تسميات مستويات الأفران
reskins-bobs-do-inserter-tier-labeling=تسميات مستويات الإدراجات
reskins-bobs-hydrazine-is-blue=الهيدرازين أزرق!
reskins-bobs-show-alien-decoratives-on-lab=المختبر الفضائي فضائي!
reskins-bobs-do-progression-based-robots=الروبوتات تتبع التقدّم
reskins-bobs-fusion-robot-color=اللون: روبوتات الاندماج
reskins-bobs-do-custom-furnace-variants=تفعيل تخصيص ألوان أنواع الأفران
reskins-bobs-standard-furnace-color=اللون: الأفران القياسية
reskins-bobs-mixing-furnace-color=اللون: أفران الخلط
reskins-bobs-chemical-furnace-color=اللون: الأفران الكيميائية

[mod-setting-description]
reskins-bobs-do-bobelectronics-colored-circuits=يعيد تصميم الدوائر المضافة بواسطة إلكترونيات Bob لتُلون حسب خريطة المستويات الحالية.
reskins-bobs-do-bobrevamp-reactor-color=يعيد تصميم المفاعلات النووية لتُلون حسب أنواع وقود اليورانيوم والثوريوم والديوتيريوم بدلاً من المستوى.
reskins-bobs-flip-bulk-inserter-icons=عند تفعيل «إصلاح الإدراجات» لدى Bob، يقلب أيقونات الإدراج الكمّي أفقياً لزيادة التباين مع الإدراجات العادية.
reskins-bobs-do-furnace-tier-labeling=عند تفعيل تسميات المستويات، يعرض أيضاً تسميات المستويات على عناصر الأفران الحجرية والفولاذية والكهربائية المضافة بواسطة Bob's Assembly.
reskins-bobs-do-inserter-tier-labeling=عند تفعيل تسميات المستويات، يعرض أيضاً تسميات المستويات على عناصر الإدراج المضافة بواسطة Bob's Logistics.
reskins-bobs-hydrazine-is-blue=يُلون مولّد الهيدرازين بـ[color=#7ac1de][font=default-bold]أزرق فاتح[/font][/color] نسبةً للوقود. وإلا يُلوَّن كالمستوى الرابع لمولّدات السوائل.
reskins-bobs-show-alien-decoratives-on-lab=يعرض جذوراً وملمساً فضائياً على المختبر الفضائي.
reskins-bobs-do-progression-based-robots=مستويات روبوتات اللوجستيات والبناء، عند استعمال نمط عرض المستويات [font=default-semibold]Progression[/font]، تتماشى مع مكوّنات الروبوتات المضافة بواسطة Bob's Logistics. روبوتات الاندماج تأخذ اللون المضبوط في الإعداد [font=default-semibold]Color: Fusion robots[/font]مع نفس مستوى الروبوتات غير الاندماجية 4.
reskins-bobs-fusion-robot-color=يضبط لون الروبوتات المُشغَّلة بالاندماج.
reskins-bobs-do-custom-furnace-variants=يفعّل تخصيص لون الأنواع المختلفة من الأفران كما تختارها أدوات اختيار الألوان أدناه.
reskins-bobs-standard-furnace-color=يضبط لون الفرن الحجري وأفران الفولاذ وحرق السوائل والأفران الكهربائية.
reskins-bobs-mixing-furnace-color=يضبط لون فرن خلط المعادن الحجري وأفران خلط الفولاذ وحرق السوائل وفرن الخلط الكهربائي.
reskins-bobs-chemical-furnace-color=يضبط لون الفرن الكيميائي الحجري وأفران الفولاذ وحرق السوائل والفرن الكيميائي الكهربائي.

