spitter-spit-blockable=إمكانية اعتراض قذائف البصّاق
worm-spit-blockable=إمكانية اعتراض قذائف الديدان
rockets-blockable=إمكانية اعتراض الصواريخ
pools-affect-structures=تأثير البرك على المنشآت
pools-affect-flying=تأثير البرك على الطائرات
shotguns-hit-friendly=إصابة البنادق الخرطوشية للأهداف الودية
unit-speed=سرعة الوحدة %
unit-health=صحة الوحدة %
unit-range=مدى الوحدة %
worm-health=صحة الدودة %
worm-range=مدى الدودة %
spawner-health=صحة العشّ %

[mod-setting-description]
spitter-spit-blockable=يمكن للجدران اعتراض قذائف البصّاق. تجعل قذائف البصّاق قابلة للاعتراض. عند التعطيل تصبح قذيفة البصّاق تيارًا يتجاوز الجدران بقوس.
worm-spit-blockable=يمكن للجدران اعتراض قذائف الديدان. تجعل قذائف الدودة قابلة للاعتراض. عند التعطيل تصبح قذيفة الدودة تيارًا يتجاوز الجدران بقوس.
rockets-blockable=يمكن للصواريخ الاصطدام بالأشجار وجدران العدو. مناسب لعب الـ PvP.
pools-affect-structures=تؤثّر البرك، مثل البرك الحمضية للديدان، على المنشآت.
pools-affect-flying=تؤثّر البرك، مثل البرك الحمضية للديدان، على الوحدات الطائرة (أبخرة كاوية).
shotguns-hit-friendly=عند التمكين، يمكن لطلقات البنادق الخرطوشية إصابة المنشآت الودية، مثل الصناديق الخشبية.
unit-speed=سرعة العضّاض والبصّاق، و100 تعني بدون تغيير.
unit-health=صحة العضّاض والبصّاق، و100 تعني بدون تغيير.
unit-range=مدى البصّاق، و100 تعني بدون تغيير.
worm-health=صحة الدودة، و100 تعني بدون تغيير.
worm-range=مدى الدودة، و100 تعني بدون تغيير.
spawner-health=صحة عشّ العضّاض وعشّ البصّاق، و100 تعني بدون تغيير.
