[recipe-description]
petroleum-gas2=يغذّي  knallgas البكتيريا colony مباشرة بـ منقّى compressed الهيدروجين إلى cause bacterial blooms.  البكتيريا سي ينتج البترول غاز كـ  byproduct.
split-yellowcake=يحتاج أكثر frosting.
neutron-absorbston=Suck أعلى كل تلك إضافي neutrons.
mirror-mk01-poor=Attempt إلى cast  المرآة بدون  البوتقة. عالٍ chance لـ failure.
purest-nitrogen-gas=يفكّك environmental compounds according إلى صغير differences في لها غليان points. فقط  fraction لـ نقي النيتروجين يمكن يكون recovered.
biocarnation-harvesting=يوجّه your lumber bots إلى حصاد  biocarnations.
biocrud-reprocessing=إعادة معالجة  بيوكرود إلى مفيد حيوي المواد.
rich-biocrud-reprocessing=إعادة معالجة  غني بيوكرود إلى مفيد حيوي المواد.
floraspollinin-reprocessing=يقتل و prune selective areas لـ  فلوراسبوولينين growths إلى revert  النباتات إلى  earlier المرحلة في  حصاد cycle.
biocrud-pyrolysis=Pyrolyze  بيوكرود إلى مفيد hydrocarbon chains.
lrf-steam-1=Perform يسخّن ينقل بين heated الملح و الماء إلى ينتج عالٍ-مُضغوط البخار.
lrf-steam-2=Perform يسخّن ينقل بين heated الملح و الماء إلى ينتج عالٍ-مُضغوط البخار.