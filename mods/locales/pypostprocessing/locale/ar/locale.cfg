[mod-setting-description]
pypp-big-inventory-gui=يكبّر حجم واجهة المخزون لتتسع أيقونات وصفات أكثر. يعمل جيداً مع وضع الواجهة «المسطّح».
pypp-compactified-recipe-tooltips=يقلل مساحة تلميحات الوصفات بإزالة المعلومات المكررة في قسم «صُنعت في». إذا كانت الوصفة تُصنع في عدة مستويات من نفس الآلة، يُعرض المستوى الأول فقط.
pypp-extended-recipe-signals=يضيف إشارات الوصفات إلى المُرحّلات للسماح بتبديل الوصفات ديناميكياً، ويضيف نصاً يدل على ناتج الوصفة الرئيسي إلى أسماء كثير من الوصفات. يسبب إشارات مكررة غير ضرورية.
pypp-no-globals=يطبع تحذيراً عند الكتابة إلى متغير عام غير موثّق أو الوصول إلى متغير غير معرّف. في المستقبل سيكون هذا مُفعّلاً افتراضياً ويُوقف اللعبة.
pypp-click-lock-duration=مدة القفل بالثواني.\nزد القيمة إذا رأيت نقرات غير مقصودة بعد فتح قائمة مباشرة.

[command-help]
check-technology-consistency=يتحقق من التقنيات مقابل نماذجها الأولية لضمان عدم إخفائها أو تعطيلها بشكل غير صحيح.\nيجب استعماله فقط عند مواجهة انسدادات من تقنيات تبدو يتيمة.

[command-output]
fixed-technology=تم إصلاح تقنية غير مطابقة: __1__
consistency-check-complete=انتهى التحقق من التقنيات، أتمنى لك يوماً سعيداً.
update-note=[color=yellow]__1__ ملاحظة تحديث:[/color] __2__

