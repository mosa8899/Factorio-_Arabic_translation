[mod-setting-description]
aai-containers-resize-1x1=يحافظ على تباعد ثابت بين الحاويات التي يمكنك السير من خلالها.
aai-containers-scale-icons=تُكبَّر أيقونة الوضع البديل الظاهرة فوق الحاوية بحسب مساحتها في اللعبة.
aai-containers-progression=أحجام سعة التخزين للصندوق الخشبي، والحديدي، والفولاذي، والمدرّع، والمخزن، والمستودع. CD = كثافة ثابتة لكل مربع للفولاذ فما فوق. تحذير: الحاويات ذات السعة العالية تُبطئ معالجة اللعبة (UPS)، ويُنصح بعدم تجاوز سعة قصوى 540.
aai-containers-number-icons=افتريّاً تظهر سعة الحاوية كرقم في الزاوية العليا اليسرى من الأيقونة.

