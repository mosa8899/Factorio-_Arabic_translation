[entity-description]
agricultural-tower=يزرع البذور ويحصد النباتات الناضجة. ينتج 50% من الأبواغ إضافية إذا زُرعت المحاصيل داخل المبنى.
borehole-pump=يستخرج السوائل من المياه الجوفية المدفونة. يختلف نوع السائل حسب الكوكب. يجب وضعه داخل مبنى مصنع.
factory-pump=مضخة مثبتة على الجدار تُستعمل لنقل السوائل بين مباني المصنع.
factory-1=يمنحك طابق مصنع إضافي لاستغلال مساحة الأرض بكفاءة أكبر.\n__CONTROL__factory-rotate__ لتبديل علامات المنافذ (يتطلب وضع ALT).\n__CONTROL__factory-open-outside-surface-to-remote-view__ لفتح طابق المصنع في العرض البعيد.\n__CONTROL__cut__ لنقل مبنى المصنع من العرض البعيد.
factory-2=يمنحك طابق مصنع إضافي لاستغلال مساحة الأرض بكفاءة أكبر.\n__CONTROL__factory-rotate__ لتبديل علامات المنافذ (يتطلب وضع ALT).\n__CONTROL__factory-open-outside-surface-to-remote-view__ لفتح طابق المصنع في العرض البعيد.\n__CONTROL__cut__ لنقل مبنى المصنع من العرض البعيد.
factory-3=يمنحك طابق مصنع إضافي لاستغلال مساحة الأرض بكفاءة أكبر.\n__CONTROL__factory-rotate__ لتبديل علامات المنافذ (يتطلب وضع ALT).\n__CONTROL__factory-open-outside-surface-to-remote-view__ لفتح طابق المصنع في العرض البعيد.\n__CONTROL__cut__ لنقل مبنى المصنع من العرض البعيد.

