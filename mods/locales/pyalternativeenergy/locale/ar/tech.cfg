[technology-description]
numal-mk01=يفتح النومال: حبار هجين متأثر بحمض فضائي نوي يعيش في المناطق العميقة. تطوّر أيضه لاستخراج الطاقة من سلسلة غذائية معزولة تماماً دون تمثيل ضوئي.
numal-mk02=يفتح نومالاً أفضل: حبار هجين متأثر بحمض فضائي نوي يعيش في المناطق العميقة. تطوّر أيضه لاستخراج الطاقة من سلسلة غذائية معزولة تماماً دون تمثيل ضوئي.
numal-mk03=يفتح نومالاً محسّناً: حبار هجين متأثر بحمض فضائي نوي يعيش في المناطق العميقة. تطوّر أيضه لاستخراج الطاقة من سلسلة غذائية معزولة تماماً دون تمثيل ضوئي.
numal-mk04=يفتح نومالاً عالي التكيّف: حبار هجين متأثر بحمض فضائي نوي يعيش في المناطق العميقة. تطوّر أيضه لاستخراج الطاقة من سلسلة غذائية معزولة تماماً دون تمثيل ضوئي.
thermal-mk01=الخطوة الأولى لفتح مجموعة من محطات الطاقة التي تحوّل الحرارة إلى ملح مصهور للطاقة أو للتدفئة المباشرة.
thermal-mk02=يفتح مبانٍ ووصفات متقدمة تحوّل الحرارة إلى ملح مصهور للطاقة أو للتدفئة المباشرة.
thermal-mk03=يفتح مبانٍ ووصفات أكثر تقدماً تحوّل الحرارة إلى ملح مصهور للطاقة أو للتدفئة المباشرة.
thermal-mk04=يفتح أبعد المباني والوصفات شمالاً والأعلى كفاءة التي تحوّل الحرارة إلى ملح مصهور للطاقة أو للتدفئة المباشرة.
wind-mk01=استخدام الرياح لتوليد طاقة ميكانيكية عبر التوربينات لتدوير المولّدات الكهربائية.
wind-mk02=استخدام الرياح لتوليد طاقة ميكانيكية عبر التوربينات لتدوير المولّدات الكهربائية.
wind-mk03=استخدام الرياح لتوليد طاقة ميكانيكية عبر التوربينات لتدوير المولّدات الكهربائية.
wind-mk04=استخدام الرياح لتوليد طاقة ميكانيكية عبر التوربينات لتدوير المولّدات الكهربائية.
geothermal-power-mk01=طاقة كهربائية مولّدة من الحرارة الجوف أرضية. لا يمكن وضعها إلا في أماكن محددة من قشرة الكوكب.
geothermal-power-mk02=طاقة كهربائية مولّدة من الحرارة الجوف أرضية. لا يمكن وضعها إلا في أماكن محددة من قشرة الكوكب.
geothermal-power-mk03=طاقة كهربائية مولّدة من الحرارة الجوف أرضية. لا يمكن وضعها إلا في أماكن محددة من قشرة الكوكب.
geothermal-power-mk04=طاقة كهربائية مولّدة من الحرارة الجوف أرضية. لا يمكن وضعها إلا في أماكن محددة من قشرة الكوكب.
eva=يفتح سلسلة إنتاج ذلك البوليمر المهم.
photonics=يتناول العلم الكامن وراء توليد الضوء ورصد والتحكم به.
microwave-receiver=يفتح تقنيات الميكروويف. تُرسل أقمار صناعية خاصة لتوجيه الطاقة مباشرة إلى السطح.
