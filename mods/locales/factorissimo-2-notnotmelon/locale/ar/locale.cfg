[command-help-message]
give-lost-factory-buildings=يمنحك كل مباني المصنع التي التقطتها على شكل عناصر، باستثناء ما هو موجود في حقيبتك أصلاً. استخدام هذا الأمر إذا لم تكن عناصر المصنع مفقودة فعلاً قد يؤدي إلى أن تشير عدة عناصر في عالمك إلى نفس مبنى المصنع. ستختفي هذه العناصر الإضافية مع رسالة «بيانات مصنع غير صالحة!» عند وضعها.
could-not-determine-with-certainty=[img=utility/warning_icon] [font=default-semibold][color=#23db30]Factorissimo:[/color][/font] تعذّر التحديد بثقة 100% أي مصنع يُفكّ لـالظل عند __1__.\nتم اختيار مصنع بشكل عشوائي عند __2__. [font=default-semibold][color=#db23c3][كانت الثقة __3__%][/color][/font]
