ric-gravity-preconcentrate-hydrothermal-sulfides=كبريتيدات حرارية مائية مركزة بالجاذبية
ric-recover-borax-from-marine-bittern=استخلاص البوراكس من المر البحري
ric-graphitise-marine-carbon=جرافيتيز الكربون المعدني البحري
ric-recover-precious-metals-from-marine-sulfides=استخلاص المعادن الثمينة من الكبريتيدات البحرية
ric-separate-deep-ocean-refractory-metals=معادن حرارية منفصلة في أعماق المحيطات

