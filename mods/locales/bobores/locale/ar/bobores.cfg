[mod-setting-description]
bobmods-ores-infiniteore=يجعل كل الخامات لا نهائية
bobmods-ores-enhancestone=إذا كان صحيحاً، سيظهر الحجر في عروق أكبر وأغنى.
bobmods-ores-unsortedgemore=إذا كان صحيحاً، ستعطي حقول خام الأحجار الكريمة مورد «الأحجار غير المصنّفة». وإذا كان خطأً ستعطي كل نوع خام على حدة.
bobmods-ores-leadgivesnickel=إذا كان صحيحاً، يمكن لتعدين الرصاص أن يعطي نيكل أيضاً
bobmods-ores-leadnickelratio=كم مرة تحصل على نيكل مقابل رصاص
bobmods-ores-nickelgivescobalt=إذا كان صحيحاً، يمكن لتعدين النيكل أن يعطي كوبالت أيضاً
bobmods-ores-nickelcobaltratio=كم مرة تحصل على كوبالت مقابل نيكل
bobmods-ores-gemsfromotherores=إذا كان صحيحاً، يمكن الحصول على الألماس من تعدين الفحم، وعلى الياقوت والصفير والتوباز من البوكسيت، وعلى الجمشت والزمرد من الكوارتز
bobmods-ores-gemprobability=كم مرة تحصل على حجر كريم من تعدين الفحم أو البوكسيت أو الكوارتز
bobmods-ores-startinggroundwater=يضيف تجمّع ماء جوفية إلى منطقة البداية
bobmods-gems-rubyratio=كم مرة تحصل على ياقوت
bobmods-gems-sapphireratio=كم مرة تحصل على صفير
bobmods-gems-emeraldratio=كم مرة تحصل على زمرد
bobmods-gems-amethystratio=كم مرة تحصل على جمشت
bobmods-gems-topazratio=كم مرة تحصل على توباز
bobmods-gems-diamondratio=كم مرة تحصل على ألماس
bobmods-ores-enablewaterores=يشمل الماء الجوفية وماء الليثيا
