[recipe-description]
ric-baghouse-filter-regeneration=قم بغسل وسائط الأكياس المستهلكة بالجير، واستعادة وسائط الترشيح القابلة لإعادة الاستخدام أثناء توليد كعكة الترشيح ومياه الصرف الصحي.
ric-secondary-carbon-capture=قم باستخلاص جزء من ثاني أكسيد الكربون من غاز المداخن الذي تم تنظيفه بالفعل باستخدام المواد الماصة والماء. يتطلب مصدر الغاز الصناعي المنبع.
accumulator=تخزين شبكي بسيط ومبكر مصنوع من الحديد والبطاريات والكابلات النحاسية. يفتح تخزين طاقة الرصاص الحمضي لاحقًا وصفة مجمعة أكثر تعقيدًا تستخدم عددًا أقل من البطاريات لكل مركم.
ric-reclaim-aai-glass=يحول الزجاج المتبقي في عمليات الحفظ الحالية في صناعة AAI إلى زجاج RIC القياسي بعد توفر كيمياء الزجاج.
ric-vent-sulfur-dioxide=إطلاق ثاني أكسيد الكبريت من خلال كومة الإغاثة. هذا بمثابة حوض نهائي للعبة المبكرة مع عقوبة تلوث شديدة؛ ويفضل استخلاص الكبريت وإنتاج الحمض بمجرد توفره.
ric-burn-coal-tar-waste=حرق فائض قار الفحم في فرن الكوك عندما يؤدي التخزين إلى إيقاف إنتاج الكوك. يتم تدمير القطران وتكون العملية متسخة عمدًا.
ric-dispose-ash=التعامل مع الرماد وتفريغه ميكانيكيًا باعتباره نفايات صناعية غير خاضعة للرقابة. فهو يمنع حدوث مآزق فحم الكوك ولكنه لا يستعيد أي مادة.
ric-dispose-metallurgical-dust=جمع الغبار المعدني والتخلص منه بدلاً من السماح للأفران بالتوقف. يؤدي التكوير والغسل اللاحقان إلى استرداد المعادن المفيدة.
ric-crude-wastewater-discharge=التصريف الطارئ غير المعالج للتحسين الرطب المبكر. يدمر تدفق مياه الصرف الصحي مع عقوبة تلوث شديدة؛ والمعالجة المناسبة أفضل بكثير من الناحية المادية.
ric-crude-beneficiation-sludge-disposal=نزح الماء الخام وإلقاء حمأة التخصيب. تُفقد معظم القيمة، ولكن لا يمكن أن يصل خط الخام الرطب إلى طريق مسدود قبل المعالجة الفعالة للنفايات.
ric-crude-acidic-wastewater-discharge=التصريف الطارئ لمياه الصرف الحمضية. مُلوِّث للغاية؛ ويُعدّ تحييد الحجر الجيري والتنقية اللاحقة المسارين المقصودين على المدى الطويل.
ric-crude-brine-discharge=التصريف الطارئ للمحلول الملحي الفائض. تُفضَّل معالجة الكلور والقلويات واستخلاص الملح وإعادة الاستخدام بمجرد أن تصبح عملية.
ric-vent-carbon-dioxide=قم بتحرير ثاني أكسيد الكربون من خلال كومة الإغاثة. يظل الاسترداد وإعادة استخدام المواد الكيميائية هو الأفضل حيثما كان ذلك متاحًا.
ric-sulfur-combustion=أحرق الكبريت العنصري المستعاد في الأكسجين لإنتاج ثاني أكسيد الكبريت لسلسلة حمض الكبريتيك في عملية التلامس.
ric-fluid-fired-steam=يحرق __1__ مع هواء الاحتراق المحيط لإنتاج البخار. تحدد نسبة الوصفة، وليس قيمة وقود تلميح الأداة للسائل، كفاءة المرجل المعبأ. يمكن استرداد غاز المداخن الساخن لاستخدامه في التدفئة أو تصريفه كحل بديل غير نظيف.
ric-vent-hot-flue-gas=يطلق غاز مداخن الغلاية غير المستعاد من خلال المكدس. وهذا يمنع الانسداد ولكنه يهدر الحرارة ويسبب تلوثًا شديدًا.
ric-hand-sort-overburden=يتم فصل الأثقال المقطوعة يدويًا إلى حجر البناء وصخور النفايات قبل توفر أول آلات المعالجة التي تعمل بالطاقة.
ric-hand-break-hematite-rom-low=يقوم بتقسيم المواد منخفضة الدرجة من الهيماتيت الخارجة من المنجم إلى تغذية الأفران البدائية والصخور النفايات.
ric-hand-break-malachite-rom-low=يقوم بتقسيم المواد المنخفضة الدرجة من المالاكيت المتجوية الخارجة من المنجم إلى مواد تغذية لأفران النحاس البدائية وصخور نفايات.
ric-hand-break-coal-rom-low=يقوم بتقسيم المواد الكربونية منخفضة الجودة الخارجة من المنجم إلى فحم صالح للاستخدام وصخور نفايات.
ric-hand-break-limestone-rom-low=يقوم بتكسير المواد الخام من الحجر الجيري منخفض الدرجة إلى مادة صهر معدنية أولية وصخور نفاية.
ric-passive-component-reel=يتم تجميع مجموعات المكونات السلبية على بكرات بحيث يستهلك تجميع اللوحة عنصرًا لوجستيًا واحدًا قابلاً للقراءة بدلاً من المقاومات والمكثفات والمحاثات السائبة.
ric-board-assembly-kit=يجمع بين البكرات السلبية والأسلاك المطلية بالقصدير وقناع اللحام ولحام التدفق في مجموعة تجميع جاهزة للوحة.
ric-active-component-tray=يقوم بتعبئة مجموعات المكونات النشطة في صواني غرف الأبحاث من أجل تجميع الإلكترونيات عالية التقنية والتركيب على السطح.
ric-semiconductor-package-tray=يقوم بتعبئة حزم أشباه الموصلات في صواني مفلترة للتركيب على السطح وتجميع وحدة المعالجة.

ric-red-mud-neutralisation=يعمل على تحييد الطين الأحمر الناتج عن عملية باير مع الجير الحي حتى يتمكن تيار النفايات من تغذية المخلفات ومعالجة مياه الصرف الصحي.
logistic-science-pack=يجمع بين الأحزمة وأجهزة الإدخال في أول علم لوجستي آلي ويناسب آلة التجميع 1.
assembling-machine-1=أول جهاز تجميع. يستخدم المكونات والإلكترونيات البدائية ولكنه لا يتطلب إطارات آلات.
lab=أول مبنى للأبحاث. تم بناؤه يدويًا من السيور والدوائر والتروس والمكونات الصناعية.
chemical-science-pack=جسر العلوم الزرقاء مصنوع من الدوائر والمحركات والبطاريات والمكونات الصناعية المتقدمة بعد اكتمال سلسلة كيمياء العلوم الخضراء.
ric-ammonium-nitrate=يحيد حمض النيتريك مع الأمونيا لصنع نترات الأمونيوم للأسمدة والمتفجرات.
ric-ammonium-phosphate=يجمع بين حمض الفوسفوريك والأمونيا في مادة وسيطة للأسمدة الفوسفاتية.
ric-urea=يستخدم الأمونيا وثاني أكسيد الكربون لإنتاج اليوريا.
ric-npk-fertilizer=يجمع بين مدخلات النيتروجين والفوسفور والبوتاسيوم في الأسمدة الصناعية.
ric-steam-reforming=يحول غاز الوقود والبخار إلى غاز اصطناعي وثاني أكسيد الكربون.
ric-syngas-to-methanol=يحول الغاز التركيبي والهيدروجين إلى ميثانول.
ric-methanol-to-formaldehyde=أكسدة الميثانول إلى الفورمالديهايد.
ric-refinery-offgas-steam-reforming=يقوم بإصلاح الغاز المنبعث من المصفاة باستخدام البخار وتحويله إلى غاز صناعي وهيدروجين بحيث تغذي المنتجات الثانوية للمصفاة العمود الفقري الكيميائي بدلاً من أن تصبح مخزنًا ميتًا.
ric-light-solvent-blending=يمزج الميثانول المبكر والنفتا في تيار مذيب عضوي قابل للاستخدام قبل سلسلة المذيبات الأروماتية الكاملة.
ric-deep-naphtha-cracking=يشقق النفتا إلى الإثيلين والبروبيلين والبيوتادين وغاز الوقود.
ric-aromatic-extraction=يفصل البنزين والتولوين عن النفتا.
ric-cumene-phenol-acetone=يستخدم البنزين والبروبيلين والأكسجين لصنع الفينول والأسيتون.
ric-phenolic-resin=يجمع بين الفينول والفورمالديهايد لتكوين راتنج فينولي.
ric-bisphenol-a=يكثف الفينول والأسيتون إلى ثنائي الفينول A للحصول على مادة أولية لراتنج الإيبوكسي.
ric-epoxy-resin=يستخدم ثنائي الفينول أ، والإبيكلوروهيدرين، والصودا الكاوية لصنع راتنجات الإيبوكسي مع المنتجات الثانوية للمياه المالحة ومياه الصرف الصحي.
ric-synthetic-rubber=يجمع بين البوتادين والاستيرين في المطاط الصناعي.
ric-vinyl-chloride=يستخدم الإيثيلين والكلور لإنتاج كلوريد الفينيل.
ric-pvc=بلمرة كلوريد الفينيل إلى PVC.
ric-fluorite-acidulation=يستخدم حمض الكبريتيك والفلوريت لإنتاج حمض الهيدروفلوريك والجبس.
ric-sodium-fluoride=يستخدم رماد الصودا وحمض الهيدروفلوريك لإنتاج فلوريد الصوديوم.
ric-aluminium-fluoride=يستخدم الألومينا وحمض الهيدروفلوريك لإنتاج فلوريد الألومنيوم.
ric-cryolite=يجمع بين فلوريد الصوديوم وفلوريد الألومنيوم لتكوين الكريوليت لاستخدامه في عملية تحليل الألومنيوم بالكهرباء.
ric-hall-heroult-aluminium=يستخدم الألومينا والكريوليت والجرافيت لإنتاج سبائك الألومنيوم وثاني أكسيد الكربون.
ric-light-alloy=يجمع بين الألومنيوم والنيكل والزنك وكربيد السيليكون في سبيكة هيكلية خفيفة.
ric-galena-roasting=يشوي الجالينا بالأكسجين لإنتاج أكسيد الرصاص وثاني أكسيد الكبريت.
ric-lead-smelting=يقلل أكسيد الرصاص مع فحم الكوك لصنع صفيحة الرصاص.
ric-cassiterite-reduction=يقلل حجر القصدير مع فحم الكوك لصنع صفيحة من الصفيح.
ric-solder=يجمع بين القصدير والرصاص في لحام للإلكترونيات.
ric-lead-acid-accumulator=يقوم ببناء ثلاثة مراكم لكل دفعة باستخدام ألواح الرصاص والبطاريات والبلاستيك وأجهزة المعالجة وحمض الكبريتيك. أكثر تعقيدًا من المركم الأساسي، ولكنه أكثر كفاءة من حيث استهلاك البطارية.
ric-chromite-roasting=يشوي الكروميت مع الجير والأكسجين لإنتاج أكسيد الكروم.
ric-ferrochrome=يختزل أكسيد الكروم مع فحم الكوك والفولاذ ليصنع الفيروكروم.
ric-pyrolusite-reduction=يختزل البيرولوسيت مع فحم الكوك لإنتاج أكسيد المنغنيز.
ric-ferromanganese=يختزل أكسيد المنغنيز مع فحم الكوك والفولاذ لينتج المنغنيز الحديدي.
ric-stainless-steel-plate=سبائك الصلب مع الكروم الحديدي والنيكل والمنغنيز الحديدي.
ric-corrosion-resistant-pipe=يصنع أنابيبًا من الفولاذ المقاوم للصدأ مبطنة ببولي فينيل الكلور (PVC) لآلات المعالجة المسببة للتآكل في المستقبل.
ric-magnesium-chloride-from-brine=يستخدم محلول ملحي وجير لاسترداد كلوريد المغنيسيوم.
ric-magnesium-electrolysis=يحلل كهربائيًا كلوريد المغنيسيوم إلى سبائك المغنيسيوم والكلور.
ric-ilmenite-sulfate-leach=يرشح الإلمنيت مع حامض الكبريتيك لإنتاج ثاني أكسيد التيتانيوم وتركيز الحديد.
ric-rutile-chlorination=يكلور الراتيل بالفحم للحصول على رباعي كلوريد التيتانيوم.
ric-kroll-titanium-sponge=يختزل رابع كلوريد التيتانيوم مع المغنيسيوم لإنتاج إسفنجة التيتانيوم وكلوريد المغنيسيوم.
ric-titanium-alloy=سبائك التيتانيوم مع الألومنيوم والموليبدينوم والنيكل.
ric-spodumene-calcination=يكلس السبودومين مع الجير لإنتاج مركز الليثيوم.
ric-lithium-carbonate=يستخدم تركيز الليثيوم ورماد الصودا لإنتاج كربونات الليثيوم.
ric-lithium-fluoride=يستخدم كربونات الليثيوم وحمض الهيدروفلوريك لإنتاج فلوريد الليثيوم.
ric-battery-electrolyte=يجمع بين فلوريد الليثيوم وحمض الفوسفوريك والإيثيلين في إلكتروليت البطارية.
ric-lithium-ion-cell=يقوم بتصنيع خلايا أيونات الليثيوم من هيدروكسيد الليثيوم والجرافيت وألسنة البطاريات والبلاستيك والإلكتروليت.
ric-lithium-ion-battery=تجميع خلايا أيونات الليثيوم في عناصر البطارية.
ric-natural-gas-separation=يفصل الغاز الطبيعي إلى غاز الميثان والإيثان والبروبان والبيوتان وغاز الوقود.
ric-sour-gas-sweetening=يحلي الغاز الحامض بهيدروكسيد الصوديوم لاستعادة الغاز الطبيعي وكبريتيد الهيدروجين.
ric-methane-steam-reforming=يقوم بإصلاح غاز الميثان بالبخار إلى غاز اصطناعي وهيدروجين.
ric-methane-partial-oxidation=يؤكسد الميثان جزئيًا إلى غاز اصطناعي وثاني أكسيد الكربون.
ric-ethane-steam-cracking=يشقق الإيثان بالبخار إلى إيثيلين وميثان وهيدروجين.
ric-propane-dehydrogenation=يزيل الهيدروجين من البروبان إلى البروبيلين والهيدروجين.
ric-butane-cracking=يشقق البوتان إلى بيوتادين وغاز وقود وهيدروجين.
ric-claus-sulfur-recovery=يستعيد الكبريت العنصري من كبريتيد الهيدروجين وثاني أكسيد الكبريت.
iron-plate=طريق مؤقت في الساعة الأولى من الهيماتيت المسحوق. ينتقل الإنتاج الصناعي إلى الفرن العالي والصب.
copper-plate=طريق مؤقت في الساعة الأولى من الكالكوبايرايت المسحوق. يتحرك الإنتاج الصناعي نحو تركيز الصهر والصب.
ric-recover-sulfur=يقلل ثاني أكسيد الكبريت مع الكربون الصناعي لاستعادة الكبريت العنصري.
ric-make-sulfuric-acid=هيدرات ثالث أكسيد الكبريت إلى حامض الكبريتيك ويخلق تيارًا صغيرًا من مياه الصرف الصحي الحمضية.
ric-polyethylene-plastic=بلمرة الإيثيلين المبكر وتحويله إلى قضبان بلاستيكية للدوائر المتقدمة والبطاريات وأتمتة العلوم الكيميائية.
ric-heavy-residue-processing=يحول البقايا الثقيلة إلى وقود صالح للاستخدام ومجاري النفايات بدلاً من تركها كسائل مسدود.
transport-belt=أحزمة البداية ميكانيكية: ألواح حديدية وتروس فقط.
inserter=أول عنصر لوجستي كهروميكانيكي، يستخدم نقاط تلامس ودائرة أساسية.
assembling-machine-2=تستمر ترقيات جهاز التجميع إلى مستوى إطار الآلة بعد معالجة الخامات.
electric-mining-drill=في وضع الإصلاح الشامل، تستخدم مثاقب التعدين الكهربائية المكونات الصناعية.
chemical-plant=في وضع الإصلاح الشامل، تستخدم المصانع الكيميائية إطارات الآلات والمكونات الصناعية.
oil-refinery=في وضع الإصلاح الشامل، تستخدم المصافي إطارات آلات ومكونات صناعية متعددة.
pumpjack=في وضع الإصلاح الشامل، تستخدم المضخات إطارات الماكينة والمكونات الصناعية.
ric-ore-sorter=آلة معالجة الخام الجاف بعد الأتمتة لفرز الخام الخام وتركيزه.
ric-ore-washer=آلة معالجة الخام الرطبة المستخدمة بعد الفرز الجاف/التركيز.
ric-waste-treatment-plant=آلة ضغط مياه الصرف الصحي والمخلفات لحلقة معالجة الخام الرطب.
ric-chemical-reactor=آلة كيميائية للأغراض العامة للمسارات الكيميائية لتقطير النفط المتبقي.
ric-distillation-column=يفصل النفط الخام وقطران الفحم إلى أجزاء بتروكيميائية مفيدة.
pipe=أنبوب البداية. أبقيت على الحديد فقط، لذا فإن الطاقة البخارية الأولى لا تتطلب إلكترونيات.
pipe-to-ground=أول ترقية للأنابيب؛ تدخل مستوى المكونات الصناعية.
underground-belt=ترقية لوجستيات المكونات المتوازنة بتكلفة مكونات صناعية أقل.
splitter=آلة لوجستيات مكونات متوازنة بتكلفة مكونات أخف.
fast-transport-belt=مستوى الخدمات اللوجستية السريعة باستخدام الفولاذ والمكونات الصناعية.
fast-underground-belt=ترقية لوجستية سريعة باستخدام الفولاذ وتكلفة مكونات صناعية مخفضة.
fast-splitter=آلة تحكم سريع في السير تستخدم الفولاذ والدوائر وتتميز بتكلفة منخفضة للمكونات.
engine-unit=جسر محرك ميكانيكي يستخدم الفولاذ المدرفل، والتروس، والأنابيب، وإطار الآلة، والمكونات الصناعية للعلوم الكيميائية.
electric-engine-unit=محرك كهربائي متوازن حول مواد التشحيم والدوائر وإطار آلة واحد ومحرك ميكانيكي.
steel-furnace=ترقية الفرن الحراري/الصلب باستخدام الطوب الحراري والمكونات.
electric-furnace=فرن متعدد المستويات يستخدم الطوب الحراري والدوائر والمكونات المتقدمة.
medium-electric-pole=تدخل الأعمدة المتوسطة إلى طبقة المكونات الصناعية.
big-electric-pole=تدخل الأعمدة الكبيرة إلى مستوى المكونات الصناعية.
substation=تتطلب المحطات الفرعية إطارات الآلات والدوائر المتقدمة والمكونات الصناعية.
speed-module=أول مستوى وحدة يتم بناؤه من الدوائر المتقدمة والمكونات الصناعية التي تنتجها RIC.
productivity-module=أول مستوى وحدة يتم بناؤه من الدوائر المتقدمة والمكونات الصناعية التي تنتجها RIC.
efficiency-module=أول مستوى وحدة يتم بناؤه من الدوائر المتقدمة والمكونات الصناعية التي تنتجها RIC.
stone-furnace=خطوة الصهر الأولى. تظل هذه الخطوة مقتصرة على الحجر فقط حتى يكون للعملية الشاملة بداية نظيفة.
burner-mining-drill=أول استخراج يدوي للخام. يستخدم فقط الحديد والحجر والتروس البدائية.
small-electric-pole=بداية القطب السلطة. أبقى بسيطًا بالنسبة للكهرباء الأولى.
boiler=أول مرجل بخار بُني من فرن وأنبوب وحجر.
steam-engine=أول مولد طاقة. بنية تحتية ميكانيكية بحتة للطاقة الأولية.
offshore-pump=أول مصدر للمياه لطاقة البخار. تم الحفاظ على بساطتها وطابعها الميكانيكي.
automation-science-pack=أول حزمة علمية. تجمع بين ترس ميكانيكي ولوحة دائرة بدائية ويمكن تشغيلها آليًا في آلة التجميع 1.
ric-crusher=أول آلة معالجة خام ميكانيكية. تعمل بالطاقة الحرارية ويتم فتحها بواسطة معالجة الخام I بعد الأتمتة.
ric-crush-hematite=يسحق الهيماتيت إلى خام حديد مسحوق جاهز للأفران.
ric-crush-chalcopyrite=يسحق الكالكوبيريت إلى خام نحاس مسحوق جاهز للأفران.
ric-electrical-contact=موصل إلكترونيات أساسي تستخدمه اللوحات البدائية والمكونات الصناعية.
ric-insulating-board=مادة عازلة بدائية لأول مسار للإلكترونيات وإطار الآلة.
ric-primitive-circuit-board=لوحة دائرة وسيطة مبكرة قبل التصنيع الكيميائي/الإلكتروني الكامل.
electronic-circuit=دائرة أساسية مجمعة من لوحات دوائر بدائية وكابل وحديد.
ric-industrial-components=مشاركة المكونات الميكانيكية/الكهربائية المبكرة التي تستخدمها آلات RIC.
ric-machine-frame=إطار الآلة المشترك المستخدم في صنع آلات معالجة الخام والكيمياء والمعادن يمكن قراءتها في كتاب الوصفات.
ric-wash-hematite=ترقية تركيز الحديد الرطب الذي ينتج المركزات والمخلفات ومياه الصرف الصحي.
ric-wash-chalcopyrite=ترقية تركيز النحاس الرطب الذي ينتج المركزات والمخلفات ومياه الصرف الصحي.
ric-treat-wastewater=تنظيف مياه الصرف الأساسية لحلقات الغسل والتحييد المبكرة.
ric-coke-oven=آلة تكويك مبكرة. تحول الفحم إلى فحم كوك لاستخدامه في صناعة المعادن في الأفران العالية.
ric-sintering-plant=آلة مخصصة للمعالجة المبكرة للحديد لتكتل مركزات الحديد في صلب متلبد لأفران الصهر.
ric-make-coke=طريق فحم الكوك الأساسي المبكر. يغذي فحم الكوك منتجات الحديد والصلب والنحاس غير اللامع والكربون والقطران/الغاز.
ric-make-coke-from-crushed-coal=تحسين مسار فحم الكوك بمجرد إنشاء عملية التكسير.
ric-blast-furnace=فرن صناعي لاختزال المركزات إلى حديد خام ونحاس نفطة.
ric-refractory-brick=الطوب ذو درجة الحرارة العالية المستخدم في الأفران والبنية التحتية للصب.
ric-casting-machine=يقوم بصب المعادن الصناعية في قوالب الصفائح المفضلة.
ric-rolling-mill=لفات الصلب إلى ألواح الصلب الصناعية.
ric-air-separator=يفصل الهواء إلى غازات صناعية.
ric-electrolyzer=يدير طرق التحليل الكهربائي مثل التحليل الكهربائي للماء والمحلول الملحي.
ric-roaster=يحمص الكبريتيد ويركز في كيمياء ثاني أكسيد الكبريت.
ric-air-separation=ينتج الأكسجين والنيتروجين اللازمين لصناعة المعادن ومعالجة الكبريت وتصنيعه لاحقًا.
ric-water-electrolysis=ينتج الهيدروجين والأكسجين للكيمياء المبكرة ولاحقًا لعلم المعادن المائية.
ric-brine-electrolysis=يحول المحلول الملحي إلى كلور وهيدروجين وهيدروكسيد الصوديوم.
ric-make-hydrochloric-acid=يجمع الكلور والهيدروجين في حمض الهيدروكلوريك.
ric-roast-copper-concentrate=يقوم بتحميص تركيز النحاس لإنتاج ثاني أكسيد الكبريت وتغذية النحاس المحضرة.
ric-crude-distillation=يقوم بتقطير النفط الخام إلى غاز وقود ونافثا ونواتج تقطير متوسطة وزيت غاز وبقايا ثقيلة وماء حمضي.
ric-standard-oil-compatibility=يحول __1__ إلى __2__ القياسي لوصفات التعديل الخارجية. لا يؤدي هذا إلى استعادة معالجة النفط أو التكسير في الإصدار الأصلي.
ric-coal-tar-distillation=أول مسار لقار الفحم، يفتح النافثا والبقايا الثقيلة من حلقة الفحم.
ric-naphtha-cracking=يشق النفتا إلى الإثيلين وغاز الوقود لجسر البلاستيك.
ric-circuit-substrate=مسار ركيزة الدائرة باستخدام بلاستيك RIC وحمض الكبريتيك والراتنج والسيليكا والجرافيت.
ric-neutralise-acidic-wastewater=تحييد مياه الصرف الصحي الحمضية مع الحجر الجيري المسحوق، وإنتاج الجبس والمخلفات قبل معالجة مياه الصرف الصحي العادية.
ric-tailings-stabilised-fill=يربط النفايات والتفل والجير والماء في ردم مستقر صالح للردم في مكبات النفايات.
ric-sour-water-neutralisation=يحيد المياه الحامضة من طرق القطران/النفط حتى لا تعيق البتروكيماويات المبكرة التخزين.
ric-spent-catalyst-reclamation=يتسرب محفز المعالجة المائية الملوث إلى مواد داعمة قابلة لإعادة الاستخدام، وحمأة معدنية ومياه صرف.
ric-hydrogen-sulfide-combustion=يحرق كبريتيد الهيدروجين بالأكسجين لإنتاج ثاني أكسيد الكبريت لسلسلة استخلاص الكبريت/الأحماض.
ric-sulfur-dioxide-oxidation=أكسدة ثاني أكسيد الكبريت إلى ثالث أكسيد الكبريت لإنتاج حمض الكبريتيك.
ric-oleum-absorption=يمتص ثالث أكسيد الكبريت في حمض الكبريتيك لصنع الأوليم لإنتاج حمض عالي الإنتاجية.
ric-oleum-dilution=يخفف الأوليوم إلى حمض كبريتيك إضافي.
ric-spent-acid-regeneration=يجدد جزءًا من التيار الحمضي المستهلك بينما يدفع الباقي إلى معالجة مياه الصرف الصحي الحمضية.
ric-organic-solvent-blending=يمزج الميثانول والأسيتون والتولوين في تيار مذيب عضوي لعمليات الإلكترونيات والتنظيف.
ric-industrial-solvent-blending=يجمع بين المذيب العضوي وزيت الغاز منخفض الكبريت للحصول على مذيب صناعي أثقل.
ric-extraction-reagent=يجمع بين المذيب وحمض الهيدروكلوريك والصودا الكاوية في كاشف لمسارات الترشيح والاستخلاص.
ric-leaching-solution=يمزج حمض الكبريتيك وحمض الهيدروكلوريك وكاشف الاستخلاص في محلول الترشيح القياسي لمركّب المنظّم غير العضوي (RIC).
ric-spent-solvent-recovery=تقوم بتقطير المذيب المستهلك بالبخار لاستخلاص المذيب العضوي القابل للاستخدام والمياه العادمة.
ric-photoresist=يمزج الراتنجات الفينولية والإيبوكسية مع المذيبات العضوية في مادة مقاومة للضوء لخطوات تعريض اللوحات والرقاقات.
ric-clean-copper-foil=ينظف رقاقة النحاس الملفوفة في مذيب عضوي قبل الطلاء وتجميع اللوحة.
ric-plated-through-hole-board=يصنع لوحة مطلية من رقائق مغلفة منقوشة، ورقائق معدنية نظيفة، وقناع لحام، ومواد كيميائية للترشيح.
ric-assembled-circuit-panel=يملأ الألواح المطلية بالأسلاك، وجهات الاتصال، واللحام ذو النواة المتدفقة قبل تجميع الدائرة المتقدمة.
ric-spent-etchant-regeneration=يجدد جزءًا من تيار التنميش المستهلك مرة أخرى إلى حل تنميش مفيد.
ric-ultrapure-water=يرشح الماء باستخدام وسائط الغرف المعقمة والمعالجة بالمواد الكاوية لاستخدام أشباه الموصلات.
ric-photoresist-developer=يقوم بإعداد محلول المطور من الماء عالى النقاء والمواد الكاوية والمذيبات الصناعية.
ric-lithography-mask=تنتج قناعًا للطباعة الحجرية قابلاً لإعادة الاستخدام للتعرض لرقاقة غرف الأبحاث.
ric-silicon-ingot=يسحب سبائك السيليكون النظيفة من البولي سيليكون تحت ظروف غرف الأبحاث المصفاة.
ric-polished-wafer=تلميع شرائح الرقائق باستخدام مركب السيريوم والماء عالى النقاء.
ric-photoetched-wafer=تعرض الرقاقات المشوبة وتنقشها إلى رقاقات وسيطة منقوشة ضوئيًا مع إنتاج مادة نقش مستهلكة.

ric-dry-concentrate-hematite=التركيز المبكر للحديد الجاف لمسار المعادن بالتقنية الحمراء.
ric-dry-concentrate-chalcopyrite=التركيز المبكر للنحاس الجاف لإنتاج النحاس الكبريتيد والنحاس الخام.
ric-primitive-iron-plate=جسر لوح تمهيدي. يحافظ على إمكانية اللعب في الفتحة ولكن يجب استبداله بالخام المتلبد والحديد الخام والصب.
ric-primitive-copper-plate=جسر لوحة التمهيد. يحافظ على إمكانية العزف على الفتحة ولكن يجب استبداله بالنحاس غير اللامع والنحاس الفقاعي والصب.
ric-iron-sintering=تكتل مركز الحديد قبل اختزاله في الفرن العالي.
ric-blast-iron=يقلل من تلبيدة الحديد مع فحم الكوك والحجر الجيري إلى الحديد الخام والخبث.
ric-cast-iron-plate=يصب الحديد الخام في صفيحة حديد قياسية للتوافق مع الإصدار الأساسي مع الحفاظ على علم المعادن في RIC.
ric-limestone-slurry=يتم تعليق الحجر الجيري المسحوق جيدًا في مياه المعالجة من أجل خدمة غسل القالب والصب التي يتم التحكم فيها. هذا هو ملاط ​​كربونات الكالسيوم، وليس ملاط ​​الجير المطفأ.
ric-limestone-wash-cast-iron-plate=يستخدم غسل قالب الحجر الجيري المخفف للحفاظ على إنتاجية الصب عالية مع إعادة معظم الغسيل كتيار مياه صرف قابل للاسترداد.
ric-filter-limestone-wash=يرشح غسيل الصب المستهلك لاستخلاص المياه القابلة لإعادة الاستخدام والحمأة الغنية بكربونات الكالسيوم.
ric-dry-limestone-wash-sludge=يجفف حمأة غسل الحجر الجيري إلى حجر جيري مطحون قابل لإعادة الاستخدام ويستعيد المياه المتبقية.
ric-smelt-copper-concentrate=ينصهر مركز النحاس إلى نحاس غير لامع، وينتج الخبث وثاني أكسيد الكبريت.
ric-convert-copper-matte=يحول مات الكوبر إلى نحاس خام دون الحاجة إلى مستوى محول الأكسجين اللاحق.
ric-cast-copper-plate=يقوم بصب النحاس الخام في ألواح نحاسية قياسية للتوافق مع المصنع الأوسع.
ric-basic-steel-billet=يحول الحديد الخام والفحم الكوكي والمادة المساعدة على الانصهار إلى قضبان فولاذية.
ric-roll-steel-plate=لفات القضبان الفولاذية إلى صفيحة فولاذية أساسية. هذا هو الطريق الفولاذي المقصود لـ RIC.
ric-slag-to-stone=يتم فتح حوض الخبث منخفض القيمة باستخدام تعدين الأفران العالية.


# 0.8.4 recipe clarity and technology tooltip pass
ric-acidic-effluent-neutralisation=يحيد نفايات العمليات الحمضية إلى مياه أكثر أمانًا، أو الجبس، أو الحمأة، أو تيارات المخلفات.
ric-advanced-copper-electrowinning=يستخدم الاسترداد الكهروكيميائي للوحة المعدنية من المحلول إلى منتج صلب.
ric-advanced-distillation-column=يفصل تيارات الهيدروكربون أو المواد الكيميائية المختلطة إلى أجزاء عملية مفيدة.
ric-advanced-electrochemical-cell=خطوة عملية الكيمياء الصناعية للخلية الكهروكيميائية المتقدمة.
ric-advanced-process-components=خطوة عملية الكيمياء الصناعية لمكونات العملية المتقدمة.
ric-advanced-uranium-isotope-separation=خطوة عملية الكيمياء الصناعية لفصل نظائر اليورانيوم المتقدم.
ric-alkylation-feed-blending=خطوة عملية الكيمياء الصناعية لمزج علف الألكلة.
ric-aluminium-cable=خطوة عملية الكيمياء الصناعية لكابلات الألومنيوم.
ric-aluminium-extrusion=خطوة عملية الكيمياء الصناعية لقذف الألمنيوم.
ric-glass-fibre-composite-panel=خطوة عملية الكيمياء الصناعية للوحة المركبة من الألياف الزجاجية.
ric-aluminium-plate=خطوة عملية الكيمياء الصناعية للوحة الألومنيوم.
ric-ammonia-recovery=يجمع بين النيتروجين والهيدروجين لتكوين الأمونيا للأسمدة وسلاسل الكيمياء الصناعية.
ric-argentite-nitric-leach=يتم تغذية الترشيحات المسحوقة أو المركزة في محلول مناسب للتنقية النهائية.
