[mod-setting-description]
reskins-lib-icon-tier-labeling=يعرض أشرطة ملوّنة للدلالة على المستوى على الأيقونات.
reskins-lib-icon-tier-labeling-style=يضبط نمط تسمية المستوى.
reskins-lib-tier-mapping=يضبط كيفية تعيين المستويات للهياكل والعناصر.\n\n[font=default-semibold]تقليدي[/font]: يتبع تعيين المستويات الأسماء. العناصر 1 و2 و3 في السلسلة تُعيَّن للمستويات 1 و2 و3 وهكذا.\nمثال: المفاعلات النووية تبدأ من المستوى 1.\n\n[font=default-semibold]تقدّم[/font]: يتبع تعيين المستويات تقدّم اللعبة. العناصر التي تُحصل عليها لاحقاً وتتطلب مواد أكثر تعقيداً تبدأ بمستويات أعلى.\nمثال: المفاعلات النووية تبدأ من المستوى 3.
reskins-lib-customize-tier-colors=[img=utility.warning_icon] الألوان المخصصة تستخدم طبقات رسومية للعناصر والكيانات بكثافة، مما يزيد بشكل حاد عدد الرسوم المعروضة على الشاشة. قد يؤثر ذلك سلباً على الأداء.\n\nيفعّل تخصيص ألوان المستويات عبر أدوات اختيار الألوان أدناه.
reskins-lib-custom-colors-tier-0=يضبط لون المستوى 0.
reskins-lib-custom-colors-tier-1=يضبط لون المستوى 1.
reskins-lib-custom-colors-tier-2=يضبط لون المستوى 2.
reskins-lib-custom-colors-tier-3=يضبط لون المستوى 3.
reskins-lib-custom-colors-tier-4=يضبط لون المستوى 4.
reskins-lib-custom-colors-tier-5=يضبط لون المستوى 5.
reskins-lib-custom-colors-tier-6=يضبط لون المستوى 6.
reskins-lib-display-notifications=يسمح بعرض إشعارات التحديث ونتائج فحص مودات Artisanal Reskins المفقودة.

