[item-description]
muluna-satellite-radar=يعمل كرادار بمدى غير محدود، يرسم الخريطة عن بُعد للاعبين على الكواكب التي يدور حولها. يستهلك 1 ميغاواط باستمرار، ويستهلك طاقة إضافية لكل منطقة يرسمها. الرادارات ذات الجودة الأعلى ترسم مربعات أكثر وتستهلك طاقة أقل لكل مربع.
muluna-greenhouse=يجب زرع محصول معين فيها باستخدام ماكينة تجميع قبل أن يمكن وضعها.
low-density-space-platform-foundation=أكثر متانة بمرتين وأقل كثافة بنصف من أساسات المنصات الفضائية القياسية.
muluna-microcellular-plastic=بلاستيك يحتوي على مليارات الثقوب المجهرية. له خصائص مادية غير اعتيادية.
muluna-diffused-plastic=بلاستيك مشبع بثاني أكسيد الكربون. لن يبقى ثاني أكسيد الكربون في البلاستيك طويلاً، خصوصاً دون تقنيات تصنيع أكثر تقدماً. قد تكون المعادن الأقوى أو المصانع الكيميائية الأفضل مفتاح خفض معدل الفشل.

[alert]
nav-beacon-available=رادار قمر صناعي يدور حول __1__.\nكل اليابسة قابلة للعرض عن بُعد عبر هذا الرادار.\nعطّل هذا التنبيه في إعدادات المود لكل لاعب.
nav-beacon-available-disabled=رادار قمر صناعي يدور حول __1__.\nإنه معطّل حالياً.\nعطّل هذا التنبيه في إعدادات المود لكل لاعب.


