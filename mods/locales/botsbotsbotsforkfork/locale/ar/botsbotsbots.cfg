[item-description]
bots-roboport-2=تحسين موديلات ميناء الروبوتات سمح لها بالعمل خارج نافيس!
bots-roboport-3=المزيد من الجهد في تقوية منافذ الروبوتات يعني أن الثلج لن يعلق في أماكن تؤدي إلى انفجارها على Aquilo، مع الانتباه لاستهلاك الطاقة...
bots-logistic-robot-0=متهرئ بالكاد يماسك نفسه، يبدو أنه قد ينفجر بمجرد أن ينظر إليه أحد بشكل خاطئ. ربما يحتاج إلى مزيد من التجارب.
bots-logistic-robot-1=إضافة قليل من الجودة حسّنت دفاعاته قليلاً، لكن لا يزال مجال للتحسين.
bots-logistic-robot-2=تحسين موديلات الروبوتات اللوجستية لم يجعلها مقاومة للحريق فحسب، بل سمح لها بالعمل خارج نافيس أيضاً!
bots-logistic-robot-3=المزيد من الجهد في الروبوتات القوية جعلها قادرة على الطيران في الكواكب الباردة، مع الانتباه لاستهلاك الطاقة...
bots-logistic-robot-4=الشكل النهائي للروبوت اللوجستي! هؤلاء يستطيعون نقل كوكب كامل في رحلة واحدة لو أُتيحت لهم الإرادة.
bots-logistic-robot-5=دمج مفاعل اندماجي صغير جداً في قلب روبوتاتك أزال تماماً حاجتها إلى إعادة الشحن.
bots-construction-robot-0=متهرئ بالكاد يماسك نفسه، يبدو أنه قد ينفجر بمجرد أن ينظر إليه أحد بشكل خاطئ. ربما يحتاج إلى مزيد من التجارب.
