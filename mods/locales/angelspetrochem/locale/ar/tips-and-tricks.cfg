; 1.1 Air filtering
angels-air-filtering=تنقية الهواء

[tips-and-tricks-description]
angels-petrochem=مود يغيّر المعالجة البتروكيماوية لتصبح أكثر تعقيداً وواقعية إلى حدّ ما (ليس مفرطاً).\nيجب معالجة المواد الخام وتحويلها عبر سلاسل معالجة كيميائية للحصول على:\n__1__\nكما يضيف المود بئراً جديداً: __2__
angels-air-filtering=الأكسجين والنيتروجين مادتان أساسيتان لكثير من العمليات الصناعية، وبعضها جزء من هذا المود. على سبيل المثال، استعمال [fluid=angels-gas-oxygen] بدلاً من الهواء الخام يحسّن كفاءة عمليات الصهر. لذا فإن فصل الهواء إلى [fluid=angels-gas-oxygen] و[fluid=angels-gas-nitrogen] تقنية أساسية.
angels-air-filtering-notes=\n\n[font=default-bold]ملاحظات[/font]: يتكوّن الغلاف الجوي للأرض من حوالي 21% أكسجين و79% نيتروجين.\nيستعمل هذا المود نسبة مختلفة لتقليل هدر غاز النيتروجين في البداية وهدر غاز الأكسجين في المراحل المتقدّمة. يمكننا فعل ذلك لأن نافيس ليست الأرض.
