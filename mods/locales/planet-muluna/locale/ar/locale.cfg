[entity-description]
muluna-advanced-boiler=مرجل يعمل في بيئات خالية من الأكسجين مثل [planet=muluna] وعلى المنصات الفضائية.
space-heating-tower=برج تسخين يعمل في بيئات خالية من الأكسجين مثل [planet=muluna] وعلى المنصات الفضائية.
muluna-cycling-steam-turbine=توربين بخاري أكثر كفاءة يسمح بتكثيفجزء من البخار المستهلك إلى ماء لإعادة تسخينه. يفضّل البخار الأعلى جودة.\n[fluid=steam] الحد الأقصى لدرجة الحرارة: 500 °C\n[fluid=cooled-steam] درجة الحرارة: 100 °C
muluna-rocket-buggy=سيارة أكبر وأسرع مزودة بقاذف صواريخ وشبكة معدات.
muluna-vacuum-heating-tower=يولّد حرارة من الوقود الكيميائي بكفاءة أعلى حتى. يمكن استخدامه على كل الأسطح، لكنه يستهلك [fluid=oxygen] وينتج [fluid=carbon-dioxide].
muluna-telescope-combinator=يتطلع إلى الكون، ويجمع معلومات عن محيط التلسكوب.\nعلى الكواكب:\n[img=quality.normal]: فهرس كل منصة فضائية في المدار\n[img=quality.uncommon]: حالة كل منصة فضائية في المدار\n[img=quality.rare]: إذا(2) أو إذا لم يكن(1) بإمكان كل منصة في المدار أن تغادر\nعلى المنصات:\n[img=virtual-signal.signal-I]:فهرس المنصة الفضائية\n[img=virtual-signal.signal-X]:إذا كان على اتصال فضائي، الموضع الحالي على الاتصال\n[img=virtual-signal.signal-L]:إذا كان على اتصال فضائي، الطول الإجمالي للاتصال\nسيصدر التلسكوب أيضاً إشارة لكل كويكب يحيط بالمنصة. مكوّن فرعي من [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=يتطلع إلى الكون، ويجمع معلومات عن محيط التلسكوب.\nعلى الكواكب: فهرس كل منصة فضائية في المدار\nعلى المنصات:\n[img=virtual-signal.signal-I]:فهرس المنصة الفضائية\n[img=virtual-signal.signal-X]:إذا كان على اتصال فضائي، الموضع الحالي على الاتصال\n[img=virtual-signal.signal-L]:إذا كان على اتصال فضائي، الطول الإجمالي للاتصال\nسيصدر التلسكوب أيضاً إشارة لكل كويكب يحيط بالمنصة. مكوّن فرعي من [entity=muluna-telescope].
muluna-telescope=يتطلع إلى الكون، ويولّد بيانات فلكية. يحتاج رؤية واضحة للنجوم كي ينتج بيانات. ينتج بيانات أكثر في المواقع الأكثر غرابة. يولّد أيضاً إشارات دائرة через [entity=muluna-telescope-combinator]. يمكن وضع تلسكوب واحد فقط لكل كوكب، لكن لا حد على المنصات الفضائية.
muluna-crusher=كسّارة تعمل بمحرك كهربائي. تسحق العناصر بكفاءة طاقة أفضل.
muluna-burner-roboport=منفذ روبوتات يزوّد الروبوتات بالوقود والمؤكسد بدلاً من الكهرباء، مما يسمح للروبوتات بالطيران دون جو.\nانظر أيضاً: [entity=muluna-burner-roboport-roboport]
muluna-burner-roboport-roboport=مكوّن منفذ الروبوتات من [entity=muluna-burner-roboport]
[entity-factoriopedia-description]
muluna-telescope-combinator=يتطلع إلى الكون، ويجمع معلومات عن محيط التلسكوب.\nعلى الكواكب:\n[img=quality.normal]: فهرس كل منصة فضائية في المدار\n[img=quality.uncommon]: حالة كل منصة فضائية في المدار\n      [font=default-bold]1[/font]: بانتظار حزمة البداية.\n      [font=default-bold]2[/font]: طُلبت حزمة البداية من النظام اللوجستي.\n      [font=default-bold]3[/font]: حزمة البداية في طريقها.\n      [font=default-bold]4[/font]: تتبع المسار.\n      [font=default-bold]5[/font]: المنصة جاهزة لمغادرة هذا الكوكب ولا تقبل التوصيلات.\n      [font=default-bold]6[/font]: لا توجد محطات في الجدول.\n      [font=default-bold]7[/font]: لا يوجد مسار.\n      [font=default-bold]8[/font]: تنتظر عند محطة\n      [font=default-bold]9[/font]: متوقفة مؤقتاً\n[img=quality.rare]: إذا(2) أو إذا لم يكن(1) بإمكان كل منصة في المدار أن تغادر\nعلى المنصات:\n[img=virtual-signal.signal-I]:فهرس المنصة الفضائية\n[img=virtual-signal.signal-X]:إذا كان على اتصال فضائي، الموضع الحالي على الاتصال\n[img=virtual-signal.signal-L]:إذا كان على اتصال فضائي، الطول الإجمالي للاتصال\nسيصدر التلسكوب أيضاً إشارة لكل كويكب يحيط بالمنصة. مكوّن فرعي من [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=يتطلع إلى الكون، ويجمع معلومات عن محيط التلسكوب.\nعلى الكواكب: فهرس كل منصة فضائية في المدار\nعلى المنصات:\n[img=virtual-signal.signal-I]:فهرس المنصة الفضائية\n[img=virtual-signal.signal-X]:إذا كان على اتصال فضائي، الموضع الحالي على الاتصال\n[img=virtual-signal.signal-L]:إذا كان على اتصال فضائي، الطول الإجمالي للاتصال\nسيصدر التلسكوب أيضاً إشارة لكل كويكب يحيط بالمنصة. مكوّن فرعي من [entity=muluna-telescope].


