nx-heat-pump=ترقية  coolers و التسخين الأنظمة بـ النيكسيلايت cartridges إلى يحسّن  الكفاءة لـ  coolers في التي الحظيرة, saving الطاقة.  الحيوانات سي يكون أكثر comfortable و سي العمل أسرع.
lichen=بدلاً من لـ باستخدام الأمعاء, يسمح  النافينز إلى bind itself مباشرة بـ أي كبير mammalian host.  الفطر سي لديهم ممتلئ تحكم فوق كلاهما العصبي و motor function. Slaughtering  هجين المخلوق سي يسمح لـ  كبير حصاد لـ بالغ النافينز الفطر.
acidosis=أدخل الزينو جينات إلى الفاووجاي السماح ها إلى لديهم  advantage في competition لـ الطعام بـ آخر المخلوقات بواسطة acidification لـ  منطقة, blocking harmful البكتيريا و آخر الفطريات من الزراعة في الفاووجاي plantations.
dry=Cultivate  الفاووجاي تحت متطرف ضغط. هذا تقنية سي يسبّب  larger buildup لـ الكربون molecules داخل  الفطر's roots. أكثر الطاقة سي يكون مطلوب إلى maintain هذا بيئة.
a-select=Fishes التي didn't pass في  مؤتمت test سي يكون تلقائياً thrown إلى الكتلة الحيوية recycling و يكون reused كـ supplement الطعام إلى  ones الذي passed.
temp-control= whole السمك undergoes mincing, enzymatic الهضم, grinding و liquefaction إلى ينتج سائل السمك hydrolysate.  resulting substance هو أيضاً معروف كـ gurry.  يعالج هو معروف إلى يكون أكثر فعّال عند cooler temperatures بسبب إلى  preservation لـ  معقّد البروتين, carbohydrate و الدهن بنى في  السمك مادة. الإضافة نشط cooling components سي يزيد  yield لـ  hydrolysation يعالج مع ذلك هناك هو  risk لـ mechanical wear.
dosing-pump=تثبيت تلقائي dosing المضخات إلى يختزل النفايات و يحسّن السمك الحياة جودة. Flushed byproducts سي يكون مجموعة و stored لـ مستقبلي يستخدم.[font=default-semibold][color=255,60,60]تحذير: اختيار هذا خيار سي تحرير  الأنبوب locations لـ كل السمك المزارع.[/color][/font] عالٍ-سرعة pumping apparatus يتطلب إضافي الكهرباء إلى operate.
dry-storage=يسمح logs إلى الراحة عدة days في  sun إلى يزيل excess moisture و يحسّن الألياف جودة بواسطة وزن.
sawblades=يطوّر التقنيات لـ  الإنتاج لـ specialized قرص المنشار wheels. هذه sawblades يأخذ  يضع لـ regular الوحدات داخل  الخشب المعالجة الوحدة بـ محسّن سرعة و الإنتاجية percentages.  الإنتاجية تأثيرات كل الخشب المعالجة الوحدة الوصفات, حتى تلك التي normally هي لا benefited بواسطة الإنتاجية.  جهاز T.U.R.D.-upgraded الخشب المعالجة units لديهم 3 الوحدة فتحات لكل المستوى.[font=default-semibold][color=255,60,60]تحذير: الخشب المعالجة units سي يتطلب عند الأقل واحد قرص المنشار الوحدة إلى function.[/color][/font]اختيار هذا خيار سي أيضاً يمنع beacons من influencing الخشب المعالجة units.
selective-heads=يزيل branches و excess bark أثناء  cutting, كـ preparation لـ مزيد المعالجة.  ثانية المرحلة لـ الخشب المعالجة يصبح كثير أسرع و مرتين كـ productive.
self-generation=يستخدم sticks, الخشب chips, و أوراق إلى الوقود  internal حارق.  حارق سي يولّد جزء لـ  الكهرباء مستهلك بواسطة  مبنى, زيادة سرعة و الإخراج. تلك hungry الأشجار سي يحتاج أكثر الرماد إلى يزرع.
carbonefarious=الأنثراسين الزيت,  byproduct لـ الفحم القطران, لديه كان studied لـ  تأثيرات على الشجرة نمو و health. يضيف هذا substance إلى  الشتلة lifecycle لـ  threefold benefit.\n1. Controlled application لـ الأنثراسين الزيت helps الشجرة الأنواع manage الطحلب parasite نمو بسبب إلى معين biocidal خصائص.\n2. مدى الحياة application لـ  الزيت acts كـ  قبل-treatment step السماح يستخدم في electronics-الدرجة PCB manufacturing.\n3. مُزاد familiarity بـ الأنثراسين الزيت المعالجة inspires  جديد الإنتاج method involving extracting polycyclic aromatic الهيدروكربونات (PAHs) من عالٍ الدرجة distillates.
hi-sprinkler=تثبيت أكثر متقدم sprinklers السماح tons لـ مُضغوط الماء إلى يسقط فوق  needy الغرود.  إضافي الماء سي يسمح لـ  greater حصاد.
ground-irrigation=يغذّي إضافي المخلفات إلى  الغرود التعدين النباتي operation. أكثر ثقيل المعادن سي يكون مركّز إلى  النبات's roots لـ مجموعة.
carbide-c=Exchange كل  الماء مجموعة الأنظمة بـ reinforced و modern carbide الترقيات. بعض الماء يمكن يكون recycled و  المضخات سي يركض أقل, saving الكهرباء. Stored الماء سي accumulate داخل  الغرود pistils و يمكن يكون extracted كـ nutrient-غني flavonoids.
gs=يضيف السمك cerebrospinal السائل في  incubation media لـ  إضافي catalyst و الكربون المصدر.  سماد bacterial نمو يعالج سي يصبح أكثر productive.
zero=أنت لديهم اكتُشف  نادر سلالة لـ zogna البكتيريا التي cannot react إلى luminescence. هذا zogna subgroup يجب يكون grown في كامل darkness داخل  incubation حجرة.
icd=تثبيت recirculation الأنظمة الذي سي إعادة-المضخة مُضغوط الهواء و السوائل ظهره إلى  incubation chambers.  ICD الأنظمة سي يحسّن عام عينة مجموعة من  النباتات المحلية.
wire-netting=تثبيت التسخين الأنظمة إلى يساعد يجفّف و bake تلك الكيكالك أثناء  نمو يعالج. تلك well-baked الأشجار هي مثالي إلى استخراج الكتلة الحيوية و إضافي fibers, مع ذلك هم هي useless لـ feeding الحيوانات.
extra-water=يزوّد salted الماء لـ هذه الماء hungry الأشجار, صنع ها ينتج أكثر أوراق و يزرع أسرع.  ري يعالج سي يساعد dislodge الكيكالك البذور الذي يمكن يكون مجموعة.
crop-rotation=يسمح آخر الأنواع إلى يزرع في  التربة أثناء جزء لـ  سنة إلى replenish lost المعادن.
biosynthetic-nylon=النايلون الحيوي التخليق من الخشب هو  يعالج التي involves converting الكتلة الحيوية إلى chemical مبنى blocks لـ producing nylon. الخشب هو primarily composed لـ lignocellulose, الذي consists لـ ثلاثة main components: السيليلوز, hemicellulose, و اللجنين.  sugars released من  الخشب الكتلة الحيوية هي fermented بواسطة microbes إلى ينتج adipic الحمض و 1,5-pentanediamine,  key monomers مطلوب إلى synthesize nylon.
eye-out=يزيل واحد أو كلاهما eyestalks من أنثى الكمات.  aim لـ ablation تحت هذه circumstances هو إلى stimulate  أنثى الكمات إلى يطوّر mature ovaries و spawn.
sex-ratio=Changes  ratio من 1:1 إلى 1:3 ذكر-إلى-أنثى الكمات. أكثر mothers سي يكون available لـ الصغير الإنتاج, لكن fewer سي reach adulthood. بسبب إلى  offset ذكر/أنثى ratio,  نادر males سي بكثير overproduce  sticky gels.  الحظيرة هو تلقائياً قادر إلى اجمع هذه gels لـ مستقبلي يستخدم.
moult-recycle=يضيف الكمات moults إلى  own الطعام إلى يحسّن  الطعام جودة, reducing النفايات.
hd-moss= الطحلب نمو متوسط consists لـ stones بـ mineral-غني خشن fraction. Typically, بعد  الطحلب الحياة دورة هذه geologic بنى هي مستنفد لـ key المغذيات. البحث إلى  thorough cleaning و restoration يعالج في لترتيب إلى recycle هذا نمو متوسط.
remove-muddy-sludge= الطحلب هو kept عند  protonema المرحلة بواسطة continuous mechanical disruption بواسطة باستخدام rotating blades. هذا exposure إلى  فضائي الغلاف الجوي's biodiversity سي يزيل  requirement لـ muddy الماء. إضافي الطاقة سي يكون مطلوب إلى maintain  حيوي processes.
spores=Unopened capsules بـ كلاهما operculum و calyptra intact هي مجموعة إلى يزوّد الأبواغ لـ  التالي محصول. في مثل الشروط sterilization هو ضروري بـ distilled الماء و الكلور.
