[mod-setting-name]
iw-start-planet=كوكب البداية في Industrial Worlds
iw-safe-start-orbit=مدار ابتدائي أكثر أماناً لبدايات عصر الفضاء
iw-vulcanus-rock-multiplier=معامل ناتج الصخور الابتدائي في فولكانوس
iw-enable-angelus-world=تفعيل عالم أنجلوس
iw-enable-pyanodons-world=تفعيل عالم بيانودونز
iw-enable-nullia-foundation=تفعيل دمج عالم نوليا (تطوير)

[mod-setting-description]
iw-start-planet=اختر عالم البداية لحفظ جديد: ناوفيس أو أنجلوس أو بيانودونز أو نوليا التجريبية أو فولكانوس أو فولغورا أو غليبا. Industrial Worlds غير متوافق مع مود Any Planet Start المنفصل. عند ترقية حفظ APS قديم، اختر عالم البداية الأصلي هنا أولاً. تغيير هذا الإعداد لا ينقل اللاعبين القائمين أبداً.
iw-safe-start-orbit=قلّل تهديدات الكويكبات الأولية للبداية على فولكانوس أو فولغورا أو غليبا. مبني على موازنة مدارات مود Any Planet Start المرخّص بميتا.
iw-vulcanus-rock-multiplier=معامل لأول صخور بركانية تُستخرج؛ اتركه على 1 للموازنة الأصلية.
iw-enable-angelus-world=أنشئ كوكب أنجلوس ومسار اكتشافه عند تثبيت الحزمة الكاملة المدعومة من Angel/Bob. تعطيل العالم يُبقي محوّل التوافق نشطاً كي تظل تغييرات النماذج العامة لـAngel/Bob معزولة عن قياسي / عصر الفضاء.
iw-enable-nullia-foundation=فعّل عالم نوليا التجريبي ومحتواه من التصنيع والبحث والمدار. مُفعّل افتراضياً إلى جانب أنجلوس وبيانودونز؛ التكامل الكامل للتقدم لا يزال غير مكتمل.
iw-enable-pyanodons-world=أنشئ كوكب بيانودونز ومسار اكتشافه عند تثبيت الحزمة الكاملة المدعومة من Pyanodons وجسر عصر الفضاء. تعطيل العالم يُبقي محوّل التوافق نشطاً كي تظل تغييرات النماذج العامة لـpY معزولة عن قياسي / عصر الفضاء.

[equipment-name]
iw-nullia-battery-equipment-1=بطارية محمولة I (نوليا)
iw-nullia-solar-equipment-1=وحدة شمسية محمولة I (نوليا)
iw-nullia-battery-equipment-2=بطارية محمولة II (نوليا)
iw-nullia-solar-equipment-2=وحدة شمسية محمولة II (نوليا)


[item-description]
iw-nullia-android-body-1=ضع روبوتاً بشرياً خاملاً في نوليا. حدّده واضغط Ctrl+Shift+M؛ تستهلك عمليات الرفع الأولى خلية كهروكيميائية واحدة وتُشغّل الروبوت لمدة 15 دقيقة نشاط. معدات بطارية IW في شبكة درعه تمدّه بطاقة الصيانة قبل استهلاك الاحتياطي. الخلايا القياسية أو عالية الكثافة تُعيد الشحن تلقائياً من حقيبته. استخدم /iw-nullia-power لفحص الشبكة والاحتياطي، أو /iw-nullia-recover للعودة إلى جسدك الخامل القريب.
iw-nullia-android-chassis-1=محطة بحث أولية حصرية في نوليا للطاقة القابلة للارتداء. هذا ليس نظام جسد Nullius الأصلي للروبوتات البشرية.

[controls]
iw-nullia-upload-mind=رفع الوعي إلى روبوت نوليا البشري المحدد
iw-nullia-previous-body=التبديل إلى روبوت نوليا البشري الخامل السابق القريب
iw-nullia-next-body=التبديل إلى روبوت نوليا البشري الخامل التالي القريب

[map-gen-preset-name]
iw-four-worlds=Industrial Worlds — العوالم الأربعة

[map-gen-preset-description]
iw-four-worlds=ابدأ على ناوفيس بموارد العوالم القياسية فقط. تستخدم أنجلوس وبيانودونز ونوليا جيولوجيا منفصلة خاصة بكل كوكب. قد تظل مؤشرات المودات الأخرى المثبتة مرئية في مُولّد الخرائط العام في Factorio.

