ric-amidoxime-adsorbent=تصنيع مادة الاميدوكسيم الممتزة
ric-seawater-uranium-adsorption=امتصاص اليورانيوم من مياه البحر
ric-uranium-adsorbent-elution=غسل المادة الممتزة المحملة باليورانيوم
ric-seawater-uranium-precipitation=ترسيب الكعكة الصفراء المشتقة من مياه البحر
