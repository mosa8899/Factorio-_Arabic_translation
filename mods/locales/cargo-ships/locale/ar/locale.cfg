[mod-setting-description]
fuel_modifier=تُضرب السعة القياسية لوقود السفن في هذه القيمة.
waterway_reach_increase=زيادة مدى اللاعب أثناء حمل الممرات المائية والعوّامات والموانئ إلخ. تتيح وضع الممرات المائية وفكّها من بعيد. اضبطها على '0' لتعطيل زيادة المدى.
use_dark_blue_waterways=تجعل الممرات المائية أغمق وبالتالي أوضح للمشاهدة. (تؤثّر حاليًا على الممرات المائية القديمة فقط)
speed_modifier=تُضرب سرعات حركة السفن والقوارب في هذه القيمة. تحذير: السفن السريعة تبدو سخيفة.
tanker_capacity=سعة تخزين السفينة الناقلة بوحدات سائل تبلغ 1000.
cargo_ship_capacity=سعة تخزين __ENTITY__cargo_ship__ بعدد الرزم.
no_catching_fish=يمنع الإدراج من صيد السمك إذا وُضع على حافة الماء.
prevent_waterway_rail_connections=إذا فُعّل، لن تتمكن من ربط ممر مائي بنوع سكة حديد آخر.

[cargo-ship-message]
error-place-on-water=خطأ: لا يمكن وضع __1__ إلا على الماء.
error-connect-rails=خطأ: لا يمكن ربط __1__ بـ __2__.
place-on-waterway=جارٍ وضع __1__ على ممر مائي.
place-independent=جارٍ وضع __1__ كمركبة قابلة للقيادة بحرية.
error-place-on-waterway=خطأ: تعذّر وضع __1__ على ممر مائي.
error-unlinked-engine=خطأ: تم حذف __1__ دون العثور على سفينة مرتبطة به.
error-train-on-waterway=خطأ: لا يمكن وضع __1__ على ممر مائي!
error-ship-no-space=خطأ: يجب وضع __1__ على ممر مائي مستقيم بمساحة كافية من كل جانب!
error-canceled=خطأ: لا يمكن وضع __1__ هنا، وقد دُمّر العنصر.
error-bridge-busy=خطأ: تأكّد من عدم وجود قطار أو سفينة تعبر حاليًا قبل حذف __ENTITY__bridge_base__.
migration-11-warning=[color=yellow] تحذير >>> فشل ترحيل Cargo Ships <<< تحذير[/color]\nلقد حمّلت خريطة من Factorio 1.1 أو أقدم. يُرجى تحميل هذه الخريطة وحفظها في Factorio 2.0 قبل الترقية إلى 2.1.\nحمّل ملف ZIP المخصّص لإصدار Factorio 2.0.77 من factorio.com لتجنّب تلف تثبيتك عبر Steam.
