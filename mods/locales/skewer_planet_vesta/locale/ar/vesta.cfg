[technology-description]
dt-fuel=يعمل مزيج الديوتيريوم والتريتيوم كحفّاز للعديد من التفاعلات القائمة على البلازما.
hot-lithium-production=الحرارة كحفّاز تسبب تفاعلاً في الليثيوم يسمح باستخراج التريتيوم.
tritium-production=التريتيوم مادة مهمة للعمليات القائمة على البلازما.
hot-heavy-water-production=تسخين الماء الثقيل وكبريتيد الهيدروجين يسمح باستخراج الديوتيريوم بسهولة. 
deuterium-production=الديوتيريوم مادة مهمة للعمليات القائمة على البلازما.
s1_cluster_processing=وُجدت آثار حديد ونحاس مكلسَة على الصخور القريبة. يبدو أن على الصخور نوعاً من الطحالب يترسب المعادن الشائعة بأشكال متبلورة.
s1_ammonia_chilled_plate=تسخين الفولاذ والحديد معاً ثم تبريدهما بسرعة ينشئ سبيكة قادرة على تحمل درجات حرارة قصوى.
s1_brine=معالجة الماء إلى محلول ملحي خطوة مهمة لإنتاج غاز التريتيوم. طف، ألم أرَ هذه العملية من قبل؟
s1_exotic_algae=يمكن دراسة وصفات طحالب أكثر غرابة.
s1_iridium_plate=لوح الإيريديوم قادر على تحمل درجات الحرارة القصوى التي تنتجها عملية التمغنطة.
s1_nutrients_from_co2=يبدو أن غاز ثاني أكسيد الكربون يوفّر أكثر بيئة ملائمة لكائنات فيستا الدقيقة.
s1_vestan_char=يمكن تسخين الكربون ومعالجته أكثر إلى مادة أسهل احتراقاً.
s1_sandceramicmesh=أحياناً كي تكبر!.. عليك أن تبدأ صغيراً. صغيراً بشكل ساحق فعلاً.
fusion-missile=يمكن استخدام السبائك المغناطيسية لاحتواء بلازما متطايرة قوية وواسعة الانتشار. هذه الصواريخ تسبب ضرراً عالياً ونطاقاً واسعاً. 
ske_fusion_thruster=يمكن ترقية دفعاتنا وتحسينها أكثر، والآن باستخدام قوة البلازما لدفع منصاتنا أسرع وأبعد من أي وقت مضى بمصدر طاقة أكثر كفاءة.
ske_fusion-thruster=يمكن ترقية دفعاتنا وتحسينها أكثر، والآن باستخدام قوة البلازما لدفع منصاتنا أسرع وأبعد من أي وقت مضى بمصدر طاقة أكثر كفاءة.
s2_transport-belt-capacity-vesta=سعة الناقل في فيستا
s2_worker-robots-storage-vesta=حجم حمولة روبوت العمل في فيستا
transport-belt-capacity-vesta=سعة الناقل في فيستا
worker-robots-storage-vesta=حجم حمولة روبوت العمل في فيستا

s1_dueterium=يمكن إنتاج وقود اندماجي أكثر تقدماً بالاستفادة من العناصر الموجودة في جو فيستا. بتفكيك المركبات المختلفة، يمكن تشكيلها مجدداً إلى نظائر هيدروجين نقية. وعلى نحو غريب، الديوتيريوم والتريتيوم مطلوبان لإنتاج الإيريديوم.
s1_iridium=ألواح الإيريديوم متينة ومقاومة للحرارة بما يكفي لتوفير بيئة دافئة تنمو فيها الطحالب دون أن تقتلها الحرارة.
s1_algea_discovery=الغازات المختلفة داخل جو فيستا تؤوي أيضاً أنواعاً دقيقة كثيرة. يمكن جني آثار هذه الكائنات من الغازات، ومع الزراعة الدقيقة يمكن أن تصبح طريقتنا الوحيدة للحصول على الموارد، بما فيها الحديد والنحاس.
s1_algea_extracting=طحالب فيستا قوية ومتطورة بشكل مذهل. إذا تغذت بغازات معينة والحرارة، ستغيّر تركيبها وتنمو مركبات معدنية شبيهة ببكتيريا غليبا. يمكن بعد ذلك معالجة هذه المركبات بالاحتراق لإنتاج موارد معدنية متنوعة.
s1_gas_manipulation_science_pack=بحث في تحسينات التقنيات المتعلقة بالغازات
s2_fusion_enhancements=واصل تطوير اختراقاتنا في الطاقة الاندماجية.

planet-discovery-vesta=استكشف فيستا، العملاق الغازي الذي يتألف في معظمه من الغاز. تبدو هناك تشكيلات صخرية علقت في حقل الغاز. منطقة الغاز مزيج من أشكال بسيطة متعددة من الغاز، منها الهيدروجين والنيتروجين وثاني أكسيد الكربون والهيليوم. ويبدو أن هناك آثاراً لشوائب متنوعة داخل حقل الغاز يمكن ترشيحها.

s1_algea_filtering=المرشحات تتيح لنا اصطياد تجمعات الطحالب المزروعة في مياتنا بسهولة. لكن أي مرشح لن يكفي؛ يجب تطويرها خصيصاً لفصل الطحالب دون إتلاف بنيتها.
s1_algea_filtering_2=يمكن تنظيف المرشحات، فنستعيد مرشحاً وبعض الطحالب الإضافية.

s1_algea_oversaturation=الإفراط في تغذية طحالب فيستا الأصلية يجعلها شديدة المغذّيات. يمكنها العمل كبديل محلي للمغذيات ولا تتلف مع الوقت!

s1_algea_culturing=الغازات المختلفة داخل جو فيستا تؤوي أيضاً أنواعاً دقيقة كثيرة. يمكن جني آثار هذه الكائنات من الغازات، ومع الزراعة الدقيقة يمكن أن تصبح طريقتنا الوحيدة للحصول على الموارد، بما فيها الحديد والنحاس.

s1_algea_treatment=طحالب فيستا قوية ومتطورة بشكل مذهل. إذا تغذت بغازات معينة والحرارة، ستغيّر تركيبها وتنمو مركبات معدنية شبيهة ببكتيريا غليبا. يمكن بعد ذلك معالجة هذه المركبات بالاحتراق لإنتاج موارد معدنية متنوعة.

s1_electrolysis=أحياناً لا تكون الحرارة هي جواب مشاكلنا، بل الكهرباء. بإدخال كميات كبيرة من الفولط إلى أشكال مختلفة من المادة، يمكننا تغيير تركيبها. وبعض الطحالب قد تتفاعل مع الكهرباء بطرق غير متوقعة.

s1_supermagnet=استخدام تيارات كهربائية عالية في حلقة torrus يتيح لنا توليد حقول بطاقات مغناطيسية هائلة. يمكن استخدام هذه الحقول لتحريك وتنشيط موارد متنوعة. بعض الطحالب قد تتفاعل مع هذه الطاقات بشكل مختلف عن المتوقع.

s1_t2d2=يمكن إنتاج وقود اندماجي أكثر تقدماً بالاستفادة من العناصر الموجودة في جو فيستا. بتفكيك المركبات المختلفة، يمكن تشكيلها مجدداً إلى نقاوات تعزز اختراقاتنا في الطاقة الاندماجية.

s2_fusion_robots=بما أن توليد الطاقة المتقدم أصبح متاحاً لنا، فمن المنطقي أن نرقّي قدراتنا اللوجستية والروبوتية بالتقنية نفسها. ستُشغَّل هذه الروبوتات بطاقة اندماج DT وستهلك طاقة أقل، مما يسمح لها بالعمل فترات أطول.

s2_plasma_pipes=بلازما تفاعلات الاندماج لا يمكن نقلها أو التحكم بها عادةً، حتى الآن. بصنع لفائف نحاسية حول إطار أنابيب مقوّى، وتبطين الداخل بسبائك بروميثيوم قوية مقاومة للحرارة، يمكننا نقل البلازما حيث نريد. لكن بسبب طبيعة العنصر الذي نعالجه، لا يمكن وضع الأنابيب تحت التضاريس.

s2_plateworkings=الهيدروجين والأكسجين حفّازان ممتازان عند صهر خاماتنا. يمكننا رفع إنتاج المعادن الأساسية كالنحاس والحديد باستخدام أحد الغازين في الاحتراق. الهيدروجين يعطي إنتاجاً أكثر مع سرعة معالجة أقل قليلاً، أما الأكسجين فتعالج بسرعة هائلة.

s2_intermediate_productivity=زيادة إنتاج العناصر الأكثر تصنيعاً.

s1_algea_rare_metals=المعادن النادرة ضرورية لإنتاج وحدات المعالجة وغيرها من العناصر، لكن لا يوجد مصدر لها على فيستا. يمكننا زراعة سلالة من الطحالب تكلّس هذه المعادن من أجلنا. 

ske_heating_conductor=الحرارة أحياناً هي الحفّاز الوحيد القادر على إحداث تغيير في التركيب الجزيئي. يمكن للموصل الحراري أخذ سوائل أو عناصر متعددة وتعريضها لحرارة شديدة لتكوين مادة جديدة.

hydrogen-sulfide=كبريتيد الهيدروجين مادة ضرورية لإنتاج غاز الديوتيريوم. إذا استطعنا إنتاجه خارج فيستا، فإن صنع الروبوتات الاندماجية مباشرة على كواكب أخرى أقرب إلى الواقع منه إلى الحلم.

ske_carbon_dioxide_offworld=ينبغي أن يكون إنتاج ثاني أكسيد الكربون مهمة بسيطة: تسخين مصدر كربون إلى درجة حرارة قصوى ودمجه بمصدر أكسجين كالماء.
carbon-dioxide=ينبغي أن يكون إنتاج ثاني أكسيد الكربون مهمة بسيطة: تسخين مصدر كربون إلى درجة حرارة قصوى ودمجه بمصدر أكسجين كالماء.

ske_working_with_gases=الغازات تشكل غالبية موارد فيستا. يمكننا جني الغازات من بحر السحاب باستخدام مضخات ساحلية.
ske_gas_giant_platform=التوسع في بحر السحاب ليس صعباً كما يتوقع المرء. البحر كثيف بما يكفي لدعم حتى أثقل الهندسة الأساسية، مما يسمح لنا بالتوسع بسهولة.

