[mod-setting-description]
fs-non-blocking-search=يستغرق البحث وقتاً أطول بكثير لكنه لا يُجمّد اللعبة.
fs-chunks-per-tick=له تأثير فقط عند تفعيل البحث في الخلفية.\nإنقاصه يُبطئ البحث، لكنه يحسّن الأداء أثناء البحث.
fs-initial-zoom=مستوى التكبير الذي تُفتح فيه النتائج. القيمة الأكبر تعني تكبيراً أكثر.\nعادةً بين [font=default-semibold]0.3[/font] و[font=default-semibold]3[/font].
fs-clear-highlights-with-gui=يزيل صناديق التمييز والأسهم عند إغلاق الواجهة.
fs-highlight-duration=عدد الثواني التي تبقى فيها صناديق التمييز والأسهم ظاهرة.\n[font=default-semibold]0[/font] تعني [font=default-semibold]إلى ما لا نهاية[/font].

