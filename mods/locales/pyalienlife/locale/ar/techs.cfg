constant=التسميد هو دائماً  exothermic يعالج.  يسخّن هو مولّدة بواسطة microbial activity و retained بواسطة insulation. عند صناعي الحراشف, هذا residual يسخّن يمكن reach أعلى إلى 250 degrees Celsius. Pouring الماء على  resulting الكتلة الحيوية سي instantly vaporize هو, creating  كبير كمية لـ البخار. Counterintuitively,  vaporization يعالج ينشئ إضافي escape channels لـ existing moistures في  يُسمّد. هذا reduction في  overall moisture المحتوى سي result في يجفّف الكتلة الحيوية.
