[mod-description]
planet-muluna=استكشف قمر نافيس «ملونا»، الذي يرتكز على سحق الكويكبات، واتخطوتك الأولى نحو الفضاء. اكتشف استخدامات جديدة للكسّارات، التي أصبحت متاحة على كل الأسطح. استخدم حزمة علوم الاستكشاف لترقية منصاتك الفضائية والوصول إلى أعماق أبعد من الفضاء.


