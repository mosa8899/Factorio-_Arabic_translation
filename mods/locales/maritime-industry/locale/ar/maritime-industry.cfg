[item-description]
mi-canal-survey-marker=علامة مسار اختيارية لحافر القنوات الكهربائي. تُحفر المربعات المعلَّمة أولاً إذا كانت قابلة للوصول وآمنة؛ وإلا يحفر الجهاز ممره التلقائي.
mi-powered-canal-dredger=حافر قنوات محلي يعمل بالكهرباء، برسومات مخصصة وحركة عمل وعلامات مسح اختيارية. اختر «حفر المرفأ» أو «تجريف المياه العميقة» في الجهاز. زوّده بقطع التجريف المناسبة؛ كل دورة كاملة تحفر مربعاً واحداً على امتداد ممر قناة بعرض 7 وعمق 24 مربعاً. صِله بماء موجود لشق القنوات. لا يلزم مود منفصل لحفر القنوات.
mi-port-network-hub=يجمع قطاعات برج مراقبة الميناء المختلفة ضمن 256 مربعاً، وينشر جاهزية المراسي وسعة/استخدام الانتظار ومعدل التدفق وطول الطابور والازدحام وجاهزية العقود إلى الدائرة دون تغيير جداول السفن.
mi-port-logistics-exchange=مخزن تجميع كبير للشبكة اللوجستية للبضائع المصنّعة والمعبّأة في الميناء. مساحته الكبيرة تبقي تجميع المواد عالية السعة داخل ساحات المحطات الحقيقية.
mi-roro-cargo=مركبة مثبّتة على إطار سطح بحري قابل لإعادة الاستخدام للشحن بالدحرجة (رو-رو). التفريغ يُعيد الإطار والمركبة.
mi-project-cargo=آلة صناعية كبيرة الحجم مثبّتة على إطار رفع ثقيل قابل لإعادة الاستخدام لنقل البضائع المشروعية. التفريغ يُعيد الإطار والآلة.
mi-reefer-cargo=بضاعة حساسة للحرارة مختومة في حاوية مبردة كهربائية قابلة لإعادة الاستخدام بطول 40 قدماً. التفريغ يُعيد هيكل الحاوية المبردة.
mi-berth-controller=واجهة دائرة ومتحكم دخول سفينة واحدة لأقرب مَرسى بحري. يحافظ على حدود القطارات الأصلية التي تتحكم بها الدائرة، وينشر حالة المَرسى والقادمين ومعرّف السفينة وإجمالي الحمولة مرة كل ثانية.
mi-port-control-tower=منسّق حركة قطاع الميناء. كل مَرسى ومرسى انتظار يتبع أقرب برج ضمن 96 مربعاً، مما يمنع تداخل القطاعات من احتساب السفن أو سعة الانتظار أو التدفق مرتين. لا يعدّل جداول السفن أبداً.
mi-anchorage=محطة انتظار متوافقة مع Cargo Ships لمداخل المرفأ. المراسي الجديدة تبدأ بحد سفينة واحدة؛ والمراسي الوجهة التي يديرها المتحكم تستخدم سلوك «الوجهة ممتلئة» الأصلي في Factorio لإيقاف السفن وإطلاقها بأمان.
mi-harbour-entry-signal=إشارة دخول ممر مائي لتنظيم دخول السفن إلى مرفأ مُدار. صِلها ببرج مراقبة الميناء؛ تُغلق عندما يكون «الإمساك بالميناء» أكبر من صفر، وتبقى مفتوحة إذا لم تكن موصولة.
mi-harbour-chain-signal=إشارة سلسلة ممر مائي لحماية تقاطعات المرفأ وكتل الاقتراب مع الحفاظ على حجز المسار الأصلي في Cargo Ships.
mi-quay-edge-section=تبليط مَرسى هندسي متوافق مع ممرات Cargo Ships. افتراضياً تُحسب مربعات الرصيف الموجودة أيضاً كمراسي ساحلية، مما يسمح بتمديد الرصيف فوق المياه العميقة. عطّل إعداد «مربعات الرصيف تُحسب كشاطئ» لإعادة قاعدة المَرسى الأصلية المحدودة العرض.
mi-quay-apron-section=ساحة عمل بعلامات تحذير بجانب المضخات والرافعات ومواضع الرباط. تبقى متوافقة مع ممرات Cargo Ships، وتتبع قاعدة مرساء الشاطئ العميق القابلة للضبط المستخدمة في قطع حافة الرصيف.
mi-quay-foundation-section=أساس ميناء ثقيل مستصلح للآلات وساحات المحطات. يمكنه تحويل المياه الساحلية العادية والضحلة إلى يابسة خرسانية مصقولة، لكن لا يمكن وضعه فوق المحيط العميق المحمي. استخدم قطع حافة الرصيف حيث يجب أن يبقى ممر Cargo Ships نشطاً تحت سطح المَرسى.
mi-loaded-container=صندوق متعدد الوسائط مختوم يحمل __1__ × __2__. التفريغ يسترد هيكل الحاوية الفارغة.
mi-harbour-dredging-section=عمل هندسي ساحلي مجرّد لحفر مربع من يابسة نافيس العادية أو تبليط ميناء إلى ماء مرفأ صالح للملاحة. استخدمه لشق مراسي وقنوات وأحواض مرفأ مستطيلة مباشرة.
mi-deepwater-dredging-section=يُوضع مباشرة على ماء عادي أو ضحل موجود، بما فيه قناة مرفأ محفورة حديثاً، لتعميقها إلى مياه عميقة محمية للسفن ذات الغاطس الكبير. استخدم قطع تجريف المرفأ أولاً لشق قنوات جديدة عبر اليابسة؛ لا حاجة للردم. المربعات المعمّقة ترث حماية الصناعة البحرية من الاستصلاح في المحيط العميق.
mi-deep-draft-quay-edge-section=تبليط مَرسى ثقيل للمحطات عميقة الغاطس. ممرات Cargo Ships تبقى صالحة عليه، والمربع لا يحمل حاجز الغاطس الضحل. يمكن لمربعات الرصيف الموجودة أن ترسّخ امتدادات فوق المياه العميقة عند تفعيل إعداد «مربعات الرصيف تُحسب كشاطئ».
mi-deep-draft-berth=مَرسى Cargo Ships مجدول ثقيل يجب أن يواجه قناة مياه عميقة. يؤسس معيار المحطة لخدمات Panamax وحاويات المحيط وفئة VLCC.
mi-deep-draft-container-berth=نسخة خط حاويات من المَرسى العميق الغاطس. يستخدم شرط التموضع نفسه في المياه العميقة الحقيقية، ومُعدّ لالمحطات الرئيسية لسفن حاويات المحيط.
mi-heavy-container-gantry-crane=رافعة جسرية طويلة المدى عالية التدفق من السفينة إلى الشاطئ لمحطات الحاويات العميقة. يجب أن تواجه مياه عميقة حقيقية، وتستخدم مفتاح التدوير للتبديل بين تحميل السفينة وتفريغها.
mi-ocean-container-ship=ناقلة حاويات رئيسية عميقة الغاطس بضعف سعة فتحات سفينة الحاويات الناقلة الفرعية. تتطلب قنوات مياه عميقة وممرات حافة رصيف عميقة الغاطس.
mi-vlcc=ناقلة خام ضخمة جداً عميقة الغاطس، بضعف نسبة سعة السوائل بالضبط مقارنة بناقلة النفط الخام البحرية. تتطلب قنوات مياه عميقة وممرات حافة رصيف عميقة الغاطس وأذراع محطة خام مخصصة لـ VLCC.
mi-vlcc-crude-loading-arm=ذراع تحميل خام عالية السعة مخصصة لمحطات VLCC فقط. تتزاوج مع فئة وصلة VLCC فقط، ويجب بناؤها بجانب ممر مَرسى مياه عميقة حقيقي.
mi-vlcc-crude-unloading-arm=ذراع تفريغ خام عالية السعة مخصصة لمحطات VLCC فقط. تتزاوج مع فئة وصلة VLCC فقط، ويجب بناؤها بجانب ممر مَرسى مياه عميقة حقيقي.
mi-deep-draft-tanker-berth=نسخة محطة خام من المَرسى العميق الغاطس لخدمات VLCC المجدولة. التموضع يتطلب ممر مَرسى مياه عميقة حقيقي.
mi-quay-wall=جدار بحرية مسلّح من الخرسانة والفولاذ لإنهاء حواف الميناء المستصلحة وتحديد أرصفة صناعية مستقيمة. يمكن بناؤه مباشرة في المياه الساحلية العادية، لكن المحيط العميق المحمي يبقى ممنوعاً.
mi-hull-plate=لوح فولاذي مشكّل في حوض بناء السفن ومُعدّ لتصنيع الهياكل البحرية.
mi-hull-section=قطعة هيكلية جاهزة كبيرة مجمّعة من ألواح الهيكل المشكّلة والهياكل الداعمة والتقويات.
mi-marine-propulsion-unit=حزمة محرك بحري وتروس وعمود دفع متكاملة للسفن المزودة بمحركات.
mi-ship-control-system=حزمة ملاحة وإشارات وتحكم بالآلات لسفينة كاملة.
mi-marine-piping-system=أنابيب وصمامات ومشعبات خدمة ثقيلة جاهزة للسفن الناقلة للسوائل.

