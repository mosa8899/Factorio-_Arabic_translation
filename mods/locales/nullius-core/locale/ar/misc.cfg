nullius-oxygen=ارفع مستوى الأكسجين في الجو. النباتات التي تبثّها في الطبيعة ستفعل ذلك تدريجياً بمرور الوقت. تصريف الأكسجين سيساهم أيضاً. تصريف الهيدروجين أو الميثان أو غيره من العوامل المختزلة سيُبطل جزءاً من الأكسجين.
