[pywiki-descriptions]
ash=معظم الوقود اللاعضوي مثل [item=coal] ينتج الآن [item=ash] عند الحرق، تماماً كما ينتج [item=uranium-fuel-cell] مادة [item=depleted-uranium-fuel-cell] عند الاستهلاك.\n\nإدارة الرماد جزء محوري من مرحلة اللعب المبكرة، إذ سيعطّل الماكينات في النهاية إن لم يُزل من فتحة الإخراج. يمكن ضبط مرشّح على [item=burner-inserter] لإزالة الرماد تلقائياً. ويمكن لـ [entity=solid-separator] المساعدة في تحويل بعض الرماد إلى خامات.
mechanical-inserter=الإدراج الحارق أصبح الآن [item=burner-inserter]. بخلاف اللعبة الأساسية، لا يحتاج إلى وقود.\n\استهلاك الطاقة:\n [entity=burner-inserter]: مجاني\n [entity=inserter]: 16.9 kW\n [entity=long-handed-inserter]: 20.11 kW\n [entity=fast-inserter]: 46.7 kW\n [entity=bulk-inserter]: 169 kW\n [entity=py-stack-inserter]: 1.6 MW\n\nسرعات الإدراج: (من صندوق إلى صندوق)\n [entity=burner-inserter]: 0.78 دورة ذراع/ث\n [entity=inserter]: 1.2 دورة ذراع/ث\n [entity=long-handed-inserter]: 1.2 دورة ذراع/ث\n [entity=fast-inserter]: 2.31 دورة ذراع/ث\n [entity=bulk-inserter]: 2.31 دورة ذراع/ث\n [entity=py-stack-inserter]: 1.8 دورة ذراع/ث\n\nعدد فتحات المرشح:\n [entity=burner-inserter]: 1\n [entity=inserter]: 2\n [entity=long-handed-inserter]: 3\n [entity=fast-inserter]: 4\n [entity=bulk-inserter]: 5\n [entity=py-stack-inserter]: 5\n\nإعدادات الإدراج:\nيمكن ضبط الإدراجات للتعامل مع فتحات محددة فقط من الكيانات. باستثناء فتحات الوحدات، يتيح لك ذلك تحديد الفتحات التي تسحب منها وتدفع إليها الأشياء التي يمكن للإدراج الوصول إليها عادةً.\nالزر على يمين واجهة الإدراج يفتح قائمة الأهداف. ستظهر الأهداف غير الصالحة باللون الأحمر. وستبدو الأهداف دائماً غير صالحة عندما يكون الإدراج شبحاً.\nالإدخال والإخراج والوقود والوحدات واضحة ذاتياً. الحمولة تُستخدم لحمولة صومعة الصاروخ أو صناديق السيارة. ناتج الاحتراق هو فتحات الرماد/علب الوقود/غيرها من العناصر الناتجة مباشرة عن حرق الوقود. المهملات هي فتحات الإخراج للعناصر الفاسدة. التفريغ هو الفتحات التي تستخدمها ماكينات التجميع لتفريغ العناصر عند تغيير وصفتها عبر شبكة الدوائر.\n\nخاص:\n [entity=long-handed-inserter]: يصل إلى بلاطتين بدلاً من بلاطة واحدة.\n [entity=bulk-inserter]: يستفيد من [technology=inserter-capacity-bonus-1].\n [entity=py-stack-inserter]: يستفيد من [technology=inserter-capacity-bonus-1]. يكدّس العناصر على الناقل حتى ثمانية صفوف.
tailings-pond=إن [entity=tailings-pond] منشأة تخزين سوائل ضخمة في الهواء الطلق تتسع لمليون وحدة سائل. ولها آليات مختلفة حسب إدخال غاز أو سائل فيها.\n\nالغازات مثل [fluid=coal-gas] تُصرَّف في الغلاف الجوي. هذا يُتلف الغاز وينشئ كميات هائلة من التلوث. كل 100 وحدة من أي غاز تنتج 15 وحدة تلوث.\n\nبعض الغازات لا تنتج تلوثاً:\n [fluid=oxygen]\n [fluid=hydrogen]\n [fluid=nitrogen]\n [fluid=purest-nitrogen-gas]\n [fluid=pressured-air]\n [fluid=hot-air]\n [fluid=vacuum]\n\nالسوائل مثل [fluid=tar] تُخزَّن في البركة حتى تمتلئ 100%. عند بلوغ هذا الحد تفيض البركة، فتُتلف السائل وتنشئ حلقات من بلاطات التلوث شديدة الاشتعال في المنطقة المتأثرة.\n\nأي سائل يحمل اسم "water" سيتسرّب إلى الماء الجوفي بدلاً من ذلك ولن ينشئ بلاطات تلوث. [fluid=muddy-sludge] أيضاً لن ينشئ بلاطات تلوث. عامل التحويل 500 وحدة سائل مقابل كل بلاطة تلوث. يمكن استخدام بلاطات التلوث لملء البحيرات.\n\nيمكنك إخراج السوائل من البركة بتوصيل [entity=pump] مباشرة بأحد المخارج. ويمكن استخدام [item=red-wire] و[item=green-wire] لقراءة محتويات البركة.
beacon=تستخدم [entity=beacon-AM1-FM1] و[entity=diet-beacon-AM1-FM1] إشارات الراديو لنقل تأثيرات الوحدات إلى ماكينات التجميع القريبة. لكل منارة تردد AM وتردد FM يحددان نطاق التأثير وكفاءة الإرسال واستهلاك الطاقة.\nتتراوح مؤشرات تردد AM وFM من 1 إلى 5.\n\n[entity=diet-beacon-AM1-FM1]\nنطاق التأثير:\n    - AM1: 32\n    - AM2: 24\n    - AM3: 16\n    - AM4: 8\n    - AM5: 2\nكفاءة الإرسال: 0.1 * AM * FM\nاستهلاك الطاقة: AM * (FM ^ 3) / 2 MW\n\n[entity=beacon-AM1-FM1]\nنطاق التأثير:\n    - AM1: 64\n    - AM2: 48\n    - AM3: 32\n    - AM4: 16\n    - AM5: 2\nكفاءة الإرسال: 0.2 * AM * FM\nاستهلاك الطاقة: AM * (FM ^ 3) MW\n\nالمنارة الافتراضية 1AM 1FM تغطي مساحة واسعة بقدرة منخفضة.\nإذا استقبلت ماكينة إشارات متعارضة على تردد AM أو FM فإن الموجات ستتداخل وتُحمّل الماكينة فوق طاقتها.\nالمنارات لا تقبل وحدات الإنتاجية مثل [item=productivity-module-3].
combustion-mixture=يمكنك حرق [fluid=combustion-mixture1] في [entity=gasturbinemk01] لتوليد الكهرباء. كلما ارتفعت حرارة السائل زادت كفاءة التوربين فولّد طاقة أكثر. لـ [entity=gasturbinemk01] حد أقصى للحرارة المقبولة: إذا زوّدته بحرارة أعلى من هذا الحد فسيُقيَّد عندها، فتُهدر الإدخال. التوربينات الأعلى مستوى لها حدود أعلى.
big-mines=لمعظم الخامات سيتولّد كل من تجمّعات الخام القياسية مثل [entity=ore-lead] والصخور الكبيرة مثل [entity=lead-rock]. والأخيرة ضخمة لدرجة أنك ستحتاج إلى منجم كبير مثل [entity=lead-mine]. معظم المناجم الكبيرة تحتاج صيانة، وقد يلزم استبدال [item=drill-head] أو [item=mega-drill-head] بشكل متكرر.\n\nمعظم المناجم تُفتح عبر [technology=big-mines].\nأول منجم كبير متاح هو [entity=salt-mine] عند [technology=energy-1]. لا يحتاج للعمل إلا إلى وقود سائل.

