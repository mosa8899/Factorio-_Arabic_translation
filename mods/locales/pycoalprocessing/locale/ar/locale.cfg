overload=يضبط عدد العناصر المُدخلة في ماكينة التصنيع بما يتجاوز الكمية المطلوبة لوصفة ما. القيمة الافتراضية تستخدم الصيغة التالية: (1.166 / (energy_required / crafting_speed الخاص بماكينة التجميع)، تُقرَّب للأعلى وتُقيَّد بين 2 و100).
future-beacons=تمت إعادة موازنة المنارات للإصدار القادم من مودات باي (البعثة النجمية).\nلكن مع هذا الإعداد يمكنك الحصول على المنارات المتوازنة الآن.\nالتغييرات:\nالمنارات (ليس المنارات الغذائية) كفاءة إرسالها 0.2*am*fm بدلاً من 0.5*am*fm.\nيمكن لـ 5 منارات التأثير على كيان بدلاً من 25.
