BRE-robo-lader-mk2=محطة شحن مطوّرة بقدرة شحن أكبر وفتحات شحن أكثر.
BRE-robo-lader-mk3=محطة شحن عالية الأداء مصمّمة للاستعمال المكثّف في الشبكات اللوجستية الكبيرة.

