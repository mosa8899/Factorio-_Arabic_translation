nullius-terraforming-remote-brown=يستهدف موقعاً على الخريطة عن بُعد لإطلاق طائرة تطوير بنية لاستبدال التضاريس.
nullius-terraforming-drone-red=يستبدل المشهد بتضاريس حمراء في منطقة قطاعات نحو 4x4. يزيل الصخور والهاويات والماء والحطام. سيرفع تقييم التطوير البيئي للكوكب عند استبدال تضاريس غريبة كالبنفسجية أو البركانية أو السوداء (كفاءة 1.25x).
