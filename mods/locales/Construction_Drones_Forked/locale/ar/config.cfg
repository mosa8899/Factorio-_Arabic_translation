[mod-setting-description]
throttling=عند قيمة N، يقسّم منطقة البحث لكل لاعب إلى (N*2)^2 قسمًا. تقليل العدد يحسّن الاستجابة، وزيادته يقلّل استهلاك المعالج.
drone_process_other_player_deconstruction=يسمح للروبات بإتمام مهام فكّ التشييد الخاصة بلاعبين آخرين
drone_process_other_player_construction=يسمح للروبات بإتمام مهام البناء الخاصة بلاعبين آخرين
drone_process_other_player_upgrade=يسمح للروبات بإتمام مهام الترقية الخاصة بلاعبين آخرين
drone_process_other_player_proxies=يسمح للروبات بإتمام مهام التوكيل للاعبين آخرين (الوحدات، الطلبات اللوجستية، إلخ)
construction-drone-search-radius=نصف قطر البحث (بالوحدات) لإيجاد المهام المتاحة.
force-player-position-search=يجبر منطقة البحث على الاختصار حول شخصية اللاعب، بحيث لا تعمل الروبات عن بُعد ما لم تكن المهمة داخل نطاق بحث اللاعب
remote-view-spawn=يسمح للروبات بالظهور من العرض البعيد (لن يعمل هذا عبر الأسطح المختلفة). تحذير: قد تعلق الروبات أحيانًا أثناء عودتها إلى اللاعب
drone-chain-search-radius=بعد إتمام مهمة فكّ تشييد، تبحث الروبات داخل هذا النطاق (بالبلاطات) عن أشباح قريبة يمكنها البناء فورًا بما تحمله من مواد. اضبطه على 0 لتعطيل ربط المهام.

