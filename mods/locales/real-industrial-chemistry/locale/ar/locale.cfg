ric-sulfur-prilling=يصلب الكبريت المنصهر المخزن مرة أخرى إلى كبريت عنصري قابل للنقل.
ric-sulfur-dioxide-absorption=يمتص ثاني أكسيد الكبريت في الماء لتكوين محلول حمض الكبريتيك للأكسدة الرطبة.
ric-wet-sulfurous-acid-oxidation=تمتص الأكاسيد ثاني أكسيد الكبريت إلى حامض الكبريتيك دون إنتاج ثالث أكسيد الكبريت الجاف أولاً.
ric-wet-gas-sulfuric-acid=يحول الكبريت المختزل المتبقي في الغاز النهائي لعملية كلاوس مباشرة إلى حمض الكبريتيك مع استخلاص ثاني أكسيد الكربون.
ric-ethylene-oxide-production=يؤكسد الإيثيلين جزئيًا إلى أكسيد الإيثيلين، وهو المادة الخام لمذيب معالجة غاز الألكانولامين.
ric-amine-solvent-makeup=يصنع مذيبًا مائيًا جديدًا من الألكانولامين من أكسيد الإثيلين والأمونيا.
ric-amine-sour-gas-sweetening=يستخدم مذيب أميني قابل للتجديد لإزالة كبريتيد الهيدروجين وثاني أكسيد الكربون من الغاز الطبيعي الحامض.
ric-rich-amine-regeneration=يمتص البخار الغازات الحمضية من الأمينات الغنية ويعيد معظم المذيبات على هيئة أمين خالي من الدهون قابل لإعادة الاستخدام.
ric-acid-gas-claus-recovery=يحول الغاز الحمضي المركز من مُجدِّد الأمين إلى كبريت أولي وتيار أصغر من الغاز المتخلف.
ric-claus-tail-gas-hydrogenation=يهدرج أنواع الكبريت المتبقية إلى كبريتيد الهيدروجين لإعادة تدويرها في عملية استخلاص الكبريت.
ric-flare-claus-tail-gas=التخلص النهائي في حالات الطوارئ من الغاز المتبقي من عملية كلاوس. يمنع هذا الإجراء حدوث جمود في المصنع ولكنه ينطوي على غرامة شديدة بسبب الانبعاثات.
ric-urea-from-recovered-carbon-dioxide=يستخدم ثاني أكسيد الكربون الصناعي المستعاد كمادة وسيطة لإنتاج اليوريا الإضافي.

ric-hand-dredge-shallow-sediment=قم باسترداد مجموعة صغيرة من رواسب الجرف الضحلة غير المجمعة يدويًا أثناء مرحلة التمهيد.
ric-hand-gather-marine-biomass=جمع الكتلة الحيوية العائمة والساحلية كمصدر أول للوقود المتجدد ومصدر للكربون.
ric-sun-dry-marine-biomass=تقليل محتوى الرطوبة في الكتلة الحيوية البحرية الطازجة باستخدام التجفيف السلبي قبل الاحتراق أو الكربنة.
ric-hand-classify-marine-sediment=يفصل الفحص اليدوي البدائي ما يكفي من المواد الحاملة للحديد والنحاس والكربونات والركام لبدء علم المعادن والبناء.
ric-marine-aggregate-to-stone=تحويل الركام البحري الخشن إلى مواد خام حجرية عامة.
ric-compacted-marine-fill=نزح المياه من الركام المجروف وضغطه في ردم استصلاح أساسي للتوسيع المبكر للمنصة.
ric-shallow-shelf-dredging=ضخ الرواسب البحرية الضحلة وفرزها باستمرار باستخدام كراكة تعمل بالطاقة.
ric-mechanical-classify-marine-sediment=غربلة وتصنيف الرواسب المجروفة ميكانيكيًا إلى مغذيات معدنية مفيدة مع استرداد أفضل من الفرز اليدوي.
ric-carbonise-marine-biomass=الانحلال الحراري للكتلة الحيوية البحرية المجففة إلى مادة اختزال معدنية عالية الكربون ورماد معدني.
ric-engineered-marine-fill=امزج الركام المصنف مع الخبث المعدني والماء الخاضع للتحكم لإنتاج ردم استصلاح هندسي أقوى.
ric-concrete-caisson-foundation=الجمع بين الردم الهندسي والخرسانة المسلحة والصلب في أساسات بحرية متينة للصناعات الثقيلة.
ric-offshore-structural-module=تصنيع مجموعات هيكلية مقاومة للتآكل تستخدمها الكراكات ومعدات الإنتاج البحرية.
ric-concentrate-seawater=قم بإزالة جزء من حمل الماء قبل التبخر الشمسي، مما يؤدي إلى إنتاج محلول ملحي مركز.
ric-evaporate-marine-brine=يعمل التبخر على الطريقة الشمسية على بلورة كلوريد الصوديوم والجبس مع ترك المغنيسيوم والبوتاسيوم والبروميد والليثيوم الذائب في المر المركز.
ric-bittern-potash-crystallisation=يؤدي المزيد من التبخير والتبلور إلى استخلاص السيلفيت مع تركيز البروميد والأملاح النزرة المتبقية.
ric-marine-magnesium-recovery=استخدم كيمياء الترسيب القلوية لاستعادة قيم المغنيسيوم من المر المركز وترك محلول ملحي متبقي غني بالليثيوم.
ric-bromine-from-bittern=أكسدة بروميد في المر المركز مع الكلور واستعادة البروم العنصري مع الاحتفاظ بجزء المحلول الملحي الغني بالليثيوم.
ric-lithium-from-marine-brine=ترسيب وتركيز الليثيوم من المحلول الملحي البحري النهائي باستخدام رماد الصودا.
ric-brominated-flame-retardant=تحويل البروم المستعاد إلى مادة وسيطة مثبطة للهب متوافقة مع البوليمر لمعدات المياه العميقة.
ric-offshore-wellstream-separation=يتم فصل تيارات آبار النفط الخام البحرية إلى النفط الخام والغاز الرطب المصاحب والمياه المنتجة قبل معالجة المصفاة.
ric-wet-gas-dehydration=إزالة السوائل المكثفة من الغاز الطبيعي الرطب، وإنتاج الغاز الحامض، والمكثفات، والمياه المنتجة للمعالجة النهائية.
ric-condensate-stabilisation=تقطير المكثفات المستعادة إلى سائل من نطاق النفتا وغاز وقود.
ric-produced-water-deoiling=استعادة الهيدروكربون المتبقي من المياه المنتجة وتكييف المياه المتبقية كيميائيًا لسلسلة معالجة مياه الصرف الصحي القائمة.
ric-flare-offshore-wet-gas=مسار التخلص في حالات الطوارئ للغاز الرطب غير المعالج عندما تكون سعة الاستخلاص غير متاحة. وهو يضحي بالمواد الأولية وينتج نفايات غازية.
ric-deep-shelf-dredging=استعادة رواسب الرفوف غير المجمعة مع العقيدات وركام الكبريتيد والرمال المعدنية الثقيلة من المياه العميقة.
ric-wash-polymetallic-nodules=إزالة الرواسب الملتصقة ونفايات الصخور قبل معالجة العقيدات التعدينية المائية.
ric-acid-leach-polymetallic-nodules=يقوم ترشيح حمض الكبريتيك بنقل قيم النحاس والنيكل والكوبالت والمنغنيز من العقيدات المغسولة إلى سائل المعالجة.
ric-nodule-selective-precipitation=التحكم في الرقم الهيدروجيني لفصل محلول النحاس عن هيدروكسيد النيكل والكوبالت المختلط والمواد الصلبة المحتوية على المنغنيز.
ric-nickel-cobalt-separation=تفصل كيمياء كبريتات الأمونيا الانتقائية محلول النيكل عن هيدروكسيد الكوبالت.
ric-cobalt-electrowinning=تحويل تغذية هيدروكسيد الكوبالت المنقّاة إلى كوبالت فلزي من خلال عملية استخلاص كهربائي.
ric-crush-hydrothermal-sulfide-rubble=إعداد مادة كبريتيد ضخمة في قاع البحر للتعويم عن طريق سحق وإزالة النفايات الصخرية الخشنة.
ric-flotate-hydrothermal-sulfides=يفصل التعويم الأجزاء الكبريتيدية الحاملة للنحاس والزنك والرصاص عن النفايات الصخرية مع توليد تيار مياه معالجة معاد تدويره.
ric-treat-sulfide-process-water=تحييد وتنقية مياه التعويم الكبريتيدية، مما يؤدي إلى إنتاج مياه الصرف الصحي المعالجة القابلة لإعادة الاستخدام وحمأة هيدروكسيد المعدن.
ric-wet-concentrate-heavy-mineral-sand=تعمل الجاذبية/التركيز الرطب على فصل معادن التيتانيوم والزركون الكثيفة عن الرمال البحرية الغنية بالكوارتز.
ric-magnetic-separate-titanium-minerals=يقسم الفصل المغناطيسي والكهروستاتيك الجزء الثقيل إلى صخور الإلمنيت والروتيل والمونازيت والنفايات المتبقية.
ric-zircon-to-zirconia=التحويل الكيميائي للرمال المحتوية على الزركون إلى زركونيا مناسبة للاستخدام في المواد الحرارية المتقدمة.
ric-zirconia-refractory-brick=استخدم الزركونيا كمادة مضافة سيراميكية ذات درجة حرارة عالية في الطوب الحراري المطور.
ric-rare-earth-mud-acid-digestion=تحلل حمضي لطين العناصر الأرضية النادرة من أعماق البحار لنقل قيم العناصر الأرضية النادرة إلى سلسلة الترشيح المائي لتركيز العناصر الأرضية النادرة (RIC) المعمول بها مع استخلاص جزء الفوسفات.
ric-deep-ocean-dredging=ويؤدي انتعاش أعماق المحيطات عالي الطاقة إلى إنتاج عقيدات، وطين أرضي نادر، ورمال معدنية ثقيلة، ومركزات معدنية مخففة.
ric-recover-refractory-metals-from-nodule-residue=تعمل المعالجة الكاوية المؤكسدة لبقايا العقيدات المتعددة الفلزات على استعادة التنغستن المخفف في صورة سائل تنجستات والموليبدينوم كأكسيد قبل أن يتوفر طريق المعدن الحراري عالي الإنتاجية في أعماق المحيطات.
ric-deep-ocean-trace-metal-recovery=يركز التعدين المائي المعادن النزرة المختلطة الموجودة في أعماق المحيطات على معادن قابلة لإعادة الاستخدام، وأتربة نادرة، وموليبدينوم.
ric-amidoxime-adsorbent=تصنيع مادة ماصة بوليمرية وسطية أوكسيمية لالتقاط كميات ضئيلة من اليورانيوم من كميات كبيرة جدًا من مياه البحر.
ric-seawater-uranium-adsorption=تعريض مادة الامتزاز الأميدوكسيم لكميات كبيرة من مياه البحر لالتقاط آثار اليورانيوم المذاب.
ric-uranium-adsorbent-elution=قم بفصل اليورانيوم من المادة الممتزة المحملة باستخدام الحمض، واستعادة معظم المادة الممتزة لدورة أخرى.
ric-seawater-uranium-precipitation=ترسيب اليورانيوم المركز من الشطافة إلى سلسلة معالجة الكعكة الصفراء/الكيمياء الإشعاعية القائمة.
ric-wash-aluminous-marine-clay=قم بغسل وإزالة الطين من طين قاع البحر من الألومنيوم لاستعادة المواد الصلبة الغنية بالكاولين وجزء من السيليكا للسيراميك والزجاج.
ric-caustic-digest-aluminous-marine-clay=استخدم عملية الهضم الكاوية الساخنة لاستخلاص الألومينا من الطين البحري الألوميني، مما يوفر مادة تغذية غير البوكسيت لعملية الألومنيوم الحالية.
ric-beneficiate-phosphatic-marine-sediment=غسل وتصنيف رواسب قاع البحر الغنية بالفوسفوريت إلى مركزات الأباتيت وشوائب الكربونات لاستخدامها في كيمياء الفوسفات.
ric-recover-fluorite-from-hydrothermal-gangue=تركيز الفلوريت الموجود في النفايات المعدنية الحرارية المائية بحيث لا تعتمد سلسلة حمض الهيدروفلوريك والفلور الحالية على رواسب الفلوريت الأرضية.
ric-gravity-preconcentrate-hydrothermal-sulfides=استخدم فصل الكثافة الخشنة على كبريتيدات قاع البحر المسحوقة لاستعادة تركيز النحاس والزنك والرصاص منخفض الإنتاجية قبل أن يصبح التعويم الكامل متاحًا.
ric-recover-borax-from-marine-bittern=تركيز قيم البورات النزرة من المُرارة البحرية شديدة التطور إلى البوراكس مع الاحتفاظ بسائل متبقٍ يحتوي على الليثيوم.
ric-graphitise-marine-carbon=المعالجة الحرارية لمادة اختزال الكربون الثابتة العالية المتجددة عند درجة حرارة قصوى وتحويلها إلى جرافيت صناعي للأقطاب الكهربائية وعلم المعادن المتقدم.
ric-recover-precious-metals-from-marine-sulfides=تعمل المعالجة الميتالورجية المائية على ترقية الجزء الحامل للمعادن الثمينة من كبريتيدات قاع البحر إلى مغذيات من الذهب والفضة لسلسلة التكرير الحالية.
ric-separate-deep-ocean-refractory-metals=يتم فصل التركيزات الحاملة للتنغستن والموليبدينوم في أعماق المحيطات إلى تغذية الولفراميت والسكايليت والموليبدينيت لمعالجة المعادن المقاومة للحرارة الموجودة.

ric-jaw-crusher=كسارة أولية كهربائية ذات إطار فولاذي لتغذية OpenPit المتطورة والتكسير العام عالي الإنتاجية. مقفلة باستخدام RIC Steel Processing.
ric-gyratory-crusher=كسارة أولية كبيرة عالية الإنتاجية للمناجم والمحاجر الناضجة. تقبل نفس العناصر المعدنية العامة وخلاصات OpenPit الأولية مثل الكسارة الفكية، لذلك لم تعد هناك حاجة إلى الكسارات ذات الموقد بمجرد توفر هذا المستوى.
ric-cone-crusher=كسارة ثانوية وثلاثية لتقليل التغذية المكسرة الأولية وإعادة الشاشة كبيرة الحجم إلى الدائرة.
ric-vibrating-screen=محطة تصنيف الحجم التي تفصل الخام المسحوق إلى كسور خشنة ودقائق ناعمة قبل إثراءه.
ric-gravity-concentrator=مركّز معادن خشن يستخدم فروق الكثافة لرفض النفايات قبل الطحن الناعم.
ric-magnetic-separator=محطة إثراء مغناطيسية للأعلاف الغنية بالماجنتيت وغيرها من التيارات المعدنية القابلة للفصل مغناطيسيًا.
ric-sag-mill=مطحنة كبيرة شبه ذاتية لتقليل الخام المنخل إلى تغذية مطحنة جاهزة للملاط.
ric-ball-mill=مطحنة طحن ناعم تُستخدم في التدفق السفلي للهيدروسيكلون في دائرة طحن مغلقة.
ric-hydrocyclone-cluster=المصنف الرطب الذي يرسل المواد الناعمة المحررة إلى الأمام بينما يعيد التدفق السفلي الخشن لإعادة الطحن.
ric-concentrate-thickener=وعاء الترسيب الذي يزيل ويستعيد المياه المعالجة من المركز المعدني الرطب قبل الترشيح.
ric-concentrate-filter-press=آلة نزح الماء من المركز النهائي التي تنتج مركزًا فلزيًا قابلًا للنقل ومياه معالجة مستصلحة.
ric-recover-topsoil-controlled-release=يستخدم سمادًا يتم التحكم في إطلاقه لاستعادة المزيد من التربة السطحية لإعادة التأهيل من نفس الغطاء الزائد مع كمية أقل من الرماد والماء.
ric-recover-topsoil=الطبقة السطحية التي تمت إزالتها مع الرماد والأسمدة النيتروجينية والفوسفاتية والبوتاسية والمياه لاستعادة التربة السطحية لإعادة تأهيلها عند إغلاق المنجم.
ric-vacuum-secondary-steel-refining=تُنهي معالجة الفولاذ الأساسي بالأكسجين في إطار عملية تكرير ثانوية عالية الطاقة، مما يقلل من فقدان الخبث والشوائب قبل الصب المستمر.
ric-integrated-hot-metal-refining=يجمع بين شحنة صناعة الصلب الساخنة وتنقية الأكسجين في مسار متأخر عالي الإنتاجية يغذي خط الصلب الثانوي.
ric-continuous-cast-steel-slab=يصب الفولاذ المعالج بالتفريغ مباشرة في ألواح مع استهلاك ماء التبريد المعالج وإنتاج تيار أصغر من المياه المستهلكة.
ric-hot-slag-metal-recovery=يستعيد الحبيبات المعدنية المحبوسة من خبث صناعة الفولاذ الساخن باستخدام تحبيب الماء المتحكم فيه قبل تثبيت البقايا المعدنية المتبقية أو إعادة استخدامها.

ric-standard-material-compatibility=تحويل توافق أحادي الاتجاه من مادة الكيمياء الصناعية إلى مادة تعديل خارجية مطابقة. لا يتم توفير مسار عكسي، لذا لا يمكن للإنتاج التابع لجهة خارجية تجاوز تقدم RIC.

ric-ambient-air-filtration=قم بتزويد مرشح Baghouse بوسائل الترشيح والمواد الماصة. تعمل كل دورة مكتملة على إزالة ما يصل إلى 40 وحدة تلوث محلية وإرجاع المواد الماصة المستهلكة لإعادة تدويرها.
ric-carbon-dioxide-mineralisation=تفاعل مع ثاني أكسيد الكربون الصناعي مع ملاط ​​الجير. تنتج الحجر والنفايات السائلة المعالجة. يستخدم ثاني أكسيد الكربون الذي دخل بالفعل إلى نظام معالجة السوائل.

ric-associated-molybdenum-recovery=قم بالتضحية بجزء من تركيز النحاس لاستعادة الموليبدينوم المرتبط دون تكرار التدفق المعدني الأساسي الكامل.
ric-associated-silver-recovery=استعادة المعادن الحاملة للفضة من جزء من مركز الرصاص، مع ترك التركيز المتبقي والمخلفات.
ric-tailings-rare-earth-scavenging=الاسترداد الانتقائي للعناصر الأرضية النادرة في وقت متأخر من اللعبة من المخلفات القديمة باستخدام حمض الكبريتيك والماء.
ric-deep-mine-water-recirculation=المعالجة الصناعية لمياه المناجم، واستهلاك الجير الحي وإعادة المياه القابلة لإعادة الاستخدام بالإضافة إلى حمأة الإثراء.
