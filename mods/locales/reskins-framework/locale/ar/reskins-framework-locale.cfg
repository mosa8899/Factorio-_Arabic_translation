[mod-name]
reskins-framework=Artisanal Reskins: الإطار

[mod-description]
reskins-framework=يخدم كأساس لمودات Artisanal Reskins. يوفّر إطاراً لإدارة الحالة العامة وتفضيلات المستخدم وإعدادات التهيئة الأخرى.

