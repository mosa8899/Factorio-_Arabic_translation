[mod-setting-description]
paracelsin-muria-aqua-regia=لا يوجد هذا الإعداد إلا عندما يكون Muria وParacelsin مُفعّلين معاً، ويُتيح وجود الملك المائي ودمج تقنيتَي تكرير الرصاص والزنك في تقنية واحدة، إلى جانب تعديل وصفات التكرير لتصبح أكثر تحدياً، مما يقرّب Muria من Paracelsin.

