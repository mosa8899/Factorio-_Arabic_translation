ric-lubricant-finishing=تقوم وحدة التكرير التحفيزي (RIC) بمعالجة زيت التشحيم الأساسي بالأحماض لتحويله إلى زيت تشحيم قياسي وترسل محلول الغسل المستهلك إلى معالجة مياه الصرف الحمضية.
