[space-location-description]
paracelsin=أرض قاحلة متجمّدة شديدة النشاط البركاني الجليدي. بحيرات من [fluid=nitrogen] تغطي السطح، تتدفق من محيط جوفي. تنتشر [entity=cryovolcanic-vent]s على السطح إلى جانب عروق [item=tetrahedrite] و[item=sphalerite]، الضرورية لاستخراج [item=zinc]. يوجد [item=vaterite] أيضاً بعروق صغيرة. كل ما يُبنى على الكوكب يجب إبقاؤه دافئاً باستمرار وإلا تجمد، ويجب التخلص من كل المنتجات الثانوية غير المرغوبة لاستخراج الزنك.

