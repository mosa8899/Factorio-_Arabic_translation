warning-no-preset=يبدو أنك لا تستخدم إعداد توليد الخريطة '__1__'. قد تنفد تجمّعات الخام الأولية بسرعة، لكن اللعبة قابلة للعب غير ذلك.
warning-biters=يبدو أنك فعّلت الـ biters. مودات بايانودون ليست متوازنة معهم بعد، ويُنصح بإيقافهم.
warning-quality=تم تفعيل مود الجودة. الدعم يقتصر على تحميله وإمكانية استخدامه، لكنه غير متوازن تماماً، لذا لا يُنصح باللعب معه. المُعيد التدويري على وجه الخصوص غير متوازن بشكل مضحك ولا ينبغي استخدامه أبداً.
2.1-warning=تهانينا على التحديث إلى مودات pY على Factorio 2.1! [color=red]تأكد من عمل نسخة احتياطية من حفظك الحالي وقراءة سجلات التغيير بعناية، فقد طرأت تغييرات جوهرية في التحديث.[/color]

