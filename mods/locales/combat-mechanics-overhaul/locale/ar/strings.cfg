[mod-name]
combat-mechanics-overhaul=إعادة صياغة ميكانيكيات القتال

[mod-description]
combat-mechanics-overhaul=يُعيد صياغة بعض ميكانيكيات القتال وإعدادات الاصطدام. تمنع الجدران معظم مقذوفات العدو من إطلاقها فوقها، مثل قذائف البصّاقات وطلقات البنادق الخرطوشية المعادية. ما زالت مقذوفاتك قادرًا على تجاوز جدرانك الخاصة دون مشاكل. تستطيع الوحدات والمركبات الطائرة الارتفاع فوق الجدران، لكنها تبقى هدفًا للمقذوفات. تُوسَم الوحدات والمنشآت بالوسوم البيولوجية/الميكانيكية والطائرة/الأرضية المنقولة/الأرضية الثابتة المناسبة كي تتأثر ببعض التأثيرات أو تكون محصّنة منها. يضمّ عدة خيارات للمود، من بينها منع تأثّر الوحدات والمركبات الطائرة بالبرك الحمضية على الأرض. كما يوفّر بعض أدوات الاصطدام للمودات الأخرى.

