[item-name]
pump-selection-tool=P.U.M.P.

[shortcut-name]
pump-shortcut=P.U.M.P.

[shortcut-description]
pump-shortcut=اسحب منطقة حول حقل نفط. ستضع الأداة أشباحاً لمضخات النفط وللأنابيب التي تربطها.

[failure]
obstructed-pipe=تعذّر على P.U.M.P. تخطيط الأنابيب. أزل العوائق من المنطقة (أشجار، صخور، ماء، مبانٍ أخرى، إلخ).
missing-resource=لم يجد P.U.M.P. موارد سائلة في المنطقة المحددة.
mixed-resources=لا يمكن لـP.U.M.P. خلط الموارد. 
other-pipes-nearby=أُلغي P.U.M.P. لأن هناك أنابيب أخرى داخل المنطقة المحددة.
extractor-must-be-square=مخطّط P.U.M.P. يتعامل مع الحفارات المربعة فقط. المورد '__1__' لا يتوفر له إلا حفّار(ات) مستطيلة.
no-suitable-extractor=لا يملك P.U.M.P. حفّاراً للمورد '__1__'. أكمل البحث اللازم أولاً.
no-pipe=لا يملك P.U.M.P. أنبوباً. أكمل البحث اللازم أولاً.
no-power-pole=لا يملك P.U.M.P. عموداً كهربائياً. أكمل البحث اللازم أولاً.
no-suitable-power-pole=لا يدعم P.U.M.P. الأعمدة الكهربائية الكبيرة، ولا توجد أعمدة صغيرة متاحة.
too-many-power-poles=نفّذ P.U.M.P. عدداً (كبيراً جداً) من التكرارات لوضع الأعمدة الكهربائية وألغى المحاولة.
too-many-heatpipe-groups=نفّذ P.U.M.P. عدداً (كبيراً جداً) من التكرارات أثناء وضع أنابيب الحرارة وألغى المحاولة.

[warning]
resource-not-planned=تعذّر على P.U.M.P. توصيل المورد: __1__
building-not-heated=لم يستطع P.U.M.P. الوصول إلى المبنى بأنبوب حراري: __1__
building-group-not-heated=لم يستطع P.U.M.P. الوصول إلى مجموعة مبانٍ بأنبوب حراري: __1__

[mod-setting-name]
pump-interface-with-module-inserter-mod=إدراج الوحدات
pump-ignore-research=تجاهل البحث
pump-always-show=إظهار قائمة خيارات البناء دائماً
pump-max-beacons-per-extractor=أقصى عدد منارات لكل مستخرج
pump-min-extractors-per-beacon=أقل عدد مستخرجات لكل منارة
pump-preferred-beacons-per-extractor=العدد المفضّل للمنارات لكل مستخرج 

[mod-setting-description]
pump-interface-with-module-inserter-mod=عند التفعيل، يستعمل P.U.M.P. إعداد 'Module Inserter Extended' لإضافة وحدات إلى الأشباح الموضوعة أيضاً.
pump-ignore-research=عند التفعيل، سيضمّن P.U.M.P. في القائمة خيارات الحفارات والأنابيب غير المفتوحة بالبحث بعد.
pump-always-show=عند التعطيل، لا تُفتح القائمة إلا عند توفر خيارات جديدة، أو عند الضغط على SHIFT أثناء استعمال P.U.M.P.. يمكن تبديل هذا الخيار من إعدادات المود أيضاً.
pump-max-beacons-per-extractor=حد صارم لعدد المنارات التي يمكنها تغطية مستخرج واحد. بما أن المنارات الإضافية تعطي عائدا متناقصاً، يمكن استعمال هذا الإعداد لتجنّب الإسراف.
pump-min-extractors-per-beacon=ضع مناراتك حيث تهمّ حقاً! إذا كان موضع المنارة لا يغطي هذا العدد من المستخرجات، فلن يُؤخذ في التخطيط.
pump-preferred-beacons-per-extractor=أوقف التخطيط لهذا المستخرج بعد الوصول إلى هذا العدد من المنارات. قد تُضاف منارات أخرى في المدى كأثر جانبي لتخطيط مستخرجات أخرى. الإعدادان الآخران المتعلقان بالمنارات لهما الأولوية.

