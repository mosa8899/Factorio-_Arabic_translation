[mod-setting-description]
additional-paste-settings-options-smart_filters=عوامل التصفية الذكية: عند السحب من ماكينة تجميع، يُستخدم المنتج كعامل تصفية بدلاً من المكوّنات.
additional-paste-settings-options-disable_filters=تعطيل عوامل التصفية: يمنع ضبط عوامل التصفية على الإدراجات (السلوك الافتراضي في اللعبة الأساسية هو ضبط المكوّنات كعوامل تصفية).
additional-paste-settings-options-inserter-filter-mode=اختر مصدر عامل التصفية عند اللصق من ماكينة التجميع: المنتجات فقط، أو المكوّنات فقط، أو التنقّل بين الاثنين.
additional-paste-settings-options-train-stop-assembler-products-load-unload-then-input-unloads=عند اللصق من ماكينة تجميع إلى محطة قطار، تُدوَّر الأسماء بترتيب الوصفة: لكل منتج في الوصفة يُطبَّق صيغة التحميل ثم صيغة التفريغ؛ ثم لكل مكوّن في الوصفة يُطبَّق التفريغ فقط. عند الإيقاف، يطابق السلوك لصق الصناديق (تبديل تحميل/تفريغ مختلط عبر قائمة مدمجة واحدة للمنتج والمكوّن).
additional-paste-settings-options-train-stop-assembler-ltn-inputs-bundle-step=يتطلب الخيار أعلاه. يدرج اسم محطة واحداً بين المنتجات والمكوّنات: كل مدخلات الوصفة مدمجة في سلسلة نصية واحدة (مفيد لمحطات بأسلوب LTN). بعد ذلك، تُنفَّذ خطوة التفريغ المعتادة لكل مدخل على حدة.
additional-paste-settings-station_name_load=(__1__) يحتوي رسومات العنصر، و(__2__) يحتوي اسم العنصر
additional-paste-settings-station_name_unload=(__1__) يحتوي رسومات العنصر، و(__2__) يحتوي اسم العنصر
additional-paste-settings-station_name_ltn_all_inputs=(__1__) كل المدخلات كأيقونات نص منسّق (مفصولة بمسافات)؛ و(__2__) أسماء العرض المفصولة بفواصل. يُستخدم فقط عند تفعيل خطوة الحزمة بأسلوب LTN.
additional-paste-settings-se-rocket-landing-pad-name=(__1__) يحتوي رسومات العنصر، و(__2__) يحتوي اسم العنصر
additional-paste-settings-options-requester-multiplier-type=يتيح لك الاختيار بين احتساب المقدار حسب: عدد رزم العنصر؛ أو الكمية التي تستهلكها الوصفة من كل نوع من العناصر؛ أو الوقت المستغرق في تصنيع العنصر.
additional-paste-settings-options-requester-multiplier-value=يحدد المقدار الذي سيُطلب من الصناديق اللوجستية، اعتماداً على نوع المعامل المختار. إذا تم اختيار الوقت، فسيكون المقدار بالثواني المستغرقة في التصنيع.
additional-paste-settings-options-inserter-multiplier-type=يتيح لك الاختيار بين احتساب المقدار حسب: عدد رزم العنصر؛ أو الكمية التي تستهلكها الوصفة من كل نوع من العناصر؛ أو الوقت المستغرق في تصنيع العنصر.
additional-paste-settings-options-inserter-multiplier-value=يحدد المقدار الذي سيُطلب من الصناديق اللوجستية، اعتماداً على نوع المعامل المختار. إذا تم اختيار الوقت، فسيكون المقدار بالثواني المستغرقة في التصنيع.
additional-paste-settings-options-combinator-multiplier-type=يتيح لك الاختيار بين احتساب المقدار حسب: عدد رزم العنصر؛ أو الكمية التي تستهلكها الوصفة من كل نوع من العناصر؛ أو الوقت المستغرق في تصنيع العنصر.
additional-paste-settings-options-combinator-multiplier-value=يحدد المقدار الذي سيُطلب من الصناديق اللوجستية، اعتماداً على نوع المعامل المختار. إذا تم اختيار الوقت، فسيكون المقدار بالثواني المستغرقة في التصنيع.
additional-paste-settings-options-sumup=هل يكون القيمة النهائية مجمّعة عند إعادة اللصق مرة أخرى فوق كيان سبق أن لُصقت عليه إعدادات. إذا مُفعِّل، ستكون القيمة النهائية تجميعية. إذا مُعطَّل، ستُضبط القيمة مباشرةً.
additional-paste-settings-options-request-from-buffer=إذا مُفعِّل، يُضبط صناديق الطلب لطلب المواد من صناديق التخزين المؤقت عند اللصق عليها
additional-paste-settings-options-invert-buffer=إذا مُفعِّل، فبدلاً من لصق المكوّنات في صندوق التخزين المؤقت، يُلصق ناتج الوصفة. يعتمد دائماً على عدد رزم العنصر المنتَج.
additional-paste-settings-options-invert-buffer-multiplier-value=يتطلب الخيار أعلاه (عكس آلية التخزين المؤقت) ليعمل. يحدد المقدار الذي سيُطلب من صناديق التخزين المؤقت، اعتماداً على عدد رزم المنتَج.
additional-paste-settings-paste-to-belt-enabled=يتيح لك لصق عنصر وصفة على ناقل
additional-paste-settings-switch_icon_format=الافتراضي هو [ img=class/name ]، وتفعيل هذا الخيار يحوّل إلى [ class=name ]

