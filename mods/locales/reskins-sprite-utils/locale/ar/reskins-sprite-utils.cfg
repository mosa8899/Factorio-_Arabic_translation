[mod-name]
reskins-sprite-utils=Artisanal Reskins: أدوات الرسوم

[mod-description]
reskins-sprite-utils=مجموعة شاملة من أدوات الأيقونات والرسوم المستقلة لتطوير مودات Factorio. طُوّرت أصلاً لدعم منظومة Artisanal Reskins، وتوفّر أدوات قوية للتعامل مع الأيقونات والرسوم والنماذج الأولية مع أمان تام للأنواع وتحقق واسع.

[mod-setting-name]
reskins-sprite-utils-validation-behavior=سلوك التحقق من المعاملات

[mod-setting-description]
reskins-sprite-utils-validation-behavior=يضبط كيف تُبلّغ أدوات التحقق عن وسيطة غير صالحة.

[string-mod-setting]
reskins-sprite-utils-validation-behavior-throw=إلقاء خطأ
reskins-sprite-utils-validation-behavior-log=تسجيل
reskins-sprite-utils-validation-behavior-off=معطّل

[string-mod-setting-description]
reskins-sprite-utils-validation-behavior-throw=يُثير خطأً ويُوقف بدء التشغيل.
reskins-sprite-utils-validation-behavior-log=يسجّل الخطأ ويكمل.
reskins-sprite-utils-validation-behavior-off=يتخطى التحقق تماماً.
