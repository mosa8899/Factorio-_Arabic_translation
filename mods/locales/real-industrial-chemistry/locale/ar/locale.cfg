ric-closed-loop-solvent-reclamation=استخلاص المذيبات في حلقة مغلقة
ric-closed-loop-mineral-residue-stabilisation=تثبيت المخلفات المعدنية في حلقة مغلقة

ric-vacuum-secondary-steel-refining=فراغ تكرير الصلب الثانوي
ric-integrated-hot-metal-refining=تكرير متكامل للمعادن الساخنة
