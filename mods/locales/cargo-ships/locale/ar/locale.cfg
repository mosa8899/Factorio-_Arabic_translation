[tips-and-tricks-item-name]
cargo-ships=Cargo Ships
cargo-ships-tip-1=بناء الممرات المائية
cargo-ships-tip-2=تحميل وتفريغ سفن النفط
cargo-ships-tip-3=وضع وقيادة القوارب

[tips-and-tricks-item-description]
cargo-ships=تُوضع السفن على [entity=straight-waterway]. تحصل على الممرات المائية بالنقر على زر الممر المائي في شريط الاختصارات أو بالضغط على __CONTROL__give-waterway__.\nيمكن وضع [item=boat] على الممرات المائية أو بشكل مستقل، بحيث يمكن قيادته مثل السيارة.\n\nيمكن ربط كل سفينة ناقلة بستّ [entity=ship-loading-pump] أو [entity=ship-unloading-pump] كحدّ أقصى.
cargo-ships-tip-1=تحصل على الممرات المائية بالنقر على زر الممر المائي في شريط الاختصارات أو بالضغط على __CONTROL__give-waterway__.
cargo-ships-tip-2=يمكن ربط [entity=oil_tanker] بستّ [entity=ship-loading-pump] أو [entity=ship-unloading-pump] كحدّ أقصى لتحميل السوائل وتفريغها.
cargo-ships-tip-3=يمكن وضع [item=boat] على الممرات المائية أو بشكل مستقل، بحيث يمكن قيادته مثل السيارة.
