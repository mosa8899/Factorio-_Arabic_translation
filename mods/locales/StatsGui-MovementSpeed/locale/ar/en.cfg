[mod-name]
StatsGui-MovementSpeed=واجهة الإحصاءات — سرعة الحركة

[mod-description]
StatsGui-MovementSpeed=يضيف سرعة الحركة إلى واجهة الإحصاءات.\n\nيستعمل الإحداثيات، لذا يدعم أي حركة للاعب: البدلة الكهربائية، والمركبات، ومكافآت البلاطات، والأحزمة، والمودات، إلخ.\nيمكن أيضاً عرض السرعة القصوى وكمية الطاقة في الحقيبة لمود Jetpack.

[mod-setting-name]
statsgui-ms-show-sensor=إظهار السرعة
statsgui-ms-jet-fuel= إضافة كمية وقود Jetpack في الحقيبة أثناء الطيران (توافق مع مود Jetpack)
statsgui-ms-max-speed-vehicle= إضافة السرعة القصوى للمركبة
statsgui-ms-max-speed-player= إضافة السرعة القصوى للاعب

[mod-setting-description]
statsgui-ms-max-speed-vehicle= قيم غير دقيقة تماماً


[statsgui-ms]
title-player= سرعة اللاعب = 
title-jet= سرعة الطيران = 
title-vehicle= سرعة المركبة = 
