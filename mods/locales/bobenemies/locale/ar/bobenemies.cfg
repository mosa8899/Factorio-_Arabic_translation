[factoriopedia-description]
bob-basic-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact] عند القتل. [/color][/font]
bob-basic-enemy-2=[font=default-semibold][color=240,180,20]يولّد عوائق. [/color][color=230,230,20]صفراء مُبطِئة.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الانفجار.[/color][/font]\n\nهذه المخلوقات هي الشكل الحياتي المهيمن على ناوفيس. تُظهر عدة أشكال مختلفة، لكنها كلها تنتمي إلى النوع ذاته.\n\nتنفذ [font=default-semibold][color=255,230,192]البصّاقات والديدان[/color][/font] هجماتها بصفراء لزجة وآكلة، بهدف إبطاء أهدافها وهضمها في مكانها. أما [font=default-semibold][color=255,230,192]المعاضّ[/color][/font] فتحاول محاصرة أهدافها، تمزيقها بأرجلها الأمامية وفكوكها القوية، مانحةً الوقت للصفراء كي تؤثر تأثيرها.\n\nوفي مواجهة هدف جيد التدريع، [font=default-semibold][color=255,230,192]تُعد الصفراء التي تستخدمها هذه المخلوقات أخطر ما فيها.[/color][/font] تختلف تركيبة الصفراء لدى ديدان وبصّاقات هذه السلالة قليلاً بحسب حجمها، ويمكنها العمل معاً لـ[font=default-semibold][color=255,230,192]تضخيم تأثير الإبطاء[/color][/font]. وإذا اضطرت مركبة للتوقف وهي تحت هذا التأثير، قد يصبح من شبه المستحيل تحريكها مجدداً.
bob-piercing-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact-blue] عند القتل. [/color][/font]
bob-piercing-enemy-2=[font=default-semibold][color=40,200,200]ردّ الفعل للضرر: غير كهربائي، غير حمضي.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الانفجار، النار، الجسدي، الثقب.[/color][/font]\n[font=default-semibold][color=60,200,60]ضعيف ضد: الحمض، الكهرباء، الليزر، السم.[/color][/font]\n\nيتخلى هذا النوع من الأعداء عن أي صفراء هاضمة في هجماته البعيدة لصالح إطلاق [font=default-semibold][color=255,230,192]أشواك ثاقبة للدرع[/color][/font] بسرعات عالية. ورغم افتقاره إلى الضرر المتواصل الذي تتمتع به سلالات أخرى، فإن هذه الأشواك تتطلب حركة جيدة لتفاديها. مع ذلك، [font=default-semibold][color=255,230,192]مقذوفاتها لن تتمكن من المرور فوق الجدران[/color][/font].\n\nهؤلاء الأعداء [font=default-semibold][color=255,230,192]مقاومون للغاية لكل أنواع الصدمات الحركية[/color][/font]، ويتعافون بسرعة كبيرة، ويُظهرون [font=default-semibold][color=255,230,192]دفعات من السرعة عند التعرض للهجوم[/color][/font]، إضافة إلى حركتهم السريعة أصلاً. تعني هذه السمات أن [font=default-semibold][color=255,230,192]معاضّها أخطر بكثير[/color][/font] من معاضّ السلالات الأخرى. [font=default-semibold][color=255,230,192]الكهرباء لن تُثير غضبها[/color][/font].
bob-electric-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact-orange] عند القتل. [/color][/font]
bob-electric-enemy-2=[font=default-semibold][color=255,120,40]تهديد مضاد للجو. [/color][color=230,230,20]صفراء مُبطِئة. [/color][color=40,200,200]ردّ الفعل للضرر: كهربائي. [/color][color=180,60,230]نيران صديقة.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الكهرباء، الليزر.[/color][/font]\n[font=default-semibold][color=60,200,60]ضعيف ضد: الحمض، النار، السم.[/color][/font]\n\nيتيح استخدام التفريغات الكهربائية في هجماتها لمعاضّ هذه السلالة [font=default-semibold][color=255,230,192]ضرب الأهداف مباشرة خلف الجدران[/color][/font]. كما تستخدم الصفراء التي تطلقها البصّاقات والديدان الكهربائية الكهرباءَ لإحداث شلل مؤقت. والجدير بالذكر أن [font=default-semibold][color=255,230,192]أعداء السلالات الأخرى عرضة لهذا التأثير أيضاً[/color][/font]، وكذلك الأجسام الطائرة التي تتجاهل عادةً برك الحمض على الأرض.\n\nوالتعرض للكهرباء يجعل معاضّ وبصّاقات هذه السلالة [font=default-semibold][color=255,230,192]يتسارعون بشكل ملحوظ[/color][/font]، و[font=default-semibold][color=255,230,192]برك صفرائهم المشحونة كهربائياً قادرة على إثارة غضبهم[/color][/font].
bob-acid-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact-purple] عند القتل. [/color][/font]
bob-acid-enemy-2=[font=default-semibold][color=200,60,60]ضرر متواصل. [/color][color=40,200,200]ردّ الفعل للضرر: ارتطام. [/color][color=70,130,220]هجوم بعد الموت.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الحمض، السم.[/color][/font]\n[font=default-semibold][color=60,200,60]ضعيف ضد: الكهرباء.[/color][/font]\n\nأُعيدت صياغة الصفراء الحمضية لهؤلاء الأعداء لتحقيق أقصى درجات التآكل والاستمرار، على حساب قدرتها على الإبطاء. فهي تلتصق بأي خصم يمشي أو يقود فوقها، [font=default-semibold][color=255,230,192]فتسبب ضرراً فورياً فضلاً عن ضرر متواصل[/color][/font]. وهي قادرة أيضاً على إلحاق [font=default-semibold][color=255,230,192]ضرر أكبر بالمنشآت[/color][/font] مقارنةً بأنواع الحمض المماثلة الأخرى. [font=default-semibold][color=255,230,192]كما قد ينفجر الأعداء برذاذ حمضي عند الموت، أو يطلقون حمضاً عند ارتطامهم بجسم كبير[/color][/font].
bob-explosive-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact-yellow] عند القتل. [/color][/font]
bob-explosive-enemy-2=[font=default-semibold][color=255,120,40]تهديد مضاد للجو. [/color][color=70,130,220]هجوم بعد الموت.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الحمض، الانفجار.[/color][/font]\n[font=default-semibold][color=60,200,60]ضعيف ضد: الكهرباء، النار، الليزر.[/color][/font]\n\nتعتمد السلالة المتفجرة على ضرر لحظي في منطقة واسعة بدلاً من الأساليب البطيئة كالصفراء الهاضمة. لكن هجماتها ليست عشوائية كما تبدو، إذ تُشكَّل بحيث لا تستهدف الحلفاء. لحسن الحظ، [font=default-semibold][color=255,230,192]الدائرة الواسعة للضرر الانفجاري الذي تسببه لا يبدو أنها تستهدف البنية التحتية غير القتالية[/color][/font].\n\nورغم غياب التأثير الهاضم أو المُبطِئ، ينبغي تجنّب البرك التي تتركها هجماتها على الأرض. تمتص هذه البرك مركبات عضوية من التربة تحتها لتحويلها إلى متفجرات إضافية. وبالتالي، [font=default-semibold][color=255,230,192]البرك قادرة على الانفجار مجدداً بعد تأخير، وقد تفعل ذلك عدة مرات[/color][/font]. كما قد ينفجر معاضّ وبصّاقات هذه السلالة عند الموت.
bob-poison-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact-green] عند القتل. [/color][/font]
bob-poison-enemy-2=[font=default-semibold][color=200,60,60]ضرر متواصل. [/color][color=255,120,40]تهديد مضاد للجو. [/color][color=60,200,60]تأثير شفاء. [/color][color=40,200,200]ردّ الفعل للضرر.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الحمض، السم.[/color][/font]\n[font=default-semibold][color=60,200,60]ضعيف ضد: النار[/color][/font]\n\nبدلاً من السموم الكيميائية العادية، يستخدم السمّ الذي تنتجه هذه السلالة مزيجاً من الإنزيمات التي تفرزها خلايا حرة الطفو، مُصمَّمةً لمهاجمة أي مادة تلامسها. تُطلَق هذه الخلايا عبر لعاب المخلوقات أو في سحابات غازية حول أجسادها، وهي قادرة أيضاً على [font=default-semibold][color=255,230,192]إصلاح جروح المخلوقات الحليفة[/color][/font].\n\nتسبب هذه الأعداء [font=default-semibold][color=255,230,192]ضرراً متوسطاً متواصلاً على مساحة واسعة[/color][/font]، لكن أخطر ما فيها هو قدرتها على الشفاء، خاصةً عند اقترانها بسلالات أعداء أخرى.
bob-fire-enemy-1=[font=default-semibold][color=255,230,192]يسقط [item=bob-alien-artifact-red] عند القتل. [/color][/font]
bob-fire-enemy-2=[font=default-semibold][color=200,60,60]ضرر متواصل. [/color][color=255,120,40]تهديد مضاد للجو. [/color][color=180,60,230]نيران صديقة.[/color][/font]\n\n[font=default-semibold][color=200,60,60]قوي ضد: الانفجار، النار، الليزر.[/color][/font]\n[font=default-semibold][color=60,200,60]ضعيف ضد: الارتطام، الجسدي، الثقب.[/color][/font]\n\nكل هجمات مخلوقات هذه السلالة تُشعل حرائق. تُغذَّى هذه الحرائق بمواد كيميائية قابلة للاحتراق وشديدة الحمضية في آنٍ واحد، مما يضمن أن [font=default-semibold][color=255,230,192]حتى المنشآت المقاومة للنار تماماً ليست في مأمن[/color][/font]. ورغم ضعفها في البداية، [font=default-semibold][color=255,230,192]تزداد شدتها كلما أُضيف وقود إضافي عبر هجمات متكررة[/color][/font]، لتصبح في النهاية أشدّ أشكال الهجوم تدميراً ضد المنشآت الدفاعية لدى أي سلالة من المخلوقات المعادية على ناوفيس. وقد [font=default-semibold][color=255,230,192]يمتد اللهب مسافة قصيرة[/color][/font] من نقطة نشوئه.


