nullius-power-switch= اتصل بشبكة الكهرباء باستخدام __1__ ([item=__2__]).
nullius-fumarole=موقع بركاني صالح لمحطة حرارية جوفية أو لاستخراج الغاز البركاني. المحطة الحرارية الجوفية لا تتأثر بالثراء ولا تستنفد المورد. الغاز البركاني اللانهائي ينضب حتى حد أدنى 25% من الإنتاج الأولي.
nullius-fumarole-finite=موقع بركاني صالح لمحطة حرارية جوفية أو لاستخراج الغاز البركاني. المحطة الحرارية الجوفية لا تتأثر بالثراء ولا تستنفد المورد. مصدر غاز بركاني محدود، يختفي عند الاستنفاد الكامل. 
nullius-hydrothermal-vent=مصدر أعماق بحرية للغاز البركاني يمكن استغلاله بمستخرج بحري. الغاز البركاني اللانهائي ينضب حتى حد أدنى 25% من الإنتاج الأولي.
nullius-offshore-extractor=منصة استخراج عائمة للفوهات الحرارية المائية. تتضمن مولّداً حرارياً يزوّدها هي ومضخاتها الملحقة بالطاقة.
or_pole=طاقة المستخرج البحري
nullius-loader=ينقل العناصر من حاوية أو ماكينة إليها بمعدل ناقل مطابق.
nullius-align-conscription-turret=منشأة دفاعية تُطلق أشعة تجنيد على الفصائل المنافسة تلقائياً.
nullius-align-concordance-transmitter=الأندرويدات الوافدة حديثاً ستبدأ في فصيل مع جهاز بث نشط بدلاً من تأسيس فصيلها الخاص. تحمي كل اللاعبين والمباني من التجنيد أثناء نشاطها. تكشف القطاعات البعيدة تدريجياً.
inserterToggleInfo=استخدم Shift+L للتبديل بين الإدراج الطويل والعادي (متاح بعد فتح بحث التمديد)
nullius-cargo-drone-mooring=برج رسوّ. يتطلب مجالاً جوياً غير محجوب بتوربينات الرياح أو أبراج الرسوّ الأخرى.

