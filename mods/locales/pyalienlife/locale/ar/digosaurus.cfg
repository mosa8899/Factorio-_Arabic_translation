[entity-description]
dino-dig-site=مكان يرتاح فيه الديغوصور ويأكل ويُسلّم الخامات.
digosaurus=نوع هجين بين الآرثوريان والفاداي مهيّأ لتعدين خام النيكسيلايت المخفي. قادر على جمع واستخراج قطع صغيرة من النيكسيلايت من التجمّعات التي تتعرض فيها الماكينات لتدهور شديد.
thikat=مخلوق تعدين معدّل وراثياً أكبر وأكثر صلابة يجمع خام النيكسيلايت. يستطيع استخراج ضعف كمية الخام بالطعام نفسه.
work-o-dile=الجيل الثالث من مخلوقات التعدين الوراثية. تسمح له وضعيته ثنائية القدم بتشغيل حفّارة تعدين عالية القدرة.

