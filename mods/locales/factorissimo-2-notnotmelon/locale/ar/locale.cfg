[mod-setting-description]
Factorissimo2-disable-new-tile-effects=يعطّل تأثيرات البلاط الجديدة المضافة في 2.0، ويعيد المصفوفات إلى مظهر 1.1 الأنظف حوافاً.
Factorissimo2-free-recursion=يتيح بناء ترتيبات مصنع تكرارية حتى دون البحث عن أي تقنية من تقنيات التداخل.
Factorissimo2-hide-recursion=يخفي تقنيتي التداخل 1 و2، ولن تتمكن من البحث عنهما.
Factorissimo2-hide-recursion-2=يخفي تقنية التداخل 2، ولن تتمكن من البحث عنها.
Factorissimo2-cheap-research=يعيد تكاليف بحث المصفوفات إلى أسعارها الأصلية بدون عصر الفضاء. البحث عن معظم تقنيات المصفوفات يصبح أرخص.
Factorissimo2-factory-preview-mode=يغيّر طريقة عرض معاينة المصنع.
Factorissimo2-space-architecture=يضف تقنيات لبناء مباني المصنع في الفضاء.

