[technology-description]
mi-expanded-bulk-logistics=عبّئ خام اليورانيوم ومواد عصر الفضاء المتاحة في دفعات جافة سائبة قابلة للتفكيك للنقل البحري.
mi-planetary-containerisation=اشحن منتجات عصر الفضاء المصنّعة والآلات الصناعية المغلّفة والهياكل الكوكبية الثقيلة باستخدام الحاويات البحرية القابلة لإعادة الاستخدام وأطر الرفع.
mi-specialised-shipping=وسّع الأسطول التجاري إلى ما بعد البضائع السائبة والحاويات القياسية والناقلات، ليشمل خدمة مركبات رو-رو وشحن الحاويات المبردة بسلسلة التبريد والبضائع المشروعية الثقيلة وناقلة منتجات متوسطة المدى.
mi-offshore-services=ادعم الحدود الصناعية البحرية بسفن إمداد سريعة وأرصفة خدمات مخصصة ومنصات بحرية كهربائية ودورات إمداد وأخذ عينات معادن واسترداد إنقاذ ساحلي.
mi-integrated-port-logistics=اربط محطات البضائع السائبة والحاويات والناقلات الرئيسية بمركز تبادل لوجستي عالي السعة لنقل وتجميع المواد على نطاق المركز.
mi-maritime-contracts=أضف حل هدف اختياري للتدفق المستمر: مكاتب عقود الميناء تتحقق من عقود الشحن فقط عندما تُبلغ أبراج مراقبة الميناء القريبة عن حركة بضائع حقيقية مؤهلة.
mi-megahub-operations=نسّق قطاعات متعددة من أبراج مراقبة الميناء كمركز صناعي ضخم واحد، وانشر إحصاءات التدفق والطوابير والازدحام على مستوى الشبكة إلى الدائرة.
mi-marine-engineering=أنشئ تصنيعاً بحرياً مخصصاً وإنتاج مكونات ومنزلقة سفن صغيرة قبل فتح النقل المائي الروتيني، كي تتوقف القوارب عن كونها عناصر تُصنع باليد.
mi-shipbuilding=ابنِ حوضاً جافاً تجارياً بعد النقل المائي الآلي، ثم جمّع سفن Cargo Ships والناقلات وسفن الصناعة البحرية بالحجم الكامل من الهياكل ووحدات الدفع والتحكم الجاهزة.
mi-hydrographic-surveying=ارسم خريطة الأرخبيل بسفن مسح مخصصة ومحطات مسح ساحلية بعيدة المدى قبل الالتزام ببنية الشحن الصناعي.
mi-dry-bulk-logistics=أنشئ أول مسار آلي بين الجزر للبضائع الجافة السائبة بمراسي أساسية وتعبئة سائبة ونقل على الرصيف وناقلات سائبة مخصصة.
mi-industrial-ports=طوّر محطات سائبة كاملة النطاق باستصلاح أرصفة مياه ضحلة مسلّحة ومرافق سلطة الميناء ونقل سككي ومخزونات عالية السعة وآلات تكديس واسترداد.
mi-containerisation=وحّد البضائع المصنّعة في حاويات متعددة الوسائط قابلة لإعادة الاستخدام بطول 20 و40 قدماً، ثم انقلها عبر ساحات الحاويات ورافعات السكك والرافعات الجسرية على الرصيف وسفن النقل الفرعي المخصصة.
mi-port-construction=شكّل الخط الساحلي إلى موانئ هندسية: استصلح المياه الساحلية العادية بأساسات الرصيف، وافرش ممرات مراسي Cargo Ships النشطة بأسطح حواف رصيف متوافقة مع الممرات، وجرّف أحواضاً وقنوات مستقيمة صالحة للملاحة، واكسُف الشواطئ بجدران رصيف مسلّحة.
mi-deep-draft-port-engineering=عمّق ماء المرفأ الموجود إلى قنوات مياه عميقة محمية، وابنِ مراسي ثقيلة تُقبل فقط بجانب تلك القنوات، مُعدّاً شبكة الميناء لشحن فئة Panamax وVLCC.
mi-heavy-bulk-shipping=انقل خام البضائع السائبة والفحم على مسارات رئيسية بمقياس Panamax باستخدام ناقلة ثقيلة ورافعة رصيف ثنائية الاتجاه عالية التدفق؛ كلاهما يتطلب مدخلاً حقيقياً لمحطة مياه عميقة.
mi-ocean-container-shipping=طوّر الخدمات اللوجستية للحاويات من خدمة نقل فرعي بين الجزر إلى مسارات رئيسية عميقة بين المراكز باستخدام سفينة حاويات المحيط ورافعة جسرية ثقيلة من السفينة إلى الشاطئ ومَرسى حاويات عميق مخصص.
mi-advanced-port-operations=أضف مراقبة مراسي مرئية بالدائرة، وقبول سفينة واحدة تلقائياً في المَرسى، وتقارير ازدحام على مستوى الميناء، ومراسي مرفأ منسّقة بالأبراج للموانئ الكبيرة متعددة المراسي.
mi-maritime-traffic-control=يضيف إشارات دخول وسلسلة مرفأ تتحكم بها الدائرة إضافة إلى بيانات سعة الانتظار لبرج مراقبة الميناء، مما يسمح بإشارات الممرات المائية الأصلية بتنظيم دخول السفن إلى الموانئ المزدحمة المُدارة.
mi-offshore-industry=أنشئ حدوداً صناعية بحرية بعد أول مسار شحن بحري، لافتاً الطريق إلى استخراج النفط في أعماق البحار وتوزيع الطاقة البحرية لمسافات بعيدة دون الحاجة إلى علوم مشتقة من النفط.
mi-tanker-industry=ابنِ محطات سائلة عالية السعة بناقلات مخصصة للخام والمنتجات والمواد الكيميائية، مع معدات تحميل بحرية مطابقة وخزانات ساحلية ومراسي هندسية مستقيمة.
mi-vlcc-crude-shipping=وسّع الخدمات اللوجستية للنفط البحري إلى خدمة ناقلات ضخمة جداً مع VLCC عميق الغاطس وأذراع خام عالية السعة مخصصة ومَرسى ناقلات مياه عميقة مجدول.

