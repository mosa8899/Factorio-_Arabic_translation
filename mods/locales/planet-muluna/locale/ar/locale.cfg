[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna] امتداد لا نهاية له من الصخور الرمادية. النيازك وفيرة على السطح، وهي غنية بالمعادن والوقود والماء، لكن الوصول إلى تلك الموارد يتطلب سحق النيازك أولاً في [entity=crusher].\n[entity=metallic-asteroid-chunk]: المصدر الرئيسي لـ [item=iron-ore]. [entity=carbonic-asteroid-chunk]: المصدر الرئيسي للوقود الكيميائي على شكل [item=carbon].\n[entity=oxide-asteroid-chunk]: المصدر الرئيسي لـ [fluid=water]. [entity=anorthite-chunk]: مصدر بديل لـ [item=copper-cable] و[item=rocket-fuel].\nلا يمكن حرق الوقود دون مصدر صناعي لـ [fluid=oxygen]. ولا يمكن صنع المنتجات البترولية هنا بتقنيات خارج نطاق فهمنا الحالي.
space-science=عند فتح [item=electromagnetic-science-pack] و[item=agricultural-science-pack] و[item=interstellar-science-pack]، يصبح بإمكانك إنتاج [item=space-science-pack] على المنصات الفضائية باستخدام قطع الكويكبات المعالجة.


[console]
