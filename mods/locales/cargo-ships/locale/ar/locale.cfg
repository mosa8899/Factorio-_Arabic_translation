[entity-description]
boat=قارب صغير وسريع مساحة تخزينه ضيّقة. يمكن وضعه على الممرات المائية أو كمركبة مستقلة.
cargo_ship=سفينة كبيرة قادرة على نقل كمّيات ضخمة من الموارد.
oil_tanker=سفينة كبيرة قادرة على نقل كمّيات ضخمة من السوائل.
pump=يمكن وضعه أيضًا على الماء لتحميل وتفريغ سفن النفط.
port=وجهات للسفن الآلية.
buoy=يقسّم شبكة الممرات المائية إلى كتل، مما يتيح لعدّة سفن العمل على الشبكة نفسها.
chain_buoy=يقرأ الإشارات التالية في المسار لتمكين تحكّم أفضل بالسفن.
bridge_base=جسر قطار آلي يُفتح لتمرير السفن من تحته. ضعه على مقطع مستقيم موجود من الممر المائي.
ship-loading-pump=مضخّة بذراع إخراج طويلة لتحميل السفن الحاملة للسوائل. الطرف الطويل يتصل بالسفن فقط، والقصير يتصل بالأنابيب والقطارات فقط. يمكن وضعها على الماء.
ship-unloading-pump=مضخّة بذراع إدخال طويلة لتفريغ السفن الحاملة للسوائل. الطرف الطويل يتصل بالسفن فقط، والقصير يتصل بالأنابيب والقطارات فقط. يمكن وضعها على الماء.

