angelsaddons-storage=خيارات التخزين في إضافات الملاك

[tips-and-tricks-description]
angelsaddons-storage=يضيف هذا المود مجموعة متنوعة من سيلوهات ومستودعات وخزانات الضغط الخاصة بالملاك بشكل مستقل عن مجموعة مودات الملاك.
angelsaddons-storage-notes=\n\n[font=default-bold]ملاحظات[/font]: السيلوهات عبارة عن صناديق تخزين 4×4 بـ256 فتحة (تختلف النسخ اللوجستية)\n[font=default-bold]ملاحظات[/font]: المستودعات عبارة عن صناديق تخزين 6×6 بـ768 فتحة (تختلف النسخ اللوجستية)\n[font=default-bold]ملاحظات[/font]: خزانات تخزين السوائل تتسع لأحجام أكبر من خزانات اللعبة الأصلية
