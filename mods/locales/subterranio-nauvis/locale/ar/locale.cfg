[tips-and-tricks-item-description]
nauvis-caves=كهوف نافيس مليئة بتجمّعات ضخمة من المعادن، شبيهة بتلك الموجودة على سطح الكوكب. يمكن أيضاً العثور على الألماس تحت السطح. لا توجد سوائل في هذه الكهوف، لكن يمكن تمديد الأنابيب إليها من السطح. لا يوجد ضوء الشمس، لكن الحرارة الجوفية وفيرة.

