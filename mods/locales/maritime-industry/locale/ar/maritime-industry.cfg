[entity-description]
mi-powered-canal-dredger=حافر ساحلي كهربائي. ضعه جزئياً على حدود ماء/يابسة ودوّر الجهاز لتوجيه مخطط البناء الأزرق بعرض 7 وطول 24 مربعاً؛ المخطط العنبري يُظهر قاعدة الآلية 3x2 على جهة الشاطئ. اختر وصفة تجريف وزوّدها بقطع التجريف. يتوقف عندما لا يبقى شيء صالح للحفر.
mi-port-network-hub=منسّق مركز ضخم للميناء يجمع قطاعات برج مراقبة الميناء المختلفة في بيانات دائرة تشمل جاهزية المراسي وسعة/استخدام الانتظار والتدفق والطوابير والازدحام وجاهزية العقود. لا تُعاد كتابة أي جداول.
mi-port-logistics-exchange=ساحة تخزين لوجستية محلية كبيرة لتجميع البضائع متعددة الوسائط والمصنّعة بين معدات المَرسى والخدمات اللوجستية الداخلية.
mi-roro-ship=سفينة بضائع متخصصة سريعة لإطارات حمولة أسطح المركبات القابلة لإعادة الاستخدام وتوزيع مركبات الجزر.
mi-refrigerated-container-ship=خط سريع متخصص للحاويات المبردة كهربائياً ومسارات إمداد الجزر بسلسلة التبريد.
mi-project-cargo-ship=سفينة ثقيلة عميقة الغاطس للآلات كبيرة الحجم قليلة الكمية والبضائع المشروعية ذات الرفع الثقيل.
mi-mr-product-tanker=ناقلة منتجات مكرّرة متوسطة المدى بسعة أكبر بكثير من الناقلة الساحلية، مع استخدام أذراع محطة المنتجات نفسها.
mi-roro-ramp=منحدر نقل محلي طويل المدى لأطراف حمولة رو-رو في محطات المركبات المتخصصة.
mi-project-cargo-crane=رافعة نقل ثقيلة طويلة المدى للبضائع المشروعية قليلة الكمية والآلات كبيرة الحجم.
mi-reefer-yard=ساحة تجميع كبيرة مخصصة للحاويات المبردة كهربائياً ووحدات البضائع الأخرى بسلسلة التبريد.
mi-offshore-service-platform=منصة عمل بحرية كهربائية لدورات الإمداد وأخذ عينات المسح وعمليات الخدمات البحرية. التموضع يتطلب مياه مفتوحة في معظم المساحة تحت المنصة.
mi-offshore-service-pier=محطة مجدولة مخصصة متوافقة مع Cargo Ships لسفن الإمداد البحرية وبضائع الخدمات.
mi-offshore-supply-vessel=سفينة دعم سريعة ضحلة الغاطس لحزم الخدمات ومواد الإصلاح والخدمات اللوجستية للمنصات البحرية.
mi-marine-salvage-yard=منشأة ساحلية تسترد كمية متواضعة من المعادن والإلكترونيات القابلة لإعادة الاستخدام من إنقاذ البحر الناتج عن أعمال الخدمة البحرية.
mi-port-contract-office=مكتب عقود تدفق اختياري. لا يعمل إلا عندما يُبلغ برج مراقبة ميناء قريب عن تدفق مؤهل مستمر، فيحوّل عقود الشحن إلى رصيد عقود.
mi-survey-boat=قارب مسح سريع منخفض السعة يرسم المربعات القريبة باستمرار أثناء التحرك. يمكن قيادته بحرية بحرية أو تحويله إلى نسخة ممر مائي عبر Cargo Ships.
mi-hydrographic-survey-station=رادار ساحلي بعيد المدى شره للطاقة لرسم المحيط المحيط وتحديد الجزر النائية.
mi-port-authority=مبنى تحكم ساحلي لميناء متطور. يوفر رسم خرائط مرفأ محلياً مستمراً ويُرسّخ المجمع الصناعي للميناء.
mi-berth-controller=مراقب دائرة تلقائي لأقرب مَرسى بحري ضمن 24 مربعاً. يُبلغ عمّا إذا كان المَرسى موصولاً أو مشغولاً أو جاهزاً، ويحصي السفن القادمة الفريدة، ويُبلغ عن حمولة العناصر والسوائل ومعرّف السفينة المتوقفة.
mi-port-control-tower=واجهة دائرة مركزية لعمليات المرفأ. كل مَرسى ومرسى انتظار ضمن 96 مربعاً يتبع أقرب برج، لذا لا يؤدي تداخل تغطية الأبراج إلى مضاعفة عدد السفن أو الطابور. يُبلغ عن سعة المَرسى وإشغاله وجاهزيته والسفن القادمة.
mi-anchorage=محطة انتظار مجدولة متوافقة مع Cargo Ships لحركة المرفأ. تبدأ بسفينة واحدة افتراضياً ويمكنها إرسال معرّف السفينة المتوقفة وإجمالي الحركة إلى شبكات الدائرة.
mi-harbour-entry-signal=إشارة ممر مائي متوافقة مع Cargo Ships مُعدّة مسبقاً للتحكم بدخول المرفأ. صِلها ببرج مراقبة الميناء فتُغلق أثناء تفعيل «الإمساك بالميناء»؛ وبدون وصلة دائرة تبقى مفتوحة.
mi-harbour-chain-signal=إشارة سلسلة متوافقة مع Cargo Ships لمداخل المرفأ وتقاطعاته. استخدمها قبل إشارات دخول المرفأ كي لا تدخل السفن تقاطعاً أو حلق مَرسى مسدوداً.
mi-bulk-cargo-terminal=يعبّئ المواد الجافة السائبة غير المغلّفة في دفعات بحرية سائبة عالية السعة ويفرغ الدفعات المستوردة.
mi-bulk-berth=مَرسى مجدول متوافقة مع Cargo Ships للمبتدئين للسفن السائبة الجافة.
mi-industrial-bulk-berth=مَرسى مسلّح متوافق مع Cargo Ships لمحطة سائبة صناعية متطورة.
mi-bulk-ship-loader=رافعة ثنائية الاتجاه طويلة المدى لنقل الدفعات السائبة المعبّأة بين التخزين على الرصيف والسفن الراسية.
mi-heavy-bulk-ship-loader=رافعة سائبة عميقة بمقياس Panamax بمدى وسرعة نقل أكبر. دوّرها 180 درجة للتبديل بين التحميل والتفريغ؛ التموضع يتطلب ممر مَرسى مياه عميقة حقيقي.
mi-bulk-stockpile=تخزين ميناء عالي السعة للدفعات السائبة الجافة. المخزون الكامل يمثل مئات الآلاف من وحدات المادة الخام.
mi-bulk-rail-hopper=مخزن مؤقت بجانب السكك لاستقبال الدفعات السائبة من القطارات أو تجهيز بضائع التصدير للتحميل على السكك.
mi-bulk-rail-transfer-crane=رافعة ثنائية الاتجاه عالية التدفق لنقل الدفعات السائبة بين عربات السكك والمخازن المؤقتة على جانب الميناء.
mi-stacker-reclaimer=آلة ساحة طويلة المدى لنقل الدفعات السائبة بين المخزونات والقماعي وأنظمة الميناء المغذّاة بالنواقل.
mi-handysize-bulk-carrier=سفينة متخصصة للبضائع الجافة السائبة. الدفعات السائبة تمنحها سعة فعلية للمواد الخام أعلى بكثير من سفينة البضائع العامة.
mi-panamax-bulk-carrier=ناقلة رئيسية ثقيلة عميقة الغاطس للبضائع السائبة الجافة. تحمل دفعات سائبة أكثر بكثير من فئة Handysize، لكن هيكلها ومحركها يرفضان فعلياً المياه العادية/الضحلة وممرات حافة الرصيف القياسية؛ استخدم قنوات المياه العميقة ومراسي حافة الرصيف العميقة.
mi-container-packing-station=محطة صناعية لختم البضائع المصنّعة في حاويات متعددة الوسائط قياسية بطول 20 و40 قدماً.
mi-container-unpacking-station=محطة وجهة لتفريغ الحاويات متعددة الوسائط المستوردة واسترداد الصناديق الفارغة القابلة لإعادة الاستخدام.
mi-container-yard=ساحة تخزين كبيرة مبلّطة للحاويات متعددة الوسائط الفارغة والمحملة. يمكن قراءة مخزونها عبر الدائرة لأتمتة المحطة.
mi-container-rail-crane=رافعة نقل ثقيلة لتحريك الحاويات بين عربات السكك وساحة المحطة.
mi-container-gantry-crane=رافعة رصيف طويلة المدى لتحميل سفن الحاويات وتفريغها.
mi-heavy-container-gantry-crane=رافعة جسرية ثقيلة من السفينة إلى الشاطئ تعمل في المياه العميقة فقط، بمدى أطول وحركة إدراج أصلية أسرع لمحطات الحاويات الرئيسية. دوّرها بعد وضعها للتبديل بين التحميل والتفريغ.
mi-container-berth=مَرسى مجدول متوافق مع Cargo Ships مخصص لحركة الحاويات.
mi-deep-draft-container-berth=مَرسى حاويات مجدول متوافق مع Cargo Ships، يُقبل فقط بجانب ممر مياه عميقة حقيقي ضمن خلوص الرصيف الهندسي.
mi-feeder-container-ship=سفينة حاويات سريعة لخدمات النقل الفرعي بين الجزر. تتوسع السعة مع إعداد سعة سفن Cargo Ships، مع بقائها أصغر وأسرع من الناقلة الرئيسية.
mi-ocean-container-ship=خط حاويات ثقيل عميق الغاطس لمسارات رئيسية بين المراكز. السعة تساوي 70% من فتحات سفن Cargo Ships المضبوطة، أي ضعف نسبة الناقلة الفرعية البحرية بالضبط، وهيكلها يرفض فعلياً المياه الضحلة وممرات حافة الرصيف القياسية.
mi-vlcc=ناقلة خام ضخمة جداً لأعلى مسارات النفط البحري حجماً. السعة تساوي 160% من سعة ناقلات Cargo Ships المضبوطة، أي ضعف نسبة ناقلة النفط الخام البحرية بالضبط؛ الهيكل والمحرك يرفضان فعلياً المياه الضحلة وممرات حافة الرصيف القياسية.
mi-tank-farm=مجموعة خزانات ساحلية عالية السعة 3x2 لمحطات الناقلات. تخزن 100,000 وحدة سائل وتبقى قابلة للقراءة بالدائرة للتحكم الآلي بالمخزون.
mi-marine-loading-arm=ذراع تحميل ناقلة المنتجات. فئة وصلة السفينة تتزاوج مع الناقلة الساحلية للمنتجات فقط، فتفصل محطات منتجات التكرير عن خدمات الخام والمواد الكيميائية. يجب أن تتوقف الناقلات بزاوية قائمة على ممر مائي مستقيم.
mi-marine-unloading-arm=ذراع تفريغ ناقلة المنتجات. فئة وصلة السفينة تتزاوج مع الناقلة الساحلية للمنتجات فقط. يجب أن تتوقف الناقلات بزاوية قائمة على ممر مائي مستقيم.
mi-crude-loading-arm=ذراع تحميل نفط خام مخصصة. تتزاوج مع ناقلات النفط الخام فقط، وصندوق السوائل فيها مرشّح للنفط الخام.
mi-crude-unloading-arm=ذراع تفريغ نفط خام مخصصة. تتزاوج مع ناقلات النفط الخام فقط، وصندوق السوائل فيها مرشّح للنفط الخام.
mi-vlcc-crude-loading-arm=ذراع تحميل خام ثقيلة مخصصة للخام فقط، بمعدل مضخة أربع مرات من الحد الأدنى لأذراع الناقلات البحرية. تستخدم فئة وصلة سفن حصرية لـ VLCC، ويُرفض وضعها ما لم يكن ممر مَرسى مياه عميقة حقيقي قريباً.
mi-vlcc-crude-unloading-arm=ذراع تفريغ خام ثقيلة مخصصة للخام فقط، بمعدل مضخة أربع مرات من الحد الأدنى لأذراع الناقلات البحرية. تستخدم فئة وصلة سفن حصرية لـ VLCC، ويُرفض وضعها ما لم يكن ممر مَرسى مياه عميقة حقيقي قريباً.
mi-chemical-loading-arm=ذراع تحميل مواد كيميائية مخصصة. تتزاوج مع الناقلات الكيميائية فقط، فتبقى معدات المحطة الكيميائية منفصلة عن خدمات الخام والمنتجات.
mi-chemical-unloading-arm=ذراع تفريغ مواد كيميائية مخصصة. تتزاوج مع الناقلات الكيميائية فقط، فتبقى معدات المحطة الكيميائية منفصلة عن خدمات الخام والمنتجات.
mi-tanker-berth=مَرسى مجدول متوافق مع Cargo Ships لخدمات الناقلات السائلة. اجعل ممر الرسو مستقيماً وبزاوية قائمة كي تتمكن أذراع التحميل والتفريغ البحرية من الاتصال.
mi-deep-draft-tanker-berth=مَرسى ناقلات مجدول ثقيل متوافق مع Cargo Ships لخدمة خام VLCC. يستخدم شرط تموضع المياه العميقة نفسه كبقية المراسي الثقيلة، ويُفضل دمجه مع أذراع تحميل/تفريغ خام VLCC.
mi-crude-oil-tanker=ناقلة سائلة كبيرة بطيئة لمسارات النفط الخام عالية الحجم. تتوسع السعة إلى 80% من سعة ناقلات Cargo Ships المضبوطة، وتتزاوج مع أذراع التحميل/التفريغ الخام البحرية فقط.
mi-coastal-product-tanker=ناقلة سريعة قصيرة ومتوسطة المدى لمنتجات التكرير والبضائع السائلة العامة. تتوسع السعة إلى نصف سعة ناقلات Cargo Ships المضبوطة، وتتزاوج مع أذراع التحميل/التفريغ البحرية للمنتجات فقط.
mi-chemical-tanker=ناقلة أصغر محمية للمواد الكيميائية الصناعية عالية القيمة. تتوسع السعة إلى 35% من سعة ناقلات Cargo Ships المضبوطة، وتتزاوج مع أذراع التحميل/التفريغ الكيميائية البحرية فقط.
mi-quay-wall=قطعة جدار بحرية مسلّح من الخرسانة والفولاذ لإنشاء حواف مرفأ مستقيمة نظيفة. يمكن بناؤها مباشرة في المياه الساحلية العادية، لكن المحيط العميق المحمي يبقى ممنوعاً.
mi-small-vessel-slipway=منشأة بناء بحرية مبكرة للقوارب وسفن المسح. لا يمكن صنع وصفات السفن في هذه الفئة باليد.
mi-shipyard-fabrication-hall=مبنى تصنيع ثقيل لتشكيل ألواح الهيكل وتجميع وحدات الهيكل والدفع والتحكم والأنابيب.
mi-dry-dock=منشأة بناء سفن كبيرة منخفضة السعة لاستكمال سفن Cargo Ships وسفن الصناعة البحرية التجارية من وحدات حوض البناء الجاهزة.
mi-deep-draft-berth=مَرسى Cargo Ships مجدول ثقيل للسفن عميقة الغاطس من فئة Panamax والحاويات المحيطية وVLCC. يُقبل الوضع فقط عندما يواجه المَرسى المياه العميقة الأصلية/الخضراء العميقة ضمن خلوص الرصيف الهندسي.

