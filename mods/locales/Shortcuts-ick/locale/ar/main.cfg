ick-compatibility-mode=فعّل هذا في حال كان مود شامل يجعل بعض الاختصارات غير قابلة للوصول.
ick-tags=اختر ما إذا كنت تريد وسوماً أو أيقونات أو لا شيء أمام أسماء الاختصارات التي يضيفها هذا المود.\n\nفي قائمة الإعدادات ستكون الوسوم ظاهرة دائماً.

ick-prepare-uninstall=[img=utility.danger_icon] كن حذراً! هذا الإعداد سيفعّل كل المعدات المعطّلة في اللقطة بأكملها. يمكنك كتابة أحد الخيارات الأربعة التالية:\n\n- [color=yellow]uninstall[/color] = يسمح لك بإلغاء تثبيت هذا المود بأمان. \n- [color=yellow]active-defense-equipment[/color] = يفعّل كل معدات الدفاع الشخصي بالليزر، مما يسمح لك بتعطيل إعداد __1__ بأمان. \n- [color=yellow]belt-immunity-equipment[/color] = يفعّل كل معدات المناعة من الناقل، مما يسمح لك بتعطيل إعداد __2__ بأمان. \n- [color=yellow]night-vision-equipment[/color] = يفعّل كل معدات الرؤية الليلية، مما يسمح لك بتعطيل إعداد __3__ بأمان.\n\nإذا أزلت المود أو عطّلت الإعدادات المذكورة أعلاه دون استخدام هذا الإعداد أولاً، فستُفقد كل المعدات المعطّلة.


