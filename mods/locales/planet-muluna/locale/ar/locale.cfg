muluna=ملونا


[space-location-description]
muluna=أكبر قمر طبيعي لنافيس. سطحه خالٍ من الحياة، لكنه غني بالمعادن والمعادن النادرة. النحاس يصعب الوصول إليه، لكن الألومنيوم يمكن أن يكون بديلاً عنه في معظم الأشياء. النباتات يمكن أن تنمو هنا بصعوبة بالغة.


