[mod-name]
reskins-angels=Artisanal Reskins: مودات Angel

[mod-description]
reskins-angels=يعيد تصميم العناصر والكيانات والتقنيات في مودات Angel لإضافة ألوان المستويات وتسميات الأيقونات. يتميز بأيقونات عالية الدقة ونماذج وإضاءة ورسوم محدّثة، ويدعم تخصيص اللاعبين لتسميات المستويات وألوانها وخرائطها. جزء من سلسلة Artisanal Reskins.

[mod-setting-name]
reskins-angels-use-angels-material-colors=استعمال ألوان مواد Angel للمنتجات الوسيطة
reskins-angels-use-angels-material-colors-pipes=استعمال ألوان مواد Angel للأنابيب
reskins-angels-use-angels-tier-colors=استعمال ألوان مستويات Angel
reskins-angels-belts-use-angels-tier-colors=الأناقل تستعمل ألوان مستويات Angel
reskins-angels-use-vanilla-style-ores=استعمال خامات بنمط اللعبة الأساسية
reskins-angels-use-item-variations=تنويعات العناصر
reskins-angels-use-vanilla-chemical-plant-sprites=استعمال مصانع كيميائية بنمط اللعبة الأساسية

# Override metal mixing settings to use filtering terminology
reskins-bobs-mixing-furnace-color=اللون: أفران الترشيح

[mod-setting-description]
# reskins-angels-do-angelsaddons-cab=This string is not yet used; do not translate.
# reskins-angels-do-angelsaddons-mobility=This string is not yet used; do not translate.
reskins-angels-use-angels-material-colors=يُلون التروس والمحامل وكرات المحامل بألوان مواد Angel.\n\nمثال: تروس النيتينول ستكون بنفسجية بدلاً من الرمادي الداكن.
reskins-angels-use-angels-material-colors-pipes=يُلون الأنابيب بألوان مواد Angel.\n\nمثال: أنابيب النيتينول ستكون بنفسجية بدلاً من الرمادي الداكن.
reskins-angels-use-angels-tier-colors=يُلون الهياكل والعناصر ذات المستويات بألوان مستويات Angel.\n\nيُتجاوز بإعداد «تفعيل الألوان المخصصة».
reskins-angels-belts-use-angels-tier-colors=ستستعمل الأناقل والكيانات ذات الصلة ألوان مستويات Angel عند تفعيل "__1__".\n\nيُتجاوز بإعداد «تفعيل الألوان المخصصة».
reskins-angels-use-vanilla-style-ores=يستبدل رسوم Angel لخامات السافيريت والستيراتيت والجيفوليت والكروتينيوم والروبيت والبوبمونيوم برسوم بنمط اللعبة الأساسية.
reskins-angels-use-item-variations=يسمح للسبائك بترتيبات مختلفة عند وضعها على الأناقل أو على الأرض، كما في الخامات المستخرجة.
reskins-angels-use-vanilla-chemical-plant-sprites=ستستعمل المصانع الكيميائية بنمط Angel رسوم وصور اللعبة الأساسية إذا كانت المصانع الكيميائية الأساسية معطّلة.
reskins-bobs-mixing-furnace-color=يضبط لون فرن الترشيح الحجري وأفران الترشيح الفولاذية والغازية وأفران الترشيح الكهربائية.
