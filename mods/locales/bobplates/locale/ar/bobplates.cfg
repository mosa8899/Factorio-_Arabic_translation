[item-description]
bob-fusion-catalyst=تحتوي على الغازات اللازمة لبدء اندماج الديوتيريوم. وعادةً ما تكون هذه الغازات تريتيوم (هيدروجين-3) أو ترالفوم (هيليوم-3).


[technology-description]
bob-alloy-processing=تعلّم كيفية دمج أكثر من مكوّن واحد لصنع سبيكة.
bob-chemical-processing=بحث في استخدام المواد الكيميائية وإنتاجها.
bob-electrolysis=يُستخدم التحليل الكهربائي لفصل العناصر عن سائل.

bob-aluminium-processing=بحث في كيفية تنقية الألومنيوم، وهو معدن خفيف قوي نسبياً.
bob-gold-processing=بحث في كيفية تنقية الذهب.
bob-nickel-processing=بحث في كيفية تنقية النيكل.
bob-lead-processing=بحث في كيفية تنقية الرصاص.
bob-silicon-processing=بحث في كيفية تنقية السيليكون لاستخدامه في الإلكترونيات.
bob-titanium-processing=التيتانيوم معدن خفيف قوي للغاية، لكن يصعب فصله عن خامه.
bob-tungsten-processing=للتنغستن نقطة انصهار مرتفعة جداً، لنتبحث طريقة أخرى لتنقيته.

bob-nitinol-processing=النيتينول سبيكة نيكل وتيتانيوم، لنتعرف على استخداماتها.
bob-invar-processing=الإنفار سبيكة حديد ونيكل، ربما يمكننا استخدامه في شيء ما.


