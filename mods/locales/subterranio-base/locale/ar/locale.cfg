[tips-and-tricks-item-description]
subterranean-caves=يمكن الوصول إلى الكهوف الجوفية بمجرد تزويد الدرع الشخصي بمعدة حفر. استعمل ctrl-enter (افتراضياً) للتنقل بين السطح والجوف. لا يوجد ضوء شمس تحت الأرض، لذا يجب إيجاد مصادر طاقة أخرى. يمكن استعمال أنابيب ونواقل المنجم لربط الموارد بين السطح والكهوف. تنقل نواقل المنجم من السطح الأصلي إلى السطح الآخر، والأنابيب ثنائية الاتجاه.

[tips-and-tricks-item-name]
subterranean-caves=الكهوف الجوفية
