[mod-setting-description]
bobmods-revamp-old-oil=إذا كان مُفعّلاً، سيغيّر هذا الإعداد سلسلة إنتاج معالجة النفط.\nكما يزيل وصفات الكبريت وحمض الكبريتيك في اللعبة الأساسية ويضيف طريقة للحصول على الكبريت وثاني أكسيد الكبريت إذا كان MCI مُثبّتاً.
bobmods-revamp-oil=إذا كان مُفعّلاً، سيجري هذا الإعداد تغييرات أكثر واقعية على سلسلة معالجة النفط.\nيستبدل مخرجات غاز البترول في معالجة النفط بالغاز الحامضي الذي يمكن معالجته إلى غاز بترول.\nيزيل وصفات الكبريت وحمض الكبريتيك في اللعبة الأساسية ويضيف كبريتيد الهيدروجين إلى وصفة معالجة الغاز الحامضي إذا كان MCI مُثبّتاً.\nسيأخذ الأولوية على إصلاح النفط والكبريت القديم.
bobmods-revamp-hardmode=إذا كان مُفعّلاً، سيوسّع هذا الإعداد بعض العمليات الكيميائية المبسّطة لتصبح أكثر واقعية.\nسيؤثر ذلك على وصفات ثاني أكسيد النيتروجين وحمض النيتريك وحمض الكبريتيك وفوق كلورات الليثيوم وكلوريد الكالسيوم وكربونات الصوديوم وأكسيد الكوبالت وتكسير غاز البترول إلى هيدروجين.
