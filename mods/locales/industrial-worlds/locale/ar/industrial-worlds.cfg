[technology-description]
iw-nullia-spaceflight=بعد هندسة صواريخ Nullius الأصلية، اصنع صومعة إطلاق ومعدات مدارية من صناعة Nullius.
planet-discovery-nauvis=أنشئ منصة فضائية ومحرك دفع حقيقيين قبل بحث رحلة العودة من كوكب البداية المختار إلى ناوفيس.
iw-nullia-thermal-power-1=ابنِ غلايات كهربائية عالية الحرارة لتغذية التوربينات البخارية المحلية. يتطلب ذلك شبكة كهربائية قائمة.
iw-nullia-precision-instruments-1=اصنع ماكينة تجميع ثقيلة ومقاييس ضغط وأدوات مختبرية باستخدام ماكينات نوليا.
iw-nullia-physics-science-1=أنتج أول حزمة علوم فيزياء مؤقتة في نوليا للأبحاث المتقدمة لاحقاً.

iw-nullia-robotics-infrastructure-1=ابنِ مولّداً يعمل بالبخار ومكبر صوت قابل للبرمجة. لا يزال توفير البخار شرطاً للتكامل.
iw-nullia-heavy-machinery-1=اصنع محركات ميكانيكية ثقيلة وهياكل للمعدات المتقدمة لاحقاً.
iw-nullia-robotics-machinery-1=اصنع إدراجات دقيقة ودوارات توربينات ووحدات تحكم بالإشارات لشبكة الأتمتة المحلية. تصاميم IW مؤقتة.
iw-nullia-robotics-control-1=اصنع مشغلات الروبوتات وأجهزة الإرسال والإلكترونيات الحاكمة محلياً قبل البناء الآلي. تصاميم IW مؤقتة.
iw-nullia-logistics-robotics-1=أدخل روبوتات توصيل تابعة لنوليا وصناديق تزويد خاملة، باستخدام شبكة مراسي روبوتات البناء.
iw-nullia-logistics-request-1=فعّل الطلب المُتحكَم به بالدائرة باستخدام صناديق طلب مخصصة من نوليا.
iw-nullia-robotics-components-1=اصنع مستشعرات بصرية مشتقة من المصدر وأول هياكل روبوتات باستخدام الفولاذ والمحركات والدوائر المتقدمة المحلية.
iw-nullia-construction-robotics-1=انشر روبوت بناء ومرسى روبوتات مخصصين من نوليا يعملان بالشبكة الكهربائية المحلية.
iw-nullia-steel-metallurgy-1=صهر فولاذ الأكسجين من سبائك حديد نوليا، مع الاحتفاظ بالحصى وثاني أكسيد الكربون، وتشكيل صفائح وقضبان وتروس وأسلاك ومحامل فولاذية.
iw-nullia-precision-engineering-2=استخدم كابل فولاذياً مزلقاً ومحركاً II لبناء ماكينة تجميع دقيقة أسرع في نوليا.
iw-nullia-copper-processing-1=اسحق خام النحاس الأصلي، واسترد محلول النحاس، وأنتج السبائك كهربائياً، واسحب سلك نحاس مزلقاً.
iw-nullia-electrical-fabrication-1=شكّل قطع ألومنيوم وصفائح حديد بنسب المصدر لصنع مكثفات ومصابيح ومُركّبات قابلة للبرمجة محلية.
iw-nullia-electrical-science-1=أنتج حزمة العلوم الكهربائية من المُركّبات والمصابيح والأسلاك النحاسية والمكثفات المحلية.
iw-nullia-power-distribution-2=ابحث عن محطة توزيع فرعية مخصصة لنوليا باستخدام العلوم الكهربائية.
iw-nullia-masonry-materials-1=استرد الحصى من الحجر، وحوّل جير نوليا والسيليكا وهيدروكسيد الألومنيوم إلى أسمنت وخرسانة.
iw-nullia-chemical-supplies-1=أنتج مادة التزليق بحمض الهيدروكلوريك المسترد، واملأ براميل الأمونيا الخاصة بـIW.
iw-nullia-polymer-chemistry-1=استرد البلاستيك باستخدام كيمياء PVC والبولي بروبيلين المطابقة للمصدر؛ واحتفظ بكلوريد الهيدروجين لإعادة تدويره.
iw-nullia-chemical-science-1=مدخلات العلوم الكيميائية الأصلية من Nullius: الزجاج والخرسانة وبرميل الأمونيا وهيدروكسيد الصوديوم وحمض الكبريتيك ومادة التزليق المحلية.
iw-nullia-chemical-plant-engineering-2=استخدم العلوم الكيميائية لبناء مفاعل نوليا الكيميائي II الأسرع دون تغيير ماكينات الكواكب الأخرى.
iw-nullia-sulfur-chemistry-1=حوّل ثاني أكسيد الكبريت البركاني إلى حمض كبريتيك؛ واسترد البوكسيت من الطين المعدني مع الاحتفاظ بمياه الصرف ومنتجات ثاني أكسيد الكبريت الثانوية.
iw-nullia-volcanic-geochemistry-1=استخرج الغاز البركاني الساخن من فوهات نوليا وجزّئه إلى ثاني أكسيد الكبريت وهواء وأول أكسيد الكربون وحمض البوريك باستخدام كيمياء Nullius المطابقة للمصدر.
iw-nullia-mineral-processing-1=سحق البوكسيت والتعويم القلوي واختزال الألومينا وتكليس الحجر الجيري وفق المصدر، مع الحفاظ على الطين والكربيد وثاني أكسيد الكربون كمنتجات ثانوية.
iw-nullia-gas-compression-1=اضغط واسترد الغازات المحلية لتخليق الأمونيا المعتمد على الضغط. نسب الضغط تتبع Nullius*.
iw-nullia-industrial-composites-1=أنتج ألياف زجاجية وفايبرغلاس ومسحوق سيراميك وزجاجاً صلباً وإيبوكسيد وبورون من تصنيع مطابق للمصدر، بما في ذلك حمض البوريك المسترد من الغاز البركاني.
iw-nullia-gas-fractionation-1=قسّم هواء نوليا إلى نيتروجين وثاني أكسيد الكربون. يتطلب فاصل غازات مخصصاً.
iw-nullia-nitric-chemistry-1=أنتج الأمونيا من النيتروجين والهيدروجين المضغوطين، ثم حمض النيتريك. بنسب Nullius* المطابقة للمصدر.
iw-nullia-high-purity-silicon-1=نقّ السيليكون باستخدام كلوريد الهيدروجين والنيتروجين، مسترداً الهيدروجين والكلور.
iw-nullia-residual-gas-fractionation-1=استرد الغازات المتبقية والأرجون دون إلغاء المنتجات الثانوية لوصفة المصدر.
iw-nullia-monocrystalline-silicon-1=نمّ سيليكوناً أحادي البلورة من مادة بولي بلورية والأرجون.
iw-nullia-processor-manufacturing-1=معالج تجريبي يستخدم سيليكوناً أحادياً أصلياً وأرجوناً وحمض نيتريك، لكن بمواد كهربائية وسيراميكية محلية مؤقتة.
iw-nullia-electronic-components-1=اصنع أسلاكاً حديدية وألواح دوائر سيليكونية من المعادن والمواد الكيميائية الصناعية المستردة محلياً. تجميع الدوائر المؤقت تكيف من IW.
iw-nullia-advanced-automation-1=ابحث عن ماكينة تجميع مُحسّنة حصراً في نوليا باستخدام لوحات التحكم المحلية وعلوم الإلكترونيات.
iw-nullia-silica-processing-1=اسحق الحجر الرملي واغسل الرمل بماء مالح لاسترداد السيليكا؛ ويمكن إعادة تدوير مياه الصرف.
iw-nullia-glassworking-1=أنتج الزجاج والطوب الحراري من السيليكا باستخدام الفرن الكهربائي المبكر.
iw-nullia-materials-science-1=علم مواد مؤقت في نوليا قائم على السيليكا والمواد الكيميائية المستردة من النفايات وفق المصدر.
iw-nullia-fluid-storage-1=ابنِ خزان تخزين صناعي حصري لنوليا باستخدام الزجاج والطوب الحراري.
iw-nullia-wastewater-treatment-1=استعد الماء المالح من مياه الصرف واسترد الملح من المحلول الملحي.
iw-nullia-brine-electrochemistry-1=استخرج الهيدروجين والكلور وهيدروكسيد الصوديوم من المحلول الملحي؛ ووسّع كيمياء الكلور.
iw-nullia-waste-byproduct-recovery-1=جفّف الطين وأنتج حمض الهيدروكلوريك من الغازات المستردة.
iw-nullia-android-replication-1=اصنع جسد روبوت بشري خامل من المستوى الأول وارفع الوعي إليه محلياً. تتوفر صيانة أولية بخلية كهروكيميائية واستعادة إعادة ظهور محلية. لا نقل بين العوالم ولا صيانة أكسجين ولا فيزيولوجيا كاملة للروبوت بعد.
iw-nullia-geology-1=طرق جيولوجيا مبكرة مكيفة من Nullius*: استخرج البوكسيت الأصلي لبدء البحث.
iw-nullia-iron-smelting-1=أول تنقية لسبائك الحديد في نوليا، مكيفة من Nullius*.
iw-nullia-iron-working-1=تشكيل الحديد الأساسي في نوليا، مكيف من Nullius*.
iw-nullia-fluid-collection-1=جمع مياه البحر والغازات الجوية من المستوى الأول.
iw-nullia-climatology-1=تحلية الماء وأبحاث بيئية مبكرة.
iw-nullia-mechanical-engineering-1=تروس ومحركات وعلوم ميكانيكية من المستوى الأول. وصفات تروس ومحركات محلية مؤقتة.
iw-nullia-automation-1=تفتح أول ماكينة تجميع كهربائية في نوليا.
iw-nullia-electrolysis-1=تحليل الماء كهربائياً مكيف من Nullius*: الهيدروجين والأكسجين للتصنيع الكهروكيميائي.
iw-nullia-android-support-1=معدات طاقة وأغطية قابلة للارتداء تمهيدية؛ نقل الجسد البشري الآلي الأول يُبحث بشكل منفصل.
iw-planet-discovery-pyanodons=تحدد عالم بيانودونز الصناعي وتفتح السفر إليه عبر المنصة الفضائية.
iw-planet-discovery-angelus=تحدد أنجلوس وتفتح السفر عبر المنصة الفضائية إلى النظام البيئي الصناعي Angel/Bob.
iw-planet-discovery-nullia=أساس تجريبي مشتق من Nullius مع بحث وإنتاج ودعم كهربائي جزئي؛ التقدم الكامل للروبوتات البشرية والتغيير الجوي غير متاح في هذا المصدر التطويري.

iw-nullia-advanced-circuitry-2=أنتج محولات وأنابيب صناعية وكابلات إشارات ملوّنة وكابلات بصرية في نوليا.

iw-nullia-advanced-fabrication-1=طوّر محركات وأجزاء ماكينات وإلكترونيات محجوبة أكثر دقة في نوليا.
iw-nullia-applied-physics-1=اصنع مستشعرات تجريبية وغرف رنين وأجهزة فيزياء.
iw-nullia-power-systems-2=طوّر منظمات حرارية ووحدات تحكم بالطاقة لأجهزة الفيزياء المعقدة.

