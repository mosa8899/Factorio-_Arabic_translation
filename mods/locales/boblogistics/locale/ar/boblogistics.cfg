[mod-setting-description]
bobmods-logistics-flyingrobotframes=إذا ضبطت على صحيح، ستكون هياكل الروبوتات الطائرة (مادة وسيطة) متاحة لاستخدامها في الوصفات.
bobmods-logistics-robotparts=إذا ضبطت على صحيح، ستكون أدوات ودماغ الروبوت اللوجستي والبنائي (مواد وسيطة) متاحة لاستخدامها في الوصفات.
bobmods-logistics-robotrequireprevious=إذا ضبطت على صحيح، يتطلب روبوت البناء واللوجستي الطبقة السابقة لتصنيعه.
bobmods-logistics-drainlessinserters=إذا ضبطت على صحيح، سيُزال استنزاف الطاقة في وضع السكون من جميع الإدراجات.
bobmods-logistics-disableroboports=إذا ضبطت على صحيح، ستُعطَّل موانئ الروبوتات القياسية، ما يجعلك معتمداً على موانئ الروبوتات المعيارية. يشمل ذلك موانئ الروبوتات المدمجة من معدات بوب ومعدات المركبات.
bobmods-logistics-beltrequireprevious=إذا ضبطت على صحيح، تتطلب الناقلات والكيانات المتعلقة بها الطبقة السابقة لتصنيعها.
bobmods-logistics-inserterrequireprevious=إذا ضبطت على صحيح، تتطلب الإدراجات الطبقة السابقة لتصنيعها.
bobmods-logistics-inserteroverhaul=سيؤدي تشغيله إلى تطوير شامل للإدراج: إضافة مستويات جديدة وكتابة كاملة جديدة لوصفات الإدراج. كما يزيل الإدراج ذو اليد الطويلة، لكنك تستطيع تحويل أي إدراج إلى ذي يد طويلة.
bobmods-logistics-beltoverhaul=سيؤدي تشغيله إلى تطوير شامل للناقلات: إضافة مستوى جديد وموازنة السرعات وكتابة كاملة جديدة لوصفات الناقل.
bobmods-logistics-ugdistanceoverhaul=سيؤدي تشغيله إلى تغيير مدى جميع الناقلات والأنابيب تحت الأرض.
bobmods-logistics-beltstarting=يحدد مدى الناقل في الطبقة الأولى.
bobmods-logistics-beltperlevel=يحدد بمقدار كم يطول مدى كل طبقة من الناقلات تحت الأرض.
bobmods-logistics-pipestarting=يحدد مدى جميع الأنابيب في الطبقة الأولى.
bobmods-logistics-pipeperlevel=يحدد بمقدار كم يطول مدى كل طبقة من الأنابيب تحت الأرض.
bobmods-logistics-beltoverhaulspeed=إذا ضبطت على صحيح، ستُحدَّث سرعات الناقلات.
bobmods-logistics-beltspeedperlevel=يحدد سرعة حركة العناصر لكل طبقة من الناقلات إذا كان إعداد تطوير شامل لسرعة الناقل مفعلاً. يرجى استخدام مضاعفات 1.875.
bobmods-logistics-fluidwagonbase=يحدد كمية السوائل التي تخزنها عربة السوائل بالآلاف (الافتراضي 50، أي 50 ألف).
bobmods-logistics-storagetankbase=يحدد كمية السوائل التي يخزنها خزان التخزين بالآلاف (الافتراضي 25، أي 25 ألف).
bobmods-logistics-trains=إذا ضبطت على صحيح، ستتوفر قطارات جديدة (قواطير وعربات).


