[space-location-description]
corrundum=كوكبٌ يكسوه غاز ثاني أكسيد الكربون مع كمية من الأكسجين تكفي للاحتراق. ولذلك فإن الضغط ودرجة الحرارة مرتفعان هنا. وقد ضمن تأثير الاحتباس الحراري المتسارع أن الظروف أقسى من ظروف فولكانوس، مع غياب أي أثر للحياة بين التراب والعواصف البرقية. والضغط العالي يجعل غاز البترول - الذي يكون متطايراً عادةً - سائلاً هنا، وبكميات هائلة. الحديد والنحاس محبوسان معاً في الغالب على هيئة كالكوبرايت. أما المعدن المهم هنا فهو البلاتين، الذي يُستخدم محفّزاً في معالجة الكبريت المتقدمة، ومصعداً ومهبطاً في التفاعلات الكهروكيميائية. ولا بد من سلسلة تصنيع فريدة من نوعها تتمحور حول الكبريت لإتقان هذا الكوكب.

