[entity-description]
oil_rig=منصّة تنقيب ضخمة عائمة لاستخراج النفط من أعماق البحر. تتضمّن توليدًا كهربائيًا على متنها (إلا إذا عُطّل) وشبكة كهربائية تزوّد منصّة النفط نفسها والمضخّات المتصلة بها بالطاقة.
offshore-oil=تجمّع كبير من نفط الأعماق. استخرجه بمنصّة النفط.

[technology-name]
deep_sea_oil_extraction=استخراج النفط من الأعماق

[technology-description]
deep_sea_oil_extraction=استخراج __ENTITY__offshore-oil__

[mod-setting-name]
no_shallow_oil=النفط البحري في المياه العميقة فقط
no_oil_for_oil_rig=__ENTITY__oil_rig__ بلا حزمة الكيمياء
oil_rig_capacity=سعة __ENTITY__oil_rig__ ×1000
oil_rigs_require_external_power=مولّد منصّة النفط الداخلي

[mod-setting-description]
no_oil_for_oil_rig=يزيل شرط حزمة الكيمياء المسبق لمنصّات النفط. فعّله إذا كنت تلعب دون تجمّعات نفط برّية.
no_shallow_oil=فعّله للسلوك القديم، لمنع ظهور النفط البحري في المياه الضحلة.
oil_rig_capacity=التخزين الداخلي لمنصّة النفط.
oil_rigs_require_external_power=[font=default-bold]صغيرة:[/font] لدى منصّات النفط مولّد صغير على متنها تدعمه الشبكة الكهربائية عند استعمال الوحدات (هذه هي الوضعية الطبيعية).\n[font=default-bold]لا شيء:[/font] لا تعمل منصّات النفط إلا عند ربطها بالشبكة الكهربائية.\n[font=default-bold]غير محدودة:[/font] لا يمكن ربط منصّات النفط بالشبكة الكهربائية ويمكنها دائمًا العمل بالطاقة الكاملة.

[string-mod-setting]
oil_rigs_require_external_power-enabled=لا شيء
oil_rigs_require_external_power-only-when-moduled=صغيرة
oil_rigs_require_external_power-disabled=غير محدودة

