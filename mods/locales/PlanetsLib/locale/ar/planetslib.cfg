[mod-setting-description]
PlanetsLib-warn-on-hidden-prerequisites=يُحذّر اللاعب عند تحميل لعبة فيها متطلبات مخفية.
PlanetsLib-update-vanilla-recipe-productivity-techs=يضيف كل الوصفات ذات الصلة إلى تقنيات إنتاجية الوصفات في اللعبة الأساسية إن لم تكن مضافة. يجب أن يبقى مُفعّلاً أثناء الاستعمال الطبيعي، لكنه قد يسبب مشاكل توافق مع المودات القديمة.
PlanetsLib-unlink-hidden-prerequisites=كلما كانت تقنية متطلباً كانت مخفية أيضاً، تُزال كمتطلب حتى لا تُحجب التقنية اللاحقة.
PlanetsLib-enhanced-tooltips=يضيف تلميحات جديدة إلى النماذج الأولية تعرض للمستخدم معلومات كانت مخفية سابقاً.
PlanetsLib-enable-entity-replacements=يفعّل استبدالات الكيانات غير المرتبطة بإعداد بدء تشغيل آخر. متاح كملاذ عند إلغاء تثبيت مود فشل مطوروه في ربط استبدالات كياناته بإعداد.
PlanetsLib-disable-all-entity-replacements=يعطّل قسرياً كل استبدالات الكيانات في كل المودات. لا ينبغي الحاجة إليه إلا إذا كان مود مُهيَّئاً بشكل خاطئ جداً.
PlanetsLib-enable-runtime-rocket-silo-replacements=إذا ضبطت الكواكب مضاعف رفع الصاروخ أو مضاعف أجزاء الصاروخ، ستُطبَّق استبدالات صوامع الصواريخ أثناء التشغيل. عطّل هذا الإعداد لتعطيل السلوك بأمان وإلغاء الاستبدالات في ملفات الحفظ إذا استعمل مود هذه الميزة بشكل غير آمن.
PlanetsLib-enable-lab-science-pack-preview-size-change=يغيّر حجم أيقونات حقائب العلم في المختبرات بنمط ALT حسب عدد حقائب العلم التي يقبلها المختبر.
