[mod-setting-description]
bobmods-plates-cheapersteel=إن فُعّل، ستكلف الصفيحة الفولاذية صفيحتَي حديد بدلاً من 5.
bobmods-plates-batteryupdate=إن فُعّل، ستُستبدل وصفة البطارية بوصفة أكثر اتساقاً مع المود.
bobmods-plates-inventorysize=تجاوز لحجم حقيبة الشخصية. وسيغيّر هذا سعة تخزين شخصية اللاعب.
bobmods-plates-purewater=إن فُعّل، سيوجد الماء النقي. وسيكون مطلوباً للتحليل الكهربائي وسيحل محل ناتج حفر الماء الجوفي. ويمكن أيضاً الحصول عليه بتكثيف البخار.
bobmods-plates-groundwater=إن فُعّل، يمكن لمضخة تعبئة البراميل الحفر بحثاً عن الماء في أي مكان على الخريطة. ولن تُفعّل تجمّعات استخراج الماء قسرياً.
bobmods-plates-vanillabarrelling=إن فُعّل، يمكن استخدام ماكينات التجميع لتعبئة البراميل.
bobmods-plates-bluedeuterium=سمعتُ أن الديوتيريوم من المفترض أن يكون أزرق، لذا أريد أن تُظهره اللعبة كذلك.
bobmods-plates-convert-recipes=إن فُعّل، ستُضاف وصفات إضافية للتحويل بين أنواع الأفران المختلفة.
bobmods-plates-expensive-electrolysis=إن فُعّل، سيزيد هذا من تكلفة الكهرباء للتحليل الكهربائي. والغرض من ذلك أن تكون تكلفة إنتاج الهيدروجين بالتحليل الكهربائي أعلى من الطاقة التي يُولّدها حرقه.

