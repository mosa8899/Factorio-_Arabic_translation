[technology-description]
factory-upgrade-greenhouse=يُركَّب سقف شفاف في سقف المصنع. يُفرَش داخل مباني المصنع تربة نباتات كثيفة وتُزرع المحاصيل بواسطة [entity=agricultural-tower]. يسمح باستخدام [entity=solar-panel] بنصف كفاءة داخل المصنع.
factory-upgrade-borehole-pump=يستخرج السوائل من المياه الجوفية المدفونة بواسطة مضخات البئر. يختلف السائل المستخرج حسب الكوكب. يجب وضعه داخل مبنى مصنع.
factory-connection-type-fluid=تنقل السوائل عبر مبنى مصنعك بواسطة الأنابيب والأنابيب الأرضية.\nمرّر المؤشر فوق سهم الوصلة واضغط __CONTROL__factory-rotate__ لاختيار وضع الإدخال أو الإخراج. __CONTROL__factory-increase__ و__CONTROL__factory-decrease__ لتغيير معدل التحديث.
factory-connection-type-chest=تنقل العناصر عبر مبنى مصنعك بواسطة الصناديق.\nمرّر المؤشر فوق سهم الوصلة واضغط __CONTROL__factory-rotate__ لاختيار وضع الإدخال أو الإخراج أو [font=default-semibold][color=255,230,192]وضع النقل[/color][/font]. __CONTROL__factory-increase__ و__CONTROL__factory-decrease__ لتغيير معدل التحديث.
factory-connection-type-circuit=تنقل إشارات الدوائر عبر مبنى مصنعك بواسطة موصل دوائر المصنع.
factory-interior-upgrade-lights=يضف مصابيح سقف لجميع مصانعك. تعاين مبنى المصنع بتمرير المؤشر بالماوس.
factory-interior-upgrade-display=يضف شاشة عرض بديلة لمصانعك. ضع العناصر في متحكّمات العرض داخل مصنعك لتحديد ما يظهر في الخارج.
factory-recursion-t1=تُركَّب مباني مصنع داخل مباني مصنع أخرى أكبر.
factory-recursion-t2=تُركَّب أي مبنى مصنع داخل أي مبنى مصنع آخر.
factory-connection-type-heat=تنقل الحرارة عبر مبنى مصنعك بواسطة أنابيب الحرارة.\n__CONTROL__factory-increase__ و__CONTROL__factory-decrease__ لتغيير معدل التحديث.
factory-interior-upgrade-roboport=ترسل طلبات بناء إلى السطح الخارجي. سيفاصل روبوتات البناء العناصر المطلوبة إلى صندوق البناء داخل المصنع.
factory-space-architecture=تقنيات التصنيع الفضائي المتقدمة تسمح ببناء مباني المصنع في الفضاء.

