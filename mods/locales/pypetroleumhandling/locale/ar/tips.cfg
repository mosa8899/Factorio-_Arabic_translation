bitumen-seep=[entity=bitumen-seep] يمكن أن يظهر على الخريطة. هذه العلامات تدل على رواسب هيدروكربونية تحت الأرض. يمكنك بناء [entity=oil-derrick-mk01] أو [entity=tar-extractor-mk01] أو [entity=natural-gas-derrick-mk01] فوقها.\n\nأولاً يجب تزويد هذه المباني بسائل حفر، مثل [fluid=drilling-fluid-0]. لا ينتج المبنى أي شيء في هذه المرحلة لأنك تحفر بحثاً عن الموارد. في النهاية ستصل إلى المخزون الجوفي، ويوقف المبنى حاجته لسائل الحفر ويبدأ بإنتاج [fluid=crude-oil] أو [fluid=tar] أو [fluid=raw-gas] بحسب نوع المبنى الذي بنيته.\n\nتعتمد كمية المورد الناتج على:\n - مستوى وكمية سائل الحفر D ((بين 1 و4) ^ 2 لكل سائل مستخدم).\n - مستوى المبنى B ((بين 1 و4) ^ 2).\n - عدد عشوائي R بين 4 و16.\n\nعدد دورات الحفر هو إذن 6400 * D * B * R.\n\nكل دورة حفر تنتج 100 وحدة من السائل المطلوب. تحدد سرعة المبنى عدد دورات الحفر في الثانية. بما أن الإخراج يتوقف على كمية سائل الحفر المستهلكة والمستوى، فإن المباني الأبطأ تستهلك سائلاً أكثر لتنتج كمية أكبر. تعوّض الحفّارات الأعلى مستوى بمضاعف B أعلى، لكن تسريعها أكثر من ذلك يقلل إجمالي كمية السائل الناتج.\n[color=255,0,0]إزالة البرج أو ترقيته ستعيد ضبط كل تقدّم التعدين![/color]
tholin=جو نوفس غني بالثولينات، التي يمكن استخدامها لصناعة مجموعة متنوعة من الغازات. لإنشاء [fluid=tholins]، عليك إطلاق [item=capsule] بصاروخ باستخدام [entity=rocket-silo]. سيجمع الثولينات الموجودة في الجو لتستخدمها.\n\nيمكن معالجة الثولينات إلى عدة غازات مفيدة:\n\n[technology=tholin-mk01]:\n[fluid=carbon-dioxide] [fluid=nitrogen] [fluid=hydrogen]\n\n[technology=tholin-mk02]:\n[fluid=syngas] [fluid=acetylene] [fluid=acidgas] [fluid=chlorine] [fluid=cyanic-acid]\n[fluid=ethylene] [fluid=benzene] [fluid=ammonia] [fluid=methane] [fluid=acetone]\n\n[technology=tholin-mk03]:\n[fluid=methanol] [fluid=refsyngas] [fluid=methanal] [fluid=propene]\n\n[technology=tholin-mk04]:\n[fluid=glycerol] [fluid=olefin] [fluid=deuterium] [fluid=helium3] [fluid=tritium]