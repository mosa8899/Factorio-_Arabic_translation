commodity-equivalence-name=دمج __1__ بوصفه __2__
commodity-equivalence-description=يتعرف على __1__ المنقول بوصفه __2__ المكافئ من أنجلوس بنسبة ثابتة تحافظ على الكمية. يتطلب تقنية المعالجة الأصلية في أنجلوس ولا يسمح بزيادة الإنتاجية أو الجودة.

nullia-landing-cache=تم استرداد غنائم نوليا. وُضع مخزن إمداد يحتوي على ماكينات سليمة وماكينات تالفة وخلايا كهروكيميائية قرب موقع وصولك (مرة واحدة لكل فصيل).
nullia-recover-success=تمت العودة إلى أقرب جسد خامل مرتبط بك شخصياً في نوليا.
nullia-recover-unavailable=لا يوجد جسد خامل مرتبط بك شخصياً ضمن 128 بلاطة في نوليا. بقية أجسادك لم تمسّ.
nullia-respawn-recovered=استعدت السيطرة على أقرب جسد مرتبط بك شخصياً بعد إعادة الظهور.
nullia-bodies-unavailable=دليل الأجساد متاح في نوليا فقط.
nullia-bodies-count=أجساد نوليا البشرية الخاملة المرتبطة بك شخصياً: __1__.
nullia-bodies-entry=الجسد __1__ عند (__2__, __3__): على بُعد __4__ بلاطة؛ احتياطي __5__ث؛ __6__.
nullia-cycle-unavailable=لا يوجد روبوت بشري خامل مرتبط بك شخصياً ضمن 128 بلاطة قريبة.
nullia-death-location=آخر روبوت بشري مفقود من نوليا على __1__ عند (__2__, __3__). تنطبق قواعد Factorio المعتادة للجثث/الحقيبة.
nullia-death-marked=تم تسجيل موقع وفاة الروبوت البشري الأخير. استخدم /iw-nullia-bodies للعثور عليه أو /iw-nullia-clear-death لإزالة علامة الخريطة.
nullia-death-cleared=تم مسح موقع وفاة الروبوت البشري المخزن وعلامته.
nullia-power-refuel=تم شحن روبوت نوليا البشري: استُهلكت خلية كهروكيميائية واحدة.
nullia-power-depleted=طاقة روبوت نوليا البشري فارغة. الجري والتعدين يتباطآن حتى تحمل خلية كهروكيميائية أخرى. لن يُدمَّر جسدك ولن يُعطَّل.
nullia-power-status=الاحتياطي الحالي لطاقة روبوت نوليا البشري: __1__ ثانية. استخدم الخلايا الكهروكيميائية في حقيبة الجسد لإعادة الشحن تلقائياً.
nullia-power-unavailable=حالة الطاقة متاحة فقط أثناء التحكم بروبوت بشري من نوليا.
pyanodons-bootstrap=تم تأسيس تمهيد بيانودونز: مُنحت مخزونة البداية الأصلية من pY عند أول وصول بدلاً من ناوفيس.
nullia-power-status-grid=احتياطي الروبوت البشري: __1__ ثانية؛ طاقة بطارية درع IW: __2__ kJ.


