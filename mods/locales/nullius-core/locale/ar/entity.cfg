nullius-relay=يوسّع مدى عمل الروبوتات. يمكن بناؤه أو تجهيزه.\nيمكن تبديل وضع «البناء فقط» باستخدام __CONTROL__nullius-prioritize__.
nullius-battery=معد لتخزين الطاقة أو وقود للمركبات.
nullius-jetpack-1=[font=default-bold][color=#f5cb48]الدفع: 1[/color][/font]\nاضغط __CONTROL__jetpack__ للتفعيل.\nيتيح لك الطيران فوق المنشآت والماء. حقائب الصواريخ المتعددة تزيد سرعة الطيران. استهلاك الطيران من علب وقود الصواريخ أو الميثان في حقيبتك.
nullius-jetpack-2=[font=default-bold][color=#f5cb48]الدفع: 2[/color][/font]\nاضغط __CONTROL__jetpack__ للتفعيل.\nيتيح لك الطيران فوق المنشآت والماء. حقائب الصواريخ المتعددة تزيد سرعة الطيران. استهلاك الطيران من علب وقود الصواريخ أو الميثان في حقيبتك.
nullius-jetpack-3=[font=default-bold][color=#f5cb48]الدفع: 3[/color][/font]\nاضغط __CONTROL__jetpack__ للتفعيل.\nيتيح لك الطيران فوق المنشآت والماء. حقائب الصواريخ المتعددة تزيد سرعة الطيران. استهلاك الطيران من علب وقود الصواريخ أو الميثان في حقيبتك.
nullius-jetpack-4=[font=default-bold][color=#f5cb48]الدفع: 4[/color][/font]\nاضغط __CONTROL__jetpack__ للتفعيل.\nيتيح لك الطيران فوق المنشآت والماء. حقائب الصواريخ المتعددة تزيد سرعة الطيران. استهلاك الطيران من علب وقود الصواريخ أو الميثان في حقيبتك.
nullius-portable-generator=يحرق وقود المركبات لتشغيل معدات الأندرويد.
nullius-portable-generator-backup=يحرق وقود المركبات لتشغيل معدات الأندرويد. أولوية أقل من البطاريات. قد يكون مفيداً كمكمّل للطاقة الشمسية، باستخدام الوقود كملاذ أخير.
nullius-portable-reactor=يحرق الوقود النووي لتشغيل معدات الأندرويد.
nullius-refueler=يعبّئ المولّدات والمفاعلات المحمولة تلقائياً بالوقود من حقيبتك. يحمّل فقط أنواع الوقود المستخدمة بالفعل في تلك المعدات.
nullius-jump-boots=يضحّي بسعة الحمولة لصالح سرعة الحركة.
nullius-deactivated-coprocessor=أُغلق هذا المعالج المساعد بعد تجاوز حد معالجات المستوى __1__.
nullius-coprocessor-quantum=يتيح تركيب حتى 2 من المعالجات المساعدة من أنواع مختلفة لكل مستوى.
nullius-coprocessor-speed=يزيد سرعة الحركة والتصنيع. يضاعف سرعة واستهلاك الطاقة لأدوات التصنيع الأخرى.\n[font=default-semibold][color=1,0.9,0.75]مضاعف سرعة التصنيع:[/color][/font]  __1__%\n[font=default-semibold][color=1,0.9,0.75]عقوبة طاقة التصنيع:[/color][/font]  __2__%\n[font=default-semibold][color=1,0.9,0.75]الطاقة لكل ثانية وصفة:[/color][/font]  __3__kJ
nullius-coprocessor-efficiency=يُحسّن السحب الأساسي للطاقة لدى الأندرويد واستهلاك طاقة أدوات التصنيع.\n[font=default-semibold][color=1,0.9,0.75]فائض الطاقة:[/color][/font]  __1__kW\n[font=default-semibold][color=1,0.9,0.75]خصم طاقة التصنيع:[/color][/font]  __2__%
nullius-coprocessor-productivity=ينتج مخرجات أكثر من المادة نفسها أثناء التصنيع اليدوي، على حساب السرعة. يرتّب الحمولة لاستغلال أفضل للتخزين المساعد.\n[font=default-semibold][color=1,0.9,0.75]مكافأة الإنتاجية:[/color][/font]  __1__%\n[font=default-semibold][color=1,0.9,0.75]عقوبة سرعة التصنيع:[/color][/font]  __2__%\n[font=default-semibold][color=1,0.9,0.75]الطاقة لكل ثانية وصفة:[/color][/font]  __3__kJ\n[font=default-semibold][color=1,0.9,0.75]سعة كيس الحمولة:[/color][/font]  __4__%
nullius-coprocessor-tier-1=يمكن تركيب حتى 2 من معالجات المستوى 1 من أنواع مختلفة.
nullius-coprocessor-tier-2=يمكن تركيب معالج مستوى 2 واحد إضافة إلى المستوى 1.
nullius-coprocessor-tier-3=يمكن تركيب معالج مستوى 3 واحد إضافة إلى المستويات الأدنى.
