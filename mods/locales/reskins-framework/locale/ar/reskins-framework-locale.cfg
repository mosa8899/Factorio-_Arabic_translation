[mod-setting-description]
reskins-framework-show-tier-labels=يعرض مؤشرات مستويات ملوّنة على الأيقونات.
reskins-framework-show-tier-labels-in-world=يعرض مؤشرات مستويات ملوّنة على العناصر فوق الأناقل وعلى الأرض.
reskins-framework-show-tier-labels-on-pipes=يعرض مؤشرات مستويات ملوّنة على أيقونات الأنابيب والأيقونات المجاورة لها\n\nلا تأثير له إذا لم يكن [font=default-semibold]إظهار تسميات المستويات[/font] مُفعّلاً.
reskins-framework-show-tier-labels-on-belts=يعرض مؤشرات مستويات ملوّنة على أيقونات الأناقل والأناقل الأرضية والمُقسّمات وأجهزة التحميل.\n\nلا تأثير له إذا لم يكن [font=default-semibold]إظهار تسميات المستويات[/font] مُفعّلاً.
reskins-framework-tier-label-style=يضبط نمط تسمية المستوى.
reskins-framework-tier-mapping=يضبط كيفية تعيين المستويات للهياكل والعناصر.\n\n[font=default-semibold]تقليدي[/font]: يتبع تعيين المستويات الأسماء. العناصر 1 و2 و3 في السلسلة تُعيَّن للمستويات 1 و2 و3 وهكذا.\nمثال: المفاعلات النووية تبدأ من المستوى 1.\n\n[font=default-semibold]تقدّم[/font]: يتبع تعيين المستويات تقدّم اللعبة. العناصر التي تُحصل عليها لاحقاً وتتطلب مواد أكثر تعقيداً تبدأ بمستويات أعلى.\nمثال: المفاعلات النووية تبدأ من المستوى 3.
reskins-framework-use-custom-tier-colors=[img=utility.warning_icon] الألوان المخصصة تستخدم طبقات رسومية للعناصر والكيانات بكثافة، مما يزيد بشكل حاد عدد الرسوم المعروضة على الشاشة. قد يؤثر ذلك سلباً على الأداء.\n\nيفعّل تخصيص ألوان المستويات عبر أدوات اختيار الألوان أدناه.
reskins-framework-custom-colors-tier-0=يضبط لون المستوى 0.
reskins-framework-custom-colors-tier-1=يضبط لون المستوى 1.
reskins-framework-custom-colors-tier-2=يضبط لون المستوى 2.
reskins-framework-custom-colors-tier-3=يضبط لون المستوى 3.
reskins-framework-custom-colors-tier-4=يضبط لون المستوى 4.
reskins-framework-custom-colors-tier-5=يضبط لون المستوى 5.
reskins-framework-custom-colors-tier-6=يضبط لون المستوى 6.

