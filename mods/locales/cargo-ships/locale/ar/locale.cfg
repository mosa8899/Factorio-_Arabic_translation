use_dark_blue_waterways=ممرات مائية أغمق
tanker_capacity=سعة __ENTITY__oil_tanker__ ×1000
cargo_ship_capacity=سعة __ENTITY__cargo_ship__
no_catching_fish=تعطيل صيد السمك بالإدراج
