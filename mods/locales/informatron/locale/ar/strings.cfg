informatron=InformaTron
informatron_tooltip=InformaTron [__CONTROL__informatron__]\nمساعدك المعلوماتي داخل اللعبة.
game_time_caption=__1__ [color=#bbbbbb]__plural_for_parameter__1__{1=يوم|rest=أيام}__[/color] __2__ [color=#bbbbbb]__plural_for_parameter__2__{1=ساعة|rest=ساعات}__[/color] __3__ [color=#bbbbbb]__plural_for_parameter__3__{1=دقيقة|rest=دقائق}__[/color] __4__ [color=#bbbbbb]__plural_for_parameter__4__{1=ثانية|rest=ثوانٍ}__[/color]
game_time_tooltip=وقت اللعبة\nالنبضة: __1__\nإجمالي الثواني: __2__\nإجمالي الدقائق: __3__\nإجمالي الساعات: __4__\nإجمالي الأيام: __5__
player_name=اللاعب __1__
window_title_label=InformaTron [__CONTROL__informatron__]
menu_informatron=InformaTron
title_informatron=InformaTron
page_introduction_text_1=مرحباً __1__!
page_introduction_text_2=أنا InformaTron، دليلك الشخصي إلى المجرّة. يمكنك العثور عليّ في أي وقت بالضغط على [__CONTROL__informatron__]. والضغط مرة أخرى يُخفي هذه النافذة.
page_introduction_text_3=بنوك معلوماتي هي المكان الذي تجد فيه المساعدة والنصائح والدروس والخلفيات والمزيد، كلها داخل اللعبة. وليست معلومات ثابتة كلها؛ الصفحات تُبنى عند طلبها ويمكن تخصيصها لك، وتتغير حسب وضعك الحالي.
page_introduction_text_3_conditional=لحظة، أين ذهبت كل بياناتي؟ يبدو أنك لم تثبّت أي مود يضيف صفحات إضافية بعد. لا تقلق، سنجد بعضها قريباً.
page_introduction_text_4=\nتوثيق المودات
page_introduction_text_5=هناك مودات كثيرة ليس لها مساعدة أو توثيق داخل اللعبة، وما يوجد قليل وغالباً مخفي في قوائم خاصة بالمود. يعود ذلك غالباً لعدم وجود مكان مناسب، وصعوبة بناء واجهات المستخدم. يوفّر InformaTron مكاناً للمودات الأخرى لتضع صفحات المساعدة والوصف لتكون كلها سهلة الوصول.\n\nإذا كان لديك مود تحبه لكن ترى أنه يحتاج توثيقاً أفضل داخل اللعبة، لم لا تطلب من مطوّره عمل صفحة InformaTron لتسهيل الأمر على الآخرين.\n\nلا تنسَ دعم صانعي المودات!
menu_editor=المحرّر
title_editor=المحرّر
page_editor_text_1=تتضمن Factorio محرّر خرائط متكاملاً يمكن إطلاقه أثناء اللعبة بأمر الكونسول "/editor" (اضغط [__CONTROL__toggle-console__] للوصول للكونسول). يمكنك أيضاً الوصول إليه باختيار «محرّر الخريطة» من القائمة الرئيسية. داخل اللعبة، يمكن استعمال /editor أيضاً للخروج من المحرّر ومتابعة اللعب.\n\nيمنح المحرّر اللاعب تحكّماً إبداعياً كاملاً لتغيير تضاريس الخريطة ونسخ أجزاء منها وغير ذلك كثير. وهو من نواحٍ كثيرة بديل أفضل لوضع الصندوق الرمل.\n\nيمكن أن يكون المحرّر أداة مفيدة جداً مع المودات، لأنه أحياناً يسمح بإصلاح حالة لعبة مكسورة. على سبيل المثال: قد ينتهي بك المطاف بأجزاء من كيانات مركّبة على الخريطة بسبب خطأ سكربت أو عدم توافق مودين؛ وضع المحرّر يسمح لك بحذف هذه العناصر عندما يكون البديل الوحيد كتابة سكربت لإزالتها.\n\nراجع الويكي الرسمي لوصف أشمل (https://wiki.factorio.com/Map_editor).
menu_console=الكونسول
title_console=الكونسول
page_console_text_1=يمكن الوصول إلى كونسول اللعبة بـ[__CONTROL__toggle-console__]. يُستعمل غالباً للتحدث مع اللاعبين الآخرين أو تشغيل أوامر الكونسول.
page_console_text_2=الأوامر العادية
page_console_text_3=الأوامر العادية تعطي معلومات فقط ولا تُعد غشاً. أمثلة: \n"/help" يعرض الأوامر. \n"/color red" يغيّر لونك إلى الأحمر.\n"/evolution" يعرض معامل تطور الفضائيين. \n"/time" يعرض عمر الخريطة.
page_console_text_4=أوامر السكربت
page_console_text_scripting_intro=أوامر السكربت يمكنها تغيير حالة اللعبة وتعطيل الإنجازات. قد تكسر اللعبة أو تسمح بالغش، لكنها أيضاً قد تُصلح لعبتك وتعلّمك شيئاً عن السكربتات. بعض الأشياء أسهل بكثير بأمر سكربت منها بـ/editor لأن السكربت يفعلها برمجياً.\n\nمن الأوامر المفيدة:
page_console_text_command_editor=يبدّل المحرّر، ويسمح لك بإجراء تغييرات على الخريطة.
page_console_text_command_cheat=يفعّل وضع الغش (لا تحتاج مواداً لصنع الأشياء). ضبطه على false يعطّل وضع الغش.
page_console_text_command_research=يبحث كل التقنيات. إذا كانت التقنية لا نهائية يبحث مستوى واحداً كل مرة.
page_console_text_command_chart=يكشف منطقة من الخريطة حولك. يستغرق وقتاً لمسح كل البلاطات كالرادار.
page_console_text_command_speed=يضبط سرعة اللعبة أسرع 10 مرات. 1 هي السرعة الطبيعية. 0.5 نصف السرعة. يجب أن تكون فوق 0.
page_console_text_command_set_evolution=يغيّر معامل تطور الأعداء إلى 50%. 0 هي القيمة الابتدائية 0%. 1 هو أقصى تطور.
page_console_text_command_teleport=ينقلك إلى الإحداثيات X,Y المحددة، هنا {0,0} هي وسط العالم / نقطة البداية. القيمة الأولى X، والموجب نحو الشرق. والثانية Y، والموجب نحو الجنوب.
page_console_text_command_recipes=يفعّل كل الوصفات بما فيها تلك التي لا تُفتح بالبحث، مثل واجهة الطاقة الكهربائية.
page_console_text_command_item=يعطيك صندوقاً لا نهائياً يمكنه توليد العناصر أو إتلافها. من العناصر المفيدة الأخرى "infinity-pipe" و"electric-energy-interface". زيادة العدد تعطيك عناصر أكثر.
page_console_text_command_indestructible=لا يمكنك التعرّض للضرر. معظم الأعداء لن يحاولوا مهاجمتك.
page_console_text_scripting_outro=راجع الويكي الرسمي لقائمة أشمل بالأوامر (https://wiki.factorio.com/Console).

