[entity-description]
bob-burner-reactor=فرن فولاذي مُعاد تعديله، مصدر الحرارة الاحتراقي يحرق عناصر الوقود لتوليد الحرارة.\nصله بالكيانات التي تعمل بالحرارة مثل المبادلات الحرارية عبر أنابيب حرارية.\nأقصى حرارة __1__°C.
bob-fluid-reactor=فرن فولاذي مُعاد تعديله، مصدر الحرارة بحرق السوائل يحرق وقوداً سائلاً لتوليد الحرارة.\nصله بالكيانات التي تعمل بالحرارة مثل المبادلات الحرارية عبر أنابيب حرارية.\nأقصى حرارة __1__°C.
bob-heat-pipe=يمكن لأنبوب الحرارة نقل الحرارة لمسافات أطول وربط الأجهزة التي تُنتج الحرارة وتستعملها.\nأقصى حرارة __1__°C.
bob-reactor-max-temperature=\nأقصى حرارة __1__°C.
bob-oil-boiler=يحرق الوقود السائل لتحويل الماء إلى بخار.
steam-turbine=يستهلك البخار لتوليد الطاقة الكهربائية. له أولوية أعلى في شبكة الطاقة.

