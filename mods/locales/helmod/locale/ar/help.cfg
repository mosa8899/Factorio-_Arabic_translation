[helmod_help]
panel-title=مساعدة

getting-start=البدء
getting-start-desc=راجع مساعدة إعدادات المود قبل استخدامه.

quick-start=بداية سريعة
quick-start-desc=يمكنك بناء أول كتلة إنتاج لديك في خط الإنتاج.\nإذا لم تظهر وصفتك، فعّل المرشحات المختلفة، فمن المؤكد أنها مخفية.
quick-start-1=انقر على زر إضافة خط إنتاج.
quick-start-2=انقر على زر إضافة وصفة.
quick-start-3=اختر وصفة من محدد الوصفات.
quick-start-4=انقر على أيقونة ناتج لفتح لوحة تحرير الناتج.
quick-start-5=اضبط كمية ناتجك، واستخدم ENTER أو زر OK للتأكيد.
quick-start-6=انقر على أيقونة صفراء في عمود المكوّنات لإضافة الوصفة التالية.
quick-start-7=انقر على الزر لإدارة صف.
quick-start-8=انقر على أيقونة رمادية في صف الوصفة لفتح محرر الوصفة، أو على أيقونة زرقاء لفتح كتلة فرعية.
quick-start-9=انقر على الأيقونة للتنقل بين الكتل الفرعية.

getting-start-panel=وصف لوحة Helmod
getting-start-panel-desc=
getting-start-panel-1=لوحة الرأس والقوائم الخاصة
getting-start-panel-2=قائمة الجدول
getting-start-panel-3=محدد الجدول (خط الإنتاج)
getting-start-panel-4=متصفح الكتل الفرعية
getting-start-panel-5=صف بيانات الجدول

mod-settings=إعدادات المود
mod-settings-desc=لفتح إعدادات المود، اضغط [ESC]، ثم انقر على خيارات ثم على مود

mod-settings-map=خريطة إعدادات المود
mod-settings-map-desc=
mod-settings-map-1=تفعيل حلّ الخصائص: إضافة زر لمشاهدة خطوة الحساب
mod-settings-map-2=خطوة ذاكرة المستخدم: تحدد سرعة إنشاء ذاكرة المستخدم، وكلما زادت قد تتدهور الأداء في تعدد اللاعبين.
mod-settings-map-3=عرض كل الأوراق: السماح للمدير برؤية كل الأوراق
mod-settings-map-4=تصفية بالنص المترجم:
mod-settings-map-5=تصفية عند تغيير النص: إذا فُعّل، تُطبّق التصفية على المحدد تلقائياً. قد يلزم تعطيله في تعدد اللاعبين
mod-settings-map-6=تصفية حسب الماكينة: إذا لم تجد الماكينة في محرر الوصفة، قد تحتاج إلى تعطيل المرشح. وسيؤدي ذلك إلى عرض كل العناصر المتاحة في المجموعة.
mod-settings-map-7=تصفية حسب المنارة: إذا لم تجد المنارة في محرر الوصفة، قد تحتاج إلى تعطيل المرشح. وسيؤدي ذلك إلى عرض كل العناصر المتاحة في المجموعة.
mod-settings-map-8=قيود الوحدات في الماكينات: أحياناً لا توجد قيود على استخدام الوحدات مع بعض المودات، ويسمح تعطيل هذا الخيار باستخدام وحدات الإنتاجية في كل مكان.
mod-settings-map-9=قيود الوحدات في المنارات: أحياناً لا توجد قيود على استخدام الوحدات مع بعض المودات، ويسمح تعطيل هذا الخيار باستخدام وحدات الإنتاجية في كل مكان.
mod-settings-map-10=عرض اللوحات الخاصة: تُستخدم اللوحات المخفية لمشاهدة قيم كائنات Factorio أو لإجراء اختبارات التصفية (تصحيح الأخطاء)
mod-settings-map-11=إظهار الأعمدة المخفية: الفهرس والمعرّف والنوع والاسم أعمدة مخفية (تصحيح الأخطاء)

mod-settings-player=إعدادات المود لكل لاعب
mod-settings-player-desc=
mod-settings-player-1=معامل عرض العرض: ضبط عرض عرض المود
mod-settings-player-2=معامل ارتفاع العرض: ضبط ارتفاع عرض المود
mod-settings-player-3=عرض الأيقونة الرئيسية: يمكنك إخفاء الأيقونة العلوية إن أردت
mod-settings-player-4=عرض وضع الخلية: تغيير طريقة عرض كل الأرقام
mod-settings-player-5=خطوة تحريك الصف: تحدد المسافة التي يتحركها الصف لأعلى/لأسفل باستخدام Shift + Click.

preferences=التفضيلات
preferences-desc=

preferences-general=عام
preferences-general-desc=التفضيلات العامة هي في الغالب إعدادات عرض
preferences-general-1=المستوى الافتراضي للماكينة: اختر الماكينة الأسرع أو الأقل، ويتم اختيارها تلقائياً عند اختيار وصفة.
preferences-general-2=تنسيق رقم الماكينة: اختر عدد الخانات العشرية التي تريد رؤيتها.
preferences-general-3=تنسيق رقم العنصر: اختر عدد الخانات العشرية التي تريد رؤيتها.
preferences-general-4=عدد الأسطر للتفضيل: عدد الأسطر المعروضة في الخيارات لتفعيل التمرير.
preferences-general-5=عدد الأعمدة للتفضيل: عدد الأعمدة المعروضة في الخيارات لتفعيل التمرير.
preferences-general-6=ترتيب عرض الناتج: ترتيب عرض الناتج أو المكوّن في صف الوصفة.
preferences-general-7=أساس عمود الناتج: يؤثر على عدد أعمدة الناتج المعروضة. وإذا احتاج الصف إلى أعمدة أكثر، يلتف تلقائياً.
preferences-general-8=أساس عمود المكوّن: يؤثر على عدد أعمدة المكوّن المعروضة. وإذا احتاج الصف إلى أعمدة أكثر، يلتف تلقائياً.
preferences-general-9=عرض التلوث: تفعيل أو تعطيل عرض التلوث.
preferences-general-10=عرض المبنى: تفعيل أو تعطيل عرض المبنى.

preferences-ui=الواجهة
preferences-ui-desc=يتيح إعداد الواجهة ضبط طريقة عمل اللوحات.
preferences-ui-1=إغلاق تلقائي للوحة: يغلق اللوحات تلقائياً بمجرد فتح إحداها.
preferences-ui-2=لصق الواجهة: يعلّق اللصق اللوحة على الجانب الأيمن من اللوحة الرئيسية.
preferences-ui-3=إزاحة لصق الواجهة: الإزاحة من الزاوية اليمنى العليا للوحة الرئيسية.

preferences-module-priority=أولوية الوحدات
preferences-module-priority-desc=أولوية الوحدات إعداد يُستخدم في لوحة تحرير الوصفة.

preferences-items-logistic=الافتراضي للوجستيات العناصر
preferences-items-logistic-desc=إعدادات اللوجستيات هي الخيارات التي تريد رؤيتها في التلميحات أو في قائمة اللوجستيات.

preferences-fluids-logistic=الافتراضي للوجستيات السوائل
preferences-fluids-logistic-desc=إعدادات اللوجستيات هي الخيارات التي تريد رؤيتها في التلميحات أو في قائمة اللوجستيات.

recipe-selector=محدد الوصفات
recipe-selector-desc=توجد محددات قليلة لكننا نصف هنا محدد الوصفات فقط. وعند اختيار وصفة تُضاف فوراً إلى «كتلة الإنتاج» الحالية أو الجديدة.

recipe-selector-normal=محدد بدون إظهار
recipe-selector-normal-desc=عند عدم تحديد أي إظهار، تظهر الوصفات المبحوث عنها فقط. أما الترجمة فتتم عند فتح اللوحة وعلى مدى عدة نبضات. وفي تعدد اللاعبين قد تحتاج إلى تقليل إعداد «خطوة ذاكرة المستخدم» إذا لم يتمكن لاعب من استخدام المود.
recipe-selector-normal-1=تصفية حسب النواتج أو المكوّنات: يحدد ما إذا كان البحث عن وصفة يُجرى على النواتج أم المكوّنات إذا كان حقل التصفية مملوءاً.
recipe-selector-normal-2=أسماء مترجمة أم أسماء إنجليزية (النظام): يدعم حقل التصفية الترجمة ما دامت موجودة.
recipe-selector-normal-3=إظهار المعطّلة: يتيح رؤية كل الوصفات المعطّلة، بشكل أساسي تلك غير المبحوث عنها، ولكن وصفات أخرى قد تكون كذلك.
recipe-selector-normal-4=إظهار المخفية: يتيح رؤية كل الوصفات المخفية. على سبيل المثال وصفة «جزء الصاروخ» غير مرئية بخلاف ذلك.
recipe-selector-normal-5=إظهار الوصفات المخفية للتصنيع: يتيح رؤية كل الوصفات المخفية للتصنيع. بعض الوصفات مخفية في قائمة التصنيع مع بعض المودات، وقد تصبح غير مقروءة مع هذا الخيار لأن كل الوصفات تتضاعف.
recipe-selector-normal-6=التصفية: اكتب اسم الناتج أو المكوّن المطلوب بحسب المرشح الأول. ومع خيار «التصفية التلقائية» يمكن جعل التصفية تستجيب للكتابة.
recipe-selector-normal-7=قائمة مجموعة الوصفات «Helmod» مجموعة وصفات افتراضية.

recipe-selector-all=محدد مع الإظهار
recipe-selector-all-desc=عند تحديد كل خيارات الإظهار، تصبح كل الوصفات متاحة.
recipe-selector-all-1=الوصفة المبحوث عنها تُعرض بأيقونة عادية 
recipe-selector-all-2=الوصفة غير المبحوث عنها تُعرض بأيقونة حمراء

recipe-selector-helmod=مجموعة Helmod
recipe-selector-helmod-desc=يضيف Helmod وصفات وهمية تُستخدم في حالات معينة. وهي مجمّعة في مجموعة الوصفات «Helmod». ولها ترس صغير يعرض تلميحاً.
recipe-selector-helmod-1=وصفة المورد: تتيح الوصول إلى حساب التعدين على سبيل المثال.
recipe-selector-helmod-2=وصفة الحرق: تحتوي على الناتج المتبقي من الاحتراق، كالقضيب اليورانيوم المستهلك.
recipe-selector-helmod-3=وصفة الصاروخ: تحتوي على العنصر الناتج عن إطلاق الصاروخ فضلاً عن المكوّنات اللازمة.

recipe-editor=لوحة محرر الوصفة
recipe-editor-desc=يصف هذا القسم كيفية استخدام محرر الوصفة

recipe-editor-general=وصف تحرير الوصفة
recipe-editor-general-desc=تحرير الوصفة من أهم القوائم بلا شك. ستجد معلومات الماكينة المختارة وأهمها سرعتها. وإذا كانت ماكينتك تستخدم وقوداً، يمكنك اختياره وسيظهر في الوصفة.\nإذا تجاوزت إعدادات المود حداً في اللعبة، ستظهر أيقونة تنبيه عند الخاصية المعنية في الماكينة، وذلك مع بعض المودات التي تعزز الماكينات أكثر من اللازم.
recipe-editor-general-1=وصف الوصفة.
recipe-editor-general-2=اختيار الماكينة وقيمها.
recipe-editor-general-3=اختيار وحدات الماكينة.
recipe-editor-general-4=اختيار المنارة وقيمها.
recipe-editor-general-5=اختيار وحدات المنارة.
recipe-editor-general-6=إعدادات المنارة.

recipe-editor-info=معلومات الوصفة
recipe-editor-info-desc=ستجد تعريف الوصفة في هذا القسم
recipe-editor-info-1=تُستخدم نسبة الإنتاج% للدلالة على معدل الاستخدام، وهذا يسمح بموازنة الوصفة.
recipe-editor-info-2=بتحديد 50% لوصفة، سيتم حسابها عند 50% من الحاجة، مثلاً للسماح للوصفة التالية باستخدام الباقي لإنتاجه.

recipe-editor-factory=معلومات الماكينة
recipe-editor-factory-desc=ستجد تعريف الماكينة في هذا القسم
recipe-editor-factory-1=اختيار الماكينة وقائمة نشرها.
recipe-editor-factory-2=معلومات الماكينة ومحدد الوقود إن وُجد.
recipe-editor-factory-3=وحدات الماكينة وقائمة نشرها.
recipe-editor-factory-4=أداة اختيار الوحدات.

recipe-editor-beacon=معلومات المنارة
recipe-editor-beacon-desc=ستجد تعريف المنارة في هذا القسم
recipe-editor-beacon-1=اختيار المنارة وقائمة نشرها.
recipe-editor-beacon-2=معلومات المنارة وإعدادات تطبيق التأثيرات والعدد بالنسبة لعدد الماكينات.
recipe-editor-beacon-3=وحدات المنارة وقائمة نشرها.
recipe-editor-beacon-4=أداة اختيار الوحدات.

recipe-editor-tools=شريط الأدوات
recipe-editor-tools-desc=يتيح شريط الأدوات تعيين إعدادات الماكينة بسرعة أو ضبط اختيارك الافتراضي للوصفات التالية التي ستضيفها. واستخدام النشر مع أولوية الوحدات طريقة سريعة وسهلة لإعداد خط الإنتاج. وإذا غيّرت اختيار الماكينة، سيُطبَّق اختيار الوحدات إن أمكن.
recipe-editor-tools-1=الماكينة الافتراضية: تخزن الاختيار الافتراضي للماكينة.
recipe-editor-tools-2=نشر اختيار الماكينة على الكتلة الحالية إن أمكن.
recipe-editor-tools-3=نشر اختيار الماكينة على كل الكتل في خط الإنتاج إن أمكن.
recipe-editor-tools-4=خيار النشر، يتجاهل فئة الوصفات.
recipe-editor-tools-5=خيار النشر، ينشر فقط على الوصفات من النوع نفسه كالحالية.
recipe-editor-tools-6=خيار النشر، ينشر مع الوحدات المختارة، وإذا كان الاختيار أولوية وحدات فسيُطبَّق.
recipe-editor-tools-7=الوحدات الافتراضية: تخزن اختيار الوحدات.
recipe-editor-tools-8=نشر اختيار الوحدات على الكتلة الحالية إن أمكن.
recipe-editor-tools-9=نشر اختيار الوحدات على كل الكتل في خط الإنتاج إن أمكن.
recipe-editor-tools-10=إزالة كل الوحدات.

recipe-editor-module-selection=اختيار الوحدات
recipe-editor-module-selection-desc=يتيح محدد الوحدات إضافة الوحدات. ويسمح بإضافة وحدة إلى الوحدة.
recipe-editor-module-selection-1=قائمة الوحدات المطبقة.
recipe-editor-module-selection-2=اختيار قائمة الوحدات.
recipe-editor-module-selection-3=الوحدات القابلة للتطبيق على هذه الوصفة أو هذه الماكينة متاحة بنقرة واحدة.
recipe-editor-module-selection-4=الوحدات غير القابلة للتطبيق على هذه الوصفة أو الماكينة تظهر باللون الأحمر.

recipe-editor-module-priority=أولوية الوحدات
recipe-editor-module-priority-desc=تسمح أولوية الوحدات بإضافة الوحدات بسرعة وسهولة. إذا كانت أولويتك مُحسنة اختيارها، يمكنك تطبيق الوحدات دفعة واحدة على خط الإنتاج بأكمله.\nوكيف تعمل الأولوية: بمجرد ضبطها، سيحاول النظام إضافة الوحدة الأولى بكميتها إن أمكن، ثم ينتقل إلى الخيار التالي، وإذا بقيت مساحة، يمضي النظام بالطريقة نفسها وهكذا.\nفعلى سبيل المثال في اللعبة الأساسية، إذا اخترت في الأولوية [item=productivity-module-3]x10 ثم [item=speed-module-3]x10 ونشرت ذلك على خط الإنتاج بأكمله، ستحصل على إعداد مُحسَّن بنقرة واحدة. ماكينات النواتج الوسيطة ستحتوي فقط على وحدات [item=productivity-module-3]، والباقي فقط على وحدات [item=speed-module-3].
recipe-editor-module-priority-1=قائمة الوحدات المطبقة.
recipe-editor-module-priority-2=الزر للوصول إلى قائمة التفضيلات لضبط أولويات الوحدات.
recipe-editor-module-priority-3=الوحدات القابلة للتطبيق على هذه الوصفة أو الماكينة تظل متاحة بنقرة بسيطة.
recipe-editor-module-priority-4=زر تطبيق الأولوية المختارة.
recipe-editor-module-priority-5=اختيار إعداد أولوية الوحدة.
recipe-editor-module-priority-6=اختيار قائمة أولوية الوحدات.

production=خط الإنتاج والكتلة
production-desc=يصف هذا القسم لوحات خط الإنتاج وكتلة الإنتاج.

production-line=خط الإنتاج
production-line-desc=خط الإنتاج مجموعة من كتل الإنتاج لإنتاج صاروخ أو أي شيء آخر.
production-line-1=مجموعة أيقونات لتغيير التبويب.
production-line-2=مجموعة أيقونات لإضافة وصفة.
production-line-3=مجموعة أيقونات للإجراء على البيانات: نسخ أو تبديل أو حذف أو تحديث.
production-line-4=مجموعة أيقونات للتحرير والتفضيلات.
production-line-5=مجموعة أيقونات لضبط خيار اللوجستيات المعروض مباشرة على الصفوف.
production-line-6=ضبط أساس زمن الحساب.
production-line-7=شريط تحديد خط الإنتاج.
production-line-8=معلومات عامة وضبط صلاحيات خط الإنتاج.
production-line-9=عناصر الإخراج في خط الإنتاج.
production-line-10=عناصر الإدخال في خط الإنتاج.
production-line-11=قائمة كتل الإنتاج.

production-block=كتلة الإنتاج
production-block-desc=كتلة الإنتاج قائمة بالوصفات لإنتاج عنصر ما.\nيُنصح بفصل الوصفات إلى عدة كتل وربطها. يمكن أن تكون الكتلة شبيهة بمخطط يُبنى ويُكرَّر حسب الحاجة، خاصة عند استخدام حد الماكينة، ويظهر عدد مرات وجودها في معلومات الكتلة.
production-block-1=مجموعة أيقونات لتغيير التبويب.
production-block-2=مجموعة أيقونات لإضافة وصفة.
production-block-3=مجموعة أيقونات للإجراء على البيانات: نسخ أو تبديل أو حذف أو تحديث.
production-block-4=مجموعة أيقونات للتثبيت أو عرض الملخص.
production-block-5=قائمة خاصة لحلّ الخصائص (مخفية افتراضياً).
production-block-6=مجموعة أيقونات للتحرير والتفضيلات.
production-block-7=مجموعة أيقونات لضبط خيار اللوجستيات المعروض مباشرة على الصفوف.
production-block-8=ضبط أساس زمن الحساب.
production-block-9=شريط التنقل بين الكتل المختلفة في خط الإنتاج.
production-block-10=خيارات الحساب لكتلة الإنتاج.
production-block-11=معلومات عامة عن كتلة الإنتاج.
production-block-12=عناصر الإخراج في كتلة الإنتاج.
production-block-13=عناصر الإدخال في كتلة الإنتاج.
production-block-14=قائمة الوصفات.

production-edition=تحرير خط الإنتاج
production-edition-desc=تتيح قائمة تحرير خط الإنتاج إضافة ملاحظات وتحديد مجموعة ومشاركتها.
production-edition-1=تشير المعلومات إلى مالك الجدول المسمى «خط الإنتاج».
production-edition-2=تُستخدم المشاركة في تبادل الورقة في تعدد اللاعبين.
production-edition-3=تسمح المجموعة بتحديد أفضل في شريط قوائم خطوط الإنتاج عبر التلميح.
production-edition-4=الملاحظة حقل معلومات حر.

compute=الحساب
compute-desc=يجب أن تفهم كيف يحسب مودي، وبعدها يصبح الأمر سهلاً.

compute-order=ترتيب الحساب
compute-order-desc=يُجرى الحساب سطراً بسطر، ويبدأ دائماً بالسطر الأول
compute-order-1=يتحقق الحساب مما إذا كان لناتج ما مكوّن من العنصر نفسه ويسمح بتحرير هذا الناتج
compute-order-2=يأخذ الحساب الوصفة الأولى
compute-order-3=يدور الحساب على نواتج الوصفة ويحلّ الوصفة
compute-order-4=يجمع الحساب عدد المكوّنات في ذاكرة مؤقتة ويستهلك الناتج
compute-order-5=ينتقل الحساب إلى الوصفة التالية ويجري العمليات السابقة
compute-order-6=في النهاية، يتحقق الحساب من حالة الناتج ويزيله إذا كانت كميته < 0.01. وإذا أنتجت الكتلة الكثير من الناتج، يُعرض الناتج بأيقونة حمراء.
compute-order-7=لموازنة الوصفات، يجب استخدام حقل «الإنتاج %» في عدد قليل من الوصفات، خاصة في حالة البترول.

compute-solver=حلّ المصفوفة
compute-solver-desc=أُضيف «حلّ المصفوفة» لحل موازنة الوصفات لأن ذلك في المود الكلاسيكي شاق قليلاً.
compute-solver-1=عندما تكون داخل كتلة، توجد أيقونة ترس هي «حلّ المصفوفة» وتسمح بتفعيله.
compute-solver-2=لا يستخدم الحساب «ترتيب الحساب»، وتُحل كل الوصفات دفعة واحدة دون ترتيب.
compute-solver-3=يجب استخدامه فقط عند الضرورة.
compute-solver-4=إذا لم يجد الحلّ نتيجة، فربما وصفة مفقودة أو تحتاج إلى إزالة.
compute-solver-5=لا يُستخدم حقل «الإنتاج%» في الحسابات عند تفعيل «حلّ المصفوفة».

special-panel=اللوحات الخاصة
special-panel-desc=بعض اللوحات الخاصة متاحة بتفعيل خيار «عرض اللوحات المخفية» و«تفعيل حلّ الخصائص»

special-panel-admin=الإدارة
special-panel-admin-desc=تتيح الإدارة إدارة عناصر مختلفة من المود. هذه اللوحة متاحة لمسؤول اللعبة فقط.
special-panel-admin-1=قائمة الذاكرة المؤقتة تُستخدم لتهيئة الذاكرات المؤقتة عند الحاجة. كن حذراً عند سوء الاستخدام، فقد يجعل المود غير صالح للاستخدام، وفي أسوأ الأحوال استخدم إنشاء الذاكرة المؤقتة (أيقونة الترس).
special-panel-admin-2=قائمة القواعد تُستخدم لضبط عمل قوائم الماكينات المختلفة، بشكل أساسي لتحرير الوصفات.
special-panel-admin-3=قائمة الأوراق تسمح للمدير بإدارة كل الأوراق دون قيود الصلاحيات.
special-panel-admin-4=قائمة المودات صفحة معلومات عن المودات المستخدمة في اللعبة. يمكن للمذيعين استخدامها لعرض المودات المستخدمة.
special-panel-admin-5=قائمة الواجهة صفحة معلومات عن واجهات المود الحالية في مختلف مناطق الواجهة.

special-panel-properties=الخصائص
special-panel-properties-desc=لوحة «الخصائص» مفيدة جداً لمشاهدة خصائص كائن في اللعبة. لا غنى عنها لمطوري المودات.
special-panel-properties-1=تتيح المحددات إضافة عنصر.
special-panel-properties-2=مرشح «إخفاء القيم الفارغة» يخفي القيم الفارغة، وهي كثيرة.
special-panel-properties-3=مرشح «إظهار الاختلافات» يعرض الخصائص المختلفة فقط.
special-panel-properties-4=يتيح حقل التصفية تصفية الخصائص حسب اسمها.
special-panel-properties-5=لحذف عنصر، انقر على أيقونته.

special-panel-filter=مرشح النماذج
special-panel-filter-desc=تُستخدم لوحة «مرشح النماذج» لاختبار المرشحات على النماذج في اللعبة. لا غنى عنها لمطوري المودات.
special-panel-filter-1=يحدد اختيار النوع العنصر الذي ينطبق عليه المرشح. وتغيير النوع يُهيّئ الواجهة.
special-panel-filter-2=اختيار العينة مرشحات تستخدمها Helmod وتخدم كمثال.
special-panel-filter-3=عرّف مرشحك الأول واضغط «+» لإضافته، وستُعرض نتيجة المرشح تلقائياً.
special-panel-filter-4=يمكنك تعديل صف المرشح في أي وقت، وستُحدَّث نتيجة المرشح تلقائياً.
special-panel-filter-5=إذا لم يكن هناك مرشح، فلا شيء في منطقة النتيجة.

special-panel-unittest=اختبار الوحدة
special-panel-unittest-desc=تُستخدم لوحة «اختبار الوحدة» للتحقق من بعض الحسابات، أهمها حسابات استهلاك الطاقة.
special-panel-unittest-1=عدد قليل من المودات لديه اختبار وحدة.
special-panel-unittest-2=القيمة الحمراء ليست بالضرورة علامة خطأ، عليك فقط التحقق من القيم بمقارنة معلومات الأيقونة وتلميح القيمة الحمراء. على الأرجح تشير القيمة الحمراء إلى تغيير في القيمة وأن القيم المرجعية لم تعد صالحة.

special-panel-debug=تصحيح النموذج
special-panel-debug-desc=تُستخدم لوحة «تصحيح النموذج» لتصور خطوات الحساب للحلّات.
special-panel-debug-1=هذه اللوحة متاحة بتفعيل خيار «تفعيل حلّ الخصائص» والنقر على أيقونة الجعران في كتلة إنتاج.
special-panel-debug-2=لا تُفعّل هذا الخيار في تعدد اللاعبين أو إن كنت لا تستخدمه.
special-panel-debug-3=الأزرار أعلى اللوحة للتنقل بين خطوات الحساب.
special-panel-debug-4=في مراحل «الخطوة x» يُشار إلى نقطة العمل باللون، ولحلّ المصفوفة تكون النقطة المسماة «المحور».

control=أدوات التحكم
control-desc=توجد بعض أدوات التحكم: مفاتيح سريعة، ونقر أيمن، وCtrl + click أو Shift + click

control-hotkey=التحكم بالمفاتيح السريعة
control-hotkey-desc=يمكنك تغيير إعدادات المفاتيح السريعة في خيارات اللعبة
control-hotkey-1=[U] فتح/إغلاق اللوحة العامة
control-hotkey-2=[I] فتح تبويب خط الإنتاج
control-hotkey-3=[O] فتح محدد الوصفات

tips=نصائح
tips-desc=نصائح تُعرض في بعض اللوحات.

tips-production-line=نصائح خط الإنتاج
tips-production-line-desc=
tips-production-line-1=خط الإنتاج مجموعة من كتل الإنتاج.
tips-production-line-2=يمكن مشاركة خط الإنتاج مع الأصدقاء في تعدد اللاعبين.
tips-production-line-3=قد يحتوي خط الإنتاج على كتل مرتبطة أو غير مرتبطة.
tips-production-line-4=تجميع كتل الإنتاج المستقلة أفضل من مضاعفة خطوط الإنتاج.

tips-production-block=نصائح كتلة الإنتاج
tips-production-block-desc=
tips-production-block-1=كتلة الإنتاج مجموعة من الوصفات.
tips-production-block-2=يمكن ربط كتلة الإنتاج بالكتل السابقة.
tips-production-block-3=يمكن أيضاً ربط النواتج الوسيطة للكتلة.
tips-production-block-4=حلّ المصفوفة لا يستخدم قيود النواتج.