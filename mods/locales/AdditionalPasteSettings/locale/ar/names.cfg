[mod-name]
AdditionalPasteSettings_CoreNest=إعدادات اللصق الإضافية (موسّعة)

[mod-description]
AdditionalPasteSettings_CoreNest=نسخة منشورة منفصلة عن إعدادات اللصق الأصلية على بوابة المودات.\n\nتضيف إعدادات لصق إضافية للعبة (shift+نقرة يمين ← shift+نقرة يسار)، مثل دمج وتوحيد الطلبات في الصناديق اللوجستية، وضبط معامل طلب ثابت، وتتيح لك تعديل السلوك الافتراضي المقدار بـ30 ثانية، كما تتيح اللصق من ماكينات التجميع إلى الإدراجات لضبط شرط لها.
